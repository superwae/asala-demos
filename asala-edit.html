<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asala · The Edit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Alexandria:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="brand/asala-tatreez.css">
<style>
/* Layout: a fashion-led demi-fine store (rotating announcement bar, centred logo with mega menu, campaign hero,
   edit tiles, tabbed product rail with metal dots, shop-the-look hotspots, photo wall), in the Asala identity.
   Tatreez lives in the details: diamonds between menu items, chain bands between sections, stitched stars on
   titles, an "x" stitch on button hover, dashed stitched badges and a stitched border in the footer. */
:root {
  --linen: #F4F3F1; --line: #E3DFD8; --red: #C6383C; --red-2: #A92D31; --ink: #33342F; --muted: #5F5D55; --teal: #3FA59A; --pink: #F2C9C0; --white: #fff;
  --f: "Jost", "Alexandria", "Segoe UI", Tahoma, sans-serif;
  --gutter: clamp(16px, 3vw, 40px);
  --tz-bg: var(--linen); --tz-panel: #fff; --tz-line: var(--line); --tz-font: var(--f); --tz-font-d: var(--f);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--white); color: var(--ink); font: 400 1rem/1.65 var(--f); overflow-x: hidden; }
img { max-width: 100%; display: block; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--red); color: var(--white); }
:focus-visible { outline: 2px dashed var(--red); outline-offset: 3px; }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: var(--gutter); }
.demo { margin: 0; background: var(--ink); color: #DAD5CC; font-size: .78rem; text-align: center; padding: 6px var(--gutter); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* tracked uppercase labels: Latin only (letter-spacing breaks Arabic joins) */
.tr { font-size: .8rem; font-weight: 500; }
html[lang="en"] .tr { text-transform: uppercase; letter-spacing: .14em; font-size: .74rem; }

/* buttons: an "x" stitch appears on both sides on hover */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 50px; padding: 0 26px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--white); font-weight: 500; text-decoration: none; transition: background .2s, color .2s, border-color .2s; }
html[lang="en"] .btn { text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; }
.btn::before, .btn::after { content: ""; width: 9px; height: 9px; flex: none; transform: scale(0) rotate(-90deg); transition: transform .3s var(--tz-ease);
  background: linear-gradient(45deg, transparent 40%, currentColor 40% 60%, transparent 60%), linear-gradient(-45deg, transparent 40%, currentColor 40% 60%, transparent 60%); }
.btn:hover::before, .btn:hover::after, .btn:focus-visible::before, .btn:focus-visible::after { transform: none; }
.btn:hover { background: var(--red); border-color: var(--red); }
.btn.line { background: transparent; color: var(--ink); }
.btn.line:hover { background: var(--ink); color: var(--white); border-color: var(--ink); }
.btn.light { background: var(--white); border-color: var(--white); color: var(--ink); }
.btn.light:hover { background: var(--red); border-color: var(--red); color: var(--white); }

/* section titles with a small stitched star */
.ttl { display: flex; align-items: center; gap: 12px; margin: 0; font: 400 clamp(1.5rem, 2.6vw, 2.1rem)/1.25 var(--f); }
html[lang="en"] .ttl { text-transform: uppercase; letter-spacing: .08em; }
.ttl canvas { width: 18px; height: 18px; flex: none; }
.sub { margin: 6px 0 0; color: var(--muted); }
.sec { padding-block: clamp(36px, 6vw, 72px); }
.band { width: 100%; height: 22px; }
.sec-band { display: block; max-width: 1400px; margin: 0 auto; padding-inline: var(--gutter); }

/* 1. announcement bar */
.ann { background: var(--red); color: var(--white); }
.ann .wrap { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; }
.ann button { width: 44px; height: 44px; border: 0; background: none; color: inherit; display: grid; place-items: center; flex: none; }
.ann svg { width: 16px; height: 16px; }
[dir="rtl"] .ann svg { transform: scaleX(-1); }
.ann p { margin: 0; min-width: 0; flex: 0 1 460px; text-align: center; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
html[lang="en"] .ann p { text-transform: uppercase; letter-spacing: .12em; font-size: .74rem; }
.ann p span { display: inline-block; animation: annIn .45s var(--tz-ease); }
@keyframes annIn { from { opacity: 0; transform: translateY(6px); } }

/* 2. header: nav at the start, small logo in the centre, icons at the end */
.top { position: sticky; top: 0; z-index: 40; background: var(--white); border-bottom: 1px solid var(--line); }
.top .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; min-height: 72px; gap: 12px; }
.logo { display: inline-flex; align-items: center; min-height: 44px; justify-self: center; }
.logo img { height: 22px; width: auto; }
.nav { display: flex; align-items: center; flex-wrap: nowrap; }
.nav > button { min-height: 44px; padding: 0 9px; border: 0; background: none; white-space: nowrap; position: relative; }
.nav > button::after { content: ""; position: absolute; inset-inline: 9px; bottom: 8px; height: 0; border-bottom: 1.5px dashed var(--red); transform: scaleX(0); transition: transform .25s; }
.nav > button:hover, .nav > button[aria-expanded="true"] { color: var(--red); }
.nav > button:hover::after, .nav > button[aria-expanded="true"]::after { transform: none; }
.nav .dia { width: 9px; height: 9px; flex: none; }
.icons { display: flex; justify-content: flex-end; align-items: center; gap: 2px; }
.ic { position: relative; min-width: 44px; height: 44px; padding: 0 8px; border: 0; background: none; display: inline-grid; place-items: center; }
.ic svg { width: 21px; height: 21px; }
.ic:hover { color: var(--red); }
.ic.lang { font-size: .86rem; font-weight: 500; }
.ic .count { position: absolute; top: 4px; inset-inline-end: 2px; min-width: 18px; height: 18px; padding: 0 4px; background: var(--red); color: var(--white); font-size: .68rem; font-weight: 600; line-height: 18px; text-align: center; border-radius: 9px; font-variant-numeric: tabular-nums; }
.mstart { display: none; }
@media (max-width: 1180px) { .nav { display: none; } .mstart { display: flex; } .d-only { display: none; } }
@media (max-width: 420px) { .logo img { height: 18px; } .ic { min-width: 44px; padding: 0 4px; } }

/* mega panel */
.mega { position: absolute; inset-inline: 0; top: 100%; background: var(--white); border-top: 1px solid var(--line); box-shadow: 0 18px 30px -18px rgba(51, 52, 47, .35); }
.mega .wrap { display: grid; grid-template-columns: repeat(2, minmax(160px, 220px)) minmax(0, 1fr); gap: 36px; padding-block: 28px 34px; }
.mega h3 { margin: 0 0 10px; color: var(--red); }
.mega ul { list-style: none; margin: 0; padding: 0; }
.mega li button { border: 0; background: none; padding: 0; min-height: 36px; text-align: start; }
.mega li button:hover { color: var(--red); text-decoration: underline dashed; text-underline-offset: 5px; }
.mega li small { display: block; color: var(--muted); font-size: .82rem; margin-top: -4px; margin-bottom: 8px; }
.feats { display: flex; gap: 18px; justify-content: flex-end; }
.feat { width: 230px; border: 0; background: none; padding: 0; text-align: start; display: grid; gap: 8px; }
.feat img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.feat:hover span { color: var(--red); }
.msearch { grid-column: 1 / -1; }
.msearch input { width: 100%; min-height: 52px; border: 0; border-bottom: 1.5px solid var(--ink); padding: 0 4px; font-size: 1.2rem; background: transparent; }
.msearch input:focus { outline: none; border-bottom-color: var(--red); }
.msearch input::-webkit-search-cancel-button { filter: grayscale(1); }
.sres { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin-top: 20px; }
.sres button { border: 0; background: none; padding: 0; text-align: start; display: grid; gap: 6px; font-size: .9rem; }
.sres img { aspect-ratio: 1; object-fit: cover; width: 100%; background: var(--linen); }
.mmenu { grid-column: 1 / -1; }
.mmenu details { border-bottom: 1px solid var(--line); }
.mmenu summary { min-height: 52px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; list-style: none; font-weight: 500; }
.mmenu summary::-webkit-details-marker { display: none; }
.mmenu summary canvas { width: 10px; height: 10px; transition: transform .2s; }
.mmenu details[open] summary canvas { transform: rotate(45deg); }
.mmenu ul { padding-bottom: 12px; }
.mmenu li button { min-height: 44px; }
@media (max-width: 1180px) {
  .mega { position: fixed; top: var(--mtop, 120px); bottom: 0; overflow: auto; overscroll-behavior: contain; }
  .mega .wrap { grid-template-columns: 1fr; gap: 0; padding-block: 8px 30px; }
}

/* 3. campaign hero */
.hero { position: relative; background: #EFEAE3; }
.hero img { width: 100%; height: clamp(420px, 46vw, 680px); object-fit: cover; object-position: 70% 40%; }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,.82) 0%, rgba(255,255,255,.45) 34%, rgba(255,255,255,0) 52%); pointer-events: none; }
.hero .copy { position: absolute; left: max(var(--gutter), calc((100% - 1400px) / 2 + var(--gutter))); top: 50%; transform: translateY(-50%); width: min(44%, 560px); }
.hero .k { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; color: var(--red); }
.hero .k canvas { width: 16px; height: 16px; }
.hero h1 { margin: 0 0 14px; font: 300 clamp(2.4rem, 4.6vw, 4.2rem)/1.08 var(--f); }
html[lang="en"] .hero h1 { text-transform: uppercase; letter-spacing: .04em; }
html[lang="ar"] .hero h1 { font-weight: 400; line-height: 1.3; }
.hero p.d { margin: 0 0 24px; max-width: 40ch; color: #45463F; font-size: 1.05rem; }
.hero .btns { display: flex; gap: 12px; flex-wrap: wrap; }
@media (max-width: 760px) {
  .hero::before { display: none; }
  .hero img { height: auto; aspect-ratio: 4 / 5; object-position: 74% 50%; }
  .hero .copy { position: static; transform: none; width: auto; padding: 22px var(--gutter) 6px; background: var(--white); }
  .hero .btns .btn { flex: 1 1 100%; }
}

/* split promo: the gift edit */
.promo { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); background: var(--linen); max-width: 1400px; margin: clamp(16px, 2vw, 24px) auto 0; }
.promo-wrap { padding-inline: var(--gutter); }
.promo img { width: 100%; height: 100%; min-height: 300px; max-height: 440px; object-fit: cover; }
.promo .txt { padding: clamp(26px, 4vw, 56px); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 6px; }
.promo h2 { margin: 0; font: 300 clamp(1.9rem, 3.2vw, 2.8rem)/1.15 var(--f); }
html[lang="en"] .promo h2 { text-transform: uppercase; letter-spacing: .05em; }
.promo p { margin: 0 0 18px; color: var(--muted); max-width: 40ch; }
.promo .k { color: var(--red); margin: 0; }
@media (max-width: 760px) { .promo { grid-template-columns: 1fr; } .promo img { min-height: 0; aspect-ratio: 16 / 10; } }

/* 4. shop the edit tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 20px); margin-top: 26px; }
.tile { position: relative; border: 0; padding: 0; background: var(--linen); overflow: hidden; text-align: start; }
.tile img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; transition: transform .7s var(--tz-ease); }
.tile:hover img { transform: scale(1.04); }
.tile .lb { position: absolute; inset-inline: 10px; bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 46px; padding: 0 14px; background: var(--white); }
.tile .lb::after { content: ""; width: 9px; height: 9px; flex: none; background: linear-gradient(45deg, transparent 40%, var(--red) 40% 60%, transparent 60%), linear-gradient(-45deg, transparent 40%, var(--red) 40% 60%, transparent 60%); }
.tile[aria-pressed="true"] .lb { background: var(--ink); color: var(--white); }
.tile[aria-pressed="true"] .lb::after { background: linear-gradient(45deg, transparent 40%, var(--pink) 40% 60%, transparent 60%), linear-gradient(-45deg, transparent 40%, var(--pink) 40% 60%, transparent 60%); }
@media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile .lb { inset-inline: 6px; bottom: 6px; padding: 0 10px; font-size: .78rem; } }

/* 5. product rail with tabs */
.rail-head { display: flex; flex-wrap: wrap; gap: 14px 30px; align-items: center; justify-content: space-between; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.tabs button { min-height: 44px; padding: 0 14px; border: 0; background: none; position: relative; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 500; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; inset-inline: 14px; bottom: 6px; border-bottom: 2px dashed var(--red); }
.tabs button:hover { color: var(--red); }
.chip { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; font-size: .9rem; }
.chip b { font-weight: 500; }
.chip button { min-height: 44px; border: 0; background: none; text-decoration: underline; text-underline-offset: 4px; color: var(--muted); padding: 0 6px; }
.rail-wrap { position: relative; margin-top: 22px; }
.rail { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 6px; }
.rail::-webkit-scrollbar { display: none; }
.arrows { display: flex; gap: 6px; }
.arrows button { width: 46px; height: 46px; border: 1.5px solid var(--ink); background: var(--white); display: grid; place-items: center; }
.arrows button:hover { background: var(--ink); color: var(--white); }
.arrows button:disabled { opacity: .3; cursor: default; background: var(--white); color: var(--ink); }
.arrows svg { width: 18px; height: 18px; }
[dir="rtl"] .arrows svg { transform: scaleX(-1); }
.count-line { margin: 0; color: var(--muted); font-size: .88rem; }

.pc { flex: 0 0 calc((100% - 60px) / 4); scroll-snap-align: start; min-width: 0; }
.pc-media { position: relative; aspect-ratio: 4 / 5; background: var(--linen); overflow: hidden; }
.pc-media .open { position: absolute; inset: 0; border: 0; padding: 0; background: none; width: 100%; }
.pc-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: var(--tint, none); transition: opacity .5s, transform .8s var(--tz-ease), filter .35s; }
.pc-media img.cut { object-fit: contain; background: var(--ink); }
.pc-media img.alt { opacity: 0; }
.pc:hover .pc-media img.alt { opacity: 1; }
.pc:hover .pc-media img { transform: scale(1.03); }
.badge { position: absolute; top: 12px; inset-inline-start: 12px; z-index: 2; pointer-events: none; padding: 5px 9px; background: var(--white); color: var(--red); border: 1.5px dashed var(--red); outline: 3px solid var(--white); font-size: .72rem; font-weight: 600; line-height: 1.2; }
html[lang="en"] .badge { text-transform: uppercase; letter-spacing: .12em; font-size: .64rem; }
.badge.teal { color: #2C7C73; border-color: var(--teal); }
.qadd { position: absolute; inset-inline: 10px; bottom: 10px; z-index: 2; min-height: 46px; border: 0; background: rgba(255,255,255,.95); display: flex; align-items: center; justify-content: center; gap: 10px; transform: translateY(calc(100% + 14px)); transition: transform .35s var(--tz-ease), background .2s, color .2s; }
html[lang="en"] .qadd { text-transform: uppercase; letter-spacing: .12em; font-size: .74rem; }
.qadd::before, .qadd::after { content: ""; width: 8px; height: 8px; background: linear-gradient(45deg, transparent 38%, currentColor 38% 62%, transparent 62%), linear-gradient(-45deg, transparent 38%, currentColor 38% 62%, transparent 62%); }
.pc:hover .qadd, .qadd:focus-visible { transform: none; }
.qadd:hover { background: var(--ink); color: var(--white); }
@media (hover: none) { .qadd { transform: none; inset-inline: auto; inset-inline-end: 8px; bottom: 8px; width: 44px; height: 44px; min-height: 44px; padding: 0; } .qadd span, .qadd::after { display: none; } .qadd::before { width: 12px; height: 12px; background: linear-gradient(currentColor, currentColor) center / 100% 1.6px no-repeat, linear-gradient(currentColor, currentColor) center / 1.6px 100% no-repeat; } }
.pc-info { padding-top: 10px; display: grid; gap: 2px; }
.tones { display: flex; gap: 0; margin-inline-start: -14px; margin-block: -2px; }
.tones button { width: 44px; height: 44px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
.tones i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.tones button[aria-checked="true"] i { box-shadow: 0 0 0 2px var(--white), 0 0 0 3.5px var(--ink); }
.pc h3 { margin: 0; font: 500 1rem/1.4 var(--f); }
.pc h3 button { border: 0; background: none; padding: 0; text-align: start; min-height: 32px; }
.pc h3 button:hover { color: var(--red); }
.pc .lab { margin: 0; color: var(--muted); font-size: .86rem; }
.pc .lab em { font-style: normal; color: var(--red); }
.pc .pr { margin: 2px 0 0; font-weight: 500; font-variant-numeric: tabular-nums; }
.pc .pr small { color: var(--muted); font-weight: 400; }
@media (max-width: 1020px) { .pc { flex-basis: calc((100% - 40px) / 3); } }
@media (max-width: 680px) { .rail { gap: 12px; } .pc { flex-basis: 68%; } .rail-head .arrows { display: none; } .rail-head > div:first-child { width: 100%; } .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--gutter)); padding-inline: calc(var(--gutter) - 14px); width: calc(100% + 2 * var(--gutter)); } .tabs::-webkit-scrollbar { display: none; } .tabs button { flex: none; } }

/* 6. shop the look */
.look-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: clamp(14px, 2vw, 26px); margin-top: 26px; align-items: start; }
.look-fig { position: relative; margin: 0; }
.look-fig img { width: 100%; height: auto; }
.hot { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border: 0; padding: 0; background: none; display: grid; place-items: center; z-index: 2; }
.hot i { position: relative; width: 26px; height: 26px; border-radius: 50%; background: var(--white); box-shadow: 0 2px 10px rgba(0,0,0,.25); display: grid; place-items: center; }
.hot i::before { content: ""; width: 10px; height: 10px; background: linear-gradient(45deg, transparent 38%, var(--red) 38% 62%, transparent 62%), linear-gradient(-45deg, transparent 38%, var(--red) 38% 62%, transparent 62%); }
.hot i::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1.5px dashed var(--white); animation: spin 9s linear infinite; }
.hot[aria-expanded="true"] i { background: var(--red); }
.hot[aria-expanded="true"] i::before { background: linear-gradient(45deg, transparent 38%, #fff 38% 62%, transparent 62%), linear-gradient(-45deg, transparent 38%, #fff 38% 62%, transparent 62%); }
@keyframes spin { to { transform: rotate(360deg); } }
.pop { position: absolute; z-index: 3; width: 250px; background: var(--white); box-shadow: 0 14px 34px rgba(0,0,0,.22); padding: 12px; display: grid; grid-template-columns: 74px 1fr; gap: 6px 12px; }
.pop img { width: 74px; height: 92px; object-fit: cover; grid-row: span 2; }
.pop img.cut { object-fit: contain; background: var(--ink); }
.pop b { font-weight: 500; line-height: 1.35; padding-inline-end: 30px; }
.pop .pp { margin: 0; color: var(--muted); font-size: .9rem; }
.pop .pa { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
.pop .pa .btn { min-height: 44px; padding: 0 10px; font-size: .8rem; gap: 6px; }
.pop .px { position: absolute; top: 2px; inset-inline-end: 2px; width: 40px; height: 40px; border: 0; background: none; display: grid; place-items: center; }
.pop .px svg { width: 16px; height: 16px; }
.look-side { display: grid; gap: 18px; }
.inlook { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.inlook li { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.inlook img { width: 64px; height: 76px; object-fit: cover; }
.inlook button.n { border: 0; background: none; padding: 0; text-align: start; font-weight: 500; min-height: 32px; }
.inlook button.n:hover { color: var(--red); }
.inlook span { display: block; color: var(--muted); font-size: .88rem; }
.inlook .add { width: 44px; height: 44px; border: 1.5px solid var(--ink); background: none; display: grid; place-items: center; }
.inlook .add:hover { background: var(--ink); color: var(--white); }
.inlook .add svg { width: 18px; height: 18px; }
@media (max-width: 860px) { .look-grid { grid-template-columns: 1fr; } }

/* 7. values */
.values { background: var(--linen); }
.vals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; list-style: none; margin: 0; padding: 0; }
.vals li { display: grid; justify-items: center; text-align: center; gap: 6px; }
.vals svg { width: 34px; height: 34px; color: var(--red); }
.vals b { font-weight: 500; }
.vals span { color: var(--muted); font-size: .88rem; max-width: 26ch; }
@media (max-width: 760px) { .vals { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 14px; } }

/* 8. #WearAsala wall */
.wall { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 24px; }
.wall button { position: relative; border: 0; padding: 0; background: var(--linen); overflow: hidden; }
.wall img { width: 100%; aspect-ratio: 1; object-fit: cover; transition: transform .7s var(--tz-ease); }
.wall button:hover img { transform: scale(1.05); }
.wall .wl { position: absolute; inset-inline-start: 8px; bottom: 8px; padding: 3px 8px; background: rgba(255,255,255,.92); font-size: .7rem; color: var(--muted); }
.wall .ws { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(51,52,47,.45); color: var(--white); opacity: 0; transition: opacity .25s; font-weight: 500; }
.wall button:hover .ws, .wall button:focus-visible .ws { opacity: 1; }
.wall-note { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; color: var(--muted); font-size: .9rem; }
.wall-note canvas { width: 14px; height: 14px; flex: none; }
@media (max-width: 760px) { .wall { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* 9. story teaser */
.story { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: clamp(24px, 5vw, 70px); }
.story figure { margin: 0; position: relative; padding: 18px; }
.story figure canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.story img { width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; }
.story .k { color: var(--red); margin: 0 0 10px; }
.story p.f { margin: 14px 0 0; color: var(--muted); max-width: 46ch; font-size: 1.05rem; }
.story .btn { margin-top: 26px; }
@media (max-width: 760px) { .story { grid-template-columns: 1fr; } .story figure { max-width: 420px; } }

/* 10. newsletter */
.news { background: var(--linen); text-align: center; }
.news .ttl { justify-content: center; }
.news form { display: flex; max-width: 520px; margin: 22px auto 0; gap: 0; }
.news input { flex: 1; min-width: 0; min-height: 52px; border: 1.5px solid var(--ink); border-inline-end: 0; padding: 0 16px; background: var(--white); }
.news input[aria-invalid="true"] { border-color: var(--red); }
.news .btn { flex: none; }
.news .msg { min-height: 1.6em; margin: 10px 0 0; font-size: .9rem; color: var(--muted); }
.news .msg.err { color: var(--red); }
@media (max-width: 480px) { .news form { flex-direction: column; gap: 10px; } .news input { border-inline-end: 1.5px solid var(--ink); } }

/* 11. footer */
footer { background: var(--white); border-top: 1px solid var(--line); }
footer .hem { width: 100%; height: 48px; background: var(--linen); }
.fcols { display: grid; grid-template-columns: 1.4fr repeat(3, minmax(0, 1fr)); gap: 30px; padding-block: 40px 30px; }
.fcols .logo { justify-self: start; }
/* metal choice for the Dome inside the shared product sheet */
.mats { display: grid; gap: 6px; }
.mats button { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 48px; padding: 6px 14px; border: 1px solid var(--line); background: none; text-align: start; }
.mats button[aria-checked="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.mats small { display: block; color: var(--muted); font-size: .8rem; }

.fcols .logo img { height: 20px; }
.fcols p { margin: 14px 0 0; color: var(--muted); font-size: .92rem; max-width: 34ch; }
footer h4 { margin: 0 0 10px; }
footer ul { list-style: none; margin: 0; padding: 0; }
footer li button { border: 0; background: none; padding: 0; min-height: 40px; text-align: start; color: var(--muted); }
footer li button:hover { color: var(--red); }
.fline { border-top: 1px solid var(--line); }
.fline .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 22px; padding-block: 10px 14px; font-size: .86rem; color: var(--muted); }
.fline .opts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; }
.fline button { min-height: 44px; border: 0; background: none; padding: 0; text-decoration: underline dashed; text-underline-offset: 5px; color: var(--ink); }
@media (max-width: 860px) { .fcols { grid-template-columns: 1fr 1fr; } .fcols > div:first-child { grid-column: 1 / -1; } }

    if (!b) return;
    if (b.id === 'ann-prev') { stopAnn(); stepAnn(-1); return; }
    if (b.id === 'ann-next') { stopAnn(); stepAnn(1); return; }
    if (b.hasAttribute('data-group')) { var g = b.getAttribute('data-group'); setGroup(openGroup === g ? null : g); return; }
    if (b.id === 'burger') { setGroup(openGroup === 'mobile' ? null : 'mobile'); return; }
    if (b.classList.contains('js-search')) { setGroup(openGroup === 'search' ? null : 'search'); return; }
    if (b.hasAttribute('data-edit')) { var inRail = !!b.closest('#tabs, #chip'); setGroup(null); setEdit(b.getAttribute('data-edit'), !inRail); return; }
    if (b.hasAttribute('data-go')) { setGroup(null); go(b.getAttribute('data-go')); return; }
    if (b.hasAttribute('data-open')) { setGroup(null); closePop(); return; } // store.js opens the sheet

    if (b.id === 'r-prev') { slide(-1); return; }
    if (b.id === 'r-next') { slide(1); return; }

      return;

    if (b.hasAttribute('data-popclose')) { var hi = openHot; closePop(); var hb = $('.hot[data-hot="' + hi + '"]'); if (hb) hb.focus(); return; }
    if (b.hasAttribute('data-qadd')) {

  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (openHot > -1) { var hi = openHot; closePop(); var hb = $('.hot[data-hot="' + hi + '"]'); if (hb) hb.focus(); }
      if (openGroup) { var g = openGroup; setGroup(null); var ob = g === 'mobile' ? $('#burger') : g === 'search' ? $$('.js-search').filter(function (x) { return x.offsetParent; })[0] : $('[data-group="' + g + '"]'); if (ob) ob.focus(); }
    }
    var tb = e.target.closest && e.target.closest('#tabs [role="tab"]');
    if (tb && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      var all = $$('#tabs [role="tab"]'), k = all.indexOf(tb), d = (e.key === 'ArrowRight') === !ar() ? 1 : -1;
      var n = all[(k + d + all.length) % all.length]; setEdit(n.getAttribute('data-edit'), false); $('#tabs [aria-selected="true"]').focus();
    }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'q') renderResults(); });
  $('#rail').addEventListener('scroll', updArrows, { passive: true });
  addEventListener('resize', function () { updArrows(); if (openHot > -1) showPop(openHot, false); });
  $('.ann').addEventListener('mouseenter', stopAnn); $('.ann').addEventListener('mouseleave', startAnn);
  $('.ann').addEventListener('focusin', stopAnn);
  $('#nl').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('#nl-email'), ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(inp.value.trim()), m = $('#nl-msg');
    inp.setAttribute('aria-invalid', String(!ok)); m.className = 'msg' + (ok ? '' : ' err');
    m.setAttribute('data-k', ok ? 'nl_ok' : 'nl_err'); m.textContent = t(ok ? 'nl_ok' : 'nl_err');
    if (ok) inp.value = ''; else inp.focus();
  });

  // The shared sheet prices the Dome at its base price whatever the metal. Here the sheet gets a metal picker
  // (materials A/B/C from the catalogue) and the add button stores the chosen metal and its price on the bag line.
  var mat = 'A';
  function sheetMats(p) {
    var extra = $('[data-sheet-extra]'), fs = $('[data-sheet-tones]') && $('[data-sheet-tones]').closest('fieldset');
    if (!extra) return;
    if (!p || !p.configurable) { extra.innerHTML = ''; if (fs) fs.hidden = false; return; }
    if (fs) fs.hidden = true;
    var m = A.MATERIALS.filter(function (x) { return x.id === mat; })[0];
    extra.innerHTML = '<fieldset class="tz-fs"><legend>' + esc(t('mat_legend')) + '</legend><div class="mats" role="radiogroup">' + A.MATERIALS.map(function (x) {
      return '<button type="button" role="radio" data-mat="' + x.id + '" aria-checked="' + (x.id === mat) + '"><span>' + esc(ar() ? x.ar : x.en) + '<small>' + esc(ar() ? x.nAr : x.nEn) + '</small></span><b>' + S.money(x.price) + '</b></button>';
    }).join('') + '</div></fieldset>';
    $$('[data-sheet-price]').forEach(function (el) { el.textContent = S.money(m.price); });
    var ph = $('[data-sheet-photo]'); if (ph) ph.style.filter = S.photoFilter(p, m.tone) || 'none';
  }
  S.on('sheet', function (d) {
    var sh = $('[data-sheet]'), already = sh && !sh.hidden && sh.classList.contains('is-open');
    if (d.product.configurable && !already) mat = d.tone === 'silver' ? 'B' : 'A';
    sheetMats(d.product);
  });
  window.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button'); if (!b) return;
    var cur = S.current();
    if (b.hasAttribute('data-mat')) { mat = b.getAttribute('data-mat'); sheetMats(cur); var nb = $('[data-mat="' + mat + '"]'); if (nb) nb.focus(); return; }
    if (b.hasAttribute('data-sheet-add') && cur && cur.configurable) {
      e.stopPropagation();
      var m = A.MATERIALS.filter(function (x) { return x.id === mat; })[0];
      S.add(cur.id, m.tone, '', { price: m.price, meta: (ar() ? m.ar : m.en) + ' · ' + t('per_pair'), noTone: true });
      var x = $('[data-sheet] [data-close]'); if (x) x.click();
    }
  }, true);

  S.boot({ strings: TZ.strings(STR), render: render, cartKey: 'asala-22-cart', orderPrefix: 'AS-' });
  render(); TZ.mount(document); startAnn();
})();
</script>
</body>
</html>
