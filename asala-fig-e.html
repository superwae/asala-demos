<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Asala Heritage House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Aref+Ruqaa:wght@700&family=Reem+Kufi:wght@700&display=swap">
<style>
/* Layout: the teammate's Figma direction "E · Heritage house (international)": a classic international jewellery house.
   Marcellus display, Jost body, letter-spaced uppercase labels, white and warm off-white bands, charcoal panels with gold labels,
   thin outline rectangles for buttons. English first; the Arabic toggle gives the full RTL version, and every heading carries
   its other-language echo the way the Figma pairs "EARRINGS أقراط". */
:root {
  --white: #ffffff; --paper: #F5F1EF; --ivory: #F5F0EA; --ivory-2: #EAE9E7;
  --char: #33342F; --char-2: #2b2c28; --char-3: #3b3c37;
  --ink: #33342F; --muted: #5f605a; --on-char: #F5F1E9; --on-char-2: #d9d6cf;
  --gold: #C9A45C; --red: #C6383C; --red-ink: #ad2e32; --error: #b3261e;
  --line: rgba(51,52,47,.14); --edge: #33342F; --edge-soft: rgba(51,52,47,.4);
  --f-display: "Marcellus", "Amiri", serif; --f-body: "Jost", "IBM Plex Sans Arabic", "Segoe UI", sans-serif;
  --f-ar: "Amiri", "IBM Plex Sans Arabic", serif; --f-ar-body: "IBM Plex Sans Arabic", "Jost", sans-serif;
  --page: 1440px; --gutter: 48px; --hh: 140px;
  --ease: cubic-bezier(.2,.8,.2,1);
  --jewel-shadow: rgba(51,52,47,.22);
  color-scheme: light;
}
:root[lang="ar"] { --f-display: "Amiri", "Marcellus", serif; --f-body: "IBM Plex Sans Arabic", "Jost", sans-serif; }
@media (max-width: 900px) { :root { --gutter: 16px; --hh: 64px; } }
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--hh) + 12px); -webkit-text-size-adjust: 100%; }
html.panel-open, html.dlg-open { overflow: hidden; }
body { margin: 0; background: var(--white); color: var(--ink); font: 400 1rem/1.65 var(--f-body); -webkit-font-smoothing: antialiased; }
::selection { background: var(--char); color: var(--on-char); }
:focus-visible { outline: 2px solid var(--char); outline-offset: 3px; }
.on-dark :focus-visible, .hero :focus-visible, .footer :focus-visible, .craft-panel :focus-visible { outline-color: var(--on-char); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
img { display: block; max-width: 100%; }
/* dome-worn.jpg carries a thin white strip on its bottom edge; lotus-45 is shown close, as in the Figma */
img[src$="dome-worn.jpg"] { scale: 1.035; transform-origin: 50% 15%; }
img.zoom { scale: 1.55; transform-origin: 50% 52%; }
img[src$="lotus-pendant.jpg"] { scale: 1.03; }
a { color: inherit; }
::placeholder { color: #75766f; opacity: 1; }
bdi { unicode-bidi: isolate; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; top: -60px; inset-inline-start: 16px; z-index: 100; background: var(--char); color: var(--on-char); padding: 12px 18px; text-decoration: none; }
.skip:focus { top: 8px; }
.page { max-width: var(--page); margin: 0 auto; padding-inline: var(--gutter); }

/* type */
.caps { font-family: var(--f-body); text-transform: uppercase; letter-spacing: .14em; font-weight: 400; }
:root[lang="ar"] .caps { letter-spacing: 0; }
.h-display { font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.12; letter-spacing: -.005em; text-wrap: balance; }
:root[lang="ar"] .h-display { line-height: 1.45; letter-spacing: 0; }
.h-sec { font-size: clamp(1.9rem, 3.05vw, 2.75rem); }
.lead { color: var(--muted); margin: 6px 0 0; font-size: 1.05rem; }
.echo:lang(ar) { font-family: var(--f-ar); letter-spacing: 0; text-transform: none; }
.echo:lang(en) { font-family: var(--f-display); letter-spacing: .01em; }
.num { font-variant-numeric: tabular-nums lining-nums; }

/* buttons: thin outline rectangles */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 28px; border: 1px solid var(--edge); background: transparent; color: var(--ink); text-decoration: none; font-size: .86rem; text-transform: uppercase; letter-spacing: .16em; font-weight: 500; transition: background-color .25s var(--ease), color .25s var(--ease); }
:root[lang="ar"] .btn { letter-spacing: 0; font-size: .98rem; }
.btn:hover { background: var(--char); color: var(--on-char); }
.btn.solid { background: var(--char); color: var(--on-char); }
.btn.solid:hover { background: var(--char-2); }
.btn.light { border-color: rgba(255,255,255,.9); color: #fff; }
.btn.light:hover { background: #fff; color: var(--char); }
.btn.sentence { text-transform: none; letter-spacing: .02em; font-size: 1rem; font-weight: 400; }
.btn.full { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link-arrow { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; background: none; border: 0; padding: 0; color: var(--ink); font-size: .95rem; font-weight: 500; text-decoration: none; }
.link-arrow svg { width: 15px; height: 15px; transition: transform .25s var(--ease); }
[dir="rtl"] .link-arrow svg, [dir="rtl"] .flip { transform: scaleX(-1); }
.link-arrow:hover span { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
.link-arrow:hover svg { transform: translateX(3px); }
[dir="rtl"] .link-arrow:hover svg { transform: scaleX(-1) translateX(3px); }

/* announcement */
.announce { background: var(--char); color: var(--on-char); }
.announce .page { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 46px; }
.announce p { margin: 0; font-size: .9rem; text-align: center; min-width: 0; flex: 0 1 640px; transition: opacity .35s ease; }
.announce p.fade { opacity: 0; }
.ann-btn { flex: none; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--on-char); }
.ann-btn svg { width: 14px; height: 14px; }

/* header */
.header { position: sticky; top: 0; z-index: 30; background: var(--white); border-bottom: 1px solid transparent; transition: border-color .25s; }
.header.is-stuck { border-bottom-color: var(--line); }
.h-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 90px; }
.h-start { display: flex; align-items: center; gap: 6px; }
.cur { font-size: .82rem; letter-spacing: .06em; color: var(--ink); padding-inline-end: 8px; white-space: nowrap; }
.lang { min-height: 44px; min-width: 44px; padding: 0 8px; background: none; border: 0; font-size: 1rem; }
.lang:lang(ar) { font-family: var(--f-ar); font-size: 1.12rem; }
.lang:hover { text-decoration: underline; text-underline-offset: 5px; }
.lockup { display: inline-flex; align-items: center; gap: 16px; min-height: 44px; text-decoration: none; color: var(--ink); direction: ltr; }
.lockup img { height: 22px; width: auto; max-width: none; }
.lockup i { width: 1px; height: 28px; background: var(--ink); }
.lockup span { font-family: var(--f-ar); font-size: 1.95rem; line-height: 1; transform: translateY(-3px); }
.h-end { display: flex; justify-content: flex-end; align-items: center; gap: 2px; }
.icon { position: relative; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--ink); }
.icon svg { width: 21px; height: 21px; }
.icon .count { position: absolute; top: 4px; inset-inline-end: 1px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--char); color: var(--on-char); font-size: .66rem; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.icon .count.red { background: var(--red); color: #fff; }
.burger { display: none; }
.nav { display: flex; justify-content: center; gap: clamp(18px, 3vw, 44px); min-height: 42px; padding-bottom: 6px; }
.nav > button, .nav > div > button { position: relative; min-height: 42px; padding: 0 2px; background: none; border: 0; font-size: .86rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
:root[lang="ar"] .nav > button, :root[lang="ar"] .nav > div > button { letter-spacing: 0; font-size: 1rem; }
.nav > button::after, .nav > div > button::after { content: ""; position: absolute; inset-inline: 0; bottom: 8px; height: 1px; background: currentColor; transform: scaleX(0); transition: transform .3s var(--ease); }
.nav button:hover::after, .nav button[aria-expanded="true"]::after { transform: scaleX(1); }
.mega { position: absolute; inset-inline: 0; top: 100%; background: var(--white); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); box-shadow: 0 18px 30px -18px rgba(51,52,47,.25); }
.mega .page { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 40px; padding-block: 34px 40px; }
.mega h3 { margin: 0 0 10px; font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 500; color: var(--muted); }
:root[lang="ar"] .mega h3 { letter-spacing: 0; font-size: .9rem; }
.mega ul { list-style: none; margin: 0; padding: 0; display: grid; }
.mega li button { min-height: 40px; background: none; border: 0; padding: 0; text-align: start; font-size: 1rem; display: flex; gap: 10px; align-items: baseline; width: 100%; }
.mega li button:hover span:first-child { text-decoration: underline; text-underline-offset: 5px; }
.mega li small { color: var(--muted); font-size: .88rem; }
.mega-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mega-tile { display: grid; gap: 8px; background: none; border: 0; padding: 0; text-align: start; }
.mega-tile .ph { aspect-ratio: 4 / 3; overflow: hidden; background: var(--paper); }
.mega-tile img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
.mega-tile:hover img { transform: scale(1.04); }
.mega-tile span { font-size: .95rem; }
.coll-row { display: grid; gap: 4px; }
.coll-row p { margin: 0 0 10px; color: var(--muted); font-size: .92rem; max-width: 34ch; }
.searchbar { border-top: 1px solid var(--line); background: var(--white); padding-block: 16px 20px; }
.searchbar input { width: 100%; min-height: 50px; border: 0; border-bottom: 1px solid var(--edge); background: transparent; padding: 0 2px; font-size: 1.05rem; border-radius: 0; }
.searchbar input:focus-visible { outline: none; border-bottom-width: 2px; }
.results { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px 16px; }
.results button { width: 100%; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 6px 0; background: none; border: 0; text-align: start; min-height: 44px; }
.results img { width: 52px; height: 64px; object-fit: cover; background: var(--paper); }
.results .pr { color: var(--muted); }
.results .none { color: var(--muted); }

/* hero carousel */
.hero { position: relative; height: clamp(520px, 54.5vw, 786px); overflow: hidden; background: #6f7377; color: #fff; }
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s linear .9s; }
.slide.is-on { opacity: 1; visibility: visible; transition: opacity .9s ease; }
.sl-media { position: absolute; inset: 0; display: grid; }
.sl-media.duo { grid-template-columns: 1fr 1fr; }
.sl-media img { width: 100%; height: 100%; object-fit: cover; }
.slide.is-on .sl-media img { animation: drift 9s ease-out both; }
@keyframes drift { from { transform: scale(1.045); } to { transform: scale(1); } }
.slide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(22,22,20,.62) 0%, rgba(22,22,20,.18) 46%, rgba(22,22,20,0) 70%), linear-gradient(to right, rgba(22,22,20,.32), rgba(22,22,20,0) 55%); pointer-events: none; }
[dir="rtl"] .slide::after { background: linear-gradient(to top, rgba(22,22,20,.62) 0%, rgba(22,22,20,.18) 46%, rgba(22,22,20,0) 70%), linear-gradient(to left, rgba(22,22,20,.32), rgba(22,22,20,0) 55%); }
.sl-text { position: absolute; inset-inline: 0; bottom: 62px; z-index: 2; }
.sl-text .page > div { max-width: min(600px, 47vw); display: grid; justify-items: start; }
.slide.deep::after { background: linear-gradient(to top, rgba(22,22,20,.74) 0%, rgba(22,22,20,.34) 48%, rgba(22,22,20,0) 78%), linear-gradient(to right, rgba(22,22,20,.38), rgba(22,22,20,0) 50%); }
[dir="rtl"] .slide.deep::after { background: linear-gradient(to top, rgba(22,22,20,.74) 0%, rgba(22,22,20,.34) 48%, rgba(22,22,20,0) 78%), linear-gradient(to left, rgba(22,22,20,.38), rgba(22,22,20,0) 50%); }
.sl-echo { margin: 0 0 10px; font-size: 1.95rem; line-height: 1.2; }
.sl-echo:lang(en) { font-size: 1.5rem; }
.sl-text .h-display { font-size: clamp(2.6rem, 4.65vw, 4.15rem); color: #fff; }
.sl-text p.sl-p { margin: 18px 0 30px; font-size: 1.12rem; line-height: 1.55; max-width: 32em; color: rgba(255,255,255,.94); }
.hero-ctl { position: absolute; inset-inline: 0; bottom: 50px; z-index: 3; pointer-events: none; }
.hero-ctl .page { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.hero-ctl button { pointer-events: auto; }
.dash { width: 44px; height: 44px; background: none; border: 0; padding: 0; display: grid; place-items: center; }
.dash::before { content: ""; width: 16px; height: 2px; background: rgba(255,255,255,.75); transition: width .4s var(--ease), background-color .3s; }
.dash[aria-current="true"]::before { width: 38px; background: #fff; }
.dash[aria-current="true"] { width: 56px; }
.pause { width: 44px; height: 44px; background: none; border: 0; color: #fff; display: grid; place-items: center; margin-inline-start: 6px; }
.pause svg { width: 14px; height: 14px; }

.section { padding-block: clamp(56px, 7vw, 100px); }
.band { background: var(--paper); }

/* shop by category */
.cat-head { text-align: center; margin-bottom: clamp(28px, 3.6vw, 44px); }
.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.cat { display: grid; gap: 18px; background: none; border: 0; padding: 0; text-align: center; }
.cat .ph { aspect-ratio: 25 / 32; overflow: hidden; background: var(--paper); }
.cat img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
.cat:hover img { transform: scale(1.035); }
.cat .lbl { display: inline-flex; justify-content: center; align-items: baseline; gap: 10px; font-size: .9rem; min-height: 24px; }
.cat .lbl .echo:lang(ar) { font-size: 1.12rem; }
.cat .lbl .echo:lang(en) { font-family: var(--f-body); text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; }
.cat:hover .lbl > span:first-child { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }

/* signature carousel */
.rail-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 18px; }
.arrows { display: flex; gap: 10px; flex: none; }
.arrow { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--white); color: var(--ink); display: grid; place-items: center; box-shadow: 0 2px 8px rgba(51,52,47,.06); transition: background-color .2s, color .2s; }
.arrow svg { width: 18px; height: 18px; }
.arrow:hover { background: var(--char); color: var(--on-char); }
.arrow[aria-disabled="true"] { opacity: .4; cursor: default; }
.arrow[aria-disabled="true"]:hover { background: var(--white); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 0 0 26px; }
.chip { min-height: 44px; padding: 0; background: none; border: 0; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid transparent; }
:root[lang="ar"] .chip { letter-spacing: 0; font-size: .95rem; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.track { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 3 * 24px) / 4); gap: 24px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.track::-webkit-scrollbar { display: none; }
.pc { position: relative; scroll-snap-align: start; display: grid; align-content: start; }
.pc-media { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--ivory-2); }
.pc-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .5s ease, transform .9s var(--ease); }
.pc-media.is-cut { background: #F1EDEA; }
.pc-media.is-cut img.main { object-fit: contain; padding: 12%; }
.pc-media .alt { opacity: 0; }
@media (hover: hover) { .pc:hover .pc-media .alt { opacity: 1; } .pc:hover .pc-media img { transform: scale(1.03); } }
.pc-link { position: absolute; inset: 0; z-index: 1; background: none; border: 0; padding: 0; }
.heart { position: absolute; top: 6px; inset-inline-end: 6px; z-index: 2; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--ink); }
.heart::before { content: ""; position: absolute; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.78); }
.heart svg { position: relative; }
.heart svg { width: 18px; height: 18px; transition: transform .25s var(--ease); }
.heart[aria-pressed="true"] svg { fill: var(--red); stroke: var(--red); }
.heart:active svg { transform: scale(.86); }
.pc-name { margin: 16px 0 0; font-size: 1rem; font-weight: 400; line-height: 1.4; }
.pc-echo { margin: 8px 0 0; color: var(--muted); font-size: .98rem; line-height: 1.4; }
.pc-echo:lang(ar) { font-size: 1.04rem; }
.pc-echo:lang(en) { font-family: var(--f-body); font-size: .92rem; }
.pc-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.pc-price { font-size: 1rem; }
.pc-price small { color: var(--muted); font-size: .82rem; margin-inline-end: 4px; }
.dots { display: inline-flex; gap: 6px; }
.dots i { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.rail-empty { color: var(--muted); padding: 40px 0; }

/* shop the edit */
.edits { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: clamp(26px, 3vw, 40px); }
.edit { position: relative; aspect-ratio: 2 / 3; overflow: hidden; background: var(--paper); border: 0; padding: 0; text-align: start; color: #fff; }
.edit img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .9s var(--ease); }
.edit img.cut { object-fit: contain; padding: 6% 8% 26%; background: #F3EFEE; }
.edit:hover img { transform: scale(1.035); }
.edit::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(28,28,26,.72), rgba(28,28,26,.25) 32%, rgba(28,28,26,0) 52%); }
.edit .tx { position: absolute; inset-inline: 24px; bottom: 26px; z-index: 1; display: grid; gap: 4px; }
.edit b { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.4rem, 2vw, 1.85rem); line-height: 1.15; }
.edit small { font-size: .9rem; color: rgba(255,255,255,.92); }

/* craft split */
.craft { display: grid; grid-template-columns: 1fr 1fr; min-height: clamp(520px, 52vw, 746px); background: var(--char); }
.craft-media { position: relative; overflow: hidden; }
.craft-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.craft-panel { color: var(--on-char); display: grid; align-content: center; padding: clamp(40px, 5.6vw, 80px); }
.craft-panel > div { max-width: 540px; }
.gold-eyebrow { margin: 0 0 18px; color: var(--gold); font-size: 1.3rem; line-height: 1.3; }
.gold-eyebrow:lang(en) { font-size: 1rem; text-transform: uppercase; letter-spacing: .16em; font-family: var(--f-body); }
.craft-panel .h-display { font-size: clamp(2rem, 3.1vw, 2.75rem); color: #fff; }
.craft-panel p.body { margin: 24px 0 30px; color: var(--on-char-2); font-size: 1.02rem; line-height: 1.75; max-width: 52ch; }
.craft-steps { list-style: none; margin: 26px 0 0; padding: 0; display: grid; gap: 16px; border-top: 1px solid rgba(245,241,233,.18); padding-top: 22px; }
.craft-steps li { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: start; }
.craft-steps img { width: 64px; height: 64px; object-fit: cover; }
.craft-steps b { display: block; font-weight: 500; color: #fff; }
.craft-steps span { color: var(--on-char-2); font-size: .94rem; }
.btn.on-char { border-color: rgba(245,241,233,.85); color: #fff; }
.btn.on-char:hover { background: var(--on-char); color: var(--char); }

/* campaign */
.campaign { max-width: 1240px; }
.camp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.camp { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: #222; border: 0; padding: 0; }
.camp img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.04); transition: transform 1.1s var(--ease); }
.camp:hover img { transform: scale(1.025); }
.camp .shop { position: absolute; inset-inline-start: 16px; bottom: 16px; background: rgba(255,255,255,.94); color: var(--ink); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; padding: 10px 14px; opacity: 0; transform: translateY(6px); transition: .35s var(--ease); }
:root[lang="ar"] .camp .shop { letter-spacing: 0; font-size: .9rem; }
.camp:hover .shop, .camp:focus-visible .shop { opacity: 1; transform: none; }
@media (hover: none) { .camp .shop { opacity: 1; transform: none; } }
