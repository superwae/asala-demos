<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Siwar Tatreez Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Alexandria:wght@300;400;500;600&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Layout: a linen tatreez panel. The hero sits inside a cross-stitched frame, products sit in running-stitch panels, the footer is a stitched border. Square corners everywhere: thread follows the weave. */
:root {
  --linen: #efeee8; --linen-2: #e6e5dd; --weave: #d9d7cc;
  --red: #a3122a; --red-deep: #7a0b1e; --black: #1c1715; --green: #2d6a3a;
  --ink: #241c1a; --muted: #5d5450; --error: #a3122a;
  --f-display: "Reem Kufi", "Alexandria", sans-serif;
  --f-body: "Alexandria", "Segoe UI", Tahoma, sans-serif;
  --gutter: clamp(16px, 4vw, 40px);
  --cell: 8px;
  --jewel-shadow: rgba(36, 28, 26, .3);
  color-scheme: light;
}
* { box-sizing: border-box; }
html.panel-open { overflow: hidden; }
body { margin: 0; background: var(--linen); color: var(--ink); font: 400 1rem/1.7 var(--f-body);
  background-image: repeating-linear-gradient(0deg, transparent 0 3px, rgba(120,110,90,.05) 3px 4px), repeating-linear-gradient(90deg, transparent 0 3px, rgba(120,110,90,.05) 3px 4px); }
::selection { background: var(--red); color: var(--linen); }
:focus-visible { outline: 2px dashed var(--red); outline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; border-radius: 0; }
button { cursor: pointer; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: var(--gutter); }
canvas.band { display: block; width: 100%; height: 32px; }

.demo { background: var(--black); color: #d8d2c8; font-size: .8rem; text-align: center; padding: 6px var(--gutter); margin: 0; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--linen); }
.top .wrap { display: flex; align-items: center; gap: 22px; min-height: 66px; }
.logo { font: 700 1.9rem/1 var(--f-display); color: var(--red); text-decoration: none; }
.top nav { display: flex; gap: 2px; }
.top nav button { background: none; border: 0; min-height: 44px; padding: 0 12px; font-weight: 500; color: var(--ink); }
.top nav button:hover { color: var(--red); text-decoration: underline dashed; text-underline-offset: 6px; }
.tools { display: flex; gap: 8px; margin-inline-start: auto; }
.sq { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1.5px solid var(--ink); background: transparent; font-weight: 500; }
.sq.red { background: var(--red); border-color: var(--red); color: var(--linen); }
.sq svg { width: 18px; height: 18px; }
.count { min-width: 22px; height: 22px; padding: 0 5px; background: var(--linen); color: var(--red); font-size: .8rem; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .top nav { display: none; } .sq .lbl { display: none; } }
.top-band { border-bottom: 1px solid var(--weave); }

/* the hero panel */
.qabbeh { padding-block: clamp(22px, 4vw, 52px); }
.qabbeh .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(22px, 4vw, 56px); align-items: center; }
.panel { position: relative; aspect-ratio: 1; max-width: 100%; padding: 34px; }
.panel > canvas.frame { position: absolute; inset: 0; width: 100%; height: 100%; }
.panel .inner { position: relative; width: 100%; height: 100%; background: var(--linen-2); box-shadow: inset 0 0 0 1px var(--weave); }
.panel .inner canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.copy h1 { font: 700 clamp(2.2rem, 5vw, 4rem)/1.15 var(--f-display); margin: 0 0 14px; color: var(--ink); text-wrap: balance; }
.copy h1 em { font-style: normal; color: var(--red); }
.copy p { margin: 0 0 22px; color: var(--muted); max-width: 42ch; font-size: 1.05rem; }
.copy label { display: block; font-weight: 500; margin-bottom: 6px; }
.name-in { width: 100%; min-height: 56px; padding: 0 16px; border: 1.5px solid var(--ink); background: var(--linen); font: 700 1.7rem "Aref Ruqaa", serif; color: var(--red); }
.name-in:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 30%, transparent); }
.buy { display: flex; align-items: center; gap: 18px; margin-top: 16px; flex-wrap: wrap; }
.price { font: 700 2rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.price small { font: 400 .85rem var(--f-body); color: var(--muted); margin-inline-start: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 24px; border: 0; background: var(--red); color: var(--linen); font-weight: 600; font-size: 1.02rem; }
.btn:hover { background: var(--red-deep); }
.marks { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 8px; }
.marks li { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.marks canvas { width: 22px; height: 22px; flex: none; }
@media (max-width: 860px) { .qabbeh .wrap { grid-template-columns: 1fr; gap: 18px; } .panel { padding: 22px; max-width: 520px; margin-inline: auto; width: 100%; aspect-ratio: 16 / 10; } .copy h1 { font-size: clamp(1.9rem, 8vw, 2.6rem); } .copy p { margin-bottom: 14px; } }

/* panels of products */
.panels { padding-block: clamp(34px, 6vw, 70px); }
.panels-head { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: end; margin-bottom: 26px; }
.panels h2, .steps-sec h2 { font: 700 clamp(1.8rem, 3.6vw, 2.8rem)/1.2 var(--f-display); margin: 0; }
.filters { display: flex; gap: 0; border: 1.5px solid var(--ink); }
.filters button { min-height: 44px; padding: 0 16px; border: 0; background: transparent; font-weight: 500; }
.filters button + button { border-inline-start: 1.5px solid var(--ink); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--linen); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0; border-top: 1.5px dashed var(--red); border-inline-start: 1.5px dashed var(--red); }
.card { position: relative; display: grid; grid-template-rows: auto auto 1fr; padding: 16px; border-bottom: 1.5px dashed var(--red); border-inline-end: 1.5px dashed var(--red); background: transparent; }
.card::after { content: ""; position: absolute; inset: 6px; border: 2px dashed var(--red); clip-path: inset(0 100% 100% 0); transition: clip-path .7s steps(14, end); pointer-events: none; }
.card:hover::after, .card:focus-within::after { clip-path: inset(0 0 0 0); }
.card .art { position: relative; aspect-ratio: 1; border: 0; background: transparent; padding: 0; width: 100%; }
.card .art canvas { position: absolute; inset: 4%; width: 92%; height: 92%; }
.card .art img { position: absolute; inset: 5%; width: 90%; height: 90%; object-fit: cover; box-shadow: 0 0 0 1px var(--weave); transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.card:hover .art img { transform: scale(1.03); }
.worn { padding-block: 0 clamp(34px, 6vw, 70px); }
.worn h2 { font: 700 clamp(1.8rem, 3.6vw, 2.8rem)/1.2 var(--f-display); margin: 0 0 22px; }
.worn-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2.5vw, 30px); }
.look { display: grid; gap: 10px; border: 0; background: none; padding: 0; text-align: start; }
.look .mini { position: relative; aspect-ratio: 4 / 5; padding: 22px; }
.look .mini canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.look .mini img { position: relative; width: 100%; height: 100%; object-fit: cover; display: block; }
.look span { font: 700 1.3rem/1.2 var(--f-display); padding-inline: 4px; }
.look:hover span { color: var(--red); }
@media (max-width: 720px) { .worn-row { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scrollbar-width: none; } .look { flex: 0 0 70%; scroll-snap-align: center; } }
.card h3 { margin: 6px 0 2px; font: 500 1rem/1.45 var(--f-body); }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
.card .p { font: 700 1.25rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.add { width: 44px; height: 44px; display: grid; place-items: center; border: 1.5px solid var(--red); background: transparent; color: var(--red); }
.add:hover { background: var(--red); color: var(--linen); }
.add svg { width: 20px; height: 20px; }
.new { position: absolute; top: 14px; inset-inline-start: 14px; z-index: 1; background: var(--green); color: var(--linen); font: 600 .75rem/1 var(--f-display); padding: 5px 8px; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .card { padding: 10px; } .card h3 { font-size: .95rem; } }

.steps-sec { padding-block: clamp(30px, 5vw, 60px); border-top: 1px solid var(--weave); }
.steps { list-style: none; padding: 0; margin: 24px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; gap: 4px; padding-top: 14px; border-top: 2px solid var(--ink); }
.steps li::before { content: counter(s); font: 700 1.8rem/1 var(--f-display); color: var(--red); }
.steps b { font-weight: 600; font-size: 1.05rem; } .steps span { color: var(--muted); }
@media (max-width: 720px) { .steps { grid-template-columns: 1fr; } }

/* the hem */
footer { background: var(--red); color: #f6dfe2; }
footer canvas.band { height: 48px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 14px 36px; align-items: center; justify-content: space-between; padding-block: 26px 32px; }
footer .logo { color: var(--linen); }
footer b { color: var(--linen); user-select: all; font-variant-numeric: tabular-nums; }

/* panels */
.sheet, .drawer { position: fixed; inset: 0; z-index: 50; background: rgba(28, 23, 21, .55); display: flex; opacity: 0; transition: opacity .25s; }
.is-open { opacity: 1; }
.sheet { align-items: center; justify-content: center; padding: 16px; }
.sheet-card { position: relative; width: min(880px, 100%); max-height: calc(100% - 16px); overflow: auto; display: grid; grid-template-columns: 1fr 1fr; background: var(--linen); border: 2px solid var(--ink); transform: translateY(14px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.is-open .sheet-card { transform: none; }
.sheet-art { position: relative; min-height: 340px; background: var(--linen-2); border-inline-end: 1.5px dashed var(--red); }
.sheet-art canvas { position: absolute; inset: 6%; width: 88%; height: 88%; }
.sheet-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sheet-info { padding: 28px; display: flex; flex-direction: column; gap: 12px; }
.sheet-info h2 { font: 700 2rem/1.2 var(--f-display); margin: 0; }
.sheet-cat { margin: 0; color: var(--red); font-weight: 500; }
.sheet-price { margin: 0; font: 700 1.7rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.sheet-desc { margin: 0; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0; }
legend, .lbl-s { font-weight: 500; margin-bottom: 8px; padding: 0; display: block; }
[data-sheet-tones] { display: flex; gap: 8px; flex-wrap: wrap; }
.tone { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--muted); background: transparent; }
.tone[aria-checked="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tone-dot { width: 16px; height: 16px; }
.text-in { width: 100%; min-height: 50px; padding: 0 14px; border: 1.5px solid var(--ink); background: var(--linen); font: 700 1.4rem "Aref Ruqaa", serif; color: var(--red); }
.hint { color: var(--muted); font-size: .82rem; }
.err { color: var(--error); font-size: .88rem; margin: 2px 0 0; min-height: 1em; font-weight: 500; }
.x { position: absolute; top: 10px; inset-inline-end: 10px; z-index: 3; width: 44px; height: 44px; border: 1.5px solid var(--ink); background: var(--linen); display: grid; place-items: center; }
.x svg { width: 18px; height: 18px; }
.full { width: 100%; }
@media (max-width: 720px) {
  .sheet { align-items: end; padding: 0; }
  .sheet-card { grid-template-columns: 1fr; max-height: 94%; border-inline: 0; border-bottom: 0; transform: translateY(40px); }
  .sheet-art { min-height: 240px; border-inline-end: 0; border-bottom: 1.5px dashed var(--red); }
  .sheet-info { padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
}
.drawer { justify-content: flex-end; }
.drawer-card { width: min(440px, 100%); height: 100%; overflow: auto; background: var(--linen); border-inline-start: 2px solid var(--ink); padding: calc(18px + env(safe-area-inset-top, 0px)) 22px calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(40px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
[dir="rtl"] .drawer-card { transform: translateX(-40px); }
.drawer.is-open .drawer-card { transform: none; }
.d-head { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1.5px dashed var(--red); }
.d-head h2 { margin: 0; font: 700 1.8rem/1 var(--f-display); }
.d-head span { color: var(--muted); }
.d-head .x { position: static; margin-inline-start: auto; }
.empty { color: var(--muted); padding: 30px 0; }
[data-cart-list] { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ci { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--weave); }
.ci-img { position: relative; width: 72px; height: 72px; background: var(--linen-2); }
.ci-img canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.ci-img img { width: 100%; height: 100%; object-fit: cover; }
.ci-name { margin: 0; font-weight: 600; }
.ci-meta { margin: 0 0 6px; color: var(--muted); font-size: .85rem; }
.ci-row { display: flex; gap: 10px; align-items: center; }
.ci-qty { display: inline-flex; align-items: center; border: 1.5px solid var(--ink); }
.ci-qty button { width: 44px; height: 44px; border: 0; background: none; font-size: 1.1rem; }
.ci-qty output { min-width: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.ci-remove { border: 0; background: none; color: var(--muted); text-decoration: underline dashed; text-underline-offset: 4px; min-height: 44px; }
.ci-price { margin: 0; font: 700 1.1rem/1.4 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sums { margin: 18px 0; display: grid; gap: 8px; font-variant-numeric: tabular-nums; }
.sums div { display: flex; justify-content: space-between; } .sums dd { margin: 0; } .sums dt { color: var(--muted); }
.sums .grand { padding-top: 10px; border-top: 1.5px dashed var(--red); font: 700 1.2rem var(--f-display); } .sums .grand dt { color: var(--ink); }
.form { display: grid; gap: 14px; }
.form label { display: block; font-weight: 500; margin-bottom: 5px; }
.form input, .form select, .form textarea { width: 100%; min-height: 50px; padding: 10px 14px; border: 1.5px solid var(--ink); background: var(--linen); }
.form textarea { min-height: 80px; resize: vertical; }
.form [aria-invalid="true"] { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.form input[type="tel"] { direction: ltr; }
[dir="rtl"] .form input[type="tel"] { text-align: right; }
[data-pay-list] { display: grid; gap: 0; border: 1.5px solid var(--ink); }
.pay { display: flex; gap: 12px; padding: 12px 14px; cursor: pointer; }
.pay + .pay { border-top: 1px dashed var(--weave); }
.pay:has(input:checked) { background: color-mix(in srgb, var(--red) 8%, var(--linen)); outline: 1.5px solid var(--red); outline-offset: -1.5px; }
.pay input { width: 20px; height: 20px; min-height: 0; margin: 3px 0 0; accent-color: var(--red); }
.pay-body { display: grid; } .pay-name { font-weight: 600; } .pay-note { color: var(--muted); font-size: .86rem; }
.fee-hint { color: var(--muted); font-size: .86rem; margin: -6px 0 0; }
.link-btn { border: 0; background: none; color: var(--muted); text-decoration: underline; min-height: 44px; }
.ok { text-align: center; padding: 40px 0; display: grid; gap: 12px; justify-items: center; }
.ok h3 { font: 700 2.2rem/1.2 var(--f-display); color: var(--red); margin: 0; }
.ok canvas { width: 64px; height: 64px; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); inset-inline: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px); z-index: 60; background: var(--ink); color: var(--linen); padding: 12px 18px; border-bottom: 3px solid var(--red); transform: translateY(20px); opacity: 0; transition: .3s; pointer-events: none; }
.toast.is-on { transform: none; opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<p class="demo" data-t="demo_note"></p>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top">سِوار</a>
    <nav aria-label="Categories">
      <button type="button" data-jump="necklace" data-cat-label="necklace"></button>
      <button type="button" data-jump="bracelet" data-cat-label="bracelet"></button>
      <button type="button" data-jump="earrings" data-cat-label="earrings"></button>
    </nav>
    <div class="tools">
      <button class="sq" type="button" data-lang-toggle><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span data-t="lang_switch"></span></button>
      <button class="sq red" type="button" data-open-cart data-ta="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="lbl" data-t="cart"></span><span class="count" data-cart-count hidden>0</span></button>
    </div>
  </div>
  <canvas class="band top-band" data-stitch="band" aria-hidden="true"></canvas>
</header>

<main id="top">
  <section class="qabbeh">
    <div class="wrap">
      <div class="panel">
        <canvas class="frame" data-stitch="frame" aria-hidden="true"></canvas>
        <div class="inner"><canvas data-id="name" data-tone="gold" data-live-target></canvas></div>
      </div>
      <div class="copy">
        <h1><span data-t="h1a"></span> <em data-t="h1b"></em></h1>
        <p data-t="lead"></p>
        <label for="hero-name" data-t="type_name"></label>
        <input id="hero-name" class="name-in" data-live-name maxlength="8" autocomplete="off" data-tp="name_ph" aria-describedby="hero-err">
        <p class="err" id="hero-err" aria-live="polite"></p>
        <div class="buy">
          <span class="price" data-hero-price></span>
          <button class="btn" type="button" data-hero-add data-t="hero_cta"></button>
        </div>
        <ul class="marks">
          <li><canvas data-stitch="star" aria-hidden="true"></canvas><span data-t="trust_cod"></span></li>
          <li><canvas data-stitch="star" aria-hidden="true"></canvas><span data-t="trust_ship"></span></li>
          <li><canvas data-stitch="star" aria-hidden="true"></canvas><span data-t="trust_swap"></span></li>
        </ul>
      </div>
    </div>
  </section>

  <section class="panels" id="panels">
    <div class="wrap">
      <div class="panels-head">
        <h2 data-t="panels_h"></h2>
        <div class="filters" role="group" aria-label="Categories">
          <button type="button" data-cat="all" aria-pressed="true" data-cat-label="all"></button>
          <button type="button" data-cat="necklace" aria-pressed="false" data-cat-label="necklace"></button>
          <button type="button" data-cat="bracelet" aria-pressed="false" data-cat-label="bracelet"></button>
          <button type="button" data-cat="earrings" aria-pressed="false" data-cat-label="earrings"></button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="worn">
    <div class="wrap">
      <h2 data-t="worn_h"></h2>
      <div class="worn-row">
        <button class="look" type="button" data-jump="necklace"><div class="mini"><canvas data-stitch="frame" aria-hidden="true"></canvas><img src="img/c-necklace.jpg" alt=""></div><span data-cat-label="necklace"></span></button>
        <button class="look" type="button" data-jump="bracelet"><div class="mini"><canvas data-stitch="frame" aria-hidden="true"></canvas><img src="img/c-bracelet.jpg" alt=""></div><span data-cat-label="bracelet"></span></button>
        <button class="look" type="button" data-jump="earrings"><div class="mini"><canvas data-stitch="frame" aria-hidden="true"></canvas><img src="img/c-earrings.jpg" alt=""></div><span data-cat-label="earrings"></span></button>
      </div>
    </div>
  </section>

  <section class="steps-sec">
    <div class="wrap">
      <h2 data-t="how_h"></h2>
      <ol class="steps">
        <li><b data-t="s1"></b><span data-t="s1d"></span></li>
        <li><b data-t="s2"></b><span data-t="s2d"></span></li>
        <li><b data-t="s3"></b><span data-t="s3d"></span></li>
      </ol>
    </div>
  </section>
</main>

<footer>
  <canvas class="band" data-stitch="hem" aria-hidden="true"></canvas>
  <div class="wrap">
    <span class="logo">سِوار</span>
    <span><span data-t="wa"></span> <b>059 000 0000</b> · Instagram <b>@siwar.demo</b></span>
  </div>
</footer>

<div class="sheet" data-sheet hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">

<script src="store.js"></script>
<script>
(function () {
  var S = window.Store, cat = 'all';
  var RED = '#a3122a', BLACK = '#1c1715', GREEN = '#2d6a3a', LINEN = '#efeee8';

  // ---- cross-stitch motifs (1 = red, 2 = black, 3 = green, 4 = linen) ----
  var STAR = [ // the eight-pointed star
    '....1....',
    '...111...',
    '1.11211.1',
    '.1122211.',
    '112232211',
    '.1122211.',
    '1.11211.1',
    '...111...',
    '....1....'];
  var CYPRESS = [
    '....1....',
    '...111...',
    '...121...',
    '..11211..',
    '..12221..',
    '.1122211.',
    '.1222221.',
    '112222211',
    '....3....',
    '...333...'];
  var BAND = [ // repeating diamond chain, 12 wide
    '.....11.....',
    '....1221....',
    '...12..21...',
    '..12....21..',
    '...12..21...',
    '....1221....',
    '.....11.....'];
  var COLORS = { '1': RED, '2': BLACK, '3': GREEN, '4': LINEN };

  function xstitch(ctx, x, y, c, color) {
    var p = c * 0.16;
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, c * 0.26); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + p, y + p); ctx.lineTo(x + c - p, y + c - p); ctx.moveTo(x + c - p, y + p); ctx.lineTo(x + p, y + c - p); ctx.stroke();
  }
  function motif(ctx, rows, ox, oy, c, map) {
    rows.forEach(function (r, j) { for (var i = 0; i < r.length; i++) { var k = r[i]; if (k !== '.') xstitch(ctx, ox + i * c, oy + j * c, c, (map || COLORS)[k]); } });
  }
  function prep(cv) {
    var b = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(b.width * dpr); cv.height = Math.round(b.height * dpr);
    var ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, b.width, b.height);
    return { ctx: ctx, W: b.width, H: b.height };
  }
  function drawStitch(cv) {
    var kind = cv.getAttribute('data-stitch'), d = prep(cv), ctx = d.ctx, W = d.W, H = d.H;
    if (!W || !H) return;
    if (kind === 'star') { var c = Math.floor(Math.min(W, H) / 9); motif(ctx, STAR, (W - c * 9) / 2, (H - c * 9) / 2, c); }
    else if (kind === 'band') {
      var c2 = Math.max(3, Math.floor(H / 8)), unit = 12 * c2, n = Math.ceil(W / unit) + 1, off = (W - n * unit) / 2;
      for (var i = 0; i < n; i++) motif(ctx, BAND, off + i * unit, (H - 7 * c2) / 2, c2);
    } else if (kind === 'hem') {
      var c3 = Math.max(3, Math.floor(H / 11)), u = 13 * c3, m = Math.ceil(W / u) + 1, o = (W - m * u) / 2;
      var light = { '1': LINEN, '2': '#f2b8c0', '3': LINEN };
      for (var k = 0; k < m; k++) motif(ctx, k % 2 ? STAR : CYPRESS, o + k * u + 2 * c3, (H - (k % 2 ? 9 : 10) * c3) / 2, c3, light);
    } else if (kind === 'frame') {
      var c4 = Math.max(3, Math.floor(Math.min(W, H) / 110));
      var edge = 3 * c4;
      // running border: alternating red/black stitches around the panel
      for (var x = 0; x < W - c4; x += c4) { var col = Math.floor(x / c4) % 4 < 2 ? RED : BLACK; xstitch(ctx, x, edge, c4, col); xstitch(ctx, x, H - edge - c4, c4, col); }
      for (var y = edge; y < H - edge; y += c4) { var col2 = Math.floor(y / c4) % 4 < 2 ? RED : BLACK; xstitch(ctx, edge, y, c4, col2); xstitch(ctx, W - edge - c4, y, c4, col2); }
      // corner stars
      var s = c4 * 0.9 * 1, sz = 9 * s;
      [[0, 0], [W - sz, 0], [0, H - sz], [W - sz, H - sz]].forEach(function (pt) { ctx.fillStyle = LINEN; ctx.fillRect(pt[0], pt[1], sz, sz); motif(ctx, STAR, pt[0], pt[1], s); });
    }
  }
  var ro = 'ResizeObserver' in window ? new ResizeObserver(function (es) { es.forEach(function (e) { drawStitch(e.target); }); }) : null;
  function mountStitches(root) { S.$$('canvas[data-stitch]', root).forEach(function (cv) { if (ro && !cv.__st) { ro.observe(cv); cv.__st = 1; } else drawStitch(cv); }); }

  var plus = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  function render() {
    var items = S.PRODUCTS.filter(function (p) { return cat === 'all' || p.cat === cat; });
    var grid = document.getElementById('grid');
    grid.innerHTML = items.map(function (p) {
      var act = p.custom
        ? '<button class="add" type="button" data-open="' + p.id + '" aria-label="' + S.esc(S.t('view') + ': ' + S.name(p)) + '">' + plus + '</button>'
        : '<button class="add" type="button" data-add="' + p.id + '" aria-label="' + S.esc(S.t('add') + ': ' + S.name(p)) + '">' + plus + '</button>';
      return '<article class="card">' + (p.isNew ? '<span class="new">' + S.t('new') + '</span>' : '') +
        '<button class="art" type="button" data-open="' + p.id + '" aria-label="' + S.esc(S.t('view') + ': ' + S.name(p)) + '">' + S.media(p, { decorative: true }) + '</button>' +
        '<h3>' + S.esc(S.name(p)) + '</h3><div class="row"><span class="p">' + S.money(p.price) + '</span>' + act + '</div></article>';
    }).join('');
    S.mount(grid);
    var hp = document.querySelector('[data-hero-price]');
    hp.innerHTML = S.money(S.byId('name').price) + '<small>' + S.esc(S.t('hero_tag')) + '</small>';
  }

  document.addEventListener('click', function (e) {
    var c = e.target.closest('[data-cat]');
    if (c) { cat = c.getAttribute('data-cat'); S.$$('[data-cat]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === c)); }); render(); return; }
    var j = e.target.closest('[data-jump]');
    if (j) { cat = j.getAttribute('data-jump'); S.$$('[data-cat]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-cat') === cat)); }); render(); document.getElementById('panels').scrollIntoView({ behavior: 'smooth' }); return; }
    if (e.target.closest('[data-hero-add]')) {
      var input = document.getElementById('hero-name'), v = input.value.trim();
      var herr = document.getElementById('hero-err');
      if (!v) { input.focus(); input.setAttribute('aria-invalid', 'true'); herr.textContent = S.t('e_engrave'); return; }
      input.removeAttribute('aria-invalid'); herr.textContent = ''; S.add('name', 'gold', v);
    }
  });
  S.on('ordered', function () { mountStitches(document.querySelector('[data-drawer]')); });
  document.addEventListener('click', function (e) { if (e.target.closest('[data-open-cart]')) setTimeout(function () { mountStitches(document.querySelector('[data-drawer]')); }, 50); });

  S.boot({
    render: render,
    strings: {
      ar: {
        h1a: 'اسمها على صدرها،', h1b: 'مثل غُرزة التطريز.', lead: 'اكتبي الاسم وشاهديه على القلادة قبل الطلب. تدفعين عند الاستلام.',
        type_name: 'اكتبي الاسم', name_ph: 'ليان', hero_tag: 'مع السلسلة', hero_cta: 'اطلبيها بهذا الاسم',
        trust_cod: 'الدفع عند الاستلام', trust_ship: 'توصيل للضفة والقدس والداخل', trust_swap: 'تبديل خلال 7 أيام (للتأكيد)',
        panels_h: 'كل القطع', worn_h: 'كيف تُلبس', how_h: 'كيف تطلبين',
        s1: 'اختاري القطعة واللون', s1d: 'ذهبي أو فضي أو وردي، حسب القطعة.', s2: 'اكتبي عنوانك ورقمك', s2d: 'نتصل بك لتأكيد الطلب قبل الشحن.',
        s3: 'ادفعي عند الاستلام', s3d: 'نقداً للمندوب، أو بالبطاقة إن فضّلتِ.', wa: 'واتساب'
      },
      en: {
        h1a: 'Her name, worn close,', h1b: 'like a tatreez stitch.', lead: 'Type a name and see it on the necklace before you order. Pay on delivery.',
        type_name: 'Type the name', name_ph: 'ليان', hero_tag: 'chain included', hero_cta: 'Order with this name',
        trust_cod: 'Cash on delivery', trust_ship: 'Delivery to the West Bank, Jerusalem and inside', trust_swap: '7-day exchange (to confirm)',
        panels_h: 'Every piece', worn_h: 'How they are worn', how_h: 'How to order',
        s1: 'Pick the piece and colour', s1d: 'Gold, silver or rose tone, depending on the piece.', s2: 'Add your address and number', s2d: 'We call to confirm before we ship.',
        s3: 'Pay when it arrives', s3d: 'Cash to the courier, or by card if you prefer.', wa: 'WhatsApp'
      }
    }
  });
  mountStitches(document);
})();
</script>
