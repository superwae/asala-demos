<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Asalah Jewellery Store</title>
<script>
  // Opens in light mode unless the visitor picked dark before.
  (function () { var t = 'light'; try { t = localStorage.getItem('asalah-theme') || 'light'; } catch (e) {} document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Aref+Ruqaa:wght@400;700&display=swap">
<style>
/* Layout: a Shopify Dawn-style storefront for Asalah (traditional jewellery and accessories), rebuilt by hand.
   Image banner, brand story, collection list, heritage collection, name-necklace image-with-text, everyday collection,
   a filterable catalogue, trust row, email signup, footer. Light by default with a dark switch. */
:root {
  --bg: #ffffff; --bg-2: #f4f2ef; --fg: #141210; --fg-75: rgba(20,18,16,.74); --line: rgba(20,18,16,.13); --edge: rgba(20,18,16,.55);
  --btn: #141210; --on-btn: #ffffff; --accent: #8a3324; --on-accent: #ffffff; --error: #b3261e;
  --f: "Rubik", "Segoe UI", Tahoma, sans-serif; --f-brand: "Aref Ruqaa", "Amiri", serif;
  --page: 1240px; --gutter: clamp(16px, 4vw, 50px);
  --jewel-shadow: rgba(20, 18, 16, .2);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #131110; --bg-2: #1f1c1a; --fg: #f3efe9; --fg-75: rgba(243,239,233,.74); --line: rgba(243,239,233,.14); --edge: rgba(243,239,233,.5);
  --btn: #f3efe9; --on-btn: #131110; --accent: #e5927a; --on-accent: #131110; --error: #ff8a80; --jewel-shadow: rgba(0,0,0,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html.panel-open { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 1rem/1.75 var(--f); letter-spacing: .01em; transition: background-color .25s, color .25s; }
::selection { background: var(--fg); color: var(--bg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; box-shadow: 0 0 0 5px var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
.page { max-width: var(--page); margin: 0 auto; padding-inline: var(--gutter); }
section[id] { scroll-margin-top: 92px; }
::placeholder { color: color-mix(in srgb, var(--fg) 60%, var(--bg)); opacity: 1; }
.footer .val, bdi { direction: ltr; unicode-bidi: isolate; }
.trust-row .multi { padding-block: 26px; border-block: 1px solid var(--line); }
.drawer-card:has([data-step="confirm"]:not([hidden])) .cod-bar { display: none; }
[data-theme="dark"] .sheet, [data-theme="dark"] .drawer { background: rgba(0,0,0,.7); }
[data-theme="dark"] .sheet-card, [data-theme="dark"] .drawer-card { background: var(--bg-2); border: 1px solid var(--line); }
[data-theme="dark"] .card .media img, [data-theme="dark"] .coll img, [data-theme="dark"] .stage img, [data-theme="dark"] .related img { filter: brightness(.9); }
@media (max-width: 750px) { .toolbar { position: static; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.h0 { font-weight: 400; font-size: clamp(2.2rem, 5vw, 4rem); line-height: 1.2; margin: 0; text-wrap: balance; }
.h1 { font-weight: 400; font-size: clamp(1.7rem, 3.2vw, 2.6rem); line-height: 1.3; margin: 0; text-wrap: balance; }
.h2 { font-weight: 400; font-size: clamp(1.4rem, 2.2vw, 1.9rem); line-height: 1.3; margin: 0; }
.sub { color: var(--fg-75); }

.button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 30px; border: 0; background: var(--btn); color: var(--on-btn); font-size: .98rem; letter-spacing: .04em; text-decoration: none; transition: box-shadow .1s; }
.button:hover { box-shadow: 0 0 0 1.3px var(--btn); }
.button--secondary { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.button--secondary:hover { box-shadow: inset 0 0 0 2px var(--fg); }
.button--light { background: #fff; color: #141210; }
.button--light-outline { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px #fff; }
.button--light-outline:hover { box-shadow: inset 0 0 0 2px #fff; }
.full { width: 100%; }

.announcement { background: var(--accent); color: var(--on-accent); text-align: center; font-size: .84rem; padding: 10px var(--gutter); margin: 0; }
.demo { background: var(--bg-2); color: var(--fg-75); text-align: center; font-size: .78rem; padding: 6px var(--gutter); margin: 0; }

/* header */
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); transition: background-color .25s; }
.header .page { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px; min-height: 78px; }
.logo { display: grid; justify-items: start; text-decoration: none; color: var(--fg); line-height: 1; }
.logo b { font: 700 2rem/1 var(--f-brand); }
.logo small { font-size: .68rem; color: var(--fg-75); letter-spacing: .04em; margin-top: 4px; }
.menu { display: flex; gap: 2px; flex-wrap: wrap; }
.menu button { background: none; border: 0; padding: 12px 10px; min-height: 44px; font-size: .95rem; color: var(--fg-75); }
.menu button:hover, .menu button[aria-current="true"] { color: var(--fg); text-decoration: underline; text-underline-offset: 6px; }
.icons { display: flex; align-items: center; }
.icon { position: relative; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--fg); }
.icon svg { width: 20px; height: 20px; }
.icon .count { position: absolute; bottom: 4px; inset-inline-end: 2px; min-width: 19px; height: 19px; border-radius: 50%; background: var(--btn); color: var(--on-btn); font-size: .68rem; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.lang { min-height: 44px; padding: 0 12px; border: 1px solid var(--edge); background: none; font-size: .85rem; margin-inline-end: 4px; }
.theme-ico-dark { display: none; }
[data-theme="dark"] .theme-ico-light { display: none; }
[data-theme="dark"] .theme-ico-dark { display: block; }
.burger { display: none; }
@media (max-width: 980px) {
  .menu { display: none; }
  .burger { display: grid; }
  .logo { justify-self: center; justify-items: center; }
}
@media (max-width: 420px) { .logo small { display: none; } .lang { padding: 0 8px; } }
.mobile-menu { border-top: 1px solid var(--line); padding: 8px var(--gutter) 16px; display: grid; }
.mobile-menu button { text-align: start; background: none; border: 0; padding: 14px 0; font-size: 1.1rem; border-bottom: 1px solid var(--line); }

/* search */
.search-bar { border-top: 1px solid var(--line); padding-block: 14px; }
.search-field input { width: 100%; min-height: 48px; padding: 0 16px; border: 1px solid var(--edge); background: var(--bg); font-size: 1rem; }
.search-results { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px; }
.search-results button { width: 100%; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 6px; background: none; border: 0; text-align: start; }
.search-results button:hover { background: var(--bg-2); }
.search-results img, .search-results canvas { width: 52px; height: 64px; object-fit: cover; background: var(--bg-2); }
.search-results .pr { color: var(--fg-75); font-variant-numeric: tabular-nums; }

/* image banner */
.banner { position: relative; min-height: clamp(440px, 60vw, 660px); display: grid; align-items: end; color: #fff; overflow: hidden; background: #2a2420; }
.banner picture, .banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.banner img { object-position: 50% 30%; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.66), rgba(0,0,0,.18) 62%, rgba(0,0,0,.05)); }
.banner .page { position: relative; z-index: 1; width: 100%; padding-block: clamp(32px, 6vw, 76px); display: grid; gap: 18px; justify-items: start; }
.banner .h0 { text-shadow: 0 2px 24px rgba(0,0,0,.35); }
.banner p { margin: 0; max-width: 42ch; color: rgba(255,255,255,.92); font-size: 1.08rem; }
.banner .btns { display: flex; gap: 12px; flex-wrap: wrap; }

.section { padding-block: clamp(44px, 6vw, 80px); }
.tight { padding-top: 0; }
.rich { text-align: center; display: grid; gap: 14px; justify-items: center; }
.rich p { margin: 0; max-width: 58ch; color: var(--fg-75); }

/* collection list */
.title-row { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
.title-row .link { background: none; border: 0; padding: 0; min-height: 44px; color: var(--fg); text-decoration: underline; text-underline-offset: 5px; }
.collections { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.coll { position: relative; display: grid; gap: 10px; background: none; border: 0; padding: 0; text-align: start; }
.coll .media { aspect-ratio: 4 / 5; overflow: hidden; background: var(--bg-2); }
.coll img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.coll:hover img { transform: scale(1.03); }
.coll span { font-size: 1.1rem; display: inline-flex; align-items: center; gap: 8px; }
.coll svg { width: 16px; height: 16px; transition: transform .2s; }
[dir="rtl"] .coll svg { transform: scaleX(-1); }
.coll:hover svg { transform: translateX(4px); }
[dir="rtl"] .coll:hover svg { transform: scaleX(-1) translateX(4px); }
@media (max-width: 750px) { .collections { grid-template-columns: 1fr 1fr; } }

/* product cards */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 34px 12px; list-style: none; margin: 0; padding: 0; }
@media (max-width: 990px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 750px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 8px; } }
.card { position: relative; display: grid; gap: 4px; align-content: start; }
.card .media { position: relative; aspect-ratio: 4 / 5; background: var(--bg-2); overflow: hidden; }
.card .media img, .card .media canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .45s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
.card .media canvas { inset: 8%; width: 84%; height: 84%; }
.card .media .alt { opacity: 0; }
@media (hover: hover) { .card:hover .media .alt { opacity: 1; } .card:hover .media img { transform: scale(1.03); } }
.card .link { position: absolute; inset: 0; z-index: 1; background: none; border: 0; padding: 0; }
.card h3 { margin: 8px 0 0; font-size: .98rem; font-weight: 400; line-height: 1.45; }
@media (hover: hover) { .card:hover h3 { text-decoration: underline; text-underline-offset: 3px; } }
.card .price { color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: .03em; }
.badge { position: absolute; bottom: 10px; inset-inline-start: 10px; z-index: 2; background: var(--fg); color: var(--bg); font-size: .75rem; padding: 2px 12px; border-radius: 40px; pointer-events: none; }
.badge.heritage { background: var(--accent); color: var(--on-accent); }
.quick-add { position: relative; z-index: 2; min-height: 44px; margin-top: 8px; background: transparent; color: var(--fg); border: 0; box-shadow: inset 0 0 0 1px var(--edge); font-size: .9rem; }
.quick-add:hover { box-shadow: inset 0 0 0 2px var(--fg); }
.center { text-align: center; margin-top: 38px; }

/* heritage band */
.heritage-band { background: var(--bg-2); }

/* image with text */
.iwt { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-2); }
.iwt .media { position: relative; min-height: 440px; }
.iwt .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.iwt .content { padding: clamp(28px, 5vw, 64px); display: grid; align-content: center; gap: 14px; }
.iwt .content p { margin: 0; color: var(--fg-75); }
.iwt .name-art { background: var(--bg); }
.iwt .name-art canvas { position: absolute; inset: 6%; width: 88%; height: 88%; }
.iwt input { width: 100%; min-height: 50px; padding: 0 16px; border: 1px solid var(--edge); background: var(--bg); font: 700 1.4rem var(--f-brand); }
.iwt label { font-size: .9rem; color: var(--fg-75); }
@media (max-width: 750px) { .iwt { grid-template-columns: 1fr; } .iwt .media { min-height: 300px; } }

/* catalogue */
.toolbar { position: sticky; top: calc(78px + env(safe-area-inset-top, 0px)); z-index: 10; background: var(--bg); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding-block: 12px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 44px; padding: 0 16px; border: 1px solid var(--edge); background: var(--bg); font-size: .9rem; border-radius: 40px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tb-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tb-right select { min-height: 44px; padding: 0 12px; border: 1px solid var(--edge); background: var(--bg); }
.count-txt { color: var(--fg-75); font-size: .88rem; }
.none { grid-column: 1 / -1; padding: 40px 0; text-align: center; color: var(--fg-75); }

/* multicolumn */
.multi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; text-align: center; }
.multi svg { width: 34px; height: 34px; margin: 0 auto 12px; display: block; }
.multi h3 { margin: 0 0 6px; font-weight: 500; font-size: 1.1rem; }
.multi p { margin: 0; color: var(--fg-75); font-size: .95rem; }
@media (max-width: 750px) { .multi { grid-template-columns: 1fr; } }

/* newsletter */
.news { text-align: center; display: grid; gap: 14px; justify-items: center; }
.news form { width: min(440px, 100%); position: relative; }
.news input { width: 100%; min-height: 50px; padding-block: 0; padding-inline: 16px 52px; border: 1px solid var(--edge); background: var(--bg); }
.news button { position: absolute; inset-inline-end: 0; top: 0; width: 50px; height: 50px; background: none; border: 0; display: grid; place-items: center; }
.news button svg { width: 18px; height: 18px; }
[dir="rtl"] .news button svg { transform: scaleX(-1); }
.news .msg { margin: 0; font-size: .9rem; min-height: 1.4em; }

/* footer */
.footer { border-top: 1px solid var(--line); padding-block: 50px 30px; font-size: .92rem; }
.footer .cols { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 30px; }
.footer .about b { font: 700 1.8rem/1 var(--f-brand); display: block; margin-bottom: 10px; }
.footer .about p { margin: 0; color: var(--fg-75); max-width: 34ch; }
.footer h4 { margin: 0 0 12px; font-weight: 500; font-size: 1rem; }
.footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; color: var(--fg-75); }
.footer ul button { background: none; border: 0; padding: 0; min-height: 44px; color: inherit; text-align: start; }
.footer ul button:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }
.footer .val { color: var(--fg); font-weight: 500; user-select: all; font-variant-numeric: tabular-nums; }
.footer .bottom { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 14px; color: var(--fg-75); font-size: .8rem; }
.pay-icons { display: flex; gap: 6px; flex-wrap: wrap; }
.pay-icons span { border: 1px solid var(--line); padding: 2px 8px; font-size: .74rem; }
@media (max-width: 860px) { .footer .cols { grid-template-columns: 1fr 1fr; } .footer .about { grid-column: 1 / -1; } }

/* product view */
.sheet, .drawer { position: fixed; inset: 0; z-index: 50; background: rgba(10,9,8,.5); display: flex; opacity: 0; transition: opacity .25s; }
.is-open { opacity: 1; }
.sheet { align-items: center; justify-content: center; padding: 16px; }
.sheet-card { position: relative; width: min(1060px, 100%); max-height: calc(100% - 16px); overflow: auto; display: grid; grid-template-columns: 1.15fr 1fr; background: var(--bg); transform: translateY(14px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.is-open .sheet-card { transform: none; }
.gallery { padding: 16px; display: grid; gap: 10px; align-content: start; }
.stage { position: relative; aspect-ratio: 4 / 5; background: var(--bg-2); overflow: hidden; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stage canvas { position: absolute; inset: 8%; width: 84%; height: 84%; }
.thumbs { display: flex; gap: 8px; }
.thumbs button { width: 64px; aspect-ratio: 4 / 5; padding: 0; border: 1px solid transparent; background: var(--bg-2); overflow: hidden; }
.thumbs button[aria-pressed="true"] { border-color: var(--fg); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.sheet-info { padding: 34px 30px; display: flex; flex-direction: column; gap: 14px; }
.sheet-info h2 { font-weight: 400; font-size: 2rem; line-height: 1.25; margin: 0; }
.sheet-cat { margin: 0; color: var(--fg-75); font-size: .85rem; }
.sheet-price { margin: 0; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.ship-note { margin: -8px 0 0; color: var(--fg-75); font-size: .82rem; }
fieldset { border: 0; padding: 0; margin: 0; }
legend, .lbl-s { font-size: .88rem; color: var(--fg-75); margin-bottom: 8px; padding: 0; display: block; }
[data-sheet-tones] { display: flex; gap: 8px; flex-wrap: wrap; }
.tone { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 40px; border: 1px solid var(--edge); background: var(--bg); font-size: .9rem; }
.tone[aria-checked="true"] { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }
.tone-dot { width: 14px; height: 14px; border-radius: 50%; }
.text-in { width: 100%; min-height: 50px; padding: 0 16px; border: 1px solid var(--edge); background: var(--bg); font: 700 1.4rem var(--f-brand); }
.hint { color: var(--fg-75); font-size: .82rem; }
.err { color: var(--error); font-size: .86rem; margin: 2px 0 0; min-height: 1em; }
.buy-btns { display: grid; gap: 10px; }
details { border-top: 1px solid var(--line); }
details:last-of-type { border-bottom: 1px solid var(--line); }
summary { list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 52px; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-size: 1.3rem; font-weight: 300; }
details[open] summary::after { content: "−"; }
details p, details ul { margin: 0 0 16px; color: var(--fg-75); font-size: .92rem; }
details ul { padding-inline-start: 18px; }
.related h3 { font-size: 1rem; font-weight: 500; margin: 6px 0 10px; }
.related ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.related button { width: 100%; display: grid; gap: 4px; background: none; border: 0; padding: 0; text-align: start; font-size: .86rem; }
.related img { aspect-ratio: 4 / 5; object-fit: cover; width: 100%; background: var(--bg-2); }
.related small { color: var(--fg-75); font-variant-numeric: tabular-nums; }
.x { position: absolute; top: 12px; inset-inline-end: 12px; z-index: 3; width: 44px; height: 44px; border: 0; background: var(--bg); display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.x svg { width: 18px; height: 18px; }
@media (max-width: 760px) {
  .sheet { align-items: end; padding: 0; }
  .sheet-card { grid-template-columns: 1fr; max-height: 94%; transform: translateY(40px); }
  .gallery { padding: 0; }
  .stage { aspect-ratio: 1; }
  .thumbs { padding: 0 16px; }
  .sheet-info { padding: 18px 20px calc(22px + env(safe-area-inset-bottom, 0px)); }
}
/* bag */
.drawer { justify-content: flex-end; }
.drawer-card { width: min(420px, 100%); height: 100%; overflow: auto; background: var(--bg); padding: calc(20px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(40px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
[dir="rtl"] .drawer-card { transform: translateX(-40px); }
.drawer.is-open .drawer-card { transform: none; }
.d-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.d-head h2 { margin: 0; font-weight: 400; font-size: 1.6rem; }
.d-head span { color: var(--fg-75); font-size: .9rem; }
.d-head .x { position: static; margin-inline-start: auto; box-shadow: none; }
.empty { color: var(--fg-75); padding: 30px 0; text-align: center; display: grid; gap: 14px; justify-items: center; }
[data-cart-list] { list-style: none; padding: 0; margin: 0; display: grid; gap: 18px; border-top: 1px solid var(--line); padding-top: 18px; }
.ci { display: grid; grid-template-columns: 80px 1fr auto; gap: 14px; }
.ci-img { position: relative; width: 80px; height: 100px; background: var(--bg-2); overflow: hidden; }
.ci-img img { width: 100%; height: 100%; object-fit: cover; }
.ci-img canvas { position: absolute; inset: 6%; width: 88%; height: 88%; }
.ci-name { margin: 0; line-height: 1.4; }
.ci-meta { margin: 2px 0 8px; color: var(--fg-75); font-size: .85rem; }
.ci-row { display: flex; gap: 10px; align-items: center; }
.ci-qty { display: inline-flex; align-items: center; box-shadow: inset 0 0 0 1px var(--edge); }
.ci-qty button { width: 44px; height: 44px; border: 0; background: none; font-size: 1.05rem; }
.ci-qty output { min-width: 20px; text-align: center; font-variant-numeric: tabular-nums; }

<script>
(function () {
  var S = window.Store, cat = 'all', max = 999, sort = 'featured';

  // ---- Asalah catalogue: the shared everyday pieces plus a heritage collection ----
  S.CATS.heritage = { ar: 'تراثي', en: 'Heritage' };
  function H(id, price, ar, en, dAr, dEn, tone, isNew) {
    return { id: id, cat: 'heritage', kind: 'coin', price: price, tones: [tone], photo: 'img/' + id + '.jpg', photoTone: tone, isNew: !!isNew, heritage: true, ar: ar, en: en, dAr: dAr, dEn: dEn };
  }
  S.PRODUCTS.unshift(
    H('h-collar', 220, 'قلادة الصدر الفضية', 'Silver bib necklace', 'قلادة صدر عريضة بنقش هندسي وأطراف متدلية.', 'A wide bib necklace with geometric engraving and a fringe.', 'silver', true),
    H('h-amber', 180, 'عقد الكهرمان', 'Amber pendant necklace', 'دلاية كهرمان على سلسلة مشغولة بزهور صغيرة.', 'An amber drop on a chain worked with small flowers.', 'gold'),
    H('h-hirz', 130, 'حِرز فضي', 'Silver amulet pendant', 'حِرز فضي بنقوش وحبات متدلية، يُلبس على سلسلة أو خيط.', 'A carved silver amulet box with hanging beads, worn on a chain or cord.', 'silver', true),
    H('h-silver', 160, 'قلادة فضية مشغولة', 'Carved silver necklace', 'قلادة فضية بدلاية كبيرة مشغولة يدوياً (للتأكيد).', 'A silver necklace with a large worked pendant (to confirm).', 'silver'),
    H('h-crescent', 75, 'حلق الهلال بالكهرمان', 'Amber crescent earrings', 'هلالان من المعدن المطروق بحبة كهرمان.', 'Hammered crescents with an amber bead.', 'rose'),
    H('h-red', 90, 'عقد الخرز الأحمر', 'Red bead strand', 'خرز أحمر شفاف بفواصل فضية.', 'Clear red beads with silver spacers.', 'silver')
  );
  var ALT = { drop: 'img/a-drop.jpg', coin: 'img/a-coin.jpg', pearl: 'img/a-pearl.jpg', layered: 'img/a-layered.jpg', bar: 'img/a-bar.jpg',
    tennis: 'img/a-tennis.jpg', beads: 'img/a-beads.jpg', cuff: 'img/c-bracelet.jpg', charm: 'img/a-charm.jpg', hoops: 'img/a-hoops.jpg', drops: 'img/a-drops.jpg',
    'h-collar': 'img/h-collar-b.jpg', 'h-crescent': 'img/h-crescent-b.jpg', 'h-red': 'img/h-red-b.jpg', 'h-amber': 'img/h-beads.jpg' };
  var HERITAGE = ['h-collar', 'h-amber', 'h-hirz', 'h-silver'];
  var ORDER = S.PRODUCTS.map(function (p) { return p.id; });

  // ---- theme ----
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('asalah-theme', t); } catch (e) {}
    var b = document.getElementById('theme-btn');
    b.setAttribute('aria-pressed', String(t === 'dark'));
    b.setAttribute('aria-label', S.t(t === 'dark' ? 'theme_to_light' : 'theme_to_dark'));
    S.$$('canvas[data-id]').forEach(function (c) { if (c.getBoundingClientRect().width) S.draw(c); });
  }
  document.getElementById('theme-btn').addEventListener('click', function () {
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  // ---- cards ----
  function card(p, ctx) {
    var mixed = !(ctx && ctx.heritageOnly);
    var alt = ALT[p.id] && !p.custom ? '<img class="alt" src="' + ALT[p.id] + '" alt="">' : '';
    var badge = p.heritage && mixed ? '<span class="badge heritage">' + S.esc(S.CATS.heritage[S.lang()]) + '</span>' : p.isNew ? '<span class="badge">' + S.esc(S.t('new')) + '</span>' : '';

  function fill(id, items, ctx) { var el = document.getElementById(id); el.innerHTML = items.map(function (p) { return card(p, ctx); }).join(''); S.mount(el); }

    if (S.lang() !== 'ar') return n + (n === 1 ? ' product' : ' products');
    return n === 0 ? 'لا منتجات' : n === 1 ? 'منتج واحد' : n === 2 ? 'منتجان' : n <= 10 ? n + ' منتجات' : n + ' منتجاً';
  }

    var items = S.PRODUCTS.filter(function (p) { return (cat === 'all' || p.cat === cat) && p.price <= max; }).slice();

    else if (sort === 'high') items.sort(function (a, b) { return b.price - a.price; });
    else if (sort === 'new') items.sort(function (a, b) { return (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0); });

    g.innerHTML = items.length ? items.map(function (p) { return card(p, { heritageOnly: cat === 'heritage' }); }).join('') : '<li class="none">' + S.esc(S.t('none')) + '</li>';
