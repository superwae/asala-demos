<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Asala Jewelry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* Layout: one store that gathers what the best-rated jewellery shops do well (Pandora and Mejuri are in the top 1% of
   Baymard's 2025 jewellery UX benchmark): a gift finder, a product page with on-model photos, real size, delivery by city,
   gift wrap and "pairs well with", quick view, wishlist, recently viewed, predictive search and a sticky add bar on phones.
   An "ideas" switch labels each feature with the shop it comes from, for presenting to the client. */
:root {
  --paper: #fbf9f6; --ivory: #f4efe6; --sand: #ebe3d6; --ink: #2a2b27; --ink-2: #5f5f58; --line: rgba(42,43,39,.13); --line-2: rgba(42,43,39,.3);
  --red: #C6383C; --red-ink: #a52a2e; --gold: #b08a3e; --gold-ink: #85652a; --error: #b3261e; --ok: #2f6b4f;
  --f-display: "Bodoni Moda", "Amiri", serif; --f-ar-display: "Amiri", "Bodoni Moda", serif; --f: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --page: 1320px; --gutter: clamp(16px, 4vw, 52px); --r: 4px; --ease: cubic-bezier(.2,.8,.2,1);
  --jewel-shadow: rgba(42,43,39,.2);
  color-scheme: light;
}
* { box-sizing: border-box; }
html.panel-open { overflow: hidden; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.7 var(--f); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.page { max-width: var(--page); margin: 0 auto; padding-inline: var(--gutter); }
section[id] { scroll-margin-top: 120px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
.display { font-family: var(--f-display); }
html[lang="ar"] .display { font-family: var(--f-ar-display); font-weight: 700; }
.h2 { font-size: clamp(1.7rem, 3vw, 2.5rem); line-height: 1.25; }
.lead { color: var(--ink-2); margin: 8px 0 0; max-width: 60ch; }
.section { padding-block: clamp(48px, 6vw, 88px); }
.title-row { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 26px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 500; letter-spacing: .02em; text-decoration: none; transition: background-color .2s, color .2s; }
.btn:hover { background: var(--red); border-color: var(--red); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.full { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.link { background: none; border: 0; padding: 0; min-height: 44px; color: var(--ink); text-decoration: underline; text-underline-offset: 5px; }
.chip { min-height: 44px; padding: 0 16px; border: 1px solid var(--line-2); background: var(--paper); border-radius: 999px; font-size: .9rem; }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ideas switch: labels each feature with where it comes from */
.ideas-pill { position: fixed; z-index: 40; bottom: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--ink); background: var(--paper); box-shadow: 0 8px 24px rgba(0,0,0,.12); font-size: .88rem; }
.ideas-pill .sw { width: 34px; height: 20px; border-radius: 99px; background: var(--line-2); position: relative; transition: background .2s; }
.ideas-pill .sw::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
.ideas-pill[aria-pressed="true"] .sw { background: var(--red); }
.ideas-pill[aria-pressed="true"] .sw::after { transform: translateX(14px); }
[dir="rtl"] .ideas-pill[aria-pressed="true"] .sw::after { transform: translateX(-14px); }
html.ideas [data-idea] { position: relative; outline: 2px dashed var(--red); outline-offset: 4px; }
html.ideas [data-idea]::before { content: attr(data-idea-label); position: absolute; z-index: 6; top: -12px; inset-inline-start: 10px; max-width: min(360px, 86%); background: var(--red); color: #fff; font-size: .74rem; line-height: 1.35; padding: 4px 10px; border-radius: 4px; pointer-events: none; }

/* top bars + header */
.util { margin: 0; background: var(--ink); color: rgba(251,249,246,.86); font-size: .8rem; text-align: center; padding: 8px var(--gutter); }
.demo { margin: 0; background: var(--ivory); color: var(--ink-2); font-size: .76rem; text-align: center; padding: 5px var(--gutter); }
.header { position: sticky; top: 0; z-index: 30; background: rgba(251,249,246,.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.header .page { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 70px; gap: 12px; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav > button { background: none; border: 0; min-height: 44px; padding: 0 10px; font-size: .93rem; color: var(--ink-2); }
.nav > button:hover, .nav > button[aria-expanded="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 6px; }
.logo { display: flex; align-items: center; justify-content: center; min-height: 44px; }
.logo img { height: 18px; width: auto; max-width: none; }
.tools { display: flex; justify-content: flex-end; align-items: center; gap: 2px; }
.icon { position: relative; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--ink); }
.icon svg { width: 21px; height: 21px; }
.icon .count { position: absolute; top: 5px; inset-inline-end: 3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--red); color: #fff; font-size: .68rem; display: grid; place-items: center; }
.lang { min-height: 44px; padding: 0 12px; border: 0; background: none; font-size: .88rem; text-decoration: underline; text-underline-offset: 5px; }
.burger { display: none; }
.mega { border-top: 1px solid var(--line); background: var(--paper); }
.mega .page { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 28px; padding-block: 24px 30px; }
.mega h4 { margin: 0 0 8px; font-size: .78rem; letter-spacing: .1em; color: var(--ink-2); font-weight: 500; }
.mega ul { list-style: none; margin: 0; padding: 0; }
.mega li button { background: none; border: 0; padding: 0; min-height: 40px; text-align: start; }
.mega li button:hover { text-decoration: underline; text-underline-offset: 4px; }
.mega .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mega .tile { position: relative; border: 0; padding: 0; background: var(--sand); aspect-ratio: 4 / 3; overflow: hidden; text-align: start; }
.mega .tile img { width: 100%; height: 100%; object-fit: cover; }
.mega .tile span { position: absolute; inset-inline: 0; bottom: 0; padding: 10px 12px; background: linear-gradient(transparent, rgba(0,0,0,.55)); color: #fff; font-size: .92rem; }
@media (max-width: 960px) {
  .nav { display: none; } .burger { display: grid; }
  .header .page { grid-template-columns: auto 1fr auto; }
  .logo { justify-content: center; }
  .mega .page { grid-template-columns: 1fr; gap: 14px; }
}
@media (max-width: 480px) { .header .page { gap: 2px; } .tools { gap: 0; } .tools .lang { padding: 0 4px; font-size: .82rem; } .logo img { height: 13px; } }

/* search overlay */
.search { border-top: 1px solid var(--line); background: var(--paper); padding-block: 16px 22px; }
.search input { width: 100%; min-height: 52px; padding: 0 16px; border: 1px solid var(--line-2); background: #fff; font-size: 1.05rem; }
.search .pop { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.search .pop span { color: var(--ink-2); font-size: .86rem; }
.search ul { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.search li button { width: 100%; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: none; border: 1px solid transparent; padding: 6px; text-align: start; }
.search li button:hover { border-color: var(--line); background: #fff; }
.search li img { width: 56px; height: 66px; object-fit: cover; background: var(--sand); }
.search .pr { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.search mark { background: #f1dfb8; color: inherit; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: min(82vh, 760px); background: var(--ivory); }
.hero .copy { display: grid; align-content: center; gap: 18px; padding: clamp(28px, 6vw, 80px) var(--gutter); justify-items: start; }
.hero h1 { font-size: clamp(2.4rem, 5vw, 4.4rem); line-height: 1.12; }
html[lang="ar"] .hero h1 { line-height: 1.35; }
.hero p { margin: 0; color: var(--ink-2); font-size: 1.07rem; max-width: 44ch; }
.hero .btns { display: flex; gap: 12px; flex-wrap: wrap; }
.hero .shot { position: relative; overflow: hidden; background: var(--sand); }
.hero .shot img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.hero .spot { position: absolute; top: 34%; inset-inline-start: 40%; z-index: 2; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px 0 6px; border: 0; border-radius: 999px; background: rgba(251,249,246,.94); box-shadow: 0 6px 18px rgba(0,0,0,.15); font-size: .86rem; }
[dir="rtl"] .hero .spot { padding: 0 6px 0 14px; }
.hero .spot i { width: 30px; height: 30px; border-radius: 50%; background: var(--red); display: grid; place-items: center; color: #fff; font-style: normal; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .hero .shot { order: -1; aspect-ratio: 4 / 4.2; } }

/* category circles */
.cats { display: flex; gap: clamp(10px, 2vw, 26px); justify-content: center; flex-wrap: wrap; }
.cat { display: grid; justify-items: center; gap: 10px; border: 0; background: none; padding: 0; width: 112px; text-align: center; font-size: .92rem; }
.cat .ph { width: 104px; height: 104px; border-radius: 50%; overflow: hidden; background: var(--sand); box-shadow: inset 0 0 0 1px var(--line); }
.cat .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.cat:hover .ph img { transform: scale(1.06); }
.cat[aria-pressed="true"] .ph { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
@media (max-width: 560px) { .cats { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; padding-bottom: 6px; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scroll-snap-type: x mandatory; } .cat { flex: none; width: 92px; scroll-snap-align: start; } .cat .ph { width: 84px; height: 84px; } }

/* gift finder */
.finder { background: var(--ink); color: var(--paper); }
.finder .page { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(24px, 4vw, 64px); align-items: start; }
.finder .lead { color: rgba(251,249,246,.74); }
.steps { display: flex; gap: 6px; margin-top: 22px; }
.steps i { flex: 1; height: 3px; background: rgba(251,249,246,.2); }
.steps i.on { background: var(--gold); }
.q { margin-top: 18px; }
.q h3 { font-size: 1.25rem; margin-bottom: 12px; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ans { min-height: 56px; padding: 10px 16px; border: 1px solid rgba(251,249,246,.3); background: transparent; color: var(--paper); text-align: start; }
.ans small { display: block; color: rgba(251,249,246,.65); font-size: .8rem; }
.ans:hover { border-color: var(--paper); }
.finder .back { color: var(--paper); }
.picks { display: grid; gap: 12px; }
.pick { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; background: rgba(251,249,246,.06); border: 1px solid rgba(251,249,246,.14); padding: 10px; }
.pick img { width: 96px; height: 116px; object-fit: cover; background: var(--sand); }
.pick img.cut { object-fit: contain; padding: 8px; }
.pick b { display: block; font-weight: 500; }
.pick small { display: block; color: rgba(251,249,246,.7); margin: 2px 0 8px; }
.pick .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pick .btn { min-height: 44px; padding: 0 16px; background: var(--paper); color: var(--ink); border-color: var(--paper); font-size: .88rem; }
.pick .btn.ghost { background: transparent; color: var(--paper); border-color: rgba(251,249,246,.4); }
.pick .p { font-variant-numeric: tabular-nums; margin-inline-start: auto; }
.finder-art { display: grid; place-items: center; min-height: 100%; }
.finder-art img { max-height: 420px; object-fit: contain; }
@media (max-width: 860px) { .finder .page { grid-template-columns: 1fr; } .answers { grid-template-columns: 1fr; } }

/* listing */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding-block: 12px; border-block: 1px solid var(--line); margin-bottom: 24px; position: sticky; top: 70px; z-index: 10; background: var(--paper); }
.toolbar .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.toolbar select { min-height: 44px; padding: 0 12px; border: 1px solid var(--line-2); background: var(--paper); }
.toolbar .count { color: var(--ink-2); font-size: .88rem; }
.metal-f { display: inline-flex; gap: 4px; align-items: center; }
.metal-f button { width: 44px; height: 44px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; }
.metal-f button span { width: 24px; height: 24px; border-radius: 50%; background-size: cover; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.metal-f button[aria-pressed="true"] span { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
@media (max-width: 760px) { .toolbar { position: static; } }
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 34px 14px; }
@media (max-width: 980px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 680px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 10px; } }
.card { position: relative; display: grid; gap: 3px; align-content: start; }
.card .media { position: relative; aspect-ratio: 4 / 5; background: var(--sand); overflow: hidden; }
.card .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .45s ease, transform .7s var(--ease); }
.card .media.cut img { object-fit: contain; padding: 12%; }
.card .media .alt { opacity: 0; }
@media (hover: hover) { .card:hover .media .alt { opacity: 1; } .card:hover .media img { transform: scale(1.03); } .card:hover .qv { opacity: 1; transform: none; } }
.card .open { position: absolute; inset: 0; z-index: 1; border: 0; background: none; padding: 0; }
.card .heart { position: absolute; z-index: 3; top: 6px; inset-inline-end: 6px; }
.card .qv { position: absolute; z-index: 3; inset-inline: 10px; bottom: 10px; min-height: 44px; border: 0; background: rgba(251,249,246,.95); font-size: .86rem; opacity: 0; transform: translateY(6px); transition: .25s var(--ease); }
@media (hover: none) { .card .qv { opacity: 1; transform: none; position: static; margin-top: 8px; border: 1px solid var(--line-2); } }
.badge { position: absolute; z-index: 2; top: 10px; inset-inline-start: 10px; background: var(--paper); color: var(--ink); font-size: .72rem; padding: 2px 9px; letter-spacing: .03em; pointer-events: none; }
.card h3 { font-size: .96rem; font-weight: 500; margin-top: 10px; line-height: 1.4; }
.card .meta { color: var(--ink-2); font-size: .84rem; }
.card .price { font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 6px; margin-top: 4px; }
.dots span { width: 14px; height: 14px; border-radius: 50%; background-size: cover; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.heart { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; color: var(--ink); }
.heart svg { width: 22px; height: 22px; }
.heart[aria-pressed="true"] svg { fill: var(--red); stroke: var(--red); }
.none { grid-column: 1 / -1; text-align: center; color: var(--ink-2); padding: 40px 0; }

/* rails */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 220px); gap: 14px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
.rail .card { scroll-snap-align: start; }

/* promise row + packaging + faq */
.promise { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; padding-block: 34px; border-block: 1px solid var(--line); }
.promise svg { width: 30px; height: 30px; margin: 0 auto 8px; display: block; }
.promise b { display: block; font-weight: 500; }
.promise small { color: var(--ink-2); }
@media (max-width: 760px) { .promise { grid-template-columns: 1fr 1fr; } }
.pack { display: grid; grid-template-columns: 1.1fr 1fr; background: var(--ivory); }
.pack img { width: 100%; height: 100%; object-fit: cover; min-height: 340px; }
.pack .txt { padding: clamp(28px, 5vw, 64px); display: grid; align-content: center; gap: 14px; justify-items: start; }
.pack .txt p { margin: 0; color: var(--ink-2); }
.pack dl { margin: 0; display: grid; gap: 6px; width: 100%; max-width: 380px; font-variant-numeric: tabular-nums; }
.pack dl div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.pack dd { margin: 0; color: var(--ink-2); }
@media (max-width: 760px) { .pack { grid-template-columns: 1fr; } .pack img { min-height: 0; aspect-ratio: 16 / 10; } }
details.acc { border-top: 1px solid var(--line); }
details.acc:last-of-type { border-bottom: 1px solid var(--line); }
details.acc summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 56px; cursor: pointer; font-weight: 500; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::after { content: "+"; font-size: 1.3rem; font-weight: 300; }
details.acc[open] summary::after { content: "−"; }
details.acc p, details.acc ul { margin: 0 0 16px; color: var(--ink-2); }
details.acc ul { padding-inline-start: 18px; }
.faq { max-width: 820px; }
.news { text-align: center; display: grid; gap: 12px; justify-items: center; }
.news form { display: flex; width: min(460px, 100%); }
.news input { flex: 1; min-height: 50px; padding: 0 14px; border: 1px solid var(--ink); border-inline-end: 0; background: #fff; }
.news .msg { min-height: 1.4em; margin: 0; font-size: .9rem; }
.footer { background: var(--ink); color: rgba(251,249,246,.75); padding-block: 48px 30px; font-size: .9rem; }
.footer .cols { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 26px; }
.footer h4 { color: var(--paper); margin: 0 0 10px; font-weight: 500; font-size: .95rem; }
.footer ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.footer li button { background: none; border: 0; padding: 0; min-height: 40px; color: inherit; text-align: start; }
.footer li button:hover { color: var(--paper); text-decoration: underline; }
.footer .bottom { margin-top: 30px; padding-top: 18px; border-top: 1px solid rgba(251,249,246,.15); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .8rem; }
.footer img { height: 16px; width: auto; margin-bottom: 12px; }
@media (max-width: 760px) { .footer .cols { grid-template-columns: 1fr 1fr; } .footer .about { grid-column: 1 / -1; } }

/* product page (engine sheet) */
.sheet, .drawer, .wish { position: fixed; inset: 0; z-index: 50; background: rgba(20,20,17,.55); display: flex; opacity: 0; transition: opacity .25s; }
.is-open { opacity: 1; }
.sheet { align-items: stretch; justify-content: center; }
.sheet-card { position: relative; width: min(1180px, 100%); margin: 2vh auto; max-height: 96vh; overflow: auto; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); background: var(--paper); transform: translateY(14px); transition: transform .3s var(--ease); }
.is-open .sheet-card { transform: none; }
.gal { padding: 16px; display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-content: start; position: sticky; top: 0; }
.gal .thumbs { display: grid; gap: 8px; align-content: start; }
.gal .thumbs button { aspect-ratio: 4 / 5; padding: 0; border: 1px solid transparent; background: var(--sand); overflow: hidden; }
.gal .thumbs button[aria-pressed="true"] { border-color: var(--ink); }
.gal .thumbs img { width: 100%; height: 100%; object-fit: cover; }
.stage { position: relative; aspect-ratio: 4 / 5; background: var(--sand); overflow: hidden; cursor: zoom-in; border: 0; padding: 0; width: 100%; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .3s var(--ease); }
.stage.render { background: #fff; } .stage.render img { object-fit: contain; padding: 6%; }
.stage.cut img { object-fit: contain; padding: 12%; }
.stage.zoom { cursor: zoom-out; } .stage.zoom img { transform: scale(1.9); }
.stage canvas { position: absolute; inset: 8%; width: 84%; height: 84%; }
.stage .worn { position: absolute; bottom: 10px; inset-inline-start: 10px; background: rgba(251,249,246,.92); font-size: .76rem; padding: 3px 10px; }
.info { padding: 34px 30px 40px; display: flex; flex-direction: column; gap: 14px; }
.info .crumb { margin: 0; color: var(--ink-2); font-size: .82rem; }

  function openWish(on) { var w = $('#wish'); if (on) { w.hidden = false; requestAnimationFrame(function () { w.classList.add('is-open'); }); document.documentElement.classList.add('panel-open'); $('#wish-close').focus(); } else { w.classList.remove('is-open'); document.documentElement.classList.remove('panel-open'); setTimeout(function () { w.hidden = true; }, 250); $('#wish-btn').focus(); } }

  // ---- cards + listing ----
