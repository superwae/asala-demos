<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asala · Everyday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="brand/asala-tatreez.css">
<style>
/* Layout: a clean, modern everyday-jewellery store (white page, centred small logo, big lifestyle hero,
   category tiles, a product scroller with tabs, gift guide, ear stack builder, values, a customer-photo wall).
   Tatreez stays quiet: a running-stitch hairline under the header, cross-stitch icons, stitched "new" stars,
   a stitched outline on button hover, and a diamond-chain band above the footer. */
:root {
  --white: #fff; --linen: #F4F3F1; --line: #E6E3DE; --red: #C6383C; --red-2: #A92D31; --ink: #33342F; --muted: #64625B; --teal: #3FA59A; --pink: #F2C9C0;
  --f: "Figtree", "Readex Pro", "Segoe UI", Tahoma, sans-serif;
  --gutter: clamp(16px, 4vw, 48px); --r: 6px; --r-s: 4px;
  --tz-bg: var(--linen); --tz-panel: #fff; --tz-line: var(--line); --tz-ink: var(--ink); --tz-muted: var(--muted);
  --tz-font: var(--f); --tz-font-d: var(--f); --tz-radius: 8px; --tz-btn-radius: 4px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--white); color: var(--ink); font: 400 1rem/1.65 var(--f); -webkit-font-smoothing: antialiased; }
[dir="rtl"] body { line-height: 1.75; }
img { max-width: 100%; display: block; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--red); color: #fff; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: var(--gutter); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; inset-inline-start: 12px; top: -60px; z-index: 80; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--r-s); }
.skip:focus { top: 12px; }
.demo { margin: 0; background: var(--linen); color: var(--muted); font-size: .78rem; text-align: center; padding: 6px var(--gutter); }

/* buttons: square-ish, a stitched outline appears on hover */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 26px; border: 1px solid var(--ink); border-radius: var(--r-s); background: var(--ink); color: #fff; font-weight: 500; letter-spacing: .01em; text-decoration: none; transition: background .2s, border-color .2s, color .2s; }
.btn::after { content: ""; position: absolute; inset: 4px; border: 1.5px dashed currentColor; border-radius: 2px; opacity: 0; transition: opacity .25s; pointer-events: none; }
.btn:hover { background: var(--red); border-color: var(--red); }
.btn:hover::after, .btn:focus-visible::after { opacity: .55; }
.btn.light { background: #fff; color: var(--ink); border-color: #fff; }
.btn.light:hover { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn[disabled] { opacity: .4; cursor: not-allowed; background: var(--ink); border-color: var(--ink); }
.btn[disabled]::after { opacity: 0; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* promo bar + header */
.promo { margin: 0; background: var(--ink); color: #EDEBE7; font-size: .82rem; text-align: center; padding: 8px var(--gutter); letter-spacing: .01em; }
.promo span + span::before { content: "·"; margin-inline: 10px; color: var(--pink); }
.top { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.97); backdrop-filter: saturate(1.2) blur(6px); }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; min-height: 68px; gap: 12px; }
.nav { display: flex; gap: 2px; }
.nav button { background: none; border: 0; min-height: 44px; padding: 0 12px; font-size: .95rem; font-weight: 500; position: relative; }
.nav button::after { content: ""; position: absolute; inset-inline: 12px; bottom: 8px; height: 0; border-bottom: 1.5px dashed var(--red); transform: scaleX(0); transition: transform .25s; }
.nav button:hover { color: var(--red); }
.nav button:hover::after, .nav button:focus-visible::after { transform: none; }
.logo { justify-self: center; display: block; padding: 8px 4px; }
.logo img { height: 22px; width: auto; }
.icons { justify-self: end; display: flex; align-items: center; gap: 2px; }
.ic { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 44px; height: 44px; padding: 0 8px; border: 0; background: none; border-radius: var(--r-s); font-size: .88rem; font-weight: 500; }
.ic:hover { color: var(--red); }
.ic svg { width: 21px; height: 21px; flex: none; }
.ic .count { position: absolute; top: 4px; inset-inline-end: 2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff; font-size: .7rem; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; line-height: 1; }
.menu-btn, .side .s-m { display: none; }
.side { display: flex; align-items: center; }
.run { width: 100%; height: 6px; }
.drop { border-top: 1px solid var(--line); background: #fff; }
.drop[hidden] { display: none; }
.search { padding-block: 16px 20px; }
.search label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.search-row { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--linen); }
.search input:focus { border-color: var(--ink); background: #fff; }
.results { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.results button { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 14px 4px 4px; padding-inline: 4px 14px; border: 1px solid var(--line); border-radius: var(--r); background: #fff; text-align: start; }
.results button:hover { border-color: var(--ink); }
.results img { width: 44px; height: 44px; object-fit: cover; border-radius: var(--r-s); background: var(--linen); }
.results small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.2; }
.none { color: var(--muted); margin: 12px 0 0; }
.mnav { display: none; }
@media (max-width: 900px) {
  .nav { display: none; }
  .menu-btn, .side .s-m { display: inline-flex; }
  .icons .s-d { display: none; }
  .icons .lang-lbl { display: none; }
  .mnav { display: grid; padding-block: 8px 16px; }
  .mnav button { min-height: 48px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: start; font-size: 1.05rem; font-weight: 500; }
  .bar { min-height: 60px; }
  .logo img { height: 20px; }
}

/* hero */
.hero { position: relative; background: var(--linen); overflow: hidden; }
.hero-img { width: 100%; height: clamp(440px, 46vw, 680px); object-fit: cover; object-position: 70% 30%; }
[dir="rtl"] .hero-img { transform: scaleX(-1); }
.hero::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgba(255,255,255,.62), rgba(255,255,255,.18) 42%, transparent 60%); pointer-events: none; }
[dir="rtl"] .hero::before { background: linear-gradient(270deg, rgba(255,255,255,.62), rgba(255,255,255,.18) 42%, transparent 60%); }
.hero-copy { position: absolute; inset: 0; z-index: 2; display: flex; align-items: flex-end; }
.hero-copy .wrap { width: 100%; padding-block: clamp(32px, 6vw, 72px); }
.hero-copy .in { max-width: 30rem; }
.hero .k { display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 500; margin: 0 0 10px; }
.hero .k canvas { width: 16px; height: 16px; }
.hero h1 { margin: 0 0 12px; font-weight: 500; font-size: clamp(2.2rem, 4.4vw, 3.6rem); line-height: 1.12; letter-spacing: -.015em; text-wrap: balance; }
[dir="rtl"] .hero h1 { letter-spacing: 0; line-height: 1.3; }
.hero p.lede { margin: 0 0 22px; font-size: 1.08rem; max-width: 30ch; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 760px) {
  .hero::before { display: none; }
  .hero-img { height: auto; aspect-ratio: 4 / 3.4; object-position: 76% 30%; }
  .hero-copy { position: static; background: #fff; }
  .hero-copy .wrap { padding-block: 22px 8px; }
  .btns .btn { flex: 1 1 140px; }
  .hero .btn.light { border-color: var(--ink); }
}

/* sections */
.sec { padding-block: clamp(48px, 7vw, 96px); }
.sec-h { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 24px; margin-bottom: 26px; }
.sec-h h2, .h2 { margin: 0; font-weight: 500; font-size: clamp(1.6rem, 2.8vw, 2.25rem); line-height: 1.2; letter-spacing: -.01em; }
[dir="rtl"] .sec-h h2, [dir="rtl"] .h2 { letter-spacing: 0; line-height: 1.35; }
.sec-h p, .sub { margin: 6px 0 0; color: var(--muted); max-width: 52ch; }

/* categories */
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 20px); }
.cat { display: grid; gap: 12px; border: 0; background: none; padding: 0; text-align: start; }
.cat .ph { aspect-ratio: 4 / 5; overflow: hidden; border-radius: var(--r); background: var(--linen); }
.cat img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--tz-ease); }
.cat:hover img { transform: scale(1.035); }
.cat span { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 1.08rem; }
.cat span svg { width: 16px; height: 16px; transition: transform .25s; }
[dir="rtl"] .cat span svg { transform: scaleX(-1); }
.cat:hover span { color: var(--red); }
.cat:hover span svg { transform: translateX(4px); }
[dir="rtl"] .cat:hover span svg { transform: scaleX(-1) translateX(4px); }
@media (max-width: 640px) { .cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cats .cat:last-child { grid-column: 1 / -1; } .cats .cat:last-child .ph { aspect-ratio: 16 / 9; } }

/* tabs + scroller */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { min-height: 44px; padding: 0 18px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-weight: 500; font-size: .92rem; }
.tab:hover { border-color: var(--ink); }
.tab[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.arrows { display: flex; gap: 6px; }
.arrow { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; background: #fff; display: grid; place-items: center; }
.arrow:hover { border-color: var(--ink); }
.arrow svg { width: 18px; height: 18px; }
[dir="rtl"] .arrow svg { transform: scaleX(-1); }
.tools-r { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 3 * 18px) / 4); gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: thin; padding-bottom: 12px; overscroll-behavior-x: contain; }
.rail > * { scroll-snap-align: start; }
@media (max-width: 1100px) { .rail { grid-auto-columns: calc((100% - 2 * 16px) / 3); gap: 16px; } }
@media (max-width: 760px) { .rail { grid-auto-columns: 68%; gap: 12px; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scroll-padding-inline: var(--gutter); } .arrows { display: none; } }

/* product card */
.pc { min-width: 0; }
.pc-media { position: relative; aspect-ratio: 4 / 5; border-radius: var(--r); overflow: hidden; background: var(--linen); }
.pc-art { position: absolute; inset: 0; border: 0; padding: 0; background: none; width: 100%; height: 100%; }
.pc-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .45s ease, transform .9s var(--tz-ease); }
.pc-art img.cut { object-fit: contain; padding: 14%; }
.pc-art img.alt { opacity: 0; }
.pc-media:hover .pc-art img.alt.has, .pc-art:focus-visible img.alt.has { opacity: 1; }
.pc-media:hover .pc-art img.main.swap, .pc-art:focus-visible img.main.swap { opacity: 0; }
.pc-media:hover .pc-art img.main:not(.swap) { transform: scale(1.03); }
.badge { position: absolute; top: 10px; inset-inline-start: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; padding-inline: 8px 10px; background: #fff; border-radius: 999px; font-size: .76rem; font-weight: 600; pointer-events: none; }
.badge canvas { width: 11px; height: 11px; }
.qa { position: absolute; inset-inline: 10px; bottom: 10px; z-index: 2; min-height: 44px; border: 0; border-radius: var(--r-s); background: rgba(255,255,255,.95); font-weight: 500; font-size: .9rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity .25s, transform .25s var(--tz-ease), background .2s, color .2s; }
.qa::after { content: ""; position: absolute; inset: 4px; border: 1.5px dashed currentColor; border-radius: 2px; opacity: 0; transition: opacity .25s; }
.qa:hover { background: var(--ink); color: #fff; }
.qa:hover::after, .qa:focus-visible::after { opacity: .5; }
.qa svg { width: 16px; height: 16px; }
@media (hover: hover) { .qa { opacity: 0; transform: translateY(8px); } .pc-media:hover .qa, .qa:focus-visible { opacity: 1; transform: none; } }
.pc-meta { padding-top: 12px; display: grid; gap: 2px; }
.pc h3 { margin: 0; font-size: 1rem; font-weight: 500; line-height: 1.4; }
.pc h3 button { border: 0; background: none; padding: 0; text-align: start; min-height: 0; }
.pc h3 button:hover { color: var(--red); }
.pc .price { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .95rem; }
.tones { display: flex; align-items: center; gap: 0; margin-top: 2px; margin-inline-start: -13px; }
.dot { width: 44px; height: 36px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
.dot i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.dot[aria-pressed="true"] i, span.dot i { box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--ink); }
.dot-name { font-size: .8rem; color: var(--muted); }

/* gift guide */
.gift { background: var(--linen); }
.gift .wrap { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 2fr); gap: clamp(24px, 4vw, 56px); align-items: start; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 14px; }
.chip { min-height: 44px; padding: 0 18px; border: 1px solid #CFCBC4; border-radius: 999px; background: #fff; font-weight: 500; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 8px; }
.chip:hover { border-color: var(--ink); }
.chip canvas { width: 10px; height: 10px; display: none; }
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.chip[aria-pressed="true"] canvas { display: block; }
.gg-count { color: var(--muted); font-size: .9rem; margin: 0 0 18px; }
.gg-box { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; padding-top: 18px; border-top: 1px solid #DDD9D2; }
.gg-box img { width: 96px; aspect-ratio: 1; object-fit: cover; border-radius: var(--r-s); }
.gg-box p { margin: 0; font-size: .92rem; color: var(--muted); }
.ggrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.gc { background: #fff; border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: auto 1fr; animation: rise .35s var(--tz-ease) both; }
.gc .art { display: block; aspect-ratio: 1; border: 0; padding: 0; background: var(--linen); width: 100%; overflow: hidden; }
.gc .art img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--tz-ease); }
.gc .art:has(img.cut) { background: #fff; }
.gc .art img.cut { object-fit: contain; padding: 12%; }
.gc:hover .art img { transform: scale(1.035); }
.gc .m { padding: 12px 14px 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.gc h3 { margin: 0; font-size: .95rem; font-weight: 500; line-height: 1.4; flex: 1 1 100%; }
.gc .price { color: var(--muted); font-variant-numeric: tabular-nums; }
.gc .add { min-height: 44px; padding: 0 14px; border: 1px solid var(--ink); border-radius: var(--r-s); background: #fff; font-weight: 500; font-size: .88rem; position: relative; }
.gc .add::after { content: ""; position: absolute; inset: 3px; border: 1.5px dashed currentColor; border-radius: 2px; opacity: 0; transition: opacity .25s; }
.gc .add:hover { background: var(--ink); color: #fff; }
.gc .add:hover::after { opacity: .5; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (max-width: 960px) { .gift .wrap { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .ggrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .gc .m { padding: 10px; } }

/* ear stack */
.stack .wrap { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: clamp(24px, 4vw, 56px); align-items: start; }
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 24px; }
.pick { position: relative; display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: #fff; overflow: hidden; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
.pick:hover { border-color: #BDB8B0; }
.pick input { position: absolute; top: 10px; inset-inline-end: 10px; z-index: 2; width: 22px; height: 22px; margin: 0; accent-color: var(--red); cursor: pointer; }
.pick .ph { aspect-ratio: 1; background: var(--linen); }
.pick .ph img { width: 100%; height: 100%; object-fit: cover; }
.pick .ph img.cut { object-fit: contain; padding: 12%; }
.pick .m { padding: 10px 12px 12px; display: grid; gap: 0; }
.pick b { font-weight: 500; font-size: .93rem; line-height: 1.4; }
.pick span { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.pick:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.pick:has(input:focus-visible) { outline: 2px solid var(--red); outline-offset: 3px; }
.pick:has(input:disabled) { opacity: .45; cursor: not-allowed; }
.pick:has(input:disabled) input { cursor: not-allowed; }
.summary { position: sticky; top: 100px; padding: 26px; background: var(--linen); border-radius: var(--r); }
.summary > canvas { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); pointer-events: none; }
.summary h3 { margin: 0; font-weight: 500; font-size: 1.25rem; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.summary h3 small { font-size: .88rem; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.slot { position: relative; aspect-ratio: 1; border-radius: var(--r-s); background: #fff; overflow: hidden; display: grid; place-items: center; }
.slot.empty { border: 1.5px dashed #CFCBC4; background: transparent; }
.slot canvas { width: 22px; height: 22px; opacity: .55; }
.slot img { width: 100%; height: 100%; object-fit: cover; animation: rise .3s var(--tz-ease) both; }
.slot img.cut { object-fit: contain; padding: 10%; }
.slot button { position: absolute; top: 2px; inset-inline-end: 2px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; }
.slot button svg { width: 14px; height: 14px; }
.slot button::before { content: ""; position: absolute; inset: -6px; }
.lines { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 6px; font-size: .93rem; }
.lines li { display: flex; justify-content: space-between; gap: 10px; }
.lines li span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.lines .empty-l { color: var(--muted); }
.tot { display: flex; justify-content: space-between; gap: 10px; padding-top: 12px; margin: 10px 0 16px; border-top: 1px dashed var(--red); font-weight: 600; font-size: 1.12rem; font-variant-numeric: tabular-nums; }
.note { margin: 10px 0 0; font-size: .86rem; color: var(--muted); min-height: 1.4em; }
.summary .btn { width: 100%; }
@media (max-width: 960px) { .stack .wrap { grid-template-columns: 1fr; } .summary { position: relative; top: auto; } }
@media (max-width: 560px) { .picks { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }

/* values */
.values { border-block: 1px solid var(--line); }
.vals { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.vals li { display: grid; justify-items: center; text-align: center; gap: 6px; padding: clamp(26px, 4vw, 44px) 18px; }
.vals li + li { border-inline-start: 1px solid var(--line); }
.vals canvas { width: 40px; height: 40px; margin-bottom: 6px; }
.vals canvas.wide { width: 44px; height: 40px; }
.vals b { font-weight: 500; font-size: 1.02rem; }
.vals span { color: var(--muted); font-size: .9rem; max-width: 26ch; }
@media (max-width: 860px) { .vals { grid-template-columns: repeat(2, minmax(0, 1fr)); } .vals li:nth-child(3) { border-inline-start: 0; } .vals li:nth-child(n+3) { border-top: 1px solid var(--line); } }

/* #WearAsala */
.ugc-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.ugc { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: var(--r-s); overflow: hidden; background: var(--linen); }
.ugc img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--tz-ease); }
.ugc:hover img { transform: scale(1.05); }
.ugc .lbl { position: absolute; inset-inline-start: 6px; bottom: 6px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.9); font-size: .7rem; font-weight: 500; }
.ugc .eye { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(51,52,47,.35); color: #fff; opacity: 0; transition: opacity .25s; font-weight: 500; font-size: .9rem; }
.ugc:hover .eye, .ugc:focus-visible .eye { opacity: 1; }
.tag { color: var(--red); }
@media (max-width: 860px) { .ugc-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .ugc .lbl { display: none; } }

/* newsletter */
.news { background: var(--linen); }
.news .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.nl { display: grid; gap: 6px; }
.nl label { font-size: .85rem; color: var(--muted); }
.nl-row { display: flex; gap: 8px; }
.nl input { flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; border: 1px solid #CFCBC4; border-radius: var(--r-s); background: #fff; direction: ltr; }
[dir="rtl"] .nl input { text-align: right; }
.nl input[aria-invalid="true"] { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.nl-err { margin: 0; color: var(--red); font-size: .86rem; }
.nl-err:empty { display: none; }
.nl-ok { display: flex; align-items: center; gap: 12px; margin: 0; font-weight: 500; }
.nl-ok canvas { width: 28px; height: 28px; flex: none; }
@media (max-width: 760px) { .news .wrap { grid-template-columns: 1fr; } .nl-row { flex-direction: column; } }

/* footer */
footer { background: #fff; }
footer .chain { width: 100%; height: 18px; margin-top: clamp(30px, 5vw, 56px); }
.fcols { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 28px; padding-block: 34px 30px; }
.fcols .logo { justify-self: start; padding: 0; margin-bottom: 12px; }
.fcols p { margin: 0; color: var(--muted); font-size: .92rem; max-width: 34ch; }
footer h4 { margin: 0 0 8px; font-size: .92rem; font-weight: 600; }
footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
footer li { color: var(--muted); font-size: .92rem; min-height: 36px; display: flex; align-items: center; }
footer li button { border: 0; background: none; padding: 0; min-height: 44px; color: var(--muted); text-align: start; }
footer li button:hover { color: var(--red); text-decoration: underline; text-underline-offset: 4px; }
.legal { border-top: 1px solid var(--line); }
.legal .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding-block: 16px 22px; font-size: .82rem; color: var(--muted); }
@media (max-width: 860px) { .fcols { grid-template-columns: 1fr 1fr; } .fcols > div:first-child { grid-column: 1 / -1; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .rail { scroll-behavior: auto; }
}
</style>

      v4: 'Designed by an architect', v4d: 'Every piece starts as a drawing of a dome, an arch or a window screen.',
      ugc_h: '#WearAsala', to_confirm: '(to confirm)', ugc_p: 'This wall is for your photos wearing Asala. Until yours arrive, it shows photos from the brand book.',
      ugc_lbl: 'Brand book photo',
      nl_h: 'Letters from Asala', nl_p: 'New pieces and drawings from the design sketchbook, in your inbox.', nl_label: 'Email address', nl_btn: 'Subscribe',
      nl_err: 'Enter a valid email address, like name@example.com.', nl_ok: 'Thank you! We’ll write soon. (Design demo: nothing was sent.)',
      foot_p: 'Everyday jewellery from Nablus, drawn from Palestinian architecture and stitched with its spirit.', foot_shop: 'Shop', foot_help: 'Help', foot_about: 'About',
      foot_fee: 'Delivery fee shown at checkout', foot_wa: 'WhatsApp orders (to confirm)', foot_care: 'Jewellery care (to confirm)', foot_made: 'Made by hand in Nablus'
    }
  };

  function count(n) {
    if (n === 1) return t('item1');
    if (S.lang() === 'ar') return n === 2 ? t('items2') : n <= 10 ? t('items', { n: n }) : t('items11', { n: n });
    return t('items', { n: n });
  }
  function base(p) { return p.configurable ? A.MATERIALS[0].price : p.price; }
  function priceHTML(p) { return (p.configurable ? esc(t('from')) + ' ' : '') + S.money(base(p)); }
  function img(p, cls) { return '<img class="' + (cls || '') + (p.cutout ? ' cut' : '') + '" src="' + p.photo + '" alt="" loading="lazy">'; }
  function toneOf(p) { return tones[p.id] || p.tones[0]; }
  function quick(id, tone) {
    var p = S.byId(id); tone = tone || toneOf(p);
    if (p.configurable) S.openProduct(p.id, tone); else S.add(p.id, tone, '', { meta: p.cat === 'earrings' ? t('per_pair') : '' });
  }

  // ---------- the everyday edit (scroller) ----------
  function card(p) {
    var tn = toneOf(p), f = S.photoFilter(p, tn) || 'none', alt = p.alts && p.alts[0];
    var dots = p.tones.map(function (x) {
      var sw = '<i style="background:' + S.TONES[x].swatch + '"></i>';
      return p.tones.length > 1
        ? '<button class="dot" type="button" data-tone-set="' + p.id + '" data-tone="' + x + '" aria-pressed="' + (x === tn) + '" aria-label="' + esc(S.TONES[x][S.lang()]) + '">' + sw + '</button>'
        : '<span class="dot" aria-hidden="true">' + sw + '</span>';
    }).join('') + (p.tones.length === 1 ? '<span class="dot-name">' + esc(S.TONES[tn][S.lang()]) + '</span>' : '');
    return '<article class="pc">' +
      '<div class="pc-media">' +
        (NEW[p.id] ? '<span class="badge"><canvas data-stitch="star" data-palette="red"></canvas>' + esc(t('new')) + '</span>' : '') +
        '<button class="pc-art" type="button" data-open="' + p.id + '" data-open-tone="' + tn + '" aria-label="' + esc(t('view') + ': ' + S.name(p)) + '">' +
          '<img class="main' + (alt ? ' swap' : '') + (p.cutout ? ' cut' : '') + '" src="' + p.photo + '" alt="" loading="lazy" style="filter:' + f + '">' +
          (alt ? '<img class="alt has" src="' + alt + '" alt="" loading="lazy">' : '') +
        '</button>' +
        '<button class="qa" type="button" data-qadd="' + p.id + '" aria-label="' + esc((p.configurable ? t('choose') : t('quick_add')) + ': ' + S.name(p)) + '">' + PLUS + '<span>' + esc(p.configurable ? t('choose') : t('quick_add')) + '</span></button>' +
      '</div>' +
      '<div class="pc-meta"><h3><button type="button" data-open="' + p.id + '" data-open-tone="' + tn + '">' + esc(S.name(p)) + '</button></h3>' +
      '<span class="price">' + priceHTML(p) + '</span><div class="tones">' + dots + '</div></div></article>';
  }
  function renderEdit() {
    $('#tabs').innerHTML = ['all', 'earrings', 'necklace'].map(function (c) {
      return '<button class="tab" type="button" data-tab="' + c + '" aria-pressed="' + (c === tab) + '">' + esc(t('c_' + c)) + '</button>';
    }).join('');
    var rail = $('#rail');
    rail.innerHTML = S.PRODUCTS.filter(function (p) { return tab === 'all' || p.cat === tab; }).map(card).join('');
    rail.scrollLeft = 0;
    TZ.mount(rail);
  }

  // ---------- gift guide ----------
  function inBudget(p) {
    var b = BUDGETS.filter(function (x) { return x.id === budget; })[0], v = base(p);
    return b.max ? v < b.max : v >= b.min;
  }
  function renderGifts() {
    $('#chips').innerHTML = BUDGETS.map(function (b) {
      var label = b.max ? t('under', { p: S.money(b.max) }) : t('over', { p: S.money(b.min) });
      return '<button class="chip" type="button" data-budget="' + b.id + '" aria-pressed="' + (b.id === budget) + '"><canvas data-stitch="star" data-palette="red"></canvas>' + esc(label) + '</button>';
    }).join('');
    var list = S.PRODUCTS.filter(inBudget);
    $('#gg-count').textContent = count(list.length);
    $('#ggrid').innerHTML = list.map(function (p) {
      return '<article class="gc"><button class="art" type="button" data-open="' + p.id + '" aria-label="' + esc(t('view') + ': ' + S.name(p)) + '">' + img(p) + '</button>' +
        '<div class="m"><h3>' + esc(S.name(p)) + '</h3><span class="price">' + priceHTML(p) + '</span>' +
        '<button class="add" type="button" data-qadd="' + p.id + '" aria-label="' + esc((p.configurable ? t('choose') : t('add')) + ': ' + S.name(p)) + '">' + esc(p.configurable ? t('choose') : t('add_short')) + '</button></div></article>';
    }).join('');
    TZ.mount($('#chips'));
  }

  // ---------- ear stack ----------
  function earrings() { return S.PRODUCTS.filter(function (p) { return p.cat === 'earrings'; }); }
  function renderPicks() {
    var full = picked.length >= MAX;
    $('#picks').innerHTML = earrings().map(function (p) {
      var on = picked.indexOf(p.id) > -1;
      return '<label class="pick"><input type="checkbox" value="' + p.id + '"' + (on ? ' checked' : '') + (full && !on ? ' disabled' : '') + '>' +
        '<div class="ph">' + img(p) + '</div><div class="m"><b>' + esc(S.name(p)) + '</b><span>' + priceHTML(p) + '</span></div></label>';
    }).join('');
  }
  function renderSummary(msg) {
    var full = picked.length >= MAX, ps = picked.map(S.byId), total = ps.reduce(function (s, p) { return s + base(p); }, 0);
    var hasDome = ps.some(function (p) { return p.configurable; });
    $('#st-n').textContent = t('st_n', { n: picked.length });
    var slots = '';
    for (var i = 0; i < MAX; i++) {
      var p = ps[i];
      slots += p ? '<div class="slot">' + img(p) + '<button type="button" data-unpick="' + p.id + '" aria-label="' + esc(t('remove_x', { n: S.name(p) })) + '">' + X + '</button></div>'
                 : '<div class="slot empty"><canvas data-stitch="star" data-palette="mono"></canvas></div>';
    }
    $('#slots').innerHTML = slots;
    $('#lines').innerHTML = ps.length ? ps.map(function (p) {
      return '<li><span>' + esc(S.name(p)) + '</span><span>' + priceHTML(p) + '</span></li>';
    }).join('') : '<li class="empty-l">' + esc(t('st_empty')) + '</li>';
    $('#st-total').textContent = (hasDome ? t('from') + ' ' : '') + S.money(total);
    var b = $('#st-add'); b.disabled = !ps.length; b.textContent = ps.length ? t('st_add') : t('st_add0');
    $('#st-note').textContent = msg || (full ? t('st_max') : hasDome ? t('st_dome', { p: S.money(A.MATERIALS[0].price) }) : '');
    TZ.mount($('#slots'));
  }
  function renderStack(msg) { renderPicks(); renderSummary(msg); }

  // ---------- #WearAsala ----------
  function renderUGC() {
    $('#ugc').innerHTML = UGC.map(function (u) {
      var p = S.byId(u.id);
      return '<button class="ugc" type="button" data-open="' + u.id + '" aria-label="' + esc(t('view') + ': ' + S.name(p) + ' · ' + t('ugc_lbl')) + '">' +
        '<img src="' + u.img + '" alt="" loading="lazy"><span class="lbl" aria-hidden="true">' + esc(t('ugc_lbl')) + '</span><span class="eye" aria-hidden="true">' + esc(t('view')) + '</span></button>';
    }).join('');
  }

  // ---------- search ----------
  function norm(s) { return String(s).toLowerCase().replace(/[ً-ْ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي'); }
  function renderSearch() {
    var q = norm($('#q').value.trim()), out = $('#results');
    if (!q) { out.innerHTML = ''; return; }
    var hits = S.PRODUCTS.filter(function (p) {
      return [p.ar, p.en, p.dAr, p.dEn, S.CATS[p.cat].ar, S.CATS[p.cat].en].some(function (s) { return norm(s).indexOf(q) > -1; });
    });
    out.innerHTML = hits.length ? hits.map(function (p) {
      return '<li><button type="button" data-open="' + p.id + '"><img src="' + p.photo + '" alt="">' +
        '<span>' + esc(S.name(p)) + '<small>' + esc(S.CATS[p.cat][S.lang()]) + ' · ' + priceHTML(p) + '</small></span></button></li>';
    }).join('') : '<li class="none">' + esc(t('search_none')) + '</li>';
  }
  function toggleDrop(id, open) {
    function btns(o) { return $$(o === 'search' ? '[data-search-btn]' : '#menu-btn'); }
    function visible(bs) { return bs.filter(function (x) { return x.offsetParent; })[0] || bs[0]; }
    var el = $('#' + id);
    open = open === undefined ? el.hidden : open;
    ['search', 'mnav'].forEach(function (o) { if (o !== id) { $('#' + o).hidden = true; btns(o).forEach(function (x) { x.setAttribute('aria-expanded', 'false'); }); } });
    var wasIn = document.activeElement && el.contains(document.activeElement);
    el.hidden = !open; btns(id).forEach(function (x) { x.setAttribute('aria-expanded', String(open)); });
    if (open && id === 'search') setTimeout(function () { $('#q').focus(); }, 20);
    if (!open && wasIn) visible(btns(id)).focus();
  }

  function render() {
    renderEdit(); renderGifts(); renderStack(); renderUGC(); renderSearch();
    $('#nl-err').textContent = $('#nl-err').textContent ? t('nl_err') : '';
    TZ.mount(document);
  }
  function go(id) {
    toggleDrop('mnav', false); toggleDrop('search', false);
    var el = document.getElementById(id); if (!el) return;
    var y = el.getBoundingClientRect().top + window.pageYOffset - $('.top').offsetHeight + 1;
    window.scrollTo({ top: y, behavior: reduce ? 'auto' : 'smooth' });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-tab')) { tab = b.getAttribute('data-tab'); renderEdit(); return; }
    if (b.hasAttribute('data-tab-go')) { tab = b.getAttribute('data-tab-go'); renderEdit(); go('edit'); return; }
    if (b.hasAttribute('data-go')) { go(b.getAttribute('data-go')); return; }
    if (b.id === 'menu-btn') { toggleDrop('mnav'); return; }
    if (b.hasAttribute('data-search-btn')) { toggleDrop('search'); return; }
    if (b.id === 'search-close') { toggleDrop('search', false); return; }
    if (b.hasAttribute('data-open') && b.closest('#results')) { toggleDrop('search', false); return; }
    if (b.hasAttribute('data-rail')) {
      var rail = $('#rail'), dir = +b.getAttribute('data-rail') * (S.lang() === 'ar' ? -1 : 1);
      rail.scrollBy({ left: dir * rail.clientWidth * 0.75, behavior: reduce ? 'auto' : 'smooth' }); return;
    }
    if (b.hasAttribute('data-tone-set')) {
      var id = b.getAttribute('data-tone-set'); tones[id] = b.getAttribute('data-tone');
      var x = $('#rail').scrollLeft; renderEdit(); $('#rail').scrollLeft = x;
      var nb = $('[data-tone-set="' + id + '"][data-tone="' + tones[id] + '"]'); if (nb) nb.focus();
      return;
    }
    if (b.hasAttribute('data-budget')) { budget = b.getAttribute('data-budget'); renderGifts(); var nc = $('[data-budget="' + budget + '"]'); if (nc) nc.focus(); return; }
    if (b.hasAttribute('data-qadd')) { quick(b.getAttribute('data-qadd')); return; }
    if (b.hasAttribute('data-unpick')) { var u = b.getAttribute('data-unpick'); picked = picked.filter(function (x) { return x !== u; }); renderStack(); var c = $('#picks input[value="' + u + '"]'); if (c) c.focus(); return; }
    if (b.id === 'st-add') {
      var ps = picked.map(S.byId), plain = ps.filter(function (p) { return !p.configurable; }), dome = ps.filter(function (p) { return p.configurable; })[0];
      plain.forEach(function (p) { S.add(p.id, p.tones[0], '', { meta: t('per_pair') }); });
      picked = []; renderStack(plain.length ? t('st_done', { n: count(plain.length) }) : '');
      if (dome) S.openProduct(dome.id, toneOf(dome));
      return;
    }
  });
  document.addEventListener('change', function (e) {
    if (!e.target.closest('#picks')) return;
    var id = e.target.value;
    if (e.target.checked) { if (picked.length < MAX && picked.indexOf(id) < 0) picked.push(id); }
    else picked = picked.filter(function (x) { return x !== id; });
    renderStack(); var c = $('#picks input[value="' + id + '"]'); if (c) c.focus();
  });
  $('#q').addEventListener('input', renderSearch);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('#search').hidden) toggleDrop('search', false);
    if (!$('#mnav').hidden) toggleDrop('mnav', false);
  });
  $('#nl').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('#nl-email'), ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(inp.value.trim());
    inp.setAttribute('aria-invalid', ok ? 'false' : 'true');
    $('#nl-err').textContent = ok ? '' : t('nl_err');
    if (!ok) { inp.focus(); return; }
    $('#nl').hidden = true; $('#nl-ok').hidden = false; TZ.mount($('#nl-ok')); $('#nl-ok').focus();
  });

  S.boot({ strings: TZ.strings(STR), render: render, cartKey: 'asala-19-cart', orderPrefix: 'AS-' });
  render(); TZ.mount(document);
})();
</script>
</body>
</html>
