<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Siwar Hebron Plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Layout: a wall of Hebron glazed plates. Cobalt owns the hero and footer, every piece sits on its own painted plate, one colour switch recolours the whole wall. */
:root {
  --glaze: #f6f8fc; --white: #ffffff;
  --cobalt: #1a3aa0; --cobalt-deep: #0f2370; --cobalt-ink: #0d1a4a;
  --turq: #0b7a74; --amber: #f2a534; --amber-ink: #3a2300;
  --muted: #4a5578; --line: #d7def0; --edge: #8592b8; --error: #c22d2d;
  --f-display: "Lalezar", "Tajawal", sans-serif;
  --f-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  --gutter: clamp(16px, 4vw, 40px);
  --jewel-shadow: rgba(13, 26, 74, .28);
  color-scheme: light;
}
* { box-sizing: border-box; }
html.panel-open { overflow: hidden; }
body { margin: 0; background: var(--glaze); color: var(--cobalt-ink); font: 500 1.05rem/1.6 var(--f-body); }
::selection { background: var(--amber); color: var(--amber-ink); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: var(--gutter); }

.demo { background: var(--cobalt-ink); color: #c7d1f2; font-size: .82rem; text-align: center; padding: 6px var(--gutter); margin: 0; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--white); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 18px; min-height: 66px; }
.logo { font: 400 2.1rem/1 var(--f-display); color: var(--cobalt); text-decoration: none; }
.top nav { display: flex; gap: 2px; margin-inline-start: 12px; }
.top nav button { background: none; border: 0; min-height: 44px; padding: 0 12px; font-weight: 700; color: var(--muted); border-radius: 22px; }
.top nav button:hover { color: var(--cobalt); background: color-mix(in srgb, var(--cobalt) 8%, transparent); }
.tools { display: flex; gap: 8px; margin-inline-start: auto; }
.pill { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid var(--cobalt); background: var(--white); color: var(--cobalt); font-weight: 700; }
.pill.solid { background: var(--cobalt); color: var(--white); }
.pill svg { width: 18px; height: 18px; }
.count { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--amber); color: var(--amber-ink); font-size: .8rem; font-weight: 800; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .top nav { display: none; } .pill .lbl { display: none; } }

/* hero: cobalt field with the colour switch and three plates */
.hero { background: var(--cobalt); color: var(--white); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 18px; background: radial-gradient(circle at 9px 9px, var(--glaze) 4px, transparent 4.5px) 0 0 / 22px 18px repeat-x; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(20px, 4vw, 56px); align-items: center; padding-block: clamp(28px, 5vw, 64px) clamp(44px, 6vw, 80px); }
.hero h1 { font: 400 clamp(2.6rem, 6.4vw, 5rem)/1.05 var(--f-display); margin: 0 0 14px; text-wrap: balance; }
.hero p { margin: 0 0 22px; color: #dfe6ff; max-width: 38ch; font-size: 1.1rem; }
.switch-lbl { font-weight: 700; font-size: .9rem; color: #c7d1f2; margin-bottom: 10px; display: block; }
.switch { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 18px 0 8px; border-radius: 26px; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06); color: var(--white); font-weight: 700; }
[dir="ltr"] .sw { padding: 0 18px 0 8px; }
[dir="rtl"] .sw { padding: 0 8px 0 18px; }
.sw i { width: 36px; height: 36px; border-radius: 50%; box-shadow: inset 0 -4px 8px rgba(0,0,0,.25), inset 0 3px 6px rgba(255,255,255,.6); }
.sw[aria-checked="true"] { background: var(--white); color: var(--cobalt); border-color: var(--white); }
.hero-plates { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px, 2vw, 22px); align-items: end; }
.hero-plates .plate-cell:nth-child(2) { transform: translateY(-22px); }
@media (max-width: 860px) {
  .hero .wrap { grid-template-columns: 1fr; }
  .hero-plates { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 14px; padding-bottom: 6px; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scrollbar-width: none; }
  .hero-plates .plate-cell { flex: 0 0 58%; scroll-snap-align: center; }
  .hero-plates .plate-cell:nth-child(2) { transform: none; }
}
.plate-cell.off .plate { opacity: .5; filter: saturate(.4); }
.tone-note { margin: -4px 0 0; font-size: .85rem; color: var(--muted); }
.hero .tone-note { color: #c7d1f2; }

/* the plate */
.plate-cell { display: grid; justify-items: center; gap: 10px; text-align: center; position: relative; }
.plate { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 0; padding: 0; background: radial-gradient(circle at 38% 30%, #ffffff 0%, #f3f6ff 55%, #dfe6f8 100%); box-shadow: 0 14px 28px rgba(13, 26, 74, .22), inset 0 -6px 14px rgba(26, 58, 160, .10); }
.plate::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-conic-gradient(var(--cobalt) 0deg 5deg, transparent 5deg 15deg);
  -webkit-mask: radial-gradient(circle closest-side, transparent 0 82%, #000 82.5% 86%, transparent 86.5% 89%, #000 89.5% 96%, transparent 96.5%);
          mask: radial-gradient(circle closest-side, transparent 0 82%, #000 82.5% 86%, transparent 86.5% 89%, #000 89.5% 96%, transparent 96.5%); }
.plate::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--cobalt); }
.plate canvas { position: absolute; inset: 9%; width: 82%; height: 82%; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.plate:hover canvas { transform: scale(1.06) rotate(-2deg); }
.plate img { position: absolute; inset: 10.5%; width: 79%; height: 79%; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px var(--white), 0 0 0 5px var(--cobalt); transition: transform .45s cubic-bezier(.2,.8,.2,1), filter .35s; }
.plate:hover img { transform: scale(1.04); }
.sticker { position: absolute; top: 2%; inset-inline-end: 2%; width: clamp(44px, 19%, 66px); aspect-ratio: 1; border-radius: 50%; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; font: 400 clamp(.9rem, 1.8vw, 1.25rem)/1 var(--f-display); transform: rotate(-10deg); box-shadow: 0 4px 10px rgba(58, 35, 0, .25); z-index: 2; pointer-events: none; font-variant-numeric: tabular-nums; }
.hero .sticker { box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.p-name { font-weight: 700; margin: 0; font-size: 1rem; line-height: 1.3; }
.hero .p-name { color: var(--white); }
.add { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: var(--cobalt); color: var(--white); font-weight: 800; }
.add:hover { background: var(--cobalt-deep); }
.hero .add { background: var(--amber); color: var(--amber-ink); }
.hero .add:hover { background: #ffb84f; }
.add svg { width: 18px; height: 18px; }
.new { position: absolute; bottom: 6%; inset-inline-start: 4%; z-index: 2; background: var(--turq); color: var(--white); font-weight: 800; font-size: .78rem; padding: 3px 10px; border-radius: 12px; }

/* wall controls */
.wall { padding-block: clamp(36px, 6vw, 72px); }
.wall-head { display: grid; grid-template-columns: 1fr auto; gap: 18px 30px; align-items: end; margin-bottom: 28px; }
.wall h2, .ways h2 { font: 400 clamp(2rem, 4vw, 3rem)/1.1 var(--f-display); color: var(--cobalt); margin: 0; }
.cats { display: flex; gap: 8px; flex-wrap: wrap; grid-column: 1 / -1; }
.cat { min-height: 44px; padding: 0 18px; border-radius: 22px; border: 2px solid var(--edge); background: var(--white); font-weight: 700; color: var(--muted); }
.cat[aria-pressed="true"] { border-color: var(--cobalt); background: var(--cobalt); color: var(--white); }
.budget { display: grid; gap: 4px; min-width: min(340px, 100%); }
.budget label { font-weight: 700; display: flex; justify-content: space-between; gap: 12px; }
.budget output { font: 400 1.5rem/1 var(--f-display); color: var(--cobalt); font-variant-numeric: tabular-nums; }
.budget input { width: 100%; accent-color: var(--cobalt); height: 44px; }
.budget small { color: var(--muted); }
@media (max-width: 700px) { .wall-head { grid-template-columns: 1fr; } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: clamp(22px, 3vw, 40px) clamp(14px, 2.5vw, 30px); }
@media (max-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .plate-cell .add .lbl { display: none; } }
.none { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 30px 0; }

/* ways to pay: turquoise band */
.ways { background: var(--turq); color: var(--white); padding-block: clamp(32px, 5vw, 60px); }
.ways h2 { color: var(--white); }
.ways ol { list-style: none; padding: 0; margin: 22px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; counter-reset: s; }
.ways li { counter-increment: s; display: grid; gap: 4px; }
.ways li::before { content: counter(s); width: 44px; height: 44px; border-radius: 50%; background: var(--white); color: var(--turq); display: grid; place-items: center; font: 400 1.5rem/1 var(--f-display); margin-bottom: 6px; }
.ways b { font-size: 1.15rem; } .ways span { color: #dff7f4; }
@media (max-width: 700px) { .ways ol { grid-template-columns: 1fr; } }

footer { background: var(--cobalt-deep); color: #c7d1f2; padding-block: 30px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 14px 36px; align-items: center; justify-content: space-between; }
footer .logo { color: var(--white); }
footer b { color: var(--white); user-select: all; font-variant-numeric: tabular-nums; }

/* panels */
.sheet, .drawer { position: fixed; inset: 0; z-index: 50; background: rgba(13, 26, 74, .5); display: flex; opacity: 0; transition: opacity .25s; }
.is-open { opacity: 1; }
.sheet { align-items: center; justify-content: center; padding: 16px; }
.sheet-card { position: relative; width: min(860px, 100%); max-height: calc(100% - 16px); overflow: auto; display: grid; grid-template-columns: 1fr 1fr; background: var(--white); border-radius: 28px; transform: scale(.96); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.is-open .sheet-card { transform: none; }
.sheet-art { padding: 26px; background: var(--cobalt); display: grid; place-items: center; }
.sheet-art .plate { max-width: 340px; }
.sheet-art canvas { position: absolute; inset: 9%; width: 82%; height: 82%; }
.sheet-art .plate img { position: absolute; inset: 10.5%; width: 79%; height: 79%; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px var(--white), 0 0 0 5px var(--cobalt); }
.sheet-info { padding: 28px; display: flex; flex-direction: column; gap: 12px; }
.sheet-info h2 { font: 400 2.1rem/1.1 var(--f-display); color: var(--cobalt); margin: 0; }
.sheet-cat { margin: 0; color: var(--turq); font-weight: 800; }
.sheet-price { margin: 0; font: 400 1.8rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.sheet-desc { margin: 0; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0; }
legend, .lbl-s { font-weight: 700; margin-bottom: 8px; padding: 0; display: block; }
[data-sheet-tones] { display: flex; gap: 8px; flex-wrap: wrap; }
.tone { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid var(--edge); background: var(--white); font-weight: 700; }
.tone[aria-checked="true"] { border-color: var(--cobalt); }
.tone-dot { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 -3px 5px rgba(0,0,0,.25); }
.text-in { width: 100%; min-height: 50px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--edge); font: 700 1.4rem "Aref Ruqaa", serif; color: var(--cobalt); }
.hint { color: var(--muted); font-size: .85rem; }
.err { color: var(--error); font-size: .9rem; margin: 2px 0 0; min-height: 1em; font-weight: 700; }
.x { position: absolute; top: 12px; inset-inline-end: 12px; z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--white); color: var(--cobalt); display: grid; place-items: center; box-shadow: 0 4px 12px rgba(13,26,74,.2); }
.x svg { width: 18px; height: 18px; }
.btn { min-height: 52px; border-radius: 26px; border: 0; background: var(--cobalt); color: var(--white); font-weight: 800; font-size: 1.05rem; padding: 0 26px; }
.btn:hover { background: var(--cobalt-deep); }
.full { width: 100%; }
@media (max-width: 720px) {
  .sheet { align-items: end; padding: 0; }
  .sheet-card { grid-template-columns: 1fr; border-radius: 28px 28px 0 0; max-height: 94%; transform: translateY(40px); }
  .sheet-art { padding: 18px 60px; }
  .sheet-info { padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
}
.drawer-card { width: min(440px, 100%); height: 100%; overflow: auto; background: var(--white); padding: calc(18px + env(safe-area-inset-top, 0px)) 22px calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(40px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
[dir="rtl"] .drawer-card { transform: translateX(-40px); }
.drawer { justify-content: flex-end; }
.drawer.is-open .drawer-card { transform: none; }
.d-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.d-head h2 { margin: 0; font: 400 2rem/1 var(--f-display); color: var(--cobalt); }
.d-head span { color: var(--muted); }
.d-head .x { position: static; margin-inline-start: auto; box-shadow: none; background: var(--glaze); }
.empty { color: var(--muted); padding: 30px 0; }
[data-cart-list] { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ci { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: start; padding: 10px; border-radius: 18px; background: var(--glaze); }
.ci-img { position: relative; width: 72px; height: 72px; border-radius: 50%; background: var(--white); box-shadow: inset 0 0 0 2px var(--cobalt); }
.ci-img canvas { position: absolute; inset: 8%; width: 84%; height: 84%; }
.ci-img img { position: absolute; inset: 4px; width: calc(100% - 8px); height: calc(100% - 8px); border-radius: 50%; object-fit: cover; }
.ci-name { margin: 0; font-weight: 800; }
.ci-meta { margin: 0 0 6px; color: var(--muted); font-size: .9rem; }
.ci-row { display: flex; gap: 10px; align-items: center; }
.ci-qty { display: inline-flex; align-items: center; background: var(--white); border-radius: 18px; }
.ci-qty button { width: 44px; height: 44px; border: 0; background: none; font-size: 1.15rem; color: var(--cobalt); font-weight: 800; }
.ci-qty output { min-width: 20px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 800; }
.ci-remove { border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }
.ci-price { margin: 0; font: 400 1.2rem/1.2 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sums { margin: 18px 0; display: grid; gap: 8px; font-variant-numeric: tabular-nums; }
.sums div { display: flex; justify-content: space-between; } .sums dd { margin: 0; font-weight: 700; } .sums dt { color: var(--muted); }
.sums .grand { padding-top: 10px; border-top: 2px dotted var(--cobalt); font-size: 1.2rem; } .sums .grand dt { color: var(--cobalt-ink); font-weight: 800; }
.form { display: grid; gap: 14px; }
.form label { display: block; font-weight: 700; margin-bottom: 5px; font-size: .95rem; }
.form input, .form select, .form textarea { width: 100%; min-height: 50px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--edge); background: var(--white); }
.form textarea { min-height: 80px; resize: vertical; }
.form [aria-invalid="true"] { border-color: var(--error); }
.form input[type="tel"] { direction: ltr; }
[dir="rtl"] .form input[type="tel"] { text-align: right; }
[data-pay-list] { display: grid; gap: 8px; }
.pay { display: flex; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--edge); cursor: pointer; }
.pay:has(input:checked) { border-color: var(--cobalt); background: color-mix(in srgb, var(--cobalt) 6%, transparent); }
.pay input { width: 20px; height: 20px; min-height: 0; margin: 3px 0 0; accent-color: var(--cobalt); }
.pay-body { display: grid; } .pay-name { font-weight: 800; } .pay-note { color: var(--muted); font-size: .88rem; }
.fee-hint { color: var(--muted); font-size: .88rem; margin: -6px 0 0; }
.link-btn { border: 0; background: none; color: var(--muted); text-decoration: underline; min-height: 44px; }
.ok { text-align: center; padding: 40px 0; display: grid; gap: 12px; justify-items: center; }
.ok h3 { font: 400 2.4rem/1.1 var(--f-display); color: var(--cobalt); margin: 0; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); inset-inline: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px); z-index: 60; background: var(--amber); color: var(--amber-ink); font-weight: 800; padding: 12px 20px; border-radius: 24px; box-shadow: 0 10px 24px rgba(13,26,74,.3); transform: translateY(20px); opacity: 0; transition: .3s; pointer-events: none; }
.toast.is-on { transform: none; opacity: 1; }
@keyframes pop { from { transform: scale(.6) rotate(-30deg); } to { transform: scale(1) rotate(-10deg); } }
.recolour .sticker { animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<p class="demo" data-t="demo_note"></p>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top">سِوار</a>
    <nav aria-label="Categories">
      <button type="button" data-jump="necklace" data-cat-label="necklace"></button>
      <button type="button" data-jump="bracelet" data-cat-label="bracelet"></button>
      <button type="button" data-jump="earrings" data-cat-label="earrings"></button>
    </nav>
    <div class="tools">
      <button class="pill" type="button" data-lang-toggle><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span data-t="lang_switch"></span></button>
      <button class="pill solid" type="button" data-open-cart data-ta="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="lbl" data-t="cart"></span><span class="count" data-cart-count hidden>0</span></button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div>
        <h1 data-t="h1"></h1>
        <p data-t="lead"></p>
        <span class="switch-lbl" id="sw-lbl" data-t="switch"></span>
        <div class="switch" role="radiogroup" aria-labelledby="sw-lbl" id="switch"></div>
      </div>
      <div class="hero-plates" id="hero-plates"></div>
    </div>
  </section>

  <section class="wall" id="wall">
    <div class="wrap">
      <div class="wall-head">
        <h2 data-t="wall_h"></h2>
        <div class="budget">
          <label for="budget"><span data-t="budget"></span><output id="budget-out" for="budget"></output></label>
          <input id="budget" type="range" min="40" max="150" step="5" value="150">
          <small id="budget-count"></small>
        </div>
        <div class="cats" id="cats">
          <button class="cat" type="button" data-cat="all" aria-pressed="true" data-cat-label="all"></button>
          <button class="cat" type="button" data-cat="necklace" aria-pressed="false" data-cat-label="necklace"></button>
          <button class="cat" type="button" data-cat="bracelet" aria-pressed="false" data-cat-label="bracelet"></button>
          <button class="cat" type="button" data-cat="earrings" aria-pressed="false" data-cat-label="earrings"></button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="ways">
    <div class="wrap">
      <h2 data-t="ways_h"></h2>
      <ol>
        <li><b data-t="s1"></b><span data-t="s1d"></span></li>
        <li><b data-t="s2"></b><span data-t="s2d"></span></li>
        <li><b data-t="s3"></b><span data-t="s3d"></span></li>
      </ol>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="logo">سِوار</span>
    <span><span data-t="wa"></span> <b>059 000 0000</b> · Instagram <b>@siwar.demo</b></span>
  </div>
</footer>

<div class="sheet" data-sheet hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-card">
    <button class="x" type="button" data-close data-ta="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="sheet-art"><div class="plate"><img data-sheet-photo alt="" hidden><canvas data-sheet-canvas></canvas></div></div>
    <div class="sheet-info">
      <p class="sheet-cat" data-sheet-cat></p>
      <h2 id="sheet-title" data-sheet-name></h2>
      <p class="sheet-price" data-sheet-price></p>
      <p class="sheet-desc" data-sheet-desc></p>
      <fieldset><legend data-t="tone"></legend><div data-sheet-tones role="radiogroup"></div></fieldset>
      <div data-sheet-custom hidden>
        <label class="lbl-s" for="engrave" data-t="engrave"></label>
        <input id="engrave" class="text-in" data-sheet-text maxlength="8" autocomplete="off">
        <span class="hint" data-t="engrave_hint"></span>
        <p class="err" data-sheet-err aria-live="polite"></p>
      </div>
      <button class="btn full" type="button" data-sheet-add data-t="add"></button>
    </div>
  </div>
</div>

<div class="drawer" data-drawer hidden role="dialog" aria-modal="true" aria-labelledby="bag-title">
  <div class="drawer-card" data-scroll>
    <div class="d-head"><h2 id="bag-title" data-t="cart"></h2><span data-count-label></span>
      <button class="x" type="button" data-close data-ta="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <section data-step="bag">
      <p class="empty" data-cart-empty data-t="bag_empty"></p>
      <div data-cart-filled hidden>
        <ul data-cart-list></ul>
        <dl class="sums"><div><dt data-t="subtotal"></dt><dd data-subtotal></dd></div></dl>
        <button class="btn full" type="button" data-goto="checkout" data-t="checkout"></button>
      </div>
    </section>
    <section data-step="checkout" hidden>
      <form class="form" data-checkout novalidate>
        <div><label for="f-name" data-t="f_name"></label><input id="f-name" name="name" autocomplete="name"><p class="err" data-err="name"></p></div>
        <div><label for="f-phone" data-t="f_phone"></label><input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" data-tp="ph_phone"><p class="err" data-err="phone"></p></div>
        <div><label for="f-city" data-t="f_city"></label><select id="f-city" name="city" data-city-select></select><p class="err" data-err="city"></p></div>
        <div><label for="f-address" data-t="f_address"></label><textarea id="f-address" name="address" data-tp="ph_address"></textarea><p class="err" data-err="address"></p></div>
        <fieldset><legend data-t="f_pay"></legend><div data-pay-list></div></fieldset>
        <dl class="sums">
          <div><dt data-t="subtotal"></dt><dd data-subtotal></dd></div>
          <div><dt data-t="delivery"></dt><dd data-fee></dd></div>
          <div class="grand"><dt data-t="total"></dt><dd data-total></dd></div>
        </dl>
        <p class="fee-hint" data-fee-hint data-t="choose_city"></p>
        <button class="btn full" type="submit" data-t="place_order"></button>
        <button class="link-btn" type="button" data-goto="bag" data-t="back_to_bag"></button>
      </form>
    </section>
    <section data-step="confirm" hidden>
      <div class="ok">
        <h3 data-t="ok_title"></h3>
        <p><span data-t="ok_num"></span>: <b data-confirm-num></b></p>
        <p data-confirm-body></p>
        <button class="btn" type="button" data-shop-again data-t="ok_again"></button>
      </div>
    </section>
  </div>
</div>

<div class="toast" data-toast role="status" aria-live="polite"></div>

<script src="store.js"></script>
<script>
(function () {
  var S = window.Store, tone = 'gold', cat = 'all', budget = 150;
  var HERO = ['drop', 'name', 'beads'];
  var bagIco = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

  function toneFor(p) { return p.tones.indexOf(tone) > -1 ? tone : p.tones[0]; }
  function plate(p, big) {
    var tn = toneFor(p);
    var action = p.custom
      ? '<button class="add" type="button" data-open="' + p.id + '" data-open-tone="' + tn + '" aria-label="' + S.esc(S.t('write_name') + ': ' + S.name(p)) + '">' + bagIco + '<span class="lbl">' + S.esc(S.t('write_name')) + '</span></button>'
      : '<button class="add" type="button" data-add="' + p.id + '" data-add-tone="' + tn + '" aria-label="' + S.esc(S.t('add') + ': ' + S.name(p)) + '">' + bagIco + '<span class="lbl">' + S.esc(S.t('add_short')) + '</span></button>';
    var off = p.tones.indexOf(tone) < 0;
    return '<div class="plate-cell' + (off ? ' off' : '') + '">' +
      '<button class="plate" type="button" data-open="' + p.id + '" data-open-tone="' + tn + '" aria-label="' + S.esc(S.t('view') + ': ' + S.name(p)) + '">' +
      '<span class="sticker">' + S.money(p.price) + '</span>' + (p.isNew && !big ? '<span class="new">' + S.t('new') + '</span>' : '') +
      S.media(p, { tone: tn, decorative: true }) + '</button>' +
      '<p class="p-name">' + S.esc(S.name(p)) + '</p>' +
      (off ? '<p class="tone-note">' + S.esc(S.t('only_in', { tones: p.tones.map(function (k) { return S.TONES[k][S.lang()]; }).join(S.lang() === 'ar' ? ' و' : ' / ') })) + '</p>' : '') + action + '</div>';
  }
  function render() { renderSwitch(); renderPlates(); }
  function renderSwitch() {
    document.getElementById('switch').innerHTML = Object.keys(S.TONES).map(function (k) {
      return '<button class="sw" type="button" role="radio" data-sw="' + k + '" aria-checked="' + (k === tone) + '"><i style="background:' + S.TONES[k].swatch + '"></i>' + S.TONES[k][S.lang()] + '</button>';
    }).join('');
  }
  function countText(n) {
    if (S.lang() !== 'ar') return S.t('showing', { n: n });
    return n === 0 ? 'لا قطع' : n === 1 ? 'تظهر قطعة واحدة' : n === 2 ? 'تظهر قطعتان' : n <= 10 ? 'تظهر ' + n + ' قطع' : 'تظهر ' + n + ' قطعة';
  }
  function renderPlates() {
    document.getElementById('hero-plates').innerHTML = HERO.map(function (id) { return plate(S.byId(id), true); }).join('');
    var items = S.PRODUCTS.filter(function (p) { return (cat === 'all' || p.cat === cat) && p.price <= budget; });
    document.getElementById('grid').innerHTML = items.length ? items.map(function (p) { return plate(p); }).join('') : '<p class="none">' + S.t('none') + '</p>';
    document.getElementById('budget-out').textContent = S.money(budget);
    document.getElementById('budget-count').textContent = countText(items.length);
    S.mount(document.getElementById('hero-plates')); S.mount(document.getElementById('grid'));
  }

  document.addEventListener('click', function (e) {
    var sw = e.target.closest('[data-sw]');
    if (sw) {
      tone = sw.getAttribute('data-sw');
      S.$$('[data-sw]').forEach(function (b) { b.setAttribute('aria-checked', String(b === sw)); });
      document.body.classList.remove('recolour'); void document.body.offsetWidth; document.body.classList.add('recolour');
      renderPlates(); return;
    }
    var c = e.target.closest('[data-cat]');
    if (c) { cat = c.getAttribute('data-cat'); S.$$('[data-cat]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === c)); }); renderPlates(); return; }
    var j = e.target.closest('[data-jump]');
    if (j) { cat = j.getAttribute('data-jump'); S.$$('[data-cat]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-cat') === cat)); }); render(); document.getElementById('wall').scrollIntoView({ behavior: 'smooth' }); }
  });
  document.getElementById('budget').addEventListener('input', function (e) { budget = Number(e.target.value); renderPlates(); });

  // Photos show gold-tone pieces; this demo previews the other tones with a tint.
  S.PRODUCTS.forEach(function (p) { if (p.altTones) p.tones = p.altTones; });
  S.boot({
    render: render,
    strings: {
      ar: {
        demo_note: 'نموذج تصميم: الأسعار ورسوم التوصيل مؤقتة. الصور من Unsplash، وألوان الفضي والوردي عليها معاينة تقريبية بالتلوين.', h1: 'اختاري اللون، والباقي يتبعه.', lead: 'حُلي يومية بأسعار واضحة على كل قطعة. تدفعين عند الاستلام.',
        switch: 'لون المعدن', add_short: 'للسلة', write_name: 'اكتبي الاسم',
        only_in: 'متوفرة بلون: {tones}', wall_h: 'كل القطع', budget: 'ميزانيتك حتى', showing: 'تظهر {n} قطع', none: 'لا توجد قطع ضمن هذه الميزانية. حرّكي المؤشر.',
        ways_h: 'الطلب بثلاث خطوات', s1: 'اختاري القطعة واللون', s1d: 'كل قطعة بسعرها، بدون مفاجآت.',
        s2: 'اكتبي العنوان والرقم', s2d: 'نتصل لتأكيد الطلب قبل الشحن.', s3: 'ادفعي عند الاستلام', s3d: 'نقداً للمندوب أو بالبطاقة.', wa: 'واتساب'
      },
      en: {
        demo_note: 'Design demo: prices and delivery fees are placeholders. Photos from Unsplash; silver and rose on them are an approximate tinted preview.', h1: 'Pick a colour. Everything follows.', lead: 'Everyday jewellery with the price on every piece. Pay on delivery.',
        switch: 'Metal colour', add_short: 'Add', write_name: 'Add a name',
        only_in: 'Comes in: {tones}', wall_h: 'Every piece', budget: 'Your budget, up to', showing: 'Showing {n} pieces', none: 'Nothing in this budget yet. Move the slider.',
        ways_h: 'Order in three steps', s1: 'Pick the piece and colour', s1d: 'Every piece shows its price.',
        s2: 'Add your address and number', s2d: 'We call to confirm before shipping.', s3: 'Pay when it arrives', s3d: 'Cash to the courier, or by card.', wa: 'WhatsApp'
      }
    }
  });
})();
</script>

</body>
</html>
