<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Asala Modern Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Manrope:wght@400;500;600;700&family=Alexandria:wght@300;400;500;600&display=swap">
<style>
/* Direction C, "Modern gallery", from the teammate's Figma: white page, black type, Syne display, Manrope body,
   Alexandria for Arabic, rounded photo bento, black marquee, pill buttons, brand red for the gift moments.
   Built as a working store on the shared engine: catalogue filter, Dome configurator, gift box builder, bag, COD checkout. */
:root {
  --bg: #ffffff; --fg: #141414; --fg-2: #5f5f5b; --line: rgba(20,20,20,.12); --edge: rgba(20,20,20,.42);
  --surface: #f2f2f0; --surface-2: #e9e9e6; --btn: #33342f; --on-btn: #ffffff; --soft: #f2f0ed;
  --red: #c6383c; --red-ink: #a92e32; --on-red: #ffffff; --bar: #2a2a28; --error: #b3261e;
  --display: "Syne", "Manrope", system-ui, sans-serif; --body: "Manrope", system-ui, sans-serif; --arabic: "Alexandria", "Manrope", sans-serif;
  --gutter: clamp(16px, 2.8vw, 40px); --page: 1440px; --r-lg: 20px; --r-md: 16px;
  --jewel-shadow: rgba(20,20,20,.2);
  color-scheme: light;
}
html[lang="ar"] { --display: "Alexandria", system-ui, sans-serif; --body: "Alexandria", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html.panel-open { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 1rem/1.6 var(--body); -webkit-font-smoothing: antialiased; overflow-x: clip; }
::selection { background: var(--fg); color: var(--bg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
img { display: block; max-width: 100%; }
bdi { unicode-bidi: isolate; }
.ar { font-family: var(--arabic); }
.en { font-family: "Manrope", system-ui, sans-serif; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.page { max-width: var(--page); margin: 0 auto; padding-inline: var(--gutter); }
section[id], [id="pieces"] { scroll-margin-top: 96px; }
::placeholder { color: #6f6f6a; opacity: 1; }
.arrow { width: 1em; height: 1em; flex: none; vertical-align: -.12em; }
[dir="rtl"] .arrow { transform: scaleX(-1); }
.skip { position: absolute; inset-inline-start: 12px; top: -60px; z-index: 90; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 40px; text-decoration: none; }
.skip:focus { top: 12px; }

/* pills */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 28px; border: 0; border-radius: 999px; background: var(--btn); color: var(--on-btn); font-weight: 600; font-size: 1rem; text-decoration: none; transition: background-color .2s, transform .2s cubic-bezier(.2,.8,.2,1); }
.pill:hover { background: #1d1d1a; }
.pill:active { transform: scale(.98); }
.pill.light { background: var(--soft); color: var(--fg); }
.pill.light:hover { background: #e7e4df; }
.pill.red { background: var(--red); color: var(--on-red); }
.pill.red:hover { background: var(--red-ink); }
.pill.sm { min-height: 48px; padding: 0 22px; font-size: .95rem; }
.pill.full { width: 100%; }
.text-btn { background: none; border: 0; padding: 0 4px; min-height: 44px; color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }

/* announcement + header */
.announce { margin: 0; background: var(--bar); color: #fff; text-align: center; font-size: .9rem; padding: 9px var(--gutter); }
.header { position: sticky; top: 0; z-index: 30; background: var(--bg); }
.header .page { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 84px; gap: 16px; }
.logo { display: inline-flex; align-items: center; min-height: 44px; justify-self: start; }
.logo img { height: 23px; width: auto; max-width: none; }
.nav { display: flex; gap: 6px; }
.nav button { background: none; border: 0; min-height: 44px; padding: 0 12px; font-size: 1rem; color: #222; border-radius: 999px; }
.nav button:hover, .nav button[aria-current="true"] { text-decoration: underline; text-underline-offset: 6px; }
.tools { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.tools button { background: none; border: 0; min-height: 44px; min-width: 44px; padding: 0 10px; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--fg); border-radius: 999px; }
.tools .lang { font-family: var(--arabic); font-size: 1.02rem; }
html[lang="ar"] .tools .lang { font-family: "Manrope", sans-serif; }
.count { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: var(--red); color: var(--on-red); font-size: .78rem; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; font-family: "Manrope", sans-serif; }
.tools svg { width: 22px; height: 22px; }
.ico-only { display: none !important; }
.burger { display: none !important; }
.mobile-menu { padding: 4px var(--gutter) 18px; display: grid; border-top: 1px solid var(--line); }
.mobile-menu button { text-align: start; background: none; border: 0; border-bottom: 1px solid var(--line); min-height: 52px; font-size: 1.1rem; }
.search-bar { border-top: 1px solid var(--line); padding-block: 14px 18px; }
.search-bar input { width: 100%; min-height: 52px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--surface); font-size: 1rem; }
.search-bar input:focus-visible { outline-offset: 2px; }
.results { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; }
.results button { width: 100%; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 6px; background: none; border: 0; text-align: start; border-radius: 14px; }
.results button:hover { background: var(--surface); }
.results img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; background: var(--surface); }
.results .none { color: var(--fg-2); padding: 10px 6px; }
@media (max-width: 1080px) {
  .nav { display: none; }
  .burger { display: inline-flex !important; }
  .header .page { grid-template-columns: auto 1fr auto; min-height: 68px; gap: 4px; }
  .logo { justify-self: center; }
  .tools .txt { display: none; }
  .tools .ico-only { display: inline-flex !important; }
}
@media (max-width: 420px) { .logo img { height: 15px; } .tools button { padding: 0 6px; } }

/* hero */
.hero { padding-block: clamp(20px, 3vw, 38px) clamp(24px, 3vw, 40px); }
.hero .page { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 488px); gap: 40px; align-items: center; }
.h-xl { font-family: var(--display); font-weight: 700; font-size: clamp(3.1rem, 8.1vw, 7.05rem); line-height: .93; letter-spacing: -.035em; margin: 0; }
html[lang="ar"] .h-xl { font-weight: 600; line-height: 1.18; letter-spacing: 0; font-size: clamp(2.7rem, 6.6vw, 5.6rem); }
.hero-copy p { margin: 0 0 26px; font-size: 1.25rem; line-height: 1.5; color: #222; max-width: 456px; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
@media (max-width: 900px) {
  .hero .page { grid-template-columns: 1fr; gap: 22px; }
  .hero-copy p { font-size: 1.05rem; margin-bottom: 20px; }
  .btn-row .pill { flex: 1 1 150px; }
}

/* bento */
.bento { display: grid; grid-template-columns: minmax(0, 2.35fr) minmax(0, 1fr) minmax(0, .66fr); grid-template-rows: minmax(0, 320px) minmax(0, 336px); gap: 20px 16px; }
.tile { position: relative; overflow: hidden; border-radius: var(--r-lg); background: var(--surface); border: 0; padding: 0; text-align: start; color: var(--fg); display: block; isolation: isolate; }
.tile > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .9s cubic-bezier(.16,1,.3,1); }
@media (hover: hover) { .tile:hover > img { transform: scale(1.035); } }
.tile:focus-visible { outline-offset: 4px; }
.t-hero { grid-row: 1 / 3; min-height: 560px; }
.t-hero > img { object-position: 86% 50%; }
.t-dome > img { object-position: 50% 26%; }
.t-gift { background: var(--red); color: var(--on-red); display: flex; flex-direction: column; justify-content: space-between; padding: 24px; }
.t-gift .mk { width: 54px; color: #fff; }
.t-gift .mk svg { width: 100%; height: auto; display: block; }
.t-gift b { font-family: var(--display); font-weight: 600; font-size: clamp(1.4rem, 1.9vw, 1.72rem); line-height: 1.04; letter-spacing: -.01em; }
html[lang="ar"] .t-gift b { line-height: 1.35; font-weight: 500; }
.t-lotus { grid-column: 2 / 4; background: #ececea; }
.t-lotus > img { object-position: 50% 62%; }
.chip-on { position: absolute; inset-inline-start: 20px; bottom: 20px; z-index: 1; display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--fg); border-radius: 999px; min-height: 40px; padding: 0 18px; font-size: .95rem; font-weight: 500; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
@media (max-width: 900px) {
  .bento { grid-template-columns: 1fr 1fr; grid-template-rows: auto; gap: 12px; }
  .t-hero { grid-column: 1 / -1; grid-row: auto; min-height: 0; aspect-ratio: 4 / 4.4; }
  .t-hero > img { object-position: 84% 50%; }
  .t-dome, .t-gift { aspect-ratio: 1; }
  .t-gift { padding: 18px; }
  .t-gift .mk { width: 42px; }
  .t-lotus { grid-column: 1 / -1; aspect-ratio: 16 / 10; }
  .chip-on { inset-inline-start: 14px; bottom: 14px; font-size: .88rem; padding: 0 14px; }
}

/* marquee */
.marquee { position: relative; background: #111; color: #fff; overflow: hidden; margin-top: 0; }
.marquee-track { display: flex; width: max-content; animation: run 34s linear infinite; }
.marquee:hover .marquee-track, .marquee.paused .marquee-track { animation-play-state: paused; }
.marquee ul { display: flex; align-items: center; list-style: none; margin: 0; padding: 0; }
.marquee li { display: flex; align-items: center; gap: 48px; padding-inline-end: 48px; white-space: nowrap; min-height: 84px; font-family: var(--display); font-weight: 600; font-size: clamp(1.4rem, 2.5vw, 2.15rem); letter-spacing: -.01em; }
html[lang="ar"] .marquee li { font-weight: 500; }
.marquee li::after { content: ""; width: 11px; height: 11px; background: var(--red); transform: rotate(45deg); flex: none; }
.marquee li:first-child { padding-inline-start: 40px; }
@keyframes run { to { transform: translateX(-50%); } }
@keyframes run-rtl { to { transform: translateX(50%); } }
[dir="rtl"] .marquee-track { animation-name: run-rtl; }
.mq-toggle { position: absolute; inset-inline-end: 8px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(17,17,17,.92); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.mq-toggle svg { width: 16px; height: 16px; }
.marquee :focus-visible, .t-gift:focus-visible { outline-color: var(--fg); }
.mq-toggle:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
@media (max-width: 700px) { .marquee li { min-height: 64px; gap: 30px; padding-inline-end: 30px; } .marquee li:first-child { padding-inline-start: 16px; } }

/* sections */
.section { padding-block: clamp(64px, 9vw, 130px); }
.h-lg { font-family: var(--display); font-weight: 700; font-size: clamp(2.3rem, 4.5vw, 4rem); line-height: 1.02; letter-spacing: -.035em; margin: 0; }
html[lang="ar"] .h-lg { font-weight: 600; letter-spacing: 0; line-height: 1.3; font-size: clamp(2rem, 3.8vw, 3.3rem); }
.h-md { font-family: var(--display); font-weight: 700; font-size: clamp(1.5rem, 2.1vw, 1.85rem); line-height: 1.15; letter-spacing: -.02em; margin: 0; }
html[lang="ar"] .h-md { font-weight: 600; letter-spacing: 0; line-height: 1.4; }

/* the pieces */
.pieces-head { display: flex; align-items: end; justify-content: space-between; gap: 18px 24px; flex-wrap: wrap; margin-bottom: 44px; padding-inline: 8px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--surface); font-size: .95rem; font-weight: 500; transition: background-color .2s; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--fg); color: #fff; }
.grid { list-style: none; margin: 0; padding: 0 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px 16px; }
.card { position: relative; }
.card .ph { position: relative; aspect-ratio: 1; border-radius: var(--r-md); overflow: hidden; background: #ececea; }
.card .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .9s cubic-bezier(.16,1,.3,1); }
.card .ph.cut img { object-fit: contain; padding: 4%; }
@media (hover: hover) { .card:hover .ph img { transform: scale(1.04); } }
.card .open { position: absolute; inset: 0; z-index: 1; border: 0; background: none; padding: 0; border-radius: var(--r-md); }
.card .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; font-weight: 500; font-size: 1.04rem; line-height: 1.35; }
.card .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
.card .alt { margin: 3px 0 0; color: var(--fg-2); font-size: .92rem; line-height: 1.35; }
.card .tag { position: absolute; top: 12px; inset-inline-start: 12px; z-index: 1; background: #fff; border-radius: 999px; font-size: .78rem; font-weight: 600; padding: 4px 11px; pointer-events: none; }
.none { grid-column: 1 / -1; color: var(--fg-2); padding: 30px 0; }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 700px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 12px; padding: 0; }
  .pieces-head { padding: 0; margin-bottom: 26px; }
  .card .row { font-size: .95rem; flex-direction: column; gap: 2px; }
  .chips { width: 100%; }
}

/* lattice + configurator */
.grey { background: var(--surface); }
.lat-head { display: grid; grid-template-columns: minmax(0, 684fr) minmax(0, 636fr); gap: 24px 40px; align-items: start; margin-bottom: 50px; }
.lat-head p { margin: 44px 0 0; font-size: 1.16rem; line-height: 1.55; color: #2b2b28; max-width: 452px; }
.pats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.pat { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: var(--r-md); overflow: hidden; background: #f6f5f3; text-align: start; transition: box-shadow .2s; }
.pat img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .9s cubic-bezier(.16,1,.3,1), filter .35s; }
.pat[data-pat="geometric"] img { object-position: 50% 0; transform: scale(1.2); transform-origin: 50% 6%; }
@media (hover: hover) { .pat:hover img { transform: scale(1.04); } .pat[data-pat="geometric"]:hover img { transform: scale(1.24); } }
.pat .chip-on { box-shadow: none; }
.pat[aria-checked="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--fg); }
.pat .tick { position: absolute; top: 14px; inset-inline-end: 14px; z-index: 1; width: 32px; height: 32px; border-radius: 50%; background: var(--fg); color: #fff; display: grid; place-items: center; opacity: 0; transform: scale(.7); transition: opacity .2s, transform .3s cubic-bezier(.16,1,.3,1); }
.pat .tick svg { width: 16px; height: 16px; }
.pat[aria-checked="true"] .tick { opacity: 1; transform: none; }
.lat-actions { margin-top: 48px; display: flex; align-items: center; gap: 16px 24px; flex-wrap: wrap; }
.lat-actions .sel { color: #2b2b28; }
.cfg { margin-top: 28px; background: #fff; border-radius: var(--r-lg); padding: clamp(20px, 3vw, 34px); display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 26px 40px; align-items: start; }
.cfg[hidden] { display: none; }
.cfg h3 { margin: 0 0 14px; font-size: 1rem; font-weight: 600; }
.cfg h3 span { color: var(--fg-2); font-weight: 400; }
.mats { display: grid; gap: 10px; }
.mat { display: grid; grid-template-columns: 34px 1fr auto; gap: 14px; align-items: center; min-height: 64px; padding: 10px 18px 10px 12px; border-radius: 16px; border: 1px solid var(--line); background: #fff; text-align: start; transition: border-color .2s, background-color .2s; }
.mat:hover { border-color: var(--edge); }
.mat .sw { width: 34px; height: 34px; border-radius: 50%; background-size: cover; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
.mat b { display: block; font-weight: 600; font-size: .98rem; }
.mat small { color: var(--fg-2); font-size: .86rem; }
.mat .pr { font-weight: 600; font-variant-numeric: tabular-nums; }
.mat[aria-checked="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); background: #fafaf8; }
.cfg-sum { display: grid; gap: 14px; align-content: start; }
.cfg-prev { display: flex; gap: 14px; align-items: center; }
.cfg-prev img { width: 84px; height: 84px; border-radius: 14px; object-fit: cover; background: var(--surface); flex: none; }
.cfg-prev .t { font-weight: 600; line-height: 1.35; }
.cfg-prev .s { color: var(--fg-2); font-size: .9rem; line-height: 1.45; }
.cfg-price { font-family: var(--display); font-weight: 700; font-size: 2.2rem; line-height: 1; letter-spacing: -.02em; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
.note { margin: 0; color: var(--fg-2); font-size: .88rem; line-height: 1.5; }
@media (max-width: 900px) {
  .lat-head { grid-template-columns: 1fr; margin-bottom: 30px; }
  .lat-head p { margin: 0; font-size: 1.02rem; }
  .pats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .cfg { grid-template-columns: 1fr; }
  .lat-actions { margin-top: 28px; }
  .lat-actions .pill { flex: 1 1 100%; }
}

/* gift */
.gift { display: grid; grid-template-columns: minmax(0, 766fr) minmax(0, 507fr); gap: clamp(28px, 4.5vw, 64px); align-items: center; }
.gift .ph { border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 766 / 530; background: #ddd; }
.gift .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 40% 50%; }
.gift-copy { max-width: 482px; }
.gift-copy > .lead-p { margin: 22px 0 18px; font-size: 1.12rem; line-height: 1.55; color: #222; }
.boxes { margin: 0 0 22px; padding: 0; display: grid; gap: 0; }
.boxes div { display: flex; justify-content: space-between; gap: 16px; font-size: 1rem; padding: 4px 0; }
.boxes dt { color: #222; } .boxes dd { margin: 0; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.gift-copy .note { margin-top: 14px; max-width: 420px; }
.builder { margin-top: 26px; display: grid; gap: 20px; background: var(--surface); border-radius: var(--r-lg); padding: 22px; }
.builder[hidden] { display: none; }
.fld > label, .fld > .lbl { display: block; font-size: .9rem; font-weight: 600; margin-bottom: 8px; }
.sel-wrap { position: relative; }
.sel-wrap select { width: 100%; min-height: 50px; appearance: none; border: 0; border-radius: 999px; background: #fff; padding-block: 0; padding-inline: 20px 44px; font-size: 1rem; }
.sel-wrap svg { position: absolute; inset-inline-end: 18px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); pointer-events: none; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #fff; font-size: .9rem; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.opt small { color: var(--fg-2); font-weight: 400; }
.opt[aria-checked="true"] { background: var(--fg); color: #fff; }
.opt[aria-checked="true"] small { color: rgba(255,255,255,.78); }
.opt[aria-disabled="true"] { color: #5f5f5b; background: transparent; box-shadow: inset 0 0 0 1px rgba(20,20,20,.22); }
.seal-dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.seal-dot svg { width: 14px; height: 14px; }
.fld textarea { width: 100%; min-height: 84px; border: 0; border-radius: 16px; background: #fff; padding: 12px 16px; resize: vertical; font-size: 1rem; line-height: 1.5; }
.fld .cnt { margin: 6px 0 0; font-size: .82rem; color: var(--fg-2); }
.gift-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.gift-total b { font-family: var(--display); font-size: 1.6rem; }
.err { color: var(--error); font-size: .88rem; margin: 6px 0 0; min-height: 0; }
.err:empty { display: none; }
@media (max-width: 900px) { .gift { grid-template-columns: 1fr; } .gift-copy { max-width: none; } .gift-copy > .lead-p { font-size: 1.02rem; } }

/* footer */
.footer { padding-block: clamp(40px, 7vw, 100px) 28px; }
.f-top { display: grid; grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(0, .58fr)); gap: 30px 24px; align-items: start; }
.news form { display: flex; gap: 8px; margin-top: 18px; max-width: 460px; }

<script src="store.js"></script>
<script src="brand/asala-catalog.js"></script>
<script>
(function () {
  var S = window.Store, A = window.ASALA;
  A.install(S);
  var KEY = 'asala-fig-c';
  ['mk-tile', 'mk-ok'].forEach(function (id) { document.getElementById(id).innerHTML = A.MARK; });

  var ORDER = ['dome', 'dome-teal', 'lotus', 'horseshoe', 'branch', 'arcs', 'mihrab'];
  var PAT_IMG = { geometric: 'brand/dome-render.jpg', star: 'brand/pat-star.jpg', mashrabiya: 'brand/pat-mashrabiya.jpg', tatreez: 'brand/pat-tatreez.jpg' };
  var MAT_SW = { A: 'brand/fin-gold-shiny.jpg', B: 'brand/fin-silver-matte.jpg', C: 'brand/fin-gold-matte.jpg' };
  var GALLERY = { dome: ['brand/dome-render.jpg', 'brand/dome-worn.jpg', 'brand/dome-stone.jpg'], horseshoe: ['brand/horseshoe-close.jpg', 'brand/woman-arch.jpg'], 'dome-teal': ['brand/dome-teal.jpg', 'brand/sketch-plan.jpg'] };
  var TINT = 'grayscale(1) brightness(1.07) contrast(1.06)';
  var filter = 'all', dome = { pattern: 'geometric', mat: 'A' };
  var gift = { piece: 'dome-teal', box: 'ring', seal: 'red', msg: '', touched: false };
  var BOX_ORDER = ['ring', 'necklace', 'bracelet', 'gift'];
  var ARROW = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  function $(id) { return document.getElementById(id); }
  function L(o) { return o[S.lang()]; }
  function other(o) { return o[S.lang() === 'ar' ? 'en' : 'ar']; }
  function mat() { return A.MATERIALS.filter(function (m) { return m.id === dome.mat; })[0]; }
  function pat() { return A.PATTERNS.filter(function (p) { return p.id === dome.pattern; })[0]; }
  function domeFilter() { return mat().tone === 'silver' ? TINT : 'none'; }
  function box(id) { return A.BOXES.filter(function (b) { return b.id === id; })[0]; }
  function seal(id) { return A.SEALS.filter(function (s) { return s.id === id; })[0]; }

  // ---------- catalogue ----------
  function matches(p) {
    if (filter === 'all') return true;
    if (filter === 'u100') return p.price < 100;
    if (filter.indexOf('coll:') === 0) return p.coll === filter.slice(5);
    return p.cat === filter;
  }
  function chipName(c) {
    return { all: S.t('c_all'), earrings: S.t('n_earrings'), necklace: S.t('n_necklaces'), u100: S.t('c_u100'), 'coll:dome': S.t('n_dome'), 'coll:najma': S.t('n_najma') }[c];
  }
  function card(p) {
    var nameAlt = other(p), altCls = S.lang() === 'ar' ? 'en' : 'ar';
    return '<li class="card"><div class="ph' + (p.cutout ? ' cut' : '') + '"><img src="' + p.photo + '" alt=""></div>' +
      '<button class="open" type="button" data-open="' + p.id + '" aria-label="' + S.esc(S.name(p) + ', ' + (p.configurable ? S.t('from') + ' ' : '') + S.money(p.price)) + '"></button>' +
      '<div class="row"><span>' + S.esc(S.name(p)) + '</span><span class="price">' + S.money(p.price) + '</span></div>' +
      '<p class="alt ' + altCls + '" lang="' + (S.lang() === 'ar' ? 'en' : 'ar') + '">' + S.esc(nameAlt) + '</p></li>';
  }
  function renderCatalog() {
    var chips = ['all', 'earrings', 'necklace', 'u100'];
    if (filter.indexOf('coll:') === 0) chips.push(filter);
    $('chips').innerHTML = chips.map(function (c) { return '<button class="chip" type="button" data-chip="' + c + '" aria-pressed="' + (c === filter) + '">' + S.esc(chipName(c)) + '</button>'; }).join('');
    var items = S.PRODUCTS.filter(matches).sort(function (a, b) { return ORDER.indexOf(a.id) - ORDER.indexOf(b.id); });
    $('grid').innerHTML = items.length ? items.map(card).join('') : '<li class="none">' + S.esc(S.t('none')) + '</li>';
    $('count-txt').textContent = S.t('showing', { f: chipName(filter), n: items.length });
    S.$$('.nav [data-jump]').forEach(function (b) { b.setAttribute('aria-current', String(b.getAttribute('data-jump') === filter)); });
  }

  // ---------- the Dome configurator ----------
  function renderPats() {
    $('pats').innerHTML = A.PATTERNS.map(function (p) {
      return '<button class="pat" type="button" role="radio" data-pat="' + p.id + '" aria-checked="' + (p.id === dome.pattern) + '" aria-label="' + S.esc(L(p)) + '"><img src="' + PAT_IMG[p.id] + '" alt=""><span class="tick">' + CHECK + '</span><span class="chip-on">' + S.esc(S.t('p_' + p.id)) + '</span></button>';
    }).join('');
    var mats = A.MATERIALS.map(function (m) {
      return '<button class="mat" type="button" role="radio" data-mat="' + m.id + '" aria-checked="' + (m.id === dome.mat) + '"><span class="sw" style="background-image:url(' + MAT_SW[m.id] + ')"></span><span><b>' + S.esc(L(m)) + '</b><small>' + S.esc(S.lang() === 'ar' ? m.nAr : m.nEn) + '</small></span><span class="pr">' + S.money(m.price) + '</span></button>';
    }).join('');
    $('mats').innerHTML = mats; $('sh-mats').innerHTML = mats;
    $('sh-pats').innerHTML = A.PATTERNS.map(function (p) {
      return '<button class="sh-pat" type="button" role="radio" data-pat="' + p.id + '" aria-checked="' + (p.id === dome.pattern) + '" aria-label="' + S.esc(L(p)) + '"><img src="' + PAT_IMG[p.id] + '" alt=""></button>';
    }).join('');
    updateDome();
  }
  function updateDome() {
    var m = mat(), p = pat();
    S.$$('[data-pat]').forEach(function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-pat') === dome.pattern)); b.tabIndex = b.getAttribute('data-pat') === dome.pattern ? 0 : -1; });
    S.$$('[data-mat]').forEach(function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-mat') === dome.mat)); b.tabIndex = b.getAttribute('data-mat') === dome.mat ? 0 : -1; });
    S.$$('.pat img').forEach(function (img) { img.style.filter = domeFilter(); });
    $('pat-sel').textContent = S.t('chosen') + ': ' + L(p);
    $('cfg-img').src = PAT_IMG[dome.pattern]; $('cfg-img').style.filter = domeFilter();
    $('cfg-t').textContent = S.name(S.byId('dome'));
    $('cfg-s').textContent = L(p) + ' · ' + L(m);
    $('cfg-price').textContent = S.money(m.price);
    $('sh-pat-name').textContent = L(p);
    var cur = S.current();
    if (cur && cur.id === 'dome' && document.querySelector('[data-sheet].is-open')) {
      $('sheet-price').textContent = S.money(m.price);
      var ph = document.querySelector('[data-sheet-photo]'); ph.src = PAT_IMG[dome.pattern]; ph.style.filter = domeFilter();
      var t0 = document.querySelector('#thumbs button'); if (t0) { t0.setAttribute('data-thumb', PAT_IMG[dome.pattern]); t0.querySelector('img').src = PAT_IMG[dome.pattern]; }
      S.$$('#thumbs button').forEach(function (b, i) { b.setAttribute('aria-pressed', String(i === 0)); });
    }
  }
  function addDome() {
    var m = mat(), p = pat();
    S.add('dome', m.tone, '', { meta: L(p) + ' · ' + L(m), photo: PAT_IMG[dome.pattern], price: m.price, noTone: true });
  }
  function openCfg(focus) {
    $('cfg').hidden = false; $('design-pair').setAttribute('aria-expanded', 'true');
    if (focus) { var r = document.querySelector('#mats [aria-checked="true"]'); if (r) setTimeout(function () { r.focus({ preventScroll: true }); }, 400); }
  }

  // ---------- gift box builder ----------
  function boxFits(id, p) { if (id === 'gift') return true; if (id === 'bracelet') return false; return p.cat === 'necklace' ? id === 'necklace' : id === 'ring'; }
  function renderBoxTable() {
    $('box-table').innerHTML = BOX_ORDER.map(function (id) { var b = box(id); return '<div><dt>' + S.esc(L(b)) + '</dt><dd>' + (b.price ? '+' + S.money(b.price) : S.esc(S.t('included'))) + '</dd></div>'; }).join('');
  }
  function renderBuilder() {
    $('g-piece').innerHTML = ORDER.map(function (id) { var p = S.byId(id); return '<option value="' + id + '"' + (id === gift.piece ? ' selected' : '') + '>' + S.esc(S.name(p)) + ' · ' + (p.configurable ? S.esc(S.t('from')) + ' ' : '') + S.money(p.price) + '</option>'; }).join('');
    var p = S.byId(gift.piece);
    $('g-boxes').innerHTML = BOX_ORDER.map(function (id) {
      var b = box(id), fits = boxFits(id, p);
      return '<button class="opt" type="button" role="radio" data-gbox="' + id + '" aria-checked="' + (id === gift.box) + '" tabindex="' + (id === gift.box ? 0 : -1) + '"' + (fits ? '' : ' aria-disabled="true"') + '>' + S.esc(L(b)) + ' <small>' + (fits ? (b.price ? '+' + S.money(b.price) : S.esc(S.t('included'))) : S.esc(S.t('not_fit'))) + '</small></button>';
    }).join('');
    $('g-seals').innerHTML = A.SEALS.map(function (s) {
      return '<button class="opt" type="button" role="radio" data-gseal="' + s.id + '" aria-checked="' + (s.id === gift.seal) + '" tabindex="' + (s.id === gift.seal ? 0 : -1) + '"><span class="seal-dot" style="background:' + s.color + ';color:' + s.ink + '">' + A.MARK + '</span>' + S.esc(L(s)) + '</button>';
    }).join('');
    $('g-msg').setAttribute('placeholder', S.t('g_default'));
    updateGift();
  }
  function updateGift() {
    var p = S.byId(gift.piece), b = box(gift.box);
    $('g-total').textContent = S.money(p.price + b.price);
    var n = gift.msg.length;
    $('g-cnt').textContent = S.lang() === 'ar' ? n + ' من 120 حرفاً' : n + ' of 120 characters';
  }
  function openBuilder(focus) {
    $('builder').hidden = false; $('build-btn').setAttribute('aria-expanded', 'true');
    if (focus) setTimeout(function () { $('g-piece').focus({ preventScroll: true }); }, 450);
  }
  function addGift() {
    var p = S.byId(gift.piece), b = box(gift.box), s = seal(gift.seal);
    var msg = gift.msg.trim() || S.t('g_default');
    var meta = [S.t('g_word'), L(b), L(s), '«' + msg.slice(0, 40) + (msg.length > 40 ? '…' : '') + '»'];
    if (p.configurable) meta.splice(1, 0, L(pat()) + ' · ' + L(mat()));
    var price = (p.configurable ? mat().price : p.price) + b.price;
    S.add(p.id, p.configurable ? mat().tone : p.tones[0], '', { meta: meta.join(' · '), price: price, photo: p.configurable ? PAT_IMG[dome.pattern] : (p.cutout ? '' : p.photo), noTone: true });
  }

  // ---------- footer info ----------
  var infoOpen = '';
  function infoHTML(k) {
    if (k === 'delivery') {
      var zones = {};
      S.CITIES.forEach(function (c) { (zones[c.fee] = zones[c.fee] || []).push(c[S.lang()]); });
      return '<p>' + S.esc(S.t('i_delivery')) + '</p><ul>' + Object.keys(zones).map(function (f) { return '<li>' + S.esc(zones[f].join(S.lang() === 'ar' ? '، ' : ', ')) + ': ' + S.money(Number(f)) + '</li>'; }).join('') + '</ul>';
    }
    return '<p>' + S.esc(S.t('i_' + k)) + '</p>';
  }
  function showInfo(k, scroll) {
    infoOpen = infoOpen === k && !scroll ? '' : k;
    var box = $('info');
    box.hidden = !infoOpen;
    S.$$('[data-info]').forEach(function (b) { b.setAttribute('aria-expanded', String(b.getAttribute('data-info') === infoOpen)); });
    if (!infoOpen) return;
    $('info-h').textContent = S.t('ih_' + k);
    $('info-body').innerHTML = infoHTML(k);
    if (scroll) { box.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(function () { box.focus({ preventScroll: true }); }, 500); }
  }

  // ---------- marquee ----------
  function renderMarquee() {
    var items = ['mq1', 'mq2', 'mq3', 'mq4'].map(function (k) { return '<li>' + S.esc(S.t(k)) + '</li>'; }).join('');
    $('mq-a').innerHTML = items + items; $('mq-b').innerHTML = items + items;
    setMq($('marquee').classList.contains('paused'));
  }
  function setMq(paused) {
    var b = $('mq-toggle');
    $('marquee').classList.toggle('paused', paused);
    b.setAttribute('aria-pressed', String(paused));
    b.setAttribute('aria-label', S.t(paused ? 'mq_play' : 'mq_pause'));
    b.innerHTML = paused ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  }
  $('mq-toggle').addEventListener('click', function () { setMq(!$('marquee').classList.contains('paused')); });

  // ---------- search + menus ----------
  function search() {
    var q = $('q').value.trim().toLowerCase(), out = $('results');
    if (!q) { out.innerHTML = ''; return; }
    var hits = S.PRODUCTS.filter(function (p) { return (p.ar + ' ' + p.en + ' ' + p.dAr + ' ' + p.dEn + ' ' + S.CATS[p.cat].ar + ' ' + S.CATS[p.cat].en).toLowerCase().indexOf(q) > -1; });
    out.innerHTML = hits.length ? hits.map(function (p) {
      return '<li><button type="button" data-open="' + p.id + '"><img src="' + p.photo + '" alt=""' + (p.cutout ? ' style="object-fit:contain"' : '') + '><span>' + S.esc(S.name(p)) + '</span><span>' + S.money(p.price) + '</span></button></li>';
    }).join('') : '<li class="none">' + S.esc(S.t('no_results')) + '</li>';
  }
  function toggle(btnId, panelId, force) {
    var b = $(btnId), p = $(panelId), open = force === undefined ? p.hidden : force;
    p.hidden = !open; b.setAttribute('aria-expanded', String(open));
    if (open && panelId === 'search-bar') $('q').focus();
  }
  $('q').addEventListener('input', search);
  $('search-btn').addEventListener('click', function () { toggle('burger', 'mobile-menu', false); toggle('search-btn', 'search-bar'); });
  $('burger').addEventListener('click', function () { toggle('search-btn', 'search-bar', false); toggle('burger', 'mobile-menu'); });
  function closeMenus() { toggle('burger', 'mobile-menu', false); toggle('search-btn', 'search-bar', false); }
  function go(id) { var el = $(id); if (el) el.scrollIntoView({ behavior: 'smooth' }); }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var b;
    if ((b = e.target.closest('[data-jump]'))) { filter = b.getAttribute('data-jump'); renderCatalog(); closeMenus(); go('pieces'); return; }
    if ((b = e.target.closest('[data-go]'))) { closeMenus(); go(b.getAttribute('data-go')); return; }
    if ((b = e.target.closest('[data-chip]'))) { filter = b.getAttribute('data-chip'); renderCatalog(); var nb = document.querySelector('[data-chip="' + filter + '"]'); if (nb) nb.focus(); return; }
    if ((b = e.target.closest('[data-design]'))) { closeMenus(); openCfg(true); go('lattice'); return; }
    if (e.target.closest('#design-pair')) { var open = $('cfg').hidden; if (open) openCfg(true); else { $('cfg').hidden = true; $('design-pair').setAttribute('aria-expanded', 'false'); } return; }
    if ((b = e.target.closest('[data-pat]'))) { dome.pattern = b.getAttribute('data-pat'); updateDome(); return; }
    if ((b = e.target.closest('[data-mat]'))) { dome.mat = b.getAttribute('data-mat'); updateDome(); return; }
    if (e.target.closest('#cfg-add')) { addDome(); return; }
    if ((b = e.target.closest('[data-build-gift]'))) {
      if (b.id === 'build-btn' && !$('builder').hidden) { $('builder').hidden = true; b.setAttribute('aria-expanded', 'false'); return; }
      openBuilder(true); if (b.id !== 'build-btn') go('gift'); return;
    }
    if ((b = e.target.closest('[data-gbox]'))) {
      if (b.getAttribute('aria-disabled') === 'true') { $('g-err').textContent = S.t(b.getAttribute('data-gbox') === 'bracelet' ? 'g_no_bracelet' : 'g_not_fit'); return; }
      $('g-err').textContent = ''; gift.box = b.getAttribute('data-gbox'); renderBuilder(); document.querySelector('[data-gbox="' + gift.box + '"]').focus(); return;
    }
    if ((b = e.target.closest('[data-gseal]'))) { gift.seal = b.getAttribute('data-gseal'); renderBuilder(); document.querySelector('[data-gseal="' + gift.seal + '"]').focus(); return; }
    if (e.target.closest('#g-add')) { addGift(); return; }
    if ((b = e.target.closest('[data-info]'))) { showInfo(b.getAttribute('data-info')); return; }
    if ((b = e.target.closest('[data-info-open]'))) { closeMenus(); showInfo(b.getAttribute('data-info-open'), true); return; }
    if (e.target.closest('.results button')) { toggle('search-btn', 'search-bar', false); return; }
    if ((b = e.target.closest('[data-thumb]'))) {
      var ph = document.querySelector('[data-sheet-photo]'), cur = S.current(), first = b === document.querySelector('#thumbs button');
      ph.src = b.getAttribute('data-thumb'); ph.style.filter = cur && cur.id === 'dome' && first ? domeFilter() : 'none';
      S.$$('[data-thumb]').forEach(function (t) { t.setAttribute('aria-pressed', String(t === b)); }); return;
    }
  });
  $('g-piece').addEventListener('change', function (e) {
    gift.piece = e.target.value; var p = S.byId(gift.piece);
    if (!boxFits(gift.box, p)) gift.box = p.cat === 'necklace' ? 'necklace' : 'ring';
    $('g-err').textContent = ''; renderBuilder();
  });
  $('g-msg').addEventListener('input', function (e) { gift.msg = e.target.value; updateGift(); });
  // Arrow keys move through each radio group (pattern cards, materials, boxes, seals)
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { var wasMenu = !$('mobile-menu').hidden, wasSearch = !$('search-bar').hidden; closeMenus(); if (wasMenu) $('burger').focus(); else if (wasSearch) $('search-btn').focus(); return; }
    var r = e.target.closest && e.target.closest('[role="radio"][data-pat], [role="radio"][data-mat], [data-gbox], [data-gseal]');
    if (!r || ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) < 0) return;
    e.preventDefault();
