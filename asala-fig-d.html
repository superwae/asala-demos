<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Asala Modern Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Jost:wght@300;400;500&family=Alexandria:wght@300;400;500&display=swap">
<style>
/* Direction D, "Modern night", from the teammate's Figma: near-black page, cream type, gold accent for the Arabic
   lines and the main buttons, brand red for "Add to bag". Michroma display, Jost light body, Alexandria for Arabic.
   Square buttons, an arch-topped spotlight carousel, collection tiles, the sketch-to-ear story and the red-seal pouch.
   Built as a working store on the shared engine: carousel through the catalogue, Dome options, gift builder, bag, COD checkout. */
:root {
  --bg: #121212; --bg-2: #1c1c19; --bg-3: #262622; --card: #f0eeea; --fg: #efe9df; --fg-2: #b9b4ab; --fg-3: #9a958c;
  --line: rgba(239,233,223,.14); --edge: rgba(239,233,223,.4);
  --gold: #c9a45c; --gold-2: #d8b670; --on-gold: #121212; --red: #c6383c; --red-2: #b02f33; --on-red: #ffffff; --error: #ff8f86;
  --display: "Michroma", "Jost", system-ui, sans-serif; --body: "Jost", system-ui, sans-serif; --arabic: "Alexandria", "Jost", sans-serif;
  --gutter: clamp(16px, 3.4vw, 48px); --page: 1440px;
  --jewel-shadow: rgba(0,0,0,.5);
  color-scheme: dark;
}
html[lang="ar"] { --display: "Alexandria", system-ui, sans-serif; --body: "Alexandria", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html.panel-open { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 300 1rem/1.65 var(--body); -webkit-font-smoothing: antialiased; overflow-x: clip; }
html[lang="ar"] body { font-weight: 300; }
::selection { background: var(--gold); color: var(--on-gold); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
img { display: block; max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.page { max-width: var(--page); margin: 0 auto; padding-inline: var(--gutter); }
section[id] { scroll-margin-top: 80px; }
::placeholder { color: #8f8a82; opacity: 1; }
.ar { font-family: var(--arabic); }
.en { font-family: "Jost", system-ui, sans-serif; }
.gold-line { color: var(--gold); margin: 0; font-weight: 300; }
.arrow { width: 18px; height: 18px; flex: none; }
[dir="rtl"] .arrow { transform: scaleX(-1); }
.skip { position: absolute; inset-inline-start: 12px; top: -60px; z-index: 90; background: var(--gold); color: var(--on-gold); padding: 10px 16px; text-decoration: none; }
.skip:focus { top: 12px; }

/* buttons: square, like the Figma */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 30px; border: 0; border-radius: 0; font-family: "Jost", sans-serif; font-weight: 500; font-size: 1.05rem; letter-spacing: .005em; text-decoration: none; transition: background-color .2s, color .2s, transform .2s cubic-bezier(.2,.8,.2,1); }
html[lang="ar"] .btn { font-family: var(--arabic); font-weight: 400; }
.btn:active { transform: scale(.985); }
.btn.gold { background: var(--gold); color: var(--on-gold); }
.btn.gold:hover { background: var(--gold-2); }
.btn.dark { background: var(--bg-3); color: var(--fg); }
.btn.dark:hover { background: #33332e; }
.btn.red { background: var(--red); color: var(--on-red); }
.btn.red:hover { background: var(--red-2); }
.btn.full { width: 100%; }
.text-btn { background: none; border: 0; min-height: 44px; padding: 0 4px; color: var(--fg-2); text-decoration: underline; text-underline-offset: 4px; }

/* header */
.header { position: sticky; top: 0; z-index: 30; background: var(--bg); }
.header .page { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 88px; gap: 16px; }
.nav { display: flex; gap: 4px; margin-inline-start: -10px; }
.nav button, .tools button { background: none; border: 0; min-height: 44px; min-width: 44px; padding: 0 10px; font-size: 1.04rem; font-weight: 300; color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.nav button:hover, .tools button:hover { color: #fff; text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }
.logo { display: inline-flex; align-items: center; min-height: 44px; }
.logo img { height: 23px; width: auto; max-width: none; }
.tools { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-inline-end: -10px; }
.tools .lang { font-family: var(--arabic); }
html[lang="ar"] .tools .lang { font-family: "Jost", sans-serif; }
.paren { font-variant-numeric: tabular-nums; }
.paren:has([data-cart-count][hidden]) { display: none; }
.burger { display: none !important; }
.tools svg { width: 22px; height: 22px; }
.ico-only { display: none !important; }
.mobile-menu { display: grid; padding: 4px var(--gutter) 18px; border-top: 1px solid var(--line); }
.mobile-menu button { text-align: start; background: none; border: 0; border-bottom: 1px solid var(--line); min-height: 52px; font-size: 1.1rem; font-weight: 300; }
@media (max-width: 900px) {
  .nav { display: none; }
  .burger { display: inline-flex !important; }
  .header .page { grid-template-columns: auto 1fr auto; min-height: 64px; gap: 4px; }
  .logo { justify-self: center; }
  .logo img { height: 17px; }
  .tools .txt { display: none; }
  .tools .ico-only { display: inline-flex !important; }
  .tools .paren { position: absolute; top: 4px; inset-inline-end: 0; min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); color: #fff; font-size: .72rem; font-weight: 500; display: grid; place-items: center; padding: 0 5px; }
  .tools .paren .p { display: none; }
  .tools [data-open-cart] { position: relative; }
}

/* hero */
.hero { display: grid; grid-template-columns: 1fr 1fr; min-height: min(845px, calc(100vh - 88px)); }
.hero-copy { display: grid; align-content: center; justify-items: start; gap: 0; padding-block: 60px; padding-inline: var(--gutter) 40px; max-width: 760px; }
.hero-copy .gold-line { font-family: var(--arabic); font-size: clamp(1.5rem, 2.2vw, 1.95rem); line-height: 1.4; }
html[lang="ar"] .hero-copy .gold-line { font-family: "Jost", sans-serif; letter-spacing: .02em; }
.h-xl { font-family: var(--display); font-weight: 400; font-size: clamp(2.1rem, 4.4vw, 4rem); line-height: 1.15; letter-spacing: .005em; margin: 14px 0 28px; }
html[lang="ar"] .h-xl { font-weight: 400; line-height: 1.35; letter-spacing: 0; font-size: clamp(2.2rem, 4vw, 3.6rem); }
.hero-copy p.lead { margin: 0 0 40px; font-size: 1.12rem; line-height: 1.7; color: var(--fg-2); max-width: 432px; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
.hero-ph { position: relative; overflow: hidden; background: #1b262b; }
.hero-ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; min-height: 0; }
  .hero-copy { padding: 40px var(--gutter) 40px; }
  .h-xl { margin: 8px 0 18px; }
  .hero-copy p.lead { margin-bottom: 28px; font-size: 1.05rem; }
  .btn-row { width: 100%; }
  .btn-row .btn { flex: 1 1 160px; }
  .hero-ph { aspect-ratio: 4 / 4.6; }
}

/* spotlight carousel */
.spot { padding-block: clamp(80px, 11vw, 160px); }
.spot .page { display: grid; grid-template-columns: minmax(0, 600fr) minmax(0, 648fr); gap: clamp(28px, 6.7vw, 96px); align-items: center; }
.arch { position: relative; aspect-ratio: 600 / 776; border-radius: 999px 999px 0 0; overflow: hidden; background: var(--card); touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.arch img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
.arch img.cut { object-fit: contain; padding: 16%; }
.arch img.fit { object-fit: contain; padding: 4%; transform: scale(1.15); }
.slide-in { animation: slide-in .6s cubic-bezier(.16,1,.3,1); }
.slide-in-back { animation: slide-in-back .6s cubic-bezier(.16,1,.3,1); }
@keyframes slide-in { from { opacity: 0; transform: translateX(28px); } }
@keyframes slide-in-back { from { opacity: 0; transform: translateX(-28px); } }
[dir="rtl"] .slide-in { animation-name: slide-in-back; }
[dir="rtl"] .slide-in-back { animation-name: slide-in; }
.fade-in { animation: fade-in .7s cubic-bezier(.16,1,.3,1); }
@keyframes fade-in { from { opacity: 0; transform: scale(1.03); } }
.spot-info { max-width: 462px; }
.spot-label { margin: 0 0 18px; font-size: .95rem; color: var(--fg-2); }
.spot-name { font-family: var(--display); font-weight: 400; font-size: clamp(1.7rem, 2.9vw, 2.55rem); line-height: 1.16; letter-spacing: .005em; margin: 0; }
html[lang="ar"] .spot-name { line-height: 1.4; letter-spacing: 0; }
.spot-alt { margin: 4px 0 0; font-size: clamp(1.25rem, 1.8vw, 1.6rem); line-height: 1.4; }
.spot-desc { margin: 26px 0 0; font-size: 1.06rem; line-height: 1.65; color: var(--fg-2); }
.spot-price { font-family: var(--display); font-size: clamp(1.5rem, 2vw, 1.7rem); margin: 30px 0 0; font-variant-numeric: tabular-nums; }
html[lang="ar"] .spot-price { font-family: "Michroma", var(--arabic); }
.spot-meta { margin: 4px 0 0; color: var(--fg-3); font-size: .95rem; }
.spot-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
.spot-ctrl { display: flex; align-items: center; gap: 22px; margin-top: 54px; }
.round { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--bg-3); color: var(--fg); display: grid; place-items: center; transition: background-color .2s; }
.round:hover { background: #34342f; }
.dots { display: flex; gap: 0; }
.dot { width: 32px; height: 44px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
.dot span { width: 9px; height: 9px; border-radius: 50%; background: #7a766d; transition: background-color .2s, transform .3s cubic-bezier(.16,1,.3,1); }
.dot:hover span { background: #a09b90; }
.dot[aria-current="true"] span { background: var(--gold); transform: scale(1.15); }
@media (max-width: 900px) {
  .spot .page { grid-template-columns: 1fr; gap: 28px; }
  .arch { max-width: 480px; width: 100%; margin-inline: auto; aspect-ratio: 5 / 5.8; }
  .spot-info { max-width: none; }
  .spot-desc { margin-top: 16px; font-size: 1rem; }
  .spot-price { margin-top: 18px; }
  .spot-btns { margin-top: 20px; }
  .spot-btns .btn { flex: 1 1 140px; }
  .spot-ctrl { margin-top: 28px; gap: 8px; justify-content: space-between; }
  .dot { width: 26px; }
}
.counter { display: none; margin: 0; font-family: "Michroma", sans-serif; font-size: .95rem; color: var(--fg-2); font-variant-numeric: tabular-nums; }
@media (max-width: 520px) {
  .dots { display: none; }
  .counter { display: block; }
}

/* collections */
.colls { padding-bottom: clamp(70px, 10vw, 150px); }
.colls .page { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.coll { position: relative; display: block; aspect-ratio: 650 / 694; overflow: hidden; border: 0; padding: 0; background: #222; color: #fff; text-align: start; isolation: isolate; }
.coll img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform 1s cubic-bezier(.16,1,.3,1); }
.coll::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(10,10,10,.82) 0%, rgba(10,10,10,.45) 26%, rgba(10,10,10,0) 52%); }
@media (hover: hover) { .coll:hover img { transform: scale(1.035); } }
.coll .txt { position: absolute; inset-inline: 32px; bottom: 44px; display: grid; gap: 4px; }
.coll b { font-family: var(--display); font-weight: 400; font-size: clamp(1.5rem, 2.3vw, 2.05rem); line-height: 1.2; display: inline-flex; align-items: center; gap: 14px; }
.coll .arrow { opacity: 0; transform: translateX(-6px); transition: opacity .3s, transform .4s cubic-bezier(.16,1,.3,1); }
@media (hover: hover) { .coll:hover .arrow { opacity: 1; transform: none; } [dir="rtl"] .coll:hover .arrow { transform: scaleX(-1); } }
.coll .txt > span { font-size: 1.05rem; color: rgba(255,255,255,.86); }
@media (max-width: 760px) { .colls .page { grid-template-columns: 1fr; gap: 14px; } .coll { aspect-ratio: 4 / 4.2; } .coll .txt { inset-inline: 20px; bottom: 22px; } }

/* sketch to ear */
.steps { background: var(--bg-2); padding-block: clamp(70px, 10vw, 145px) clamp(70px, 9vw, 140px); }
.h-lg { font-family: var(--display); font-weight: 400; font-size: clamp(1.75rem, 3.05vw, 2.7rem); line-height: 1.2; letter-spacing: .005em; margin: 0; max-width: 820px; }
html[lang="ar"] .h-lg { line-height: 1.45; letter-spacing: 0; }
.step-grid { list-style: none; margin: 64px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.step .ph { aspect-ratio: 313 / 443; overflow: hidden; background: #efefef; }
.step .ph img { width: 100%; height: 100%; object-fit: cover; }
.step h3 { margin: 30px 0 0; font-weight: 500; font-size: 1.12rem; line-height: 1.4; }
.step p { margin: 8px 0 0; color: var(--fg-2); font-size: 1rem; }
@media (max-width: 900px) { .step-grid { grid-template-columns: 1fr 1fr; gap: 28px 14px; margin-top: 36px; } .step h3 { margin-top: 14px; } }

/* pouch */
.pouch { position: relative; min-height: clamp(520px, 54vw, 790px); display: grid; align-items: center; overflow: hidden; isolation: isolate; background: #1a1a1a; }
.pouch > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; z-index: -2; }
.pouch::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(14,14,14,.82) 0%, rgba(14,14,14,.55) 34%, rgba(14,14,14,.18) 62%, rgba(14,14,14,.05) 100%), rgba(10,10,10,.22); }
.pouch .page { width: 100%; }
.pouch-copy { max-width: 600px; display: grid; justify-items: start; }
.pouch-copy .ar-line { font-family: var(--arabic); font-size: clamp(1.7rem, 2.6vw, 2.35rem); line-height: 1.4; margin: 0; font-weight: 300; color: #fff; }
html[lang="ar"] .pouch-copy .ar-line { font-family: "Jost", sans-serif; font-size: clamp(1.4rem, 2vw, 1.8rem); }
.pouch-copy h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 3.1vw, 2.8rem); line-height: 1.12; margin: 14px 0 0; color: #fff; }
html[lang="ar"] .pouch-copy h2 { line-height: 1.4; }
.pouch-copy p { margin: 12px 0 0; font-size: 1.12rem; color: rgba(255,255,255,.85); }
.pouch-copy .btn { margin-top: 30px; }
.pouch-copy small { display: block; margin-top: 14px; color: rgba(255,255,255,.72); font-size: .86rem; }
@media (max-width: 760px) {
  .pouch { min-height: 0; display: block; background: var(--bg); }
  .pouch > img { position: relative; height: auto; aspect-ratio: 4 / 3; object-position: 58% 50%; z-index: 0; }
  .pouch::after { display: none; }
  .pouch .page { padding-block: 26px 10px; }
}

/* gift builder */
.builder { background: var(--bg-2); padding-block: clamp(50px, 7vw, 100px); }
.builder[hidden] { display: none; }
.builder .page { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(28px, 5vw, 80px); align-items: start; }
.b-preview { position: sticky; top: 100px; display: grid; gap: 18px; }
.b-card { position: relative; background: #f3eee4; color: #2a2925; padding: 44px 40px 40px; min-height: 280px; display: grid; align-content: space-between; gap: 24px; box-shadow: 0 24px 50px rgba(0,0,0,.4); }
.b-card .msg { margin: 0; font-size: 1.3rem; line-height: 1.55; font-weight: 300; overflow-wrap: anywhere; }
.b-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.b-card .foot img { height: 13px; width: auto; }
.b-seal { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 6px 14px rgba(0,0,0,.25), inset 0 0 0 3px rgba(255,255,255,.15); flex: none; }
.b-seal svg { width: 36px; height: 36px; }
.b-sum { display: flex; gap: 14px; align-items: center; color: var(--fg-2); font-size: .98rem; }
.b-sum img { width: 64px; height: 64px; object-fit: cover; background: var(--card); flex: none; }
.b-sum img.cut { object-fit: contain; padding: 6px; }
.b-sum b { display: block; color: var(--fg); font-weight: 400; }
.b-form { display: grid; gap: 26px; }
.b-form h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.5rem, 2.3vw, 2rem); line-height: 1.25; margin: 0; }
html[lang="ar"] .b-form h2 { line-height: 1.5; }
.fld > label, .fld > .lbl { display: block; font-size: .95rem; color: var(--fg-2); margin-bottom: 10px; }
.sel-wrap { position: relative; }
.sel-wrap select { width: 100%; min-height: 54px; appearance: none; border: 1px solid var(--edge); border-radius: 0; background: var(--bg); padding-block: 0; padding-inline: 18px 46px; font-size: 1rem; font-weight: 300; }
.sel-wrap svg { position: absolute; inset-inline-end: 18px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); pointer-events: none; }
.rows { display: grid; gap: 0; border-top: 1px solid var(--line); }
.row-opt { display: flex; justify-content: space-between; align-items: center; gap: 14px; min-height: 56px; padding: 0 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: start; font-size: 1.02rem; font-weight: 300; }
.row-opt .r { display: inline-flex; align-items: center; gap: 14px; }
.row-opt .r::before { content: ""; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--edge); flex: none; transition: box-shadow .2s; }
.row-opt[aria-checked="true"] .r::before { box-shadow: inset 0 0 0 5px var(--gold); }
.row-opt small { color: var(--fg-2); font-size: .95rem; font-variant-numeric: tabular-nums; }
.row-opt[aria-disabled="true"] { color: #8f8a82; }
.row-opt[aria-disabled="true"] .r::before { box-shadow: inset 0 0 0 1px rgba(239,233,223,.2); }
.seals { display: flex; gap: 10px; flex-wrap: wrap; }
.seal-opt { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px 0 8px; border: 1px solid var(--line); background: none; font-weight: 300; }
[dir="rtl"] .seal-opt { padding: 0 8px 0 16px; }
.seal-opt .dot2 { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.seal-opt .dot2 svg { width: 18px; height: 18px; }
.seal-opt[aria-checked="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.fld textarea { width: 100%; min-height: 96px; border: 1px solid var(--edge); border-radius: 0; background: var(--bg); padding: 14px 16px; resize: vertical; font-size: 1rem; font-weight: 300; line-height: 1.5; }
.cnt { margin: 6px 0 0; font-size: .85rem; color: var(--fg-3); }
.err { color: var(--error); font-size: .9rem; margin: 8px 0 0; }
.err:empty { display: none; }
.b-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 18px; font-variant-numeric: tabular-nums; }
.b-total b { font-family: var(--display); font-weight: 400; font-size: 1.6rem; }
html[lang="ar"] .b-total b { font-family: "Michroma", var(--arabic); }
.note { margin: 0; color: var(--fg-3); font-size: .88rem; line-height: 1.55; }
@media (max-width: 900px) { .builder .page { grid-template-columns: 1fr; } .b-preview { position: static; } .b-card { padding: 30px 24px 26px; min-height: 220px; } }

/* footer */
.footer { padding-block: clamp(60px, 8vw, 100px) 40px; }
.f-logo img { height: 23px; width: auto; }
.f-top { margin-top: 64px; display: grid; grid-template-columns: minmax(0, 436fr) repeat(3, minmax(0, 255fr)); gap: 30px 24px; align-items: start; }
.f-about { margin: 0; color: var(--fg-2); font-size: 1.05rem; max-width: 26em; }
.f-col { list-style: none; margin: 0; padding: 0; display: grid; }
.f-col button { background: none; border: 0; padding: 0; min-height: 34px; min-width: 44px; text-align: start; font-size: 1rem; font-weight: 300; color: var(--fg-2); }
.f-col button:hover, .f-col button[aria-expanded="true"] { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }
.f-col .lang-l { font-family: var(--arabic); color: var(--fg); }
html[lang="ar"] .f-col .lang-l { font-family: "Jost", sans-serif; }
.info { margin-top: 30px; border: 1px solid var(--line); padding: 22px 24px; display: grid; gap: 8px; max-width: 760px; }
.info[hidden] { display: none; }
.info h3 { margin: 0; font-weight: 500; font-size: 1.05rem; }
.info p, .info ul { margin: 0; color: var(--fg-2); }
.info ul { padding-inline-start: 18px; }
