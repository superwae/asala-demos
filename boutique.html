<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Siwar Clean Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Layout: the category standard, played straight. Announcement bar, centred logo, one product-led hero, category tiles, a sortable grid, a quiet trust row. Follows the viewer's light or dark theme. */
:root {
  --bg: #ffffff; --tile: #f3f1ef; --tile-2: #ebe8e5; --fg: #161514; --muted: #6a6560; --line: #e4e0dc; --edge: #8f8a85;
  --accent: #1f1d1b; --on-accent: #ffffff; --blush: #e9d6cf; --error: #b3261e;
  --f-head: "Noto Kufi Arabic", "Segoe UI", sans-serif;
  --f-body: "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --gutter: clamp(16px, 4vw, 48px);
  --jewel-shadow: rgba(22, 21, 20, .2);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131211; --tile: #1d1b1a; --tile-2: #252321; --fg: #f1eeea; --muted: #a7a09a; --line: #2f2c2a; --edge: #6b6560;
  --accent: #f1eeea; --on-accent: #131211; --blush: #4a3a35; --error: #ff8a80; --jewel-shadow: rgba(0, 0, 0, .55); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131211; --tile: #1d1b1a; --tile-2: #252321; --fg: #f1eeea; --muted: #a7a09a; --line: #2f2c2a; --edge: #6b6560;
  --accent: #f1eeea; --on-accent: #131211; --blush: #4a3a35; --error: #ff8a80; --jewel-shadow: rgba(0, 0, 0, .55); color-scheme: dark; }
* { box-sizing: border-box; }
html.panel-open { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 1rem/1.7 var(--f-body); }
::selection { background: var(--blush); color: var(--fg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: var(--gutter); }

.announce { background: var(--accent); color: var(--on-accent); text-align: center; font-size: .85rem; padding: 8px var(--gutter); margin: 0; }
.demo { color: var(--muted); font-size: .78rem; text-align: center; padding: 6px var(--gutter); margin: 0; border-bottom: 1px solid var(--line); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 68px; gap: 16px; }
.top nav { display: flex; gap: 4px; }
.top nav button { background: none; border: 0; min-height: 44px; padding: 0 10px; font-size: .95rem; color: var(--fg); }
.top nav button:hover { text-decoration: underline; text-underline-offset: 6px; }
.logo { font: 700 1.6rem/1 var(--f-head); color: var(--fg); text-decoration: none; letter-spacing: 0; }
.tools { display: flex; gap: 6px; justify-content: flex-end; }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; min-width: 44px; justify-content: center; padding: 0 10px; background: none; border: 0; }
.icon-btn svg { width: 22px; height: 22px; }
.count { min-width: 20px; height: 20px; border-radius: 10px; padding: 0 5px; background: var(--fg); color: var(--bg); font-size: .72rem; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .top nav { display: none; } .top .wrap { grid-template-columns: auto 1fr auto; } .logo { justify-self: start; grid-column: 1; } .tools { grid-column: 3; } .icon-btn .lbl { display: none; } }

.hero { padding-block: 20px 8px; }
.hero-tile { display: grid; grid-template-columns: 1fr 1fr; background: var(--tile); border-radius: 4px; overflow: hidden; }
.hero-art { position: relative; min-height: 420px; background: var(--tile-2); }
.hero-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.hero-copy { padding: clamp(24px, 5vw, 64px); display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.hero h1 { font: 600 clamp(2rem, 4.2vw, 3.2rem)/1.25 var(--f-head); margin: 0; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); max-width: 40ch; }
.hero .meta { display: flex; align-items: baseline; gap: 12px; }
.hero .meta b { font: 600 1.4rem var(--f-head); font-variant-numeric: tabular-nums; }
.hero .meta span { color: var(--muted); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 28px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn:hover { opacity: .88; }
.btn.line { background: transparent; color: var(--fg); }
@media (max-width: 820px) { .hero-tile { grid-template-columns: 1fr; } .hero-art { min-height: 260px; } }

.sec { padding-block: clamp(34px, 5vw, 64px); }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.sec h2 { font: 600 clamp(1.4rem, 2.6vw, 1.9rem)/1.3 var(--f-head); margin: 0; }
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.cat-tile { position: relative; display: grid; grid-template-rows: 1fr auto; aspect-ratio: 4 / 5; background: var(--tile); border: 0; border-radius: 4px; padding: 0; overflow: hidden; text-align: start; }
.cat-tile .art { position: relative; }
.cat-tile .art { overflow: hidden; }
.cat-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.cat-tile:hover img { transform: scale(1.04); }
.cat-tile span { padding: 14px 16px; font: 500 1.05rem var(--f-head); display: flex; justify-content: space-between; }
@media (max-width: 560px) { .cats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } .cat-tile span { padding: 8px 10px; font-size: .9rem; } }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--edge); background: var(--bg); font-size: .92rem; }
.seg button[aria-pressed="true"] { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.sort { min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--edge); background: var(--bg); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px 16px; }
@media (max-width: 980px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 10px; } }
.prod { display: grid; gap: 8px; }
.prod .img { position: relative; aspect-ratio: 4 / 5; background: var(--tile); border-radius: 4px; border: 0; padding: 0; overflow: hidden; }
.prod .img canvas { position: absolute; inset: 8%; width: 84%; height: 84%; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
.prod .img:hover canvas { transform: scale(1.04); }
.prod .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.prod .img:hover img { transform: scale(1.03); }
.prod .new { position: absolute; top: 10px; inset-inline-start: 10px; background: var(--bg); color: var(--fg); font-size: .72rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
.prod .quick { position: absolute; bottom: 10px; inset-inline: 10px; min-height: 44px; border-radius: 999px; border: 0; background: var(--bg); color: var(--fg); font-weight: 500; font-size: .9rem; opacity: 0; transform: translateY(6px); transition: .25s; }
.prod:hover .quick, .prod .quick:focus-visible { opacity: 1; transform: none; }
@media (hover: none) { .prod .quick { opacity: 1; transform: none; } }
.prod h3 { margin: 0; font: 500 .98rem/1.5 var(--f-body); }
.prod .p { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.swatches { display: flex; gap: 6px; }
.swatches i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }

.trust { border-block: 1px solid var(--line); }
.trust ul { list-style: none; margin: 0; padding: 26px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.trust li { display: flex; gap: 12px; align-items: flex-start; }
.trust svg { width: 26px; height: 26px; flex: none; }
.trust b { display: block; font-weight: 600; } .trust span { color: var(--muted); font-size: .9rem; }
@media (max-width: 720px) { .trust ul { grid-template-columns: 1fr; } }
footer { padding-block: 32px 40px; color: var(--muted); font-size: .9rem; }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
footer b { color: var(--fg); user-select: all; font-weight: 500; font-variant-numeric: tabular-nums; }

/* panels */
.sheet, .drawer { position: fixed; inset: 0; z-index: 50; background: rgba(10, 10, 10, .45); display: flex; opacity: 0; transition: opacity .25s; }
.is-open { opacity: 1; }
.sheet { align-items: center; justify-content: center; padding: 16px; }
.sheet-card { position: relative; width: min(900px, 100%); max-height: calc(100% - 16px); overflow: auto; display: grid; grid-template-columns: 1.1fr 1fr; background: var(--bg); border-radius: 6px; transform: translateY(14px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.is-open .sheet-card { transform: none; }
.sheet-art { position: relative; min-height: 380px; background: var(--tile); }
.sheet-art canvas { position: absolute; inset: 8%; width: 84%; height: 84%; }
.sheet-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sheet-info { padding: 32px 28px; display: flex; flex-direction: column; gap: 12px; }
.sheet-info h2 { font: 600 1.7rem/1.35 var(--f-head); margin: 0; }
.sheet-cat { margin: 0; color: var(--muted); font-size: .85rem; }
.sheet-price { margin: 0; font-size: 1.25rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.sheet-desc { margin: 0; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0; }
legend, .lbl-s { font-size: .88rem; font-weight: 500; margin-bottom: 8px; padding: 0; display: block; }
[data-sheet-tones] { display: flex; gap: 8px; flex-wrap: wrap; }
.tone { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--edge); background: var(--bg); }
.tone[aria-checked="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.tone-dot { width: 16px; height: 16px; border-radius: 50%; }
.text-in { width: 100%; min-height: 50px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--edge); background: var(--bg); font: 700 1.4rem "Aref Ruqaa", serif; }
.hint { color: var(--muted); font-size: .82rem; }
.err { color: var(--error); font-size: .86rem; margin: 2px 0 0; min-height: 1em; }
.x { position: absolute; top: 12px; inset-inline-end: 12px; z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bg); display: grid; place-items: center; }
.x svg { width: 18px; height: 18px; }
.full { width: 100%; }
@media (max-width: 720px) {
  .sheet { align-items: end; padding: 0; }
  .sheet-card { grid-template-columns: 1fr; border-radius: 14px 14px 0 0; max-height: 94%; transform: translateY(40px); }
  .sheet-art { min-height: 240px; }
  .sheet-info { padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
}
.drawer { justify-content: flex-end; }
.drawer-card { width: min(440px, 100%); height: 100%; overflow: auto; background: var(--bg); padding: calc(18px + env(safe-area-inset-top, 0px)) 22px calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(40px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
[dir="rtl"] .drawer-card { transform: translateX(-40px); }
.drawer.is-open .drawer-card { transform: none; }
.d-head { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.d-head h2 { margin: 0; font: 600 1.4rem/1 var(--f-head); }
.d-head span { color: var(--muted); }
.d-head .x { position: static; margin-inline-start: auto; background: var(--tile); }
.empty { color: var(--muted); padding: 30px 0; }
[data-cart-list] { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
.ci { display: grid; grid-template-columns: 76px 1fr auto; gap: 12px; }
.ci-img { position: relative; width: 76px; height: 92px; background: var(--tile); border-radius: 4px; }
.ci-img canvas { position: absolute; inset: 6%; width: 88%; height: 88%; }
.ci-img { overflow: hidden; }
.ci-img img { width: 100%; height: 100%; object-fit: cover; }
.ci-name { margin: 0; font-weight: 500; }
.ci-meta { margin: 0 0 6px; color: var(--muted); font-size: .85rem; }
.ci-row { display: flex; gap: 10px; align-items: center; }
.ci-qty { display: inline-flex; align-items: center; border: 1px solid var(--edge); border-radius: 999px; }
.ci-qty button { width: 44px; height: 44px; border: 0; background: none; font-size: 1.05rem; }
.ci-qty output { min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.ci-remove { border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; font-size: .85rem; }
.ci-price { margin: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sums { margin: 18px 0; display: grid; gap: 8px; font-variant-numeric: tabular-nums; }
.sums div { display: flex; justify-content: space-between; } .sums dd { margin: 0; } .sums dt { color: var(--muted); }
.sums .grand { padding-top: 10px; border-top: 1px solid var(--line); font-weight: 600; font-size: 1.1rem; } .sums .grand dt { color: var(--fg); }
.form { display: grid; gap: 14px; }
.form label { display: block; font-size: .88rem; font-weight: 500; margin-bottom: 5px; }
.form input, .form select, .form textarea { width: 100%; min-height: 50px; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--edge); background: var(--bg); }
.form textarea { min-height: 80px; resize: vertical; }
.form [aria-invalid="true"] { border-color: var(--error); }
.form input[type="tel"] { direction: ltr; }
[dir="rtl"] .form input[type="tel"] { text-align: right; }
[data-pay-list] { display: grid; gap: 8px; }
.pay { display: flex; gap: 12px; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--edge); cursor: pointer; }
.pay:has(input:checked) { border-color: var(--fg); }
.pay input { width: 20px; height: 20px; min-height: 0; margin: 3px 0 0; accent-color: var(--fg); }
.pay-body { display: grid; } .pay-name { font-weight: 500; } .pay-note { color: var(--muted); font-size: .85rem; }
.fee-hint { color: var(--muted); font-size: .85rem; margin: -6px 0 0; }
.link-btn { border: 0; background: none; color: var(--muted); text-decoration: underline; min-height: 44px; }
.ok { text-align: center; padding: 40px 0; display: grid; gap: 12px; justify-items: center; }
.ok h3 { font: 600 1.8rem/1.3 var(--f-head); margin: 0; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); inset-inline: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px); z-index: 60; background: var(--fg); color: var(--bg); padding: 12px 20px; border-radius: 999px; transform: translateY(20px); opacity: 0; transition: .3s; pointer-events: none; }
.toast.is-on { transform: none; opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<p class="announce" data-t="announce"></p>
<p class="demo" data-t="demo_note"></p>

<header class="top">
  <div class="wrap">
    <nav aria-label="Categories">
      <button type="button" data-jump="necklace" data-cat-label="necklace"></button>
      <button type="button" data-jump="bracelet" data-cat-label="bracelet"></button>
      <button type="button" data-jump="earrings" data-cat-label="earrings"></button>
    </nav>
    <a class="logo" href="#top">سِوار</a>
    <div class="tools">
      <button class="icon-btn" type="button" data-lang-toggle><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span data-t="lang_switch"></span></button>
      <button class="icon-btn" type="button" data-open-cart data-ta="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="count" data-cart-count hidden>0</span></button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="hero-tile">
        <div class="hero-art"><img src="img/p-layered.jpg" alt="" fetchpriority="high"></div>
        <div class="hero-copy">
          <h1 data-t="h1"></h1>
          <p data-t="lead"></p>
          <div class="meta"><b data-hero-price></b><span data-hero-name></span></div>
          <div class="actions">
            <button class="btn" type="button" data-add="layered" data-t="add"></button>
            <button class="btn line" type="button" data-jump="all" data-t="shop_all"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="cats_h"></h2></div>
      <div class="cats">
        <button class="cat-tile" type="button" data-jump="necklace"><div class="art"><img src="img/c-necklace.jpg" alt=""></div><span data-cat-label="necklace"></span></button>
        <button class="cat-tile" type="button" data-jump="bracelet"><div class="art"><img src="img/c-bracelet.jpg" alt=""></div><span data-cat-label="bracelet"></span></button>
        <button class="cat-tile" type="button" data-jump="earrings"><div class="art"><img src="img/c-earrings.jpg" alt=""></div><span data-cat-label="earrings"></span></button>
      </div>
    </div>
  </section>

  <section class="sec" id="shop">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-t="all_h"></h2>
        <div class="toolbar">
          <div class="seg" role="group" aria-label="Categories">
            <button type="button" data-cat="all" aria-pressed="true" data-cat-label="all"></button>
            <button type="button" data-cat="necklace" aria-pressed="false" data-cat-label="necklace"></button>
            <button type="button" data-cat="bracelet" aria-pressed="false" data-cat-label="bracelet"></button>
            <button type="button" data-cat="earrings" aria-pressed="false" data-cat-label="earrings"></button>
          </div>
          <label class="sr" for="sort" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" data-t="sort"></label>
          <select class="sort" id="sort"></select>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="trust">
    <div class="wrap">
      <ul>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.5"/></svg><div><b data-t="t1"></b><span data-t="t1d"></span></div></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.5"/><circle cx="17" cy="17.5" r="1.5"/></svg><div><b data-t="t2"></b><span data-t="t2d"></span></div></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg><div><b data-t="t3"></b><span data-t="t3d"></span></div></li>
      </ul>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© سِوار</span>
    <span><span data-t="wa"></span> <b>059 000 0000</b> · Instagram <b>@siwar.demo</b></span>
  </div>
</footer>

<div class="sheet" data-sheet hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-card">
    <button class="x" type="button" data-close data-ta="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="sheet-art"><img data-sheet-photo alt="" hidden><canvas data-sheet-canvas></canvas></div>
    <div class="sheet-info">
      <p class="sheet-cat" data-sheet-cat></p>
      <h2 id="sheet-title" data-sheet-name></h2>
      <p class="sheet-price" data-sheet-price></p>
      <p class="sheet-desc" data-sheet-desc></p>
      <fieldset><legend data-t="tone"></legend><div data-sheet-tones role="radiogroup"></div></fieldset>
      <div data-sheet-custom hidden>
        <label class="lbl-s" for="engrave" data-t="engrave"></label>
        <input id="engrave" class="text-in" data-sheet-text maxlength="8" autocomplete="off">
        <span class="hint" data-t="engrave_hint"></span>
        <p class="err" data-sheet-err aria-live="polite"></p>
      </div>
      <button class="btn full" type="button" data-sheet-add data-t="add"></button>
    </div>
  </div>
</div>

<div class="drawer" data-drawer hidden role="dialog" aria-modal="true" aria-labelledby="bag-title">
  <div class="drawer-card" data-scroll>
    <div class="d-head"><h2 id="bag-title" data-t="cart"></h2><span data-count-label></span>
      <button class="x" type="button" data-close data-ta="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <section data-step="bag">
      <p class="empty" data-cart-empty data-t="bag_empty"></p>
      <div data-cart-filled hidden>
        <ul data-cart-list></ul>
        <dl class="sums"><div><dt data-t="subtotal"></dt><dd data-subtotal></dd></div></dl>
        <button class="btn full" type="button" data-goto="checkout" data-t="checkout"></button>
      </div>
    </section>
    <section data-step="checkout" hidden>
      <form class="form" data-checkout novalidate>
        <div><label for="f-name" data-t="f_name"></label><input id="f-name" name="name" autocomplete="name"><p class="err" data-err="name"></p></div>
        <div><label for="f-phone" data-t="f_phone"></label><input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" data-tp="ph_phone"><p class="err" data-err="phone"></p></div>
        <div><label for="f-city" data-t="f_city"></label><select id="f-city" name="city" data-city-select></select><p class="err" data-err="city"></p></div>
        <div><label for="f-address" data-t="f_address"></label><textarea id="f-address" name="address" data-tp="ph_address"></textarea><p class="err" data-err="address"></p></div>
        <fieldset><legend data-t="f_pay"></legend><div data-pay-list></div></fieldset>
        <dl class="sums">
          <div><dt data-t="subtotal"></dt><dd data-subtotal></dd></div>
          <div><dt data-t="delivery"></dt><dd data-fee></dd></div>
          <div class="grand"><dt data-t="total"></dt><dd data-total></dd></div>
        </dl>
        <p class="fee-hint" data-fee-hint data-t="choose_city"></p>
        <button class="btn full" type="submit" data-t="place_order"></button>
        <button class="link-btn" type="button" data-goto="bag" data-t="back_to_bag"></button>
      </form>
    </section>
    <section data-step="confirm" hidden>
      <div class="ok">
        <h3 data-t="ok_title"></h3>
        <p><span data-t="ok_num"></span>: <b data-confirm-num></b></p>
        <p data-confirm-body></p>
        <button class="btn" type="button" data-shop-again data-t="ok_again"></button>
      </div>
    </section>
  </div>
</div>

<div class="toast" data-toast role="status" aria-live="polite"></div>

<script src="store.js"></script>
<script>
(function () {
  var S = window.Store, cat = 'all', sort = 'featured';
  function render() {
    var sel = document.getElementById('sort');
    sel.innerHTML = [['featured', S.t('sort_featured')], ['low', S.t('sort_low')], ['high', S.t('sort_high')]].map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === sort ? ' selected' : '') + '>' + S.esc(o[1]) + '</option>';
    }).join('');
    var items = S.PRODUCTS.filter(function (p) { return cat === 'all' || p.cat === cat; }).slice();
    if (sort === 'low') items.sort(function (a, b) { return a.price - b.price; });
    if (sort === 'high') items.sort(function (a, b) { return b.price - a.price; });
    var grid = document.getElementById('grid');
    grid.innerHTML = items.map(function (p) {
      var quick = p.custom
        ? '<button class="quick" type="button" data-open="' + p.id + '">' + S.esc(S.t('add_name')) + '</button>'
        : '<button class="quick" type="button" data-add="' + p.id + '" aria-label="' + S.esc(S.t('add') + ': ' + S.name(p)) + '">' + S.esc(S.t('add')) + '</button>';
      return '<article class="prod"><div class="img">' +
        '<button type="button" data-open="' + p.id + '" aria-label="' + S.esc(S.t('view') + ': ' + S.name(p)) + '" style="position:absolute;inset:0;border:0;background:none;padding:0">' + S.media(p, { decorative: true }) + '</button>' +
        (p.isNew ? '<span class="new">' + S.t('new') + '</span>' : '') + quick + '</div>' +
        '<h3>' + S.esc(S.name(p)) + '</h3><p class="p">' + S.money(p.price) + '</p>' +
        '<div class="swatches" aria-label="' + S.esc(S.t('tone')) + '">' + p.tones.map(function (t) { return '<i title="' + S.esc(S.TONES[t][S.lang()]) + '" style="background:' + S.TONES[t].swatch + '"></i>'; }).join('') + '</div></article>';
    }).join('');
    S.mount(grid);
    var hp = S.byId('layered');
    document.querySelector('[data-hero-price]').textContent = S.money(hp.price);
    document.querySelector('[data-hero-name]').textContent = S.name(hp);
  }
  document.addEventListener('click', function (e) {
    var c = e.target.closest('[data-cat]');
    if (c) { cat = c.getAttribute('data-cat'); S.$$('[data-cat]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === c)); }); render(); return; }
    var j = e.target.closest('[data-jump]');
    if (j) { cat = j.getAttribute('data-jump'); S.$$('[data-cat]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-cat') === cat)); }); render(); document.getElementById('shop').scrollIntoView({ behavior: 'smooth' }); }
  });
  document.getElementById('sort').addEventListener('change', function (e) { sort = e.target.value; render(); });

  S.boot({
    render: render,
    strings: {
      ar: {
        announce: 'الدفع عند الاستلام لكل الطلبات · توصيل للضفة والقدس والداخل',
        h1: 'طبقتان بلون ذهبي، لكل يوم.', lead: 'سلسلتان بطولين مختلفين تُلبسان معاً، بلون ذهبي.',
        shop_all: 'كل القطع', cats_h: 'تسوقي حسب النوع', all_h: 'كل القطع', add_name: 'اكتبي الاسم',
        sort: 'الترتيب', sort_featured: 'المقترح', sort_low: 'السعر: من الأقل', sort_high: 'السعر: من الأعلى',
        t1: 'الدفع عند الاستلام', t1d: 'أو بالبطاقة عبر بوابة محلية.', t2: 'توصيل للضفة والقدس والداخل', t2d: 'الرسوم تظهر قبل تأكيد الطلب.', t3: 'تبديل خلال 7 أيام', t3d: 'سياسة للتأكيد مع المتجر.', wa: 'واتساب'
      },
      en: {
        announce: 'Cash on delivery on every order · Delivery to the West Bank, Jerusalem and inside',
        h1: 'Two gold-tone layers, for every day.', lead: 'Two chains at two lengths, worn together, in gold tone.',
        shop_all: 'Shop all', cats_h: 'Shop by type', all_h: 'All pieces', add_name: 'Add a name',
        sort: 'Sort', sort_featured: 'Featured', sort_low: 'Price: low to high', sort_high: 'Price: high to low',
        t1: 'Cash on delivery', t1d: 'Or by card through a local gateway.', t2: 'Delivery to the West Bank, Jerusalem and inside', t2d: 'Fees show before you confirm.', t3: '7-day exchange', t3d: 'Policy to confirm with the shop.', wa: 'WhatsApp'
      }
    }
  });
})();
</script>
