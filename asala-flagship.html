<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asala Flagship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* ASALA flagship demo (25 Oct 2026 meeting): dark 3D hero over a light store, Shop by menu,
   the Asala assistant (gift finder, talk to the maker, custom design), most-requested ranked by orders. */
:root {
  --night: #12110e; --night2: #1b1a16; --night3: #26241f;
  --gold: #d6ad69; --gold2: #b38946; --goldhi: #f1d9a6;
  --ivory: #f5f1e9; --paper: #faf8f3; --ink: #24231f; --ink2: #56524a; --muted: #7b766c;
  --red: #c6383c; --wine: #6e3442; --olive: #5d6450;
  --bg: var(--paper); --fg: var(--ink); --fg2: var(--ink2); --mut: var(--muted); --line: rgba(36,35,31,.12);
  --panel: #ffffff; --soft: var(--ivory); --tile: #f1ece2;
  --f-ld: "Cormorant Garamond", "Times New Roman", serif; --f-l: "Jost", system-ui, sans-serif;
  --f-ad: "Noto Naskh Arabic", "Cormorant Garamond", serif; --f-a: "IBM Plex Sans Arabic", "Jost", system-ui, sans-serif;
  --fd: var(--f-ad); --fb: var(--f-a);
  --r: 14px; --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: light;
}
html[lang="en"] { --fd: var(--f-ld); --fb: var(--f-l); }
html[data-theme="dark"] {
  --bg: #15140f; --fg: #eee8dc; --fg2: #c2baa9; --mut: #988f80; --line: rgba(238,232,220,.13);
  --panel: #1e1d18; --soft: #1b1a15; --tile: #23211b; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--fb); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: min(1240px, 100% - 40px); margin-inline: auto; }
h1, h2, h3 { font-family: var(--fd); font-weight: 500; margin: 0; line-height: 1.2; text-wrap: balance; }
html[lang="en"] h1, html[lang="en"] h2 { font-weight: 500; letter-spacing: -.005em; }
p { margin: 0; }
.caps { font-family: var(--f-l); text-transform: uppercase; letter-spacing: .22em; font-size: .72rem; font-weight: 400; }
html[lang="ar"] .caps { font-family: var(--f-a); letter-spacing: 0; text-transform: none; font-size: .86rem; }
.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
[dir="rtl"] .flip-rtl { transform: scaleX(-1); }
[dir="ltr"] .flip-ltr { transform: scaleX(-1); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 26px; border-radius: 999px; font-size: .95rem; font-weight: 500; transition: background .25s, color .25s, border-color .25s, transform .25s var(--ease); text-decoration: none; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn-gold { background: var(--gold); color: #1a160e; }
.btn-gold:hover { background: var(--goldhi); }
.btn-line { border: 1px solid rgba(241,217,166,.45); color: var(--ivory); }
.btn-line:hover { border-color: var(--gold); color: var(--goldhi); }
.btn-dark { background: var(--ink); color: var(--ivory); }
html[data-theme="dark"] .btn-dark { background: var(--gold); color: #1a160e; }
.btn-dark:hover { opacity: .9; }
.btn-ghost { border: 1px solid var(--line); color: var(--fg); }
.btn-ghost:hover { border-color: var(--fg); }
.btn .ic { width: 18px; height: 18px; }
.link { display: inline-flex; align-items: center; gap: 8px; font-size: .92rem; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px; }

/* ---------- header ---------- */
.hdr { position: fixed; inset: 0 0 auto 0; z-index: 40; color: var(--ivory); transition: background .35s, color .35s, box-shadow .35s; }
.hdr.solid { background: rgba(250,248,243,.94); color: var(--ink); box-shadow: 0 1px 0 var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
html[data-theme="dark"] .hdr.solid { background: rgba(21,20,15,.94); color: var(--fg); }
.hdr-in { height: 84px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
.hdr-side { display: flex; align-items: center; gap: 6px; }
.hdr-end { justify-content: flex-end; }
.ibtn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 50%; position: relative; transition: background .2s; }
.ibtn:hover { background: rgba(255,255,255,.08); }
.hdr.solid .ibtn:hover { background: rgba(0,0,0,.05); }
.tbtn { text-decoration: none; height: 44px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; border-radius: 22px; }
.tbtn:hover { color: var(--gold); }
.hdr.solid .tbtn:hover { color: var(--gold2); }
.tbtn .chev { width: 14px; height: 14px; transition: transform .25s; }
.tbtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.brand { display: grid; justify-items: center; gap: 2px; text-decoration: none; }
.brand img { height: 21px; width: auto; }
.brand .wm-dark { display: none; }
.hdr.solid .brand .wm-light { display: none; }
.hdr.solid .brand .wm-dark { display: block; }
html[data-theme="dark"] .hdr.solid .brand .wm-light { display: block; }
html[data-theme="dark"] .hdr.solid .brand .wm-dark { display: none; }
.brand small { font-family: var(--f-ad); font-size: .82rem; color: var(--gold); display: flex; align-items: center; gap: 8px; line-height: 1; }
.brand small::before, .brand small::after { content: ""; width: 16px; height: 1px; background: currentColor; opacity: .7; }
.hdr.solid .brand small { color: var(--gold2); }
.count { position: absolute; top: 5px; inset-inline-end: 4px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--gold); color: #1a160e; font: 600 .66rem/17px var(--f-l); text-align: center; padding: 0 4px; }
.hide-sm { }
@media (max-width: 860px) { .hide-sm { display: none !important; } .hdr-in { height: 68px; } }

/* shop-by mega menu */
.mega { position: absolute; inset: 100% 0 auto 0; background: var(--panel); color: var(--fg); box-shadow: 0 30px 60px -30px rgba(0,0,0,.35); border-top: 1px solid var(--line); opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .25s, transform .25s var(--ease); }
.mega.open { opacity: 1; transform: none; pointer-events: auto; }
.mega-in { display: grid; grid-template-columns: 260px 1fr 300px; gap: 40px; padding: 34px 0 40px; }
.mg-groups { display: grid; align-content: start; border-inline-end: 1px solid var(--line); padding-inline-end: 24px; }
.mg-groups button { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-family: var(--fd); font-size: 1.28rem; text-align: start; color: var(--fg2); transition: color .2s; }
html[lang="en"] .mg-groups button { font-size: 1.45rem; }
.mg-groups button[aria-selected="true"], .mg-groups button:hover { color: var(--fg); }
.mg-groups button .ic { width: 16px; height: 16px; opacity: .5; }
.mg-groups button[aria-selected="true"] .ic { opacity: 1; color: var(--gold2); }
.mg-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 30px; align-content: start; }
.mg-opts a { display: flex; align-items: center; gap: 14px; padding: 10px 0; text-decoration: none; border-bottom: 1px solid var(--line); font-size: .98rem; }
.mg-opts a:hover { color: var(--gold2); }
.mg-opts a img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--tile); }
.mg-opts a .n { margin-inline-start: auto; color: var(--mut); font-size: .8rem; font-family: var(--f-l); }
.mg-feat { border-radius: var(--r); overflow: hidden; position: relative; min-height: 260px; background: var(--night); color: var(--ivory); text-decoration: none; display: flex; align-items: flex-end; }
.mg-feat img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .8; transition: transform .6s var(--ease); }
.mg-feat:hover img { transform: scale(1.04); }
.mg-feat span { position: relative; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,.65)); width: 100%; font-family: var(--fd); font-size: 1.25rem; }

/* ---------- hero ---------- */
.hero { position: relative; background: radial-gradient(120% 90% at 70% 40%, #2a2721 0%, var(--night) 58%); color: var(--ivory); min-height: max(680px, 100svh); overflow: hidden; isolation: isolate; }
[dir="rtl"] .hero { background: radial-gradient(120% 90% at 30% 40%, #2a2721 0%, var(--night) 58%); }
.hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 140px; background: linear-gradient(transparent, rgba(0,0,0,.35)); pointer-events: none; z-index: -1; }
.hero-in { position: relative; min-height: inherit; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); align-items: center; gap: 30px; padding-top: 96px; padding-bottom: 40px; }
.hero-copy { max-width: 520px; }
.eyebrow { display: flex; align-items: center; gap: 14px; color: rgba(245,241,233,.7); margin-bottom: 26px; }
.eyebrow::after { content: ""; width: 54px; height: 1px; background: var(--gold); opacity: .7; }
.hero h1 { font-size: clamp(3rem, 6.4vw, 5.6rem); line-height: 1.08; font-weight: 500; }
html[lang="ar"] .hero h1 { font-size: clamp(2.8rem, 6vw, 5.2rem); line-height: 1.25; }
.hero h1 .g { color: var(--gold); display: block; }
.hero-p { margin-top: 24px; color: rgba(245,241,233,.78); font-size: 1.05rem; max-width: 460px; }
.hero-cta { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 14px; }
.slides { margin-top: 46px; display: flex; gap: 6px; align-items: center; }
.slides button { display: flex; align-items: center; gap: 12px; padding: 10px 0; color: rgba(245,241,233,.45); font: 400 .82rem var(--f-l); letter-spacing: .1em; transition: color .3s; }
.slides button i { display: block; width: 64px; height: 1px; background: rgba(245,241,233,.25); position: relative; overflow: hidden; }
.slides button i::after { content: ""; position: absolute; inset: 0; background: var(--gold); transform: scaleX(0); transform-origin: left; }
[dir="rtl"] .slides button i::after { transform-origin: right; }
.slides button[aria-current="true"] { color: var(--gold); }
.slides button[aria-current="true"] i::after { animation: fill var(--dur, 8s) linear forwards; }
.slides.paused button[aria-current="true"] i::after { animation-play-state: paused; }
@keyframes fill { to { transform: scaleX(1); } }
.slides button:last-child i { display: none; }
.scroll-cue { margin-top: 40px; display: inline-flex; align-items: center; gap: 16px; color: rgba(245,241,233,.6); text-decoration: none; }
.scroll-cue span:first-child { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(214,173,105,.55); display: grid; place-items: center; color: var(--gold); }
.scroll-cue .ic { width: 18px; height: 18px; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }

/* the stage: a lit arch niche, the 3D piece, its pedestal */
.stage { position: relative; height: min(78vh, 720px); min-height: 520px; }
.niche { position: absolute; inset: 4% 14% 12% 14%; border-radius: 999px 999px 0 0; background: linear-gradient(180deg, #2b2822 0%, #1a1814 70%, #13120f 100%); box-shadow: inset 0 0 80px rgba(0,0,0,.6); }
.niche::before { content: ""; position: absolute; inset: -14px; border-radius: 999px 999px 0 0; border: 1.5px solid rgba(214,173,105,.55); border-bottom: 0; filter: drop-shadow(0 0 6px rgba(214,173,105,.35)); }
.niche::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(60% 45% at 50% 38%, rgba(255,226,170,.16), transparent 70%); }
.floor { position: absolute; inset: auto -20% 0 -20%; height: 26%; background: radial-gradient(50% 60% at 50% 0%, rgba(214,173,105,.12), transparent 70%); }
#hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; z-index: 1; }
#hero-canvas:active { cursor: grabbing; }
.fallback { position: absolute; inset: 14% 24% 22%; display: none; z-index: 1; }
.fallback img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 30px 40px rgba(0,0,0,.6)); }
html.no3d .fallback { display: block; }
html.no3d #hero-canvas { display: none; }
.cap { position: absolute; inset-inline: 0; bottom: -7%; z-index: 2; display: flex; justify-content: center; }
.cap button { display: grid; justify-items: center; gap: 2px; color: var(--ivory); padding: 6px 16px; }
.cap b { font-family: var(--fd); font-weight: 500; font-size: 1.3rem; }
html[lang="en"] .cap b { font-size: 1.5rem; }
.cap small { color: rgba(245,241,233,.6); font-size: .82rem; display: inline-flex; gap: 6px; align-items: center; }
.cap button:hover small { color: var(--gold); }
.drag { position: absolute; top: 10%; inset-inline-start: 0; z-index: 2; color: rgba(245,241,233,.55); font-size: .8rem; display: flex; align-items: center; gap: 8px; transition: opacity .5s; }
.drag.gone { opacity: 0; }
.rail { position: absolute; top: 50%; inset-inline-end: 0; transform: translateY(-50%); z-index: 3; display: grid; justify-items: center; gap: 10px; }
.rail-btn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(214,173,105,.5); color: var(--gold); display: grid; place-items: center; background: rgba(18,17,14,.5); }
.rail-btn[aria-expanded="true"] { background: var(--gold); color: #1a160e; }
.rail-list { display: grid; gap: 10px; padding: 12px 8px; border-radius: 30px; background: rgba(18,17,14,.65); border: 1px solid rgba(214,173,105,.25); transform-origin: center; animation: pop .25s var(--ease); }
@keyframes pop { from { opacity: 0; transform: scale(.92); } }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.sw[aria-pressed="true"] { border-color: var(--goldhi); }
.sw.A { background: radial-gradient(circle at 35% 30%, #fff1c9, #d7a948 55%, #8a6420); }
.sw.B { background: radial-gradient(circle at 35% 30%, #ffffff, #c9ced3 55%, #7b8086); }
.sw.C { background: radial-gradient(circle at 35% 30%, #fde3c0, #d9a465 55%, #8c5d2c); }
.rail-list hr { width: 18px; border: 0; border-top: 1px solid rgba(214,173,105,.3); margin: 2px auto; }
.pt { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; border: 2px solid transparent; }
.pt img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(.2) contrast(1.1); }
.pt[aria-pressed="true"] { border-color: var(--goldhi); }

@media (max-width: 900px) {
  .hero-in { grid-template-columns: 1fr; padding-top: 76px; gap: 0; }
  .stage { order: -1; height: 56svh; min-height: 380px; margin-bottom: 64px; }
  .cap { bottom: -58px; }
  .niche { inset: 6% 18% 14% 18%; }
  .hero-copy { max-width: none; padding-bottom: 20px; }
  .eyebrow { margin-bottom: 14px; }
  .hero-p { font-size: 1rem; }
  .slides { margin-top: 28px; }
  .scroll-cue { display: none; }
  .rail { top: auto; bottom: 14%; transform: none; }
  .drag { top: 4%; }
}

/* ---------- sections ---------- */
.sec { padding: clamp(64px, 9vw, 120px) 0; }
.sec-hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 40px; flex-wrap: wrap; }
.sec-hd h2 { font-size: clamp(2rem, 3.6vw, 3rem); }
html[lang="en"] .sec-hd h2 { font-size: clamp(2.3rem, 4vw, 3.4rem); }
.sec-hd p { color: var(--fg2); max-width: 520px; margin-top: 8px; }
.kick { color: var(--gold2); margin-bottom: 10px; display: block; }
html[data-theme="dark"] .kick { color: var(--gold); }

/* shop-by circles, right under the hero */
.cats { padding: 44px 0 10px; }
.cats-hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px; gap: 16px; }
.cats-hd h2 { font-size: 1.35rem; }
html[lang="en"] .cats-hd h2 { font-size: 1.6rem; }
.cats-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 18px; }
.cat { display: grid; justify-items: center; gap: 12px; text-decoration: none; text-align: center; font-size: .95rem; }
.cat span.c { width: min(128px, 100%); aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: var(--tile); display: block; position: relative; }
.cat img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
.cat:hover img { transform: scale(1.07); }
.cat span.c::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
.cat:hover { color: var(--gold2); }
@media (max-width: 900px) { .cats-row { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 10px; scrollbar-width: none; } .cats-row::-webkit-scrollbar { display: none; } .cat { flex: 0 0 96px; scroll-snap-align: start; font-size: .86rem; } }

/* product cards */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 34px 22px; }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 700px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 14px; } }
.card { display: grid; gap: 12px; text-align: start; position: relative; }
.card .ph { position: relative; aspect-ratio: 4 / 5; border-radius: var(--r); overflow: hidden; background: var(--tile); }
.card .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .5s, transform .8s var(--ease); }
.card .ph img.alt { opacity: 0; }
.card:hover .ph img.alt { opacity: 1; }
.card:hover .ph img:first-child { transform: scale(1.04); }
.card .rank { position: absolute; top: 12px; inset-inline-start: 12px; font: 500 .74rem var(--f-l); letter-spacing: .12em; color: var(--ink); background: rgba(250,248,243,.88); border-radius: 20px; padding: 3px 10px; }
.card .new { position: absolute; top: 12px; inset-inline-end: 12px; font-size: .74rem; color: #fff; background: var(--red); border-radius: 20px; padding: 2px 10px; }
.card .view { position: absolute; inset: auto 12px 12px 12px; min-height: 42px; border-radius: 21px; background: rgba(250,248,243,.94); color: var(--ink); font-size: .86rem; display: grid; place-items: center; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s var(--ease); }
.card:hover .view, .card:focus-visible .view { opacity: 1; transform: none; }
.card h3 { font-family: var(--fb); font-size: 1rem; font-weight: 500; line-height: 1.45; }
.card .meta { color: var(--mut); font-size: .84rem; display: flex; gap: 10px; justify-content: space-between; }
.card .meta b { color: var(--fg); font-weight: 500; font-family: var(--f-l); }
.card.moved { animation: lift .9s var(--ease); }
@keyframes lift { 0% { box-shadow: 0 0 0 0 rgba(214,173,105,.0); } 30% { box-shadow: 0 0 0 4px rgba(214,173,105,.55); border-radius: var(--r); } 100% { box-shadow: 0 0 0 0 rgba(214,173,105,0); } }
.auto-note { display: inline-flex; align-items: center; gap: 8px; color: var(--mut); font-size: .84rem; }
.auto-note i { width: 7px; height: 7px; border-radius: 50%; background: #3f9b6a; box-shadow: 0 0 0 4px rgba(63,155,106,.15); }

/* made + care: the one dark band below the hero */
.made { background: var(--night2); color: var(--ivory); }
.made .sec-hd p { color: rgba(245,241,233,.7); }
.made .kick { color: var(--gold); }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; counter-reset: s; }
.step figure { margin: 0; }
.step .im { aspect-ratio: 4 / 5; border-radius: var(--r); overflow: hidden; background: #000; }
.step img { width: 100%; height: 100%; object-fit: cover; }
.step figcaption { margin-top: 14px; }
.step b { display: flex; gap: 10px; align-items: baseline; font-family: var(--fd); font-weight: 500; font-size: 1.2rem; }
html[lang="en"] .step b { font-size: 1.4rem; }
.step b::before { counter-increment: s; content: "0" counter(s); font: 400 .78rem var(--f-l); color: var(--gold); letter-spacing: .1em; }
.step span { color: rgba(245,241,233,.65); font-size: .9rem; }
.care { margin-top: 56px; padding-top: 34px; border-top: 1px solid rgba(245,241,233,.14); display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
.care h3 { font-size: 1.6rem; }
.care ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 30px; }
.care li { display: flex; gap: 12px; color: rgba(245,241,233,.85); font-size: .95rem; }
.care li::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: .55em; border: 1.5px solid var(--gold); transform: rotate(45deg); }
@media (max-width: 900px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } .care { grid-template-columns: 1fr; } .care ul { grid-template-columns: 1fr; } }

/* packaging */
.pack { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(30px, 6vw, 80px); align-items: center; }
.pack .im { border-radius: var(--r); overflow: hidden; aspect-ratio: 16 / 10; }

/* about + our story */

.ab .story p + p { margin-top: 12px; }
.ab .story p { color: var(--fg2); }
.vision { background: var(--night2); color: var(--ivory); border-radius: 20px; padding: 34px; position: relative; overflow: hidden; }
.vision .kick { color: var(--gold); }
.vision blockquote { margin: 0; font-family: var(--fd); font-size: 1.45rem; line-height: 1.6; }

.vision svg.mk { position: absolute; width: 180px; inset-inline-end: -40px; bottom: -50px; color: rgba(214,173,105,.12); }
.maker { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.maker .av { width: 54px; height: 54px; border-radius: 50%; background: var(--night2); color: var(--gold); display: grid; place-items: center; flex: none; }
.maker .av svg { width: 30px; }
.maker div { flex: 1 1 180px; }
.maker b { display: block; font-weight: 500; }
.maker span { color: var(--mut); font-size: .88rem; }
.sketches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 30px; }
.sketches img { aspect-ratio: 1; object-fit: cover; border-radius: 12px; }
@media (max-width: 900px) { .ab { grid-template-columns: 1fr; } }

/* ---------- footer ---------- */
.trust { background: var(--soft); border-top: 1px solid var(--line); }
.trust ul { list-style: none; margin: 0; padding: 26px 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.trust li { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-size: .9rem; color: var(--fg2); }
.trust .ic { color: var(--gold2); width: 22px; height: 22px; }
@media (max-width: 700px) { .trust ul { grid-template-columns: 1fr 1fr; } }
.ftr { background: var(--night); color: rgba(245,241,233,.82); padding: 64px 0 28px; }
.ftr-top { display: grid; grid-template-columns: 1.3fr repeat(3, 1fr) 1.4fr; gap: 34px; }
.ftr h4 { margin: 0 0 16px; color: var(--gold); font-weight: 500; }
.ftr ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: .93rem; }
.ftr ul a, .ftr ul button { text-decoration: none; text-align: start; opacity: .85; }
.ftr ul a:hover, .ftr ul button:hover { opacity: 1; color: var(--goldhi); }
.ftr .about-col p { font-size: .92rem; margin-top: 14px; opacity: .8; }
.ftr .about-col img { height: 18px; }
.addr { margin-top: 16px; display: grid; gap: 8px; font-size: .9rem; }
.addr div { display: flex; gap: 10px; align-items: flex-start; }
.addr .ic { width: 18px; height: 18px; color: var(--gold); margin-top: 3px; }
.news p { font-size: .92rem; opacity: .8; }
.news form { margin-top: 14px; display: flex; border-bottom: 1px solid rgba(245,241,233,.35); }
.news input { flex: 1; background: none; border: 0; padding: 10px 0; color: var(--ivory); min-width: 0; }
.news input::placeholder { color: rgba(245,241,233,.5); }
.news button { width: 40px; color: var(--gold); }
.social { display: flex; gap: 10px; margin-top: 20px; }
.social a { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(245,241,233,.22); display: grid; place-items: center; }
.social a:hover { border-color: var(--gold); color: var(--gold); }
.social .ic { width: 18px; height: 18px; }
.ftr-pay { margin-top: 44px; padding-top: 22px; border-top: 1px solid rgba(245,241,233,.12); display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; font-size: .84rem; }
.pays { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pay { height: 30px; min-width: 50px; padding: 0 10px; border-radius: 6px; background: #fff; color: #1a1f71; display: inline-grid; place-items: center; font: 700 italic .82rem/1 var(--f-l); letter-spacing: .02em; }
.pay.mc { gap: 0; display: inline-flex; align-items: center; justify-content: center; }
.pay.mc i { width: 16px; height: 16px; border-radius: 50%; background: #eb001b; display: block; }
.pay.mc i + i { background: #f79e1b; margin-inline-start: -6px; mix-blend-mode: multiply; }
.pay.cod { background: transparent; border: 1px solid rgba(245,241,233,.3); color: var(--ivory); font: 400 .78rem var(--fb); }
.ftr-bot { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px 20px; justify-content: space-between; font-size: .8rem; opacity: .6; }

@media (max-width: 1000px) { .ftr-top { grid-template-columns: 1fr 1fr; } .ftr .about-col, .news { grid-column: 1 / -1; } }

/* ---------- shop view ---------- */
.view-shop { padding-top: 120px; min-height: 80vh; }
.shop-hd { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }

.filters { position: sticky; top: 84px; z-index: 5; background: var(--bg); padding: 12px 0; border-block: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.fsel { position: relative; }

.res { color: var(--mut); font-size: .86rem; margin: 18px 0 24px; }
.empty { padding: 60px 0; text-align: center; color: var(--fg2); }

/* ---------- overlays: sheet, bag, checkout, policies, search ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10,9,7,.5); z-index: 60; opacity: 0; transition: opacity .3s; }
.scrim.on { opacity: 1; }
.panel { position: fixed; z-index: 61; background: var(--panel); color: var(--fg); box-shadow: 0 30px 80px rgba(0,0,0,.3); transition: transform .38s var(--ease), opacity .3s; }
.side { top: 0; bottom: 0; inset-inline-end: 0; width: min(480px, 100%); transform: translateX(100%); display: flex; flex-direction: column; }
[dir="rtl"] .side { transform: translateX(-100%); }
.side.from-start { inset-inline-end: auto; inset-inline-start: 0; transform: translateX(-100%); }
[dir="rtl"] .side.from-start { transform: translateX(100%); }

.p-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 22px; border-bottom: 1px solid var(--line); }

.gal { background: var(--tile); position: relative; min-height: 100%; }

.thumbs button { width: 64px; height: 64px; border-radius: 10px; overflow: hidden; border: 2px solid transparent; }
.thumbs button[aria-pressed="true"] { border-color: var(--gold2); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.info { padding: 30px 0; padding-inline-end: 26px; display: grid; align-content: start; gap: 16px; }
.info h2 { font-size: 2rem; }

.info .coll { color: var(--gold2); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); border-radius: 22px; padding: 8px 14px; font-size: .86rem; display: inline-flex; align-items: center; gap: 8px; }

.facts { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.facts li { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.facts .ic { color: var(--gold2); width: 18px; height: 18px; margin-top: 3px; }
.ask { display: inline-flex; gap: 8px; align-items: center; font-size: .9rem; text-decoration: underline; color: var(--fg2); justify-self: start; }
@media (max-width: 760px) {
  .sheet .p-bd { grid-template-columns: 1fr; gap: 0; }
  .info { padding: 22px; }
  .gal .main { aspect-ratio: 1; }
}

.line { display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
.line img { width: 76px; height: 92px; object-fit: cover; border-radius: 10px; background: var(--tile); }

.form { display: grid; gap: 14px; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.ok { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 30px 6px; }

.pol-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 0 22px 12px; border-bottom: 1px solid var(--line); scrollbar-width: none; }

.search { top: 0; inset-inline: 0; transform: translateY(-100%); padding: 22px 0 26px; }

/* menu drawer */

/* ---------- the Asala assistant ---------- */
.asst-fab { position: fixed; z-index: 55; bottom: max(20px, env(safe-area-inset-bottom)); inset-inline-end: 20px; display: flex; align-items: center; gap: 12px; padding: 6px; padding-inline-end: 20px; border-radius: 40px; background: var(--night2); color: var(--ivory); box-shadow: 0 14px 34px -10px rgba(0,0,0,.45), 0 0 0 1px rgba(214,173,105,.35); transition: padding .35s var(--ease), transform .3s var(--ease), opacity .3s; }
.asst-fab .orb { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #f3dcab, var(--gold) 55%, #9b7535); color: #1a160e; flex: none; position: relative; }
.asst-fab .orb svg { width: 26px; }
.asst-fab .orb::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid rgba(214,173,105,.6); animation: ring 3s ease-out infinite; }
@keyframes ring { 0% { opacity: .8; transform: scale(.9); } 70%, 100% { opacity: 0; transform: scale(1.25); } }
.asst-fab .lbl { font-size: .92rem; white-space: nowrap; overflow: hidden; max-width: 220px; transition: max-width .35s var(--ease), opacity .3s; }
.asst-fab.mini { padding-inline-end: 6px; gap: 0; }
.asst-fab.mini .lbl { max-width: 0; opacity: 0; }
.asst-fab:hover { transform: translateY(-2px); }
.asst-fab.away { opacity: 0; pointer-events: none; transform: translateY(20px); }
.asst { position: fixed; z-index: 62; bottom: 92px; inset-inline-end: 20px; width: min(400px, 100% - 40px); max-height: min(680px, 100svh - 120px); display: flex; flex-direction: column; background: var(--paper); color: var(--ink); border-radius: 22px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.45), 0 0 0 1px rgba(214,173,105,.3); overflow: hidden; opacity: 0; transform: translateY(14px) scale(.98); transform-origin: bottom; pointer-events: none; transition: opacity .3s, transform .35s var(--ease); }
html[data-theme="dark"] .asst { background: #1d1c17; color: var(--fg); }
.asst.on { opacity: 1; transform: none; pointer-events: auto; }
.a-hd { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 12px; gap: 10px; position: relative; }
.a-hd .back { display: inline-flex; gap: 6px; align-items: center; font-size: .86rem; color: var(--fg2); padding: 6px 4px; }
.a-hd .t { display: flex; align-items: center; gap: 10px; }
.a-hd .t .m { width: 30px; height: 30px; border-radius: 50%; background: var(--night2); color: var(--gold); display: grid; place-items: center; }
.a-hd .t .m svg { width: 18px; }
.a-hd .t b { font-weight: 500; font-size: .95rem; display: block; line-height: 1.2; }
.a-hd .t small { color: var(--mut); font-size: .76rem; }
.a-bd { overflow: auto; padding: 4px 18px 18px; overscroll-behavior: contain; }
.a-bd h3 { font-size: 1.45rem; margin: 6px 0 4px; }
html[lang="en"] .a-bd h3 { font-size: 1.7rem; }
.a-sub { color: var(--fg2); font-size: .9rem; margin-bottom: 16px; }
.a-opt { width: 100%; display: flex; align-items: center; gap: 14px; text-align: start; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 10px; transition: border-color .2s, transform .2s var(--ease); }
.a-opt:hover { border-color: var(--gold2); transform: translateY(-1px); }

.a-foot { display: flex; gap: 10px; align-items: center; justify-content: center; color: var(--mut); font-size: .84rem; padding: 12px; border-radius: 14px; background: var(--soft); margin-top: 6px; }

.q-step { color: var(--mut); font-size: .8rem; display: flex; justify-content: space-between; align-items: center; }

.rec .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

.rec .acts button.pri { background: var(--ink); color: var(--ivory); border-color: var(--ink); }
html[data-theme="dark"] .rec .acts button.pri { background: var(--gold); color: #1a160e; border-color: var(--gold); }
.rec .pr { font-family: var(--f-l); font-size: .86rem; color: var(--fg); }

.howto small { color: var(--mut); font-size: .82rem; }
.vid { position: relative; aspect-ratio: 16 / 10; border-radius: 16px; overflow: hidden; background: var(--night); color: var(--ivory); }
.vid .sc { position: absolute; inset: 0; opacity: 0; transition: opacity .6s; }
.vid .sc.on { opacity: 1; }
.vid .sc img { width: 100%; height: 100%; object-fit: cover; opacity: .75; }
.vid .sc.on img { animation: kb 4.2s linear forwards; }
@keyframes kb { from { transform: scale(1.02); } to { transform: scale(1.1); } }
.vid .sc p { position: absolute; inset: auto 0 0 0; padding: 30px 16px 26px; background: linear-gradient(transparent, rgba(0,0,0,.8)); font-size: .92rem; }
.vid .sc p b { color: var(--gold); font-family: var(--f-l); font-weight: 500; margin-inline-end: 8px; }
.vid .play { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.25); }
.vid .play span { width: 62px; height: 62px; border-radius: 50%; background: rgba(250,248,243,.92); color: var(--ink); display: grid; place-items: center; }
.vid .bar { position: absolute; inset: auto 0 0 0; height: 3px; background: rgba(255,255,255,.2); }
.vid .bar i { display: block; height: 100%; width: 0; background: var(--gold); }
.vid .tag { position: absolute; top: 10px; inset-inline-start: 10px; font-size: .72rem; background: rgba(0,0,0,.55); border-radius: 12px; padding: 2px 10px; }
.drop { border: 1.5px dashed var(--line); border-radius: 14px; padding: 16px; display: flex; gap: 12px; align-items: center; cursor: pointer; font-size: .88rem; color: var(--fg2); }
.drop:hover { border-color: var(--gold2); }
.drop img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
.wa { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); border-radius: 24px; min-height: 44px; font-size: .9rem; text-decoration: none; }
.wa .ic { color: #25a35a; }
@media (max-width: 600px) {
  .asst { inset: auto 0 0 0; width: 100%; max-height: 86svh; border-radius: 22px 22px 0 0; transform: translateY(100%); }
  .asst.on { transform: none; }
  .asst::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--line); position: absolute; top: 8px; left: 50%; margin-left: -20px; }
  .asst-fab { inset-inline-end: 14px; bottom: max(14px, env(safe-area-inset-bottom)); padding-inline-end: 6px; gap: 0; }
  .asst-fab .lbl { max-width: 0; opacity: 0; }
  .demo-flag { display: none; }
  .two { grid-template-columns: 1fr; }
}
.toast { position: fixed; z-index: 80; bottom: 100px; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: var(--ivory); padding: 12px 20px; border-radius: 24px; font-size: .9rem; opacity: 0; transition: opacity .3s, transform .3s var(--ease); pointer-events: none; max-width: calc(100% - 40px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.demo-flag { position: fixed; z-index: 30; bottom: 0; inset-inline-start: 0; font-size: .7rem; background: rgba(18,17,14,.75); color: rgba(245,241,233,.75); padding: 4px 12px; border-start-end-radius: 10px; }
[dir="rtl"] .demo-flag { border-radius: 0 10px 0 0; }
html.shot .hero { min-height: 900px; } html.shot .stage { height: 700px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
</style>

  const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const x = c.getContext('2d');
  x.fillStyle = '#141311'; x.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 2600; i++) { x.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.025) + ')'; x.fillRect(Math.random() * 1024, Math.random() * 512, 2, 2); }
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let v = 0; v < 14; v++) {
    x.strokeStyle = v % 3 ? 'rgba(200,190,170,' + (0.08 + rnd() * 0.12) + ')' : 'rgba(214,173,105,' + (0.12 + rnd() * 0.18) + ')';
    x.lineWidth = 0.6 + rnd() * 2.2; x.beginPath(); let px = rnd() * 1024, py = rnd() * 512; x.moveTo(px, py);
    for (let s = 0; s < 9; s++) { const nx = px + (rnd() - 0.3) * 220, ny = py + (rnd() - 0.5) * 120; x.quadraticCurveTo((px + nx) / 2 + (rnd() - 0.5) * 80, (py + ny) / 2 + (rnd() - 0.5) * 80, nx, ny); px = nx; py = ny; }
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; return t;
}
function shadowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const gr = x.createRadialGradient(128, 128, 4, 128, 128, 128); gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c);
}

// ---------- the viewer ----------
const canvas = document.getElementById('hero-canvas');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch (e) { renderer = null; }
if (!renderer) { document.documentElement.classList.add('no3d'); }
else {
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.25;
  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  const key = new THREE.DirectionalLight(0xfff0d8, 3.0); key.position.set(2.5, 4, 6); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.9); fill.position.set(-3, -1, 5); scene.add(fill);
  const rimL = new THREE.DirectionalLight(0xffdcb0, 1.6); rimL.position.set(-4, 2, -3); scene.add(rimL);
  const spot = new THREE.SpotLight(0xffe2b0, 22, 14, 0.42, 0.7, 1.4); spot.position.set(0, 6, 1.5); spot.target.position.set(0, -0.6, 0); scene.add(spot, spot.target);
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  const TARGET_H = 3.3, PLINTH_Y = -TARGET_H / 2 - 0.42;
  // plinth
  const plinth = new THREE.Group();
  const marble = new THREE.MeshPhysicalMaterial({ map: marbleTexture(), roughness: 0.42, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.35, envMapIntensity: 0.35 });
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.13, 0.32, 96), marble); plinth.add(cyl);
  const edge = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.01, 8, 120), metalMat('A')); edge.rotation.x = Math.PI / 2; edge.position.y = 0.16; plinth.add(edge);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.8, 48), new THREE.MeshBasicMaterial({ map: shadowTexture(), transparent: true, depthWrite: false })); shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.162; plinth.add(shadow);
  plinth.position.y = PLINTH_Y; plinth.rotation.x = 0.0; scene.add(plinth);
  const holder = new THREE.Group(); scene.add(holder);
  const BUILD = { dome: buildDome, arch2: buildDoubleArch, window: buildWindow };
  const cache = new Map();
  function get(kind, hero) {
    const k = kind + '|' + hero.metal + '|' + (kind === 'dome' ? hero.pattern : '');
    if (cache.has(k)) return cache.get(k);
    const g = BUILD[kind](hero);
    const box = new THREE.Box3().setFromObject(g), size = new THREE.Vector3(), ctr = new THREE.Vector3(); box.getSize(size); box.getCenter(ctr);
    const s = TARGET_H / size.y; const wrap = new THREE.Group(); g.position.sub(ctr); wrap.add(g); wrap.scale.setScalar(s); wrap.userData = { s, pivots: g.userData.pivots || [] };
    cache.set(k, wrap); return wrap;
  }
  let curP = null, prevP = null, trans = 1, yaw = 0.45, pitch = 0, vel = 0, dragging = false, lastX = 0, lastY = 0, idle = 3, running = false, last = 0, visible = true, active = true, prevYaw = yaw;
  function size() {
    const r = canvas.getBoundingClientRect(); if (!r.width) return;
    renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height;
    const need = TARGET_H + 1.6, fov = camera.fov * Math.PI / 180;
    let dist = need / 2 / Math.tan(fov / 2); const distW = 3.4 / 2 / Math.tan(fov / 2) / camera.aspect; dist = Math.max(dist, distW) * 1.04;
    camera.position.set(0, 0.7, dist); camera.lookAt(0, -0.42, 0); camera.updateProjectionMatrix();
  }
  function show(kind, hero) {
    const next = get(kind, hero); if (next === curP) return;
    if (prevP) holder.remove(prevP);
    prevP = curP; curP = next; trans = prevP ? 0 : 1; holder.add(curP); if (trans === 1) curP.scale.setScalar(curP.userData.s);
  }
  canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; vel = 0; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (!dragging) return; const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; yaw += dx * 0.01; vel = dx * 0.01; pitch = Math.max(-0.35, Math.min(0.35, pitch + dy * 0.003)); idle = 0; });
  ['pointerup', 'pointercancel'].forEach(t => canvas.addEventListener(t, () => { dragging = false; }));

  new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible) start(); }, { threshold: 0.01 }).observe(canvas);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
  function start() { if (running || !active) return; running = true; last = performance.now(); requestAnimationFrame(tick); }
  const ease = x => 1 - Math.pow(1 - x, 3);
  function tick(now) {
    if (!visible || document.hidden || !active) { running = false; return; }
    const dt = Math.min(0.05, (now - last) / 1000); last = now; idle += dt;
    if (!dragging) { vel *= Math.pow(0.04, dt); yaw += vel; if (idle > 2 && !REDUCED) yaw += dt * 0.35; if (idle > 1.5) pitch *= Math.pow(0.3, dt); }
    const omega = (yaw - prevYaw) / Math.max(dt, 1e-3); prevYaw = yaw;
    if (trans < 1) {
      trans = Math.min(1, trans + dt / 0.75); const e = ease(trans);
      if (prevP) { prevP.scale.setScalar(prevP.userData.s * Math.max(0.001, 1 - e)); prevP.rotation.y = e * 1.2; if (trans >= 1) { holder.remove(prevP); prevP = null; } }
      curP.scale.setScalar(curP.userData.s * (0.55 + 0.45 * e)); curP.rotation.y = (1 - e) * -1.2; curP.position.y = (1 - e) * 0.4;
    }
    holder.rotation.set(pitch + (REDUCED ? 0 : Math.sin(now / 2600) * 0.035), yaw, 0);
    holder.position.y = REDUCED ? 0 : Math.sin(now / 1900) * 0.05;
    if (curP && !REDUCED) curP.userData.pivots.forEach((pv, i) => { const u = pv.userData, om = Math.max(-3, Math.min(3, omega)); u.v += (-28 * u.a - 3.2 * u.v - om * 0.9 + Math.sin(now / 900 + i) * 0.15) * dt; u.a = Math.max(-0.7, Math.min(0.7, u.a + u.v * dt)); u.w += (-30 * u.b - 3 * u.w + om * 0.35 * (i - 1)) * dt; u.b = Math.max(-0.6, Math.min(0.6, u.b + u.w * dt)); pv.rotation.x = u.a * 0.5; pv.rotation.z = u.b * 0.4; });
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  window.HERO3D = {
    show,
    relabel() {},
    active(on) { active = on; if (on) start(); }
  };
  const FS = window.ASALA_FS;
  size(); show(FS ? FS.slide() : 'dome', FS ? FS.hero : { metal: 'A', pattern: 'geometric' }); start();
  if (!location.hash.startsWith('#shop')) window.HERO3D.active(true); else window.HERO3D.active(false);
}
