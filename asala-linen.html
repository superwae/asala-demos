<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asala Tatreez Linen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Alexandria:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="brand/asala-tatreez.css">
<style>
/* Layout: the client's favourite tatreez panel (demo 07), rebuilt with the Asala brand book.
   The page is a linen tatreez panel: the hero sits in a cross-stitched frame,
   pieces sit in running-stitch panels, and the footer is a stitched border. Square corners: thread follows the weave. */
:root {
  --linen: #F4F3F1; --linen-2: #ECE9E3; --weave: #DCD7CD; --red: #C6383C; --red-2: #A92D31; --ink: #33342F; --muted: #5F5D55; --teal: #3FA59A; --white: #fff;
  --f-d: "Reem Kufi", "Alexandria", sans-serif; --f-b: "Alexandria", "Segoe UI", Tahoma, sans-serif;
  --gutter: clamp(16px, 4vw, 44px);
  --tz-bg: var(--linen); --tz-panel: #FBFAF8; --tz-line: var(--weave); --tz-font: var(--f-b); --tz-font-d: var(--f-d);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--linen); color: var(--ink); font: 400 1rem/1.7 var(--f-b);
  background-image: repeating-linear-gradient(0deg, transparent 0 3px, rgba(110, 100, 80, .045) 3px 4px), repeating-linear-gradient(90deg, transparent 0 3px, rgba(110, 100, 80, .045) 3px 4px); }
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; }
::selection { background: var(--red); color: var(--linen); }
:focus-visible { outline: 2px dashed var(--red); outline-offset: 3px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: var(--gutter); }
.demo { margin: 0; background: var(--ink); color: #DAD5CC; font-size: .8rem; text-align: center; padding: 6px var(--gutter); }

/* header */
.top { position: sticky; top: 0; z-index: 30; background: var(--linen); }
.top .wrap { display: flex; align-items: center; gap: 28px; min-height: 76px; }
.logo img { height: 26px; width: auto; }
.top nav { display: flex; gap: 4px; }
.top nav button { background: none; border: 0; min-height: 44px; padding: 0 12px; font-weight: 500; }
.top nav button:hover { color: var(--red); text-decoration: underline dashed; text-underline-offset: 7px; }
.tools { display: flex; gap: 8px; margin-inline-start: auto; }
.sq { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 16px; border: 1.5px solid var(--ink); background: transparent; font-weight: 500; text-decoration: none; }
.sq.red { background: var(--red); border-color: var(--red); color: var(--linen); }
.sq.red:hover { background: var(--red-2); }
.sq svg { width: 18px; height: 18px; }
.count { min-width: 22px; height: 22px; padding: 0 5px; background: var(--linen); color: var(--red); font-size: .8rem; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.band { width: 100%; height: 30px; }
.top .band { border-bottom: 1px solid var(--weave); }
@media (max-width: 820px) { .top nav { display: none; } .sq .lbl { display: none; } .top .wrap { gap: 12px; } }

/* hero: the chest panel */
.qabbeh { padding-block: clamp(26px, 5vw, 64px); }
.qabbeh .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(24px, 5vw, 72px); align-items: center; }
.panel { position: relative; aspect-ratio: 1; padding: clamp(26px, 4vw, 40px); }
.panel > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.panel .inner { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--linen-2); box-shadow: inset 0 0 0 1px var(--weave); }
.panel .inner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s ease, transform 6s ease; transform: scale(1.04); }
.panel .inner img.on { opacity: 1; transform: none; }
.dots { position: absolute; bottom: clamp(36px, 5vw, 52px); inset-inline-start: 50%; transform: translateX(50%); display: flex; gap: 6px; z-index: 2; }
[dir="ltr"] .dots { transform: translateX(-50%); }
.dots button { width: 34px; height: 34px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
.dots button::before { content: ""; width: 10px; height: 10px; background: var(--linen); box-shadow: 0 0 0 1px rgba(0,0,0,.25); transform: rotate(45deg); }
.dots button[aria-current="true"]::before { background: var(--red); }
.eyebrow { display: flex; align-items: center; gap: 10px; color: var(--red); font-weight: 600; margin: 0 0 12px; }
.eyebrow canvas { width: 22px; height: 22px; }
.copy h1 { font: 700 clamp(2.3rem, 5.4vw, 4.3rem)/1.15 var(--f-d); margin: 0 0 16px; text-wrap: balance; }
.copy h1 em { font-style: normal; color: var(--red); display: block; }
.copy .lede { margin: 0 0 26px; color: var(--muted); max-width: 44ch; font-size: 1.08rem; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; }
.marks { list-style: none; padding: 0; margin: 26px 0 0; display: grid; gap: 8px; }
.marks li { display: flex; align-items: center; gap: 10px; }
.marks canvas { width: 18px; height: 18px; flex: none; }
@media (max-width: 860px) { .qabbeh .wrap { grid-template-columns: 1fr; } .panel { max-width: 560px; width: 100%; margin-inline: auto; } }

/* section heads */
.sec { padding-block: clamp(40px, 7vw, 86px); }
.head { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: end; margin-bottom: 28px; }
.head h2 { font: 700 clamp(1.9rem, 3.8vw, 2.9rem)/1.2 var(--f-d); margin: 0; }
.head p { margin: 4px 0 0; color: var(--muted); }
.k { color: var(--red); font-weight: 600; margin: 0 0 6px; font-size: .95rem; }

/* tatreez dome: pattern picker */
.motif { background: var(--white); border-block: 1px solid var(--weave); }
.motif .wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(24px, 5vw, 70px); align-items: center; }
.pat-stage { position: relative; aspect-ratio: 416 / 384; background: #F7F5F2; }
.pat-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .4s; }
.pat-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.pats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 22px 0; }
.pat { border: 1.5px solid var(--weave); background: #F7F5F2; padding: 6px 6px 8px; display: grid; gap: 6px; text-align: center; font-size: .82rem; font-weight: 500; }
.pat img { aspect-ratio: 416 / 384; object-fit: contain; width: 100%; }
.pat[aria-pressed="true"] { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); color: var(--red); }
.motif h2 { font: 700 clamp(1.9rem, 3.8vw, 2.8rem)/1.2 var(--f-d); margin: 0 0 12px; }
.motif p.d { color: var(--muted); margin: 0; max-width: 46ch; }
.motif .price { font: 700 1.6rem/1 var(--f-d); margin-inline-end: 14px; }
.buyrow { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
@media (max-width: 860px) { .motif .wrap { grid-template-columns: 1fr; } }
@media (max-width: 460px) { .pats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* product panels */
.filters { display: flex; border: 1.5px solid var(--ink); }
.filters button { min-height: 44px; padding: 0 18px; border: 0; background: transparent; font-weight: 500; }
.filters button + button { border-inline-start: 1.5px solid var(--ink); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--linen); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); border-top: 1.5px dashed var(--red); border-inline-start: 1.5px dashed var(--red); }
.card { position: relative; display: grid; grid-template-rows: auto 1fr; padding: 18px; border-bottom: 1.5px dashed var(--red); border-inline-end: 1.5px dashed var(--red); }
.card::after { content: ""; position: absolute; inset: 7px; border: 2px dashed var(--red); clip-path: inset(0 100% 100% 0); transition: clip-path .7s steps(14, end); pointer-events: none; }
.card:hover::after, .card:focus-within::after { clip-path: inset(0 0 0 0); }
.card .art { position: relative; aspect-ratio: 1; border: 0; background: transparent; padding: 0; width: 100%; overflow: hidden; }
.card .art img { width: 100%; height: 100%; object-fit: cover; box-shadow: 0 0 0 1px var(--weave); transition: transform .6s var(--tz-ease); }
.card .art img.cut { object-fit: contain; background: var(--ink); }
.card:hover .art img { transform: scale(1.04); }
.card .new { position: absolute; top: 12px; inset-inline-start: 12px; z-index: 1; background: var(--teal); color: var(--linen); font: 600 .75rem/1 var(--f-b); padding: 6px 9px; }
.card .meta { display: grid; align-content: start; gap: 2px; padding-top: 14px; }
.card .cat { color: var(--red); font-size: .82rem; font-weight: 500; margin: 0; }
.card h3 { margin: 0; font: 500 1.05rem/1.45 var(--f-b); }
.card h3 button { border: 0; background: none; padding: 0; text-align: start; }
.card h3 button:hover { color: var(--red); }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.card .p { font: 700 1.3rem/1 var(--f-d); font-variant-numeric: tabular-nums; }
.card .p small { font: 400 .8rem var(--f-b); color: var(--muted); }
.add { width: 46px; height: 46px; display: grid; place-items: center; border: 1.5px solid var(--red); background: transparent; color: var(--red); }
.add:hover { background: var(--red); color: var(--linen); }
.add svg { width: 20px; height: 20px; }
@media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .card { padding: 10px; } .card h3 { font-size: .93rem; } .card .p { font-size: 1.1rem; } .add { width: 40px; height: 40px; } }

/* how they are worn */
.looks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2.6vw, 32px); }
.look { display: grid; gap: 10px; border: 0; background: none; padding: 0; text-align: start; }
.look .mini { position: relative; aspect-ratio: 4 / 5; padding: 22px; }
.look .mini canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.look .mini img { width: 100%; height: 100%; object-fit: cover; }
.look b { font: 700 1.3rem/1.2 var(--f-d); }
.look span { color: var(--muted); font-size: .92rem; }
.look:hover b { color: var(--red); }
@media (max-width: 760px) { .looks { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scrollbar-width: none; } .look { flex: 0 0 72%; scroll-snap-align: center; } }

/* gift box */
.gift { background: var(--ink); color: var(--linen); }
.gift .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(24px, 5vw, 70px); align-items: center; }
.gift h2 { font: 700 clamp(1.9rem, 3.8vw, 2.8rem)/1.2 var(--f-d); margin: 0 0 12px; }
.gift p { color: #CFCAC0; margin: 0 0 20px; max-width: 46ch; }
.gift .k { color: #F2C9C0; }
.gift-art { position: relative; padding: 26px; }
.gift-art > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.gift-art img { width: 100%; aspect-ratio: 1594 / 987; object-fit: cover; }
.seals { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
.seal { display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border: 1.5px solid #6A6A63; background: transparent; color: var(--linen); }
.seal i { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 2px var(--ink), 0 0 0 3px #8A887F; }
.seal[aria-pressed="true"] { border-color: var(--linen); }
.seal-note { font-size: .92rem; color: #CFCAC0; min-height: 1.6em; }
.gift .tz-btn.ghost { color: var(--linen); border-color: var(--linen); }
.gift .tz-btn.ghost:hover { background: var(--linen); color: var(--ink); }
@media (max-width: 860px) { .gift .wrap { grid-template-columns: 1fr; } }

/* sketchbook story */
.story .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(24px, 5vw, 70px); align-items: center; }
.sketches { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: end; }
.sketches figure { margin: 0; background: var(--white); padding: 10px; box-shadow: 0 0 0 1px var(--weave); }
.sketches figure:nth-child(2) { transform: translateY(-34px) rotate(1.5deg); }
.sketches img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.story h2 { font: 700 clamp(1.9rem, 3.8vw, 2.8rem)/1.2 var(--f-d); margin: 0 0 14px; }
.story p { color: var(--muted); margin: 0 0 14px; max-width: 48ch; }
.story .cyp { width: 54px; height: 60px; margin-bottom: 14px; }
@media (max-width: 860px) { .story .wrap { grid-template-columns: 1fr; } .sketches figure:nth-child(2) { transform: none; } }

/* steps */
.steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; gap: 4px; padding-top: 14px; border-top: 2px solid var(--ink); }
.steps li::before { content: counter(s, arabic-indic); font: 700 2rem/1 var(--f-d); color: var(--red); }
[dir="ltr"] .steps li::before { content: counter(s); }
.steps b { font-weight: 600; font-size: 1.06rem; } .steps span { color: var(--muted); }
@media (max-width: 720px) { .steps { grid-template-columns: 1fr; } }

/* the hem */
footer { background: var(--red); color: #F8DCDD; }
footer .hem { width: 100%; height: 64px; }
footer .wrap { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 28px; padding-block: 30px 40px; }
footer .logo img { height: 24px; margin-bottom: 14px; }
footer h4 { margin: 0 0 10px; color: var(--linen); font: 600 1rem var(--f-b); }
footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
footer button { border: 0; background: none; padding: 0; color: inherit; min-height: 32px; text-align: start; }
footer button:hover { color: var(--linen); text-decoration: underline; }
.legal { border-top: 1px solid rgba(255,255,255,.25); }
.legal .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding-block: 14px; font-size: .85rem; grid-template-columns: none; }
@media (max-width: 720px) { footer .wrap { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .card::after, .panel .inner img, .card .art img { transition: none; } }
</style>
</head>
<body>
<p class="demo" data-t="demo_note"></p>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Asala"><img src="brand/wordmark-dark.png" alt="ASALA" width="173" height="26"></a>
    <nav data-ta="menu">
      <button type="button" data-filter-go="earrings" data-t="c_earrings"></button>
      <button type="button" data-filter-go="necklace" data-t="c_necklace"></button>
      <button type="button" data-go="motif" data-t="n_motif"></button>
      <button type="button" data-go="gift" data-t="n_gift"></button>
      <button type="button" data-go="story" data-t="our_story"></button>
    </nav>
    <div class="tools">
      <button class="sq" type="button" data-lang-toggle data-t="lang_switch"></button>
      <button class="sq red" type="button" data-open-cart data-ta="cart"><span class="lbl" data-t="cart"></span><span class="count" data-cart-count hidden>0</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></button>
    </div>
  </div>
  <canvas class="band" data-stitch="chain" data-cell="4"></canvas>
</header>

<main id="top">
  <section class="qabbeh">
    <div class="wrap">
      <div class="panel">
        <canvas data-stitch="frame" data-sew data-cell="6"></canvas>
        <div class="inner" id="slides">
          <img class="on" src="brand/woman-arch.jpg" alt="" data-slide="horseshoe">
          <img src="brand/dome-worn.jpg" alt="" data-slide="dome">
          <img src="brand/pat-tatreez.jpg" alt="" data-slide="dome" style="object-fit:contain;background:#F7F5F2">
        </div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="copy">
        <p class="eyebrow"><canvas data-stitch="star"></canvas><span data-t="eyebrow"></span></p>
        <h1><span data-t="h1a"></span> <em data-t="h1b"></em></h1>
        <p class="lede" data-t="lede"></p>
        <div class="btns">
          <button class="tz-btn" type="button" data-go="pieces" data-t="shop_all"></button>
          <button class="tz-btn ghost" type="button" data-go="motif" data-t="cta_motif"></button>
        </div>
        <ul class="marks">
          <li><canvas data-stitch="star"></canvas><span data-t="tz_made"></span></li>
          <li><canvas data-stitch="star"></canvas><span data-t="tz_box"></span></li>
          <li><canvas data-stitch="star"></canvas><span data-t="tz_cod"></span></li>
        </ul>
      </div>
    </div>
  </section>

  <section class="sec motif" id="motif">
    <div class="wrap">
      <div class="pat-stage"><img id="pat-img" src="brand/pat-tatreez.jpg" alt=""><canvas data-stitch="corners" data-cell="4"></canvas></div>
      <div>
        <p class="k" data-t="motif_k"></p>
        <h2 data-t="motif_h"></h2>
        <p class="d" data-t="motif_p"></p>
        <div class="pats" id="pats" role="group"></div>
        <div class="buyrow"><span class="price" id="motif-price"></span><button class="tz-btn" type="button" id="motif-add"></button></div>
      </div>
    </div>
  </section>

  <section class="sec" id="pieces">
    <div class="wrap">
      <div class="head">
        <div><p class="k" data-t="pieces_k"></p><h2 data-t="pieces_h"></h2></div>
        <div class="filters" id="filters" role="group"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <div class="head"><div><p class="k" data-t="worn_k"></p><h2 data-t="worn_h"></h2></div></div>
      <div class="looks">
        <button class="look" type="button" data-open="dome"><div class="mini"><canvas data-stitch="frame" data-sew data-cell="4"></canvas><img src="brand/dome-worn.jpg" alt=""></div><b data-t="look1"></b><span data-t="look1d"></span></button>
        <button class="look" type="button" data-open="horseshoe"><div class="mini"><canvas data-stitch="frame" data-sew data-cell="4"></canvas><img src="brand/horseshoe-close.jpg" alt=""></div><b data-t="look2"></b><span data-t="look2d"></span></button>
        <button class="look" type="button" data-open="branch"><div class="mini"><canvas data-stitch="frame" data-sew data-cell="4"></canvas><img src="brand/cover-ear.jpg" alt=""></div><b data-t="look3"></b><span data-t="look3d"></span></button>
      </div>
    </div>
  </section>

  <section class="sec gift" id="gift">
    <div class="wrap">
      <div class="gift-art"><canvas data-stitch="frame" data-palette="light" data-cell="5" data-sew></canvas><img src="brand/packaging-family.jpg" alt=""></div>
      <div>
        <p class="k" data-t="gift_k"></p>
        <h2 data-t="gift_h"></h2>
        <p data-t="gift_p"></p>
        <div class="seals" id="seals" role="group"></div>
        <p class="seal-note" id="seal-note" aria-live="polite"></p>
        <button class="tz-btn ghost" type="button" data-go="pieces" data-t="gift_cta"></button>
      </div>
    </div>
  </section>

  <section class="sec story" id="story">
    <div class="wrap">
      <div class="sketches">
        <figure><img src="brand/sketch-dome.jpg" alt=""></figure>
        <figure><img src="brand/sketch-plan.jpg" alt=""></figure>
      </div>
      <div>
        <canvas class="cyp" data-stitch="cypress"></canvas>
        <h2 data-t="story_h"></h2>
        <p data-t="story_p1"></p>
        <p data-t="story_p2"></p>
      </div>
    </div>
  </section>

  <section class="sec" style="border-top:1px solid var(--weave)">
    <div class="wrap">
      <div class="head"><h2 data-t="how_h"></h2></div>
      <ol class="steps">
        <li><b data-t="s1"></b><span data-t="s1d"></span></li>
        <li><b data-t="s2"></b><span data-t="s2d"></span></li>
        <li><b data-t="s3"></b><span data-t="s3d"></span></li>
      </ol>
    </div>
  </section>
</main>

<footer>
  <canvas class="hem" data-stitch="hem" data-palette="light" data-cell="5"></canvas>
  <div class="wrap">
    <div><a class="logo" href="#top" aria-label="Asala"><img src="brand/wordmark-white.png" alt="ASALA" width="160" height="24"></a><p data-t="foot_p" style="margin:0;max-width:36ch"></p></div>
    <div><h4 data-t="foot_shop"></h4><ul><li><button type="button" data-filter-go="earrings" data-t="c_earrings"></button></li><li><button type="button" data-filter-go="necklace" data-t="c_necklace"></button></li><li><button type="button" data-go="gift" data-t="n_gift"></button></li></ul></div>
    <div><h4 data-t="foot_help"></h4><ul><li data-t="tz_cod"></li><li data-t="foot_wa"></li><li data-t="foot_care"></li></ul></div>
  </div>
  <div class="legal"><div class="wrap"><span>© 2026 Asala · أصالة</span><span data-t="foot_made"></span></div></div>
</footer>

<script src="store.js"></script>

  var $ = S.$, $$ = S.$$, esc = S.esc, t = S.t;

  var PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

  var STR = {
    ar: {
      n_motif: 'نقوش القبة', n_gift: 'علبة الهدية', eyebrow: 'مجموعة القبة · صُنعت يدوياً في نابلس',

      cta_motif: 'اختاري نقش القبة',
      motif_k: 'من دفتر التصميم', motif_h: 'أقراط القبة، بأربعة نقوش',

      motif_add: 'اختاري المعدن والنقش', pieces_k: 'المتجر', pieces_h: 'كل القطع',
      worn_k: 'على الأذن وعلى الصدر', worn_h: 'كيف تُلبَس',
      look1: 'أقراط القبة', look1d: 'وحدها، والشعر خلف الأذن.', look2: 'قوس الحدوة', look2d: 'للنهار والسهرة.', look3: 'الغصن', look3d: 'سلك فضي يتحرك مع الشعر.',
      gift_k: 'التغليف', gift_h: 'علبة فحمية، وختمٌ بلونكِ', gift_p: 'كل قطعة تصل في علبة أصالة مع بطاقة شكر. اختاري لون الختم للهدية.',
      gift_cta: 'اختاري قطعة للهدية', seal_pick: 'لون الختم: {s}',
      story_h: 'من دفتر مهندسة معمارية',
      story_p1: 'أسّست أصالة مهندسةٌ معمارية من نابلس. كل قطعة تبدأ رسماً لقبة أو قوس أو نافذة مشربية.',
      story_p2: 'ثم تنتقل الرسمة إلى المعدن أو الطين: نحاسٌ مقصوص بالليزر ومطليّ بالذهب، أو فضة 925، أو طين بوليمر بلمسات ذهبية، بحوافّ مشطّبة يدوياً.',
      how_h: 'كيف تطلبين', s1: 'اختاري القطعة', s1d: 'وأضيفيها إلى السلة.', s2: 'اكتبي العنوان', s2d: 'واختاري المدينة لتظهر رسوم التوصيل.', s3: 'ادفعي عند الاستلام', s3d: 'نتصل بكِ لتأكيد الطلب قبل الشحن.',
      foot_p: 'حُليّ مصنوعة يدوياً في نابلس، مستوحاة من العمارة الفلسطينية.', foot_shop: 'تسوّقي', foot_help: 'مساعدة', foot_wa: 'واتساب للطلبات (للتأكيد)', foot_care: 'العناية بالقطع',
      foot_made: 'صُنعت يدوياً في نابلس', per_pair: 'للزوج', choose: 'اختاري', added_box: ''
    },
    en: {
      n_motif: 'Dome patterns', n_gift: 'Gift box', eyebrow: 'The Dome collection · handmade in Nablus',
      h1a: 'Architecture to wear,', h1b: 'from Nablus.',
      lede: 'Pieces drawn from the domes, arches and windows of Palestine, made in Nablus. Each one starts as a sketch, is laser cut and finished by hand, and arrives in a gift box.',
      cta_motif: 'Choose the dome pattern',
      motif_k: 'From the design sketchbook', motif_h: 'The Dome earrings, in four patterns',
      motif_p: 'One of four patterns is cut into the dome: Islamic geometric, eight-point star, mashrabiya or Palestinian tatreez. Choose yours.',
      motif_add: 'Choose metal and pattern', pieces_k: 'The shop', pieces_h: 'Every piece',
      worn_k: 'On the ear and at the neck', worn_h: 'How they are worn',
      look1: 'The Dome', look1d: 'On its own, hair tucked back.', look2: 'The Horseshoe arch', look2d: 'For day and for night.', look3: 'The Branch', look3d: 'A silver wire that moves with your hair.',
      gift_k: 'Packaging', gift_h: 'A charcoal box, sealed in your colour', gift_p: 'Every piece arrives in an Asala box with a thank-you card. Choose the seal colour for a gift.',
      gift_cta: 'Choose a piece to gift', seal_pick: 'Seal colour: {s}',
      story_h: 'From an architect’s sketchbook',
      story_p1: 'Asala was founded by an architect from Nablus. Every piece starts as a drawing of a dome, an arch or a mashrabiya window.',
      story_p2: 'Then the drawing moves into metal or clay: laser-cut brass plated in 18K gold, 925 silver, or polymer clay with gold touches, every edge finished by hand.',

      foot_made: 'Made by hand in Nablus', per_pair: 'per pair', choose: 'Choose', added_box: ''
    }
  };

  function price(p) { return S.money(p.configurable ? A.MATERIALS[0].price : p.price); }
  function card(p) {
    return '<article class="card">' +
      '<button class="art" type="button" data-open="' + p.id + '" aria-label="' + esc(t('view') + ': ' + S.name(p)) + '">' +
      (NEW[p.id] ? '<span class="new">' + esc(t('new')) + '</span>' : '') +
      '<img' + (p.cutout ? ' class="cut"' : '') + ' src="' + p.photo + '" alt="" loading="lazy"></button>' +
      '<div class="meta"><p class="cat">' + esc(S.CATS[p.cat][S.lang()]) + '</p>' +
      '<h3><button type="button" data-open="' + p.id + '">' + esc(S.name(p)) + '</button></h3>' +
      '<div class="row"><span class="p">' + (p.configurable ? '<small>' + esc(t('from')) + '</small> ' : '') + price(p) + '</span>' +
      '<button class="add" type="button" data-qadd="' + p.id + '" aria-label="' + esc(t('add') + ': ' + S.name(p)) + '">' + PLUS + '</button></div></div></article>';
  }
  function renderGrid() {
    $('#filters').innerHTML = ['all', 'earrings', 'necklace'].map(function (c) {
      return '<button type="button" data-filter="' + c + '" aria-pressed="' + (c === filter) + '">' + esc(t('c_' + c)) + '</button>';
    }).join('');
    $('#grid').innerHTML = S.PRODUCTS.filter(function (p) { return filter === 'all' || p.cat === filter; }).map(card).join('');
  }
  function renderMotif() {
    $('#pats').innerHTML = A.PATTERNS.map(function (p) {
      return '<button class="pat" type="button" data-pat="' + p.id + '" aria-pressed="' + (p.id === pat) + '"><img src="' + p.img + '" alt="">' + esc(p[S.lang()]) + '</button>';
    }).join('');
    var cur = A.PATTERNS.filter(function (p) { return p.id === pat; })[0];
    $('#pat-img').src = cur.img; $('#pat-img').alt = cur[S.lang()];
    $('#motif-price').innerHTML = '<small style="font:400 .85rem var(--f-b);color:var(--muted)">' + esc(t('from')) + '</small> ' + S.money(A.MATERIALS[0].price);
    $('#motif-add').textContent = t('motif_add');
  }
  function renderSeals() {
    $('#seals').innerHTML = A.SEALS.map(function (s) {
      return '<button class="seal" type="button" data-seal="' + s.id + '" aria-pressed="' + (s.id === seal) + '"><i style="background:' + s.color + '"></i>' + esc(s[S.lang()]) + '</button>';
    }).join('');
    var s = A.SEALS.filter(function (x) { return x.id === seal; })[0];
    $('#seal-note').textContent = t('seal_pick', { s: s[S.lang()] });
    var cv = document.querySelector('.gift-art canvas'); cv.setAttribute('data-c1', s.id === 'charcoal' ? '#F4F3F1' : s.color === '#E9E2D5' ? '#E9E2D5' : '#F2C9C0'); cv.setAttribute('data-c2', s.color === '#33342F' ? '#C6383C' : s.color); TZ.draw(cv);
  }
  function renderDots() {
    var imgs = $$('#slides img');
    $('#dots').innerHTML = imgs.map(function (_, i) { return '<button type="button" data-slide-go="' + i + '" aria-label="' + (i + 1) + '" aria-current="' + (i === slide) + '"></button>'; }).join('');
  }
  function show(i) {
    var imgs = $$('#slides img'); slide = (i + imgs.length) % imgs.length;
    imgs.forEach(function (im, k) { im.classList.toggle('on', k === slide); });
    renderDots();
  }
  var timer = matchMedia('(prefers-reduced-motion: reduce)').matches ? null : setInterval(function () { show(slide + 1); }, 5200);

  function render() { renderGrid(); renderMotif(); renderSeals(); renderDots(); }
  function go(id) { var el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-filter')) { filter = b.getAttribute('data-filter'); renderGrid(); return; }
    if (b.hasAttribute('data-filter-go')) { filter = b.getAttribute('data-filter-go'); renderGrid(); go('pieces'); return; }
    if (b.hasAttribute('data-go')) { go(b.getAttribute('data-go')); return; }
    if (b.hasAttribute('data-pat')) { pat = b.getAttribute('data-pat'); renderMotif(); return; }
    if (b.id === 'motif-add') { S.openProduct('dome'); return; }
    if (b.hasAttribute('data-seal')) { seal = b.getAttribute('data-seal'); renderSeals(); return; }
    if (b.hasAttribute('data-slide-go')) { if (timer) { clearInterval(timer); timer = null; } show(+b.getAttribute('data-slide-go')); return; }
    if (b.hasAttribute('data-qadd')) {
      var p = S.byId(b.getAttribute('data-qadd'));
      if (p.configurable) S.openProduct(p.id); else S.add(p.id, p.tones[0], '', { meta: p.cat === 'earrings' ? t('per_pair') : '' });
    }
  });

  S.boot({ strings: TZ.strings(STR), render: render, cartKey: 'asala-tz-cart', orderPrefix: 'AS-' });
  render(); TZ.mount(document);
})();
</script>
