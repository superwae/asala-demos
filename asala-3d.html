<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Asala 3D Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* Layout: a dark stage where the Dome earring is a real 3D object (turn it, take it apart), then an ivory
   studio where the visitor designs a whole earring piece by piece and sees it built live in 3D,
   then the ready-made pieces, the story and the bag. */
:root {
  --stage: #1d1e1a; --stage-2: #2a2b26; --on-stage: #f5f1e9; --on-stage-2: rgba(245,241,233,.72); --stage-line: rgba(245,241,233,.16);
  --paper: #fbf8f2; --ivory: #F5F1E9; --sand: #ece5d8; --ink: #33342F; --ink-2: #5c5c55; --line: rgba(51,52,47,.14); --line-2: rgba(51,52,47,.32);
  --red: #C6383C; --red-ink: #a52a2e; --gold: #d9b56c; --gold-ink: #85652a; --error: #b3261e;
  --f-display: "Noto Kufi Arabic", "IBM Plex Sans Arabic", sans-serif; --f: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --gutter: clamp(16px, 4vw, 56px); --r: 14px; --ease: cubic-bezier(.2,.8,.2,1);
  --jewel-shadow: rgba(51,52,47,.2);
  color-scheme: light;
}
* { box-sizing: border-box; }
html.panel-open { overflow: hidden; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.75 var(--f); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: var(--gutter); }
section[id] { scroll-margin-top: 72px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; margin: 0; text-wrap: balance; }
.h2 { font-size: clamp(1.7rem, 3.2vw, 2.6rem); line-height: 1.35; }
.lead { color: var(--ink-2); max-width: 56ch; margin: 10px 0 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 26px; border: 0; border-radius: 999px; background: var(--ink); color: var(--ivory); font-weight: 500; text-decoration: none; transition: background-color .2s, color .2s, box-shadow .2s; }
.btn:hover { background: var(--red); }
.btn.light { background: var(--ivory); color: var(--ink); }
.btn.light:hover { background: #fff; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.ghost:hover { box-shadow: inset 0 0 0 1px var(--ink); background: transparent; }
.btn.ghost-light { background: transparent; color: var(--on-stage); box-shadow: inset 0 0 0 1px var(--stage-line); }
.btn.ghost-light:hover, .btn.ghost-light[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--on-stage); background: rgba(245,241,233,.06); }
.btn.full { width: 100%; }
.btn svg { width: 18px; height: 18px; }

.demo { margin: 0; background: #121310; color: rgba(245,241,233,.7); text-align: center; font-size: .78rem; padding: 6px var(--gutter); }

/* header (dark, joins the stage) */
.header { position: sticky; top: 0; z-index: 30; background: rgba(29,30,26,.92); backdrop-filter: blur(10px); color: var(--on-stage); border-bottom: 1px solid var(--stage-line); }
.header .wrap { display: flex; align-items: center; gap: 18px; min-height: 66px; }
.logo { display: flex; align-items: center; min-height: 44px; }
.logo img { height: 17px; width: auto; max-width: none; }
.nav { display: flex; gap: 4px; margin-inline-start: 18px; }
.nav button { background: none; border: 0; min-height: 44px; padding: 0 12px; color: var(--on-stage-2); }
.nav button:hover { color: var(--on-stage); }
.tools { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; }
.lang { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--stage-line); background: none; color: var(--on-stage); font-size: .85rem; }
.icon { position: relative; width: 44px; height: 44px; border: 0; background: none; color: var(--on-stage); display: grid; place-items: center; }
.icon svg { width: 21px; height: 21px; }
.icon .count { position: absolute; top: 4px; inset-inline-end: 2px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 99px; background: var(--red); color: #fff; font-size: .7rem; display: grid; place-items: center; }
@media (max-width: 760px) { .nav { display: none; } }

/* ---------- hero stage ---------- */
.hero { position: relative; background: radial-gradient(120% 90% at 62% 38%, #34352f 0%, var(--stage) 58%, #151612 100%); color: var(--on-stage); overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: center; gap: 24px; min-height: min(86vh, 820px); padding-block: 28px 40px; }
.hero-copy { display: grid; gap: 20px; justify-items: start; position: relative; z-index: 2; }
.hero h1 { font-size: clamp(2.3rem, 4.8vw, 4.3rem); line-height: 1.3; font-weight: 500; }
html[lang="en"] .hero h1 { line-height: 1.12; }
.hero h1 em { font-style: normal; color: var(--gold); }
.hero-copy p { margin: 0; color: var(--on-stage-2); max-width: 44ch; font-size: 1.06rem; }
.hero-copy .btns { display: flex; gap: 12px; flex-wrap: wrap; }
.stage { position: relative; height: min(74vh, 700px); min-height: 380px; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.stage .floor { position: absolute; left: 50%; bottom: 6%; width: 46%; height: 9%; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(0,0,0,.55), transparent); filter: blur(6px); pointer-events: none; }
.stage .fallback { position: absolute; inset: 8% 18%; display: none; }
.stage .fallback img { width: 100%; height: 100%; object-fit: contain; border-radius: var(--r); }
.no3d .stage .fallback { display: block; }
.no3d .stage canvas, .no3d .drag-hint, .no3d #explode-btn { display: none; }
.drag-hint { position: absolute; bottom: 14px; inset-inline-start: 50%; transform: translateX(-50%); display: inline-flex; gap: 8px; align-items: center; font-size: .82rem; color: var(--on-stage-2); pointer-events: none; transition: opacity .4s; }
[dir="rtl"] .drag-hint { transform: translateX(50%); }
.drag-hint svg { width: 18px; height: 18px; }
.drag-hint.gone { opacity: 0; }
.tag3d { position: absolute; z-index: 3; pointer-events: none; display: flex; align-items: center; gap: 8px; font-size: .82rem; white-space: nowrap; color: var(--on-stage); opacity: 0; transition: opacity .3s; }
.tag3d i { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px rgba(198,56,60,.3); flex: none; }
.tag3d span { background: rgba(29,30,26,.82); border: 1px solid var(--stage-line); padding: 4px 12px; border-radius: 99px; }
.tag3d.flip { flex-direction: row-reverse; }
.quick { position: absolute; inset-inline: 0; bottom: 48px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; z-index: 2; }
.quick-group { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(29,30,26,.7); border: 1px solid var(--stage-line); }
.qbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; background: none; display: grid; place-items: center; }
.qbtn span { width: 26px; height: 26px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); background-size: cover; background-position: center; }
.qbtn[aria-checked="true"] span { box-shadow: 0 0 0 2px var(--stage), 0 0 0 4px var(--on-stage); }
.price-pill { font-variant-numeric: tabular-nums; color: var(--on-stage); padding: 0 14px; font-size: .92rem; min-height: 44px; display: flex; align-items: center; }
@media (max-width: 900px) {
  .hero .wrap { grid-template-columns: 1fr; min-height: 0; padding-block: 0 34px; gap: 6px; }
  .stage { order: -1; height: 58vh; min-height: 340px; margin-inline: calc(-1 * var(--gutter)); }
  .quick { bottom: 40px; }
  .drag-hint { bottom: 8px; }
}

/* ---------- drawing to 3D ---------- */
.journey { padding-block: clamp(56px, 8vw, 104px); }
.steps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2vw, 26px); margin-top: 34px; }
.steps3 figure { margin: 0; }
.steps3 .ph { aspect-ratio: 4 / 5; border-radius: var(--r); overflow: hidden; background: var(--sand); }
.steps3 .ph img { width: 100%; height: 100%; object-fit: cover; }
.steps3 .ph.contain { background: #f3f1ee; } .steps3 .ph.contain img { object-fit: contain; padding: 8%; }
.steps3 figcaption { margin-top: 12px; display: grid; gap: 2px; }
.steps3 figcaption b { font-family: var(--f-display); font-weight: 500; font-size: 1.05rem; }
.steps3 figcaption span { color: var(--ink-2); font-size: .92rem; }
.steps3 .n { color: var(--red-ink); font-variant-numeric: tabular-nums; margin-inline-end: 6px; }
@media (max-width: 760px) { .steps3 { grid-template-columns: 1fr 1fr; } .steps3 figure:last-child { grid-column: 1 / -1; } .steps3 figure:last-child .ph { aspect-ratio: 16 / 10; } }

/* ---------- studio ---------- */
.studio { background: var(--ivory); padding-block: clamp(56px, 7vw, 96px); border-block: 1px solid var(--line); }
.studio-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: clamp(20px, 3vw, 44px); align-items: start; margin-top: 30px; }
.viewer { position: sticky; top: 84px; border-radius: 22px; overflow: hidden; background: radial-gradient(90% 80% at 50% 40%, #3a3b35, var(--stage) 70%); aspect-ratio: 1 / 1.02; color: var(--on-stage); }
.viewer canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; }
.viewer .fallback { position: absolute; inset: 12%; display: none; }
.viewer .fallback img { width: 100%; height: 100%; object-fit: contain; }
.no3d .viewer .fallback { display: block; }
.no3d .viewer canvas, .no3d .views { display: none; }
.viewer .views { position: absolute; top: 12px; inset-inline-end: 12px; display: flex; gap: 4px; padding: 4px; border-radius: 99px; background: rgba(29,30,26,.72); border: 1px solid var(--stage-line); }
.viewer .views button { min-height: 44px; min-width: 48px; padding: 0 12px; border-radius: 99px; border: 0; background: none; color: var(--on-stage-2); font-size: .82rem; }
.viewer .views button[aria-pressed="true"] { background: var(--on-stage); color: var(--ink); }
.viewer .dims { position: absolute; bottom: 14px; inset-inline-start: 16px; font-size: .82rem; color: var(--on-stage-2); font-variant-numeric: tabular-nums; }
.viewer .no3d-note { position: absolute; bottom: 14px; inset-inline: 16px; font-size: .82rem; color: var(--on-stage-2); display: none; }
.no3d .viewer .no3d-note { display: block; }
.panel { display: grid; gap: 8px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.preset { min-height: 44px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--paper); font-size: .9rem; }
.preset:hover { border-color: var(--ink); }
.opt { border: 0; padding: 18px 0; margin: 0; border-top: 1px solid var(--line); min-width: 0; }
.opt legend { padding: 0; font-weight: 500; display: flex; gap: 10px; align-items: baseline; width: 100%; }
.opt legend .num { color: var(--red-ink); font-variant-numeric: tabular-nums; font-size: .9rem; }
.opt legend .val { margin-inline-start: auto; color: var(--ink-2); font-weight: 400; font-size: .9rem; }
.choices { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.ch { min-height: 44px; padding: 6px 16px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--paper); display: inline-flex; align-items: center; gap: 10px; font-size: .92rem; text-align: start; }
.ch:hover { border-color: var(--ink); }
.ch[aria-checked="true"] { background: var(--ink); color: var(--ivory); border-color: var(--ink); }
.ch svg { width: 26px; height: 26px; flex: none; }
.ch .sw { width: 22px; height: 22px; border-radius: 50%; background-size: cover; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.ch small { display: block; font-size: .78rem; opacity: .8; line-height: 1.3; }
.ch.pat { padding: 6px 14px 6px 6px; }
[dir="rtl"] .ch.pat { padding: 6px 6px 6px 14px; }
.ch.pat canvas { width: 40px; height: 22px; border-radius: 22px 22px 3px 3px; background: #2b2c27; flex: none; }
.rangerow { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; margin-top: 12px; font-size: .88rem; color: var(--ink-2); }
.rangerow input[type="range"] { width: 100%; accent-color: var(--ink); min-height: 44px; }
.engrave { margin-top: 12px; display: grid; gap: 6px; }
.engrave input { min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--paper); font-size: 1.05rem; }
.engrave small { color: var(--ink-2); font-size: .82rem; }
.summary { margin-top: 10px; padding: 18px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); display: grid; gap: 12px; }
.summary .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.summary .price { font-size: 1.6rem; font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.summary .spec { margin: 0; color: var(--ink-2); font-size: .9rem; }
.summary .note { margin: 0; color: var(--ink-2); font-size: .8rem; }
@media (max-width: 900px) {
  .studio-grid { grid-template-columns: 1fr; }
  .viewer { top: 66px; aspect-ratio: auto; height: 44vh; z-index: 5; border-radius: 0; margin-inline: calc(-1 * var(--gutter)); }
}

/* ---------- ready-made pieces ---------- */
.pieces { padding-block: clamp(56px, 7vw, 96px); }
.grid { list-style: none; margin: 30px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px 14px; }
@media (max-width: 980px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 680px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 10px; } }
.card { position: relative; display: grid; gap: 4px; align-content: start; }
.card .media { position: relative; aspect-ratio: 4 / 5; border-radius: var(--r); overflow: hidden; background: var(--sand); }
.card .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .7s var(--ease); }
.card .media.cut img { object-fit: contain; padding: 12%; }
@media (hover: hover) { .card:hover .media img { transform: scale(1.04); } }
.card .link { position: absolute; inset: 0; z-index: 1; border: 0; background: none; padding: 0; }
.card h3 { font-family: var(--f); font-weight: 500; font-size: .98rem; margin-top: 10px; line-height: 1.45; }
.card .price { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.card .act { position: relative; z-index: 2; margin-top: 8px; min-height: 44px; border-radius: 99px; border: 1px solid var(--line-2); background: none; font-size: .88rem; }
.card .act:hover { border-color: var(--ink); }
.badge { position: absolute; top: 10px; inset-inline-start: 10px; z-index: 2; background: var(--red); color: #fff; font-size: .74rem; padding: 2px 10px; border-radius: 99px; pointer-events: none; }

/* ---------- packaging + footer ---------- */
.pack { padding-block: 0 clamp(56px, 7vw, 96px); }
.pack .box { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border-radius: 22px; overflow: hidden; background: var(--ink); color: var(--ivory); }
.pack .box img { width: 100%; height: 100%; object-fit: cover; min-height: 320px; }
.pack .txt { padding: clamp(26px, 4vw, 56px); display: grid; align-content: center; gap: 14px; }
.pack .txt p { margin: 0; color: rgba(245,241,233,.78); }
.pack .txt small { color: rgba(245,241,233,.6); }
@media (max-width: 760px) { .pack .box { grid-template-columns: 1fr; } .pack .box img { min-height: 0; aspect-ratio: 16 / 10; } }
.footer { background: var(--stage); color: var(--on-stage-2); padding-block: 40px; font-size: .88rem; }
.footer .wrap { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: center; }
.footer img { height: 15px; width: auto; }

/* ---------- product sheet + bag (engine) ---------- */
.sheet, .drawer { position: fixed; inset: 0; z-index: 50; background: rgba(20,20,17,.55); display: flex; opacity: 0; transition: opacity .25s; }
.is-open { opacity: 1; }
.sheet { align-items: center; justify-content: center; padding: 16px; }
.sheet-card { position: relative; width: min(900px, 100%); max-height: calc(100% - 16px); overflow: auto; display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); border-radius: 20px; transform: translateY(14px); transition: transform .3s var(--ease); }
.is-open .sheet-card { transform: none; }
.s-art { position: relative; aspect-ratio: 4 / 5; background: var(--sand); }
.s-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.s-art.cut img { object-fit: contain; padding: 12%; }
.s-art canvas { position: absolute; inset: 10%; width: 80%; height: 80%; }
.s-info { padding: 30px 26px; display: grid; gap: 12px; align-content: start; }
.s-info h2 { font-size: 1.6rem; line-height: 1.35; }
.s-cat { margin: 0; color: var(--ink-2); font-size: .86rem; }
.s-price { margin: 0; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.s-desc { margin: 0; color: var(--ink-2); }
fieldset.tones { border: 0; padding: 0; margin: 0; }
fieldset.tones legend { font-size: .86rem; color: var(--ink-2); padding: 0; margin-bottom: 6px; }
[data-sheet-tones] { display: flex; gap: 8px; flex-wrap: wrap; }
.tone { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--paper); font-size: .9rem; }
.tone[aria-checked="true"] { background: var(--ink); color: var(--ivory); border-color: var(--ink); }
.tone-dot { width: 14px; height: 14px; border-radius: 50%; }
.x { position: absolute; top: 12px; inset-inline-end: 12px; z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--paper); display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.14); }
.x svg { width: 18px; height: 18px; }
@media (max-width: 720px) { .sheet { align-items: end; padding: 0; } .sheet-card { grid-template-columns: 1fr; max-height: 94%; border-radius: 20px 20px 0 0; } .s-art { aspect-ratio: 1; } }
.drawer { justify-content: flex-end; }
.drawer-card { width: min(420px, 100%); height: 100%; overflow: auto; background: var(--paper); padding: 20px 22px 28px; transform: translateX(40px); transition: transform .3s var(--ease); }
[dir="rtl"] .drawer-card { transform: translateX(-40px); }
.drawer.is-open .drawer-card { transform: none; }
.d-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.d-head h2 { font-size: 1.4rem; }
.d-head span { color: var(--ink-2); font-size: .88rem; }
.d-head .x { position: static; margin-inline-start: auto; box-shadow: none; background: var(--ivory); }
.empty { text-align: center; color: var(--ink-2); padding: 30px 0; display: grid; gap: 14px; justify-items: center; }
[data-cart-list] { list-style: none; padding: 16px 0 0; margin: 0; display: grid; gap: 16px; border-top: 1px solid var(--line); }
.ci { display: grid; grid-template-columns: 76px 1fr auto; gap: 12px; }
.ci-img { position: relative; width: 76px; height: 92px; border-radius: 10px; overflow: hidden; background: var(--stage); }
.ci-img img { width: 100%; height: 100%; object-fit: cover; }
.ci-name { margin: 0; line-height: 1.4; font-weight: 500; }
.ci-meta { margin: 2px 0 8px; color: var(--ink-2); font-size: .82rem; line-height: 1.5; }
.ci-row { display: flex; gap: 10px; align-items: center; }
.ci-qty { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 99px; }
.ci-qty button { width: 44px; height: 44px; border: 0; background: none; }
.ci-qty output { min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.ci-remove { border: 0; background: none; color: var(--ink-2); text-decoration: underline; min-height: 44px; font-size: .84rem; }
.ci-price { margin: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sums { margin: 18px 0 6px; display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; font-variant-numeric: tabular-nums; }
.sums div { display: flex; justify-content: space-between; } .sums dd { margin: 0; } .sums dt { color: var(--ink-2); }
.sums .grand { font-size: 1.1rem; } .sums .grand dt { color: var(--ink); }
.tax-note { margin: 0 0 14px; color: var(--ink-2); font-size: .82rem; }
.form { display: grid; gap: 14px; }
.form label { display: block; font-size: .86rem; color: var(--ink-2); margin-bottom: 4px; }
.form input, .form select, .form textarea { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: #fff; }
.form textarea { min-height: 80px; }
.form [aria-invalid="true"] { border-color: var(--error); }
.form input[type="tel"] { direction: ltr; }
[dir="rtl"] .form input[type="tel"] { text-align: right; }
.err { color: var(--error); font-size: .84rem; margin: 2px 0 0; min-height: 1em; }
[data-pay-list] { display: grid; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; }

<script>
/* Page logic (no 3D here): the design state, the studio controls, price, cards, bag. The 3D module below
   registers window.A3D and reads the same state through window.ASALA_UI. */
(function () {
  var S = window.Store, A = window.ASALA;
  A.install(S);
  S.PRODUCTS.push({ id: 'custom', cat: 'earrings', coll: 'dome', price: 180, tones: ['gold', 'silver'], photo: 'brand/dome-render.jpg', photoTone: 'gold', madeToOrder: true,
    ar: 'تصميمك الخاص', en: 'Your own design', dAr: 'قطعة صمّمتِها في استوديو أصالة.', dEn: 'A piece you designed in the ASALA studio.' });
  document.getElementById('mark-ok').innerHTML = A.MARK; document.querySelector('#mark-ok svg').style.cssText = 'width:100%;height:auto;display:block';
  function T(k) { return S.t(k); }
  function L2(ar, en) { return S.lang() === 'ar' ? ar : en; }

  // ---- options (labels in both languages) ----
  var O = {
    shape: [{ id: 'dome', ar: 'قبة', en: 'Dome', dAr: 'نصف دائرة', dEn: 'Half circle' }, { id: 'pointed', ar: 'محراب', en: 'Mihrab', dAr: 'قوس مدبّب', dEn: 'Pointed arch' }, { id: 'horseshoe', ar: 'حدوة', en: 'Horseshoe', dAr: 'قوس أندلسي', dEn: 'Andalusian arch' }],
    arches: [{ id: 3, ar: '3 أقواس', en: '3 arches' }, { id: 4, ar: '4 أقواس', en: '4 arches' }, { id: 5, ar: '5 أقواس', en: '5 arches' }],
    pattern: [{ id: 'geometric', ar: 'هندسي إسلامي', en: 'Islamic geometric' }, { id: 'star', ar: 'نجمة ثمانية', en: 'Eight-point star' }, { id: 'mashrabiya', ar: 'مشربية', en: 'Mashrabiya' }, { id: 'tatreez', ar: 'تطريز فلسطيني', en: 'Palestinian tatreez' }, { id: 'open', ar: 'مفتوحة', en: 'Open' }],
    drops: [{ id: 0, ar: 'بلا متدليات', en: 'No drops' }, { id: 1, ar: 'واحدة', en: 'One' }, { id: 3, ar: 'ثلاث', en: 'Three' }],
    dropShape: [{ id: 'diamond', ar: 'معيّن', en: 'Diamond' }, { id: 'circle', ar: 'دائرة', en: 'Circle' }, { id: 'tear', ar: 'قطرة', en: 'Drop' }, { id: 'crescent', ar: 'هلال', en: 'Crescent' }],
    metal: [{ id: 'A', sw: 'brand/fin-gold-shiny.jpg' }, { id: 'B', sw: 'brand/fin-silver-matte.jpg' }, { id: 'C', sw: 'brand/fin-gold-matte.jpg' }],
    size: [{ id: 'S', ar: 'صغير', en: 'Small', k: .88 }, { id: 'M', ar: 'وسط', en: 'Medium', k: 1 }, { id: 'L', ar: 'كبير', en: 'Large', k: 1.14 }],
    qty: [{ id: 'pair', ar: 'زوج', en: 'Pair' }, { id: 'single', ar: 'فردة واحدة', en: 'Single' }]
  };
  var PRESETS = [
    { id: 'classic', ar: 'قبة الصخرة', en: 'Dome of the Rock', o: { shape: 'dome', arches: 4, pattern: 'geometric', drops: 3, dropShape: 'diamond', metal: 'A' } },
    { id: 'mihrab', ar: 'المحراب', en: 'The mihrab', o: { shape: 'pointed', arches: 3, pattern: 'star', drops: 1, dropShape: 'tear', metal: 'B' } },
    { id: 'andalus', ar: 'الأندلس', en: 'Andalus', o: { shape: 'horseshoe', arches: 5, pattern: 'mashrabiya', drops: 3, dropShape: 'circle', metal: 'C' } },
    { id: 'blank', ar: 'من الصفر', en: 'From scratch', o: { shape: 'dome', arches: 4, pattern: 'open', drops: 0, dropShape: 'diamond', metal: 'A' } }
  ];
  var design = { shape: 'dome', arches: 4, pattern: 'geometric', weight: 1, density: 1, drops: 3, dropShape: 'diamond', metal: 'A', size: 'M', engrave: '', qty: 'pair' };
  var hero = { pattern: 'geometric', metal: 'A' };
  var KEYS = ['shape', 'arches', 'pattern', 'weight', 'density', 'drops', 'dropShape', 'metal', 'size', 'qty'];
  (function readLink() {
    var m = /#d=([^&]+)/.exec(location.hash); if (!m) return;
    var v = decodeURIComponent(m[1]).split('~');
    KEYS.forEach(function (k, i) { var x = v[i]; if (x == null || x === '') return; if (['arches', 'weight', 'density', 'drops'].indexOf(k) > -1) x = Number(x);
      if (k === 'weight' || k === 'density') { if (x >= 0 && x <= 2) design[k] = x; return; }
      if (O[k] && find(O[k], x)) design[k] = x; });
    if (v[10]) design.engrave = v[10].slice(0, 10);
  })();
  function writeLink() {
    var v = KEYS.map(function (k) { return design[k]; }).concat([design.engrave.trim()]).join('~');
    try { history.replaceState(null, '', '#d=' + encodeURIComponent(v)); } catch (e) {}
  }

  function find(list, id) { return list.filter(function (x) { return x.id === id; })[0]; }
  function mat(id) { return A.MATERIALS.filter(function (m) { return m.id === id; })[0]; }
  function label(key, id) { if (key === 'metal') return mat(id)[S.lang()]; return find(O[key], id)[S.lang()]; }

  // Placeholder price rules, stated on the page as an estimate for the shop to set
  function priceOf(d) {
    var p = mat(d.metal).price;
    p += { 0: -25, 1: -15, 3: 0 }[d.drops];
    if (d.pattern === 'open') p -= 10;
    p += { S: -10, M: 0, L: 25 }[d.size];
    if (d.engrave.trim()) p += 20;
    if (d.qty === 'single') p = Math.round(p * 0.6);
    return p;
  }
  function specOf(d) {
    var parts = [label('shape', d.shape), label('arches', d.arches), label('pattern', d.pattern)];
    parts.push(d.drops ? label('drops', d.drops) + ' · ' + label('dropShape', d.dropShape) : label('drops', 0));
    parts.push(mat(d.metal)[S.lang()], label('size', d.size));
    if (d.engrave.trim()) parts.push('«' + d.engrave.trim() + '»');
    parts.push(label('qty', d.qty));
    return parts.join(' · ');
  }

  // ---- studio controls ----
  var SHAPE_ICON = {
    dome: '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 22V13a9 9 0 0 1 18 0v9Z"/></svg>',
    pointed: '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 22v-9C4 8 9 5 13 2c4 3 9 6 9 11v9Z"/></svg>',
    horseshoe: '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 22v-5.5A9.5 9.5 0 1 1 20 16.5V22Z"/></svg>'
  };
  var DROP_ICON = {
    diamond: '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 3l8 10-8 10-8-10Z"/></svg>',
    circle: '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="13" cy="13" r="8"/></svg>',
    tear: '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 3c3 5 7 8 7 12a7 7 0 0 1-14 0c0-4 4-7 7-12Z"/></svg>',
    crescent: '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 4a9 9 0 1 0 5 13A8 8 0 0 1 17 4Z"/></svg>'
  };
  function chHTML(key, o, checked) {
    var inner = '';
    if (key === 'shape') inner = SHAPE_ICON[o.id] + '<span>' + S.esc(o[S.lang()]) + '<small>' + S.esc(L2(o.dAr, o.dEn)) + '</small></span>';
    else if (key === 'dropShape') inner = DROP_ICON[o.id] + '<span>' + S.esc(o[S.lang()]) + '</span>';
    else if (key === 'metal') { var m = mat(o.id); inner = '<span class="sw" style="background-image:url(' + o.sw + ')"></span><span>' + S.esc(m[S.lang()]) + '<small>' + S.esc(L2(m.nAr, m.nEn)) + '</small></span>'; }
    else if (key === 'pattern') inner = '<canvas width="80" height="44" data-patthumb="' + o.id + '"></canvas><span>' + S.esc(o[S.lang()]) + '</span>';
    else inner = '<span>' + S.esc(o[S.lang()]) + '</span>';
    return '<button type="button" class="ch' + (key === 'pattern' ? ' pat' : '') + '" role="radio" aria-checked="' + checked + '" data-k="' + key + '" data-v="' + o.id + '">' + inner + '</button>';
  }
  function renderControls() {
    S.$$('.choices[data-key]').forEach(function (g) {
      var key = g.getAttribute('data-key');
      g.innerHTML = O[key].map(function (o) { return chHTML(key, o, String(design[key]) === String(o.id)); }).join('');
    });
