<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Siwar Dawn Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Layout: a Shopify Dawn-style storefront, rebuilt by hand. Image banner, rich text, featured collection, collection list, image with text, multicolumn, email signup, footer. Real product photos. Follows light and dark theme. */
:root {
  --bg: #ffffff; --bg-2: #f3f3f3; --fg: #121212; --fg-75: rgba(18,18,18,.75); --line: rgba(18,18,18,.12);
  --btn: #121212; --on-btn: #ffffff; --badge: #334fb4; --on-badge: #ffffff; --error: #b3261e; --overlay: rgba(0,0,0,.42);
  --f: "Rubik", "Segoe UI", Tahoma, sans-serif;
  --page: 1200px; --gutter: clamp(16px, 4vw, 50px);
  --jewel-shadow: rgba(18, 18, 18, .2);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121212; --bg-2: #1e1e1e; --fg: #f3f3f3; --fg-75: rgba(243,243,243,.75); --line: rgba(243,243,243,.14);
  --btn: #f3f3f3; --on-btn: #121212; --badge: #8fa5f0; --on-badge: #121212; --error: #ff8a80; --jewel-shadow: rgba(0,0,0,.55); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121212; --bg-2: #1e1e1e; --fg: #f3f3f3; --fg-75: rgba(243,243,243,.75); --line: rgba(243,243,243,.14);
  --btn: #f3f3f3; --on-btn: #121212; --badge: #8fa5f0; --on-badge: #121212; --error: #ff8a80; --jewel-shadow: rgba(0,0,0,.55); color-scheme: dark; }
* { box-sizing: border-box; }
html.panel-open { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 1rem/1.75 var(--f); letter-spacing: .01em; }
::selection { background: var(--fg); color: var(--bg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; box-shadow: 0 0 0 5px var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
.page { max-width: var(--page); margin: 0 auto; padding-inline: var(--gutter); }
.h0 { font-weight: 400; font-size: clamp(2.2rem, 5vw, 4rem); line-height: 1.2; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.h1 { font-weight: 400; font-size: clamp(1.7rem, 3.2vw, 2.6rem); line-height: 1.3; margin: 0; text-wrap: balance; }
.h2 { font-weight: 400; font-size: clamp(1.4rem, 2.2vw, 1.9rem); line-height: 1.3; margin: 0; }
.sub { color: var(--fg-75); }

.button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 30px; border: 0; background: var(--btn); color: var(--on-btn); font-size: .98rem; letter-spacing: .06em; text-decoration: none; position: relative; transition: box-shadow .1s; }
.button:hover { box-shadow: 0 0 0 1.3px var(--btn); }
.button--secondary { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.button--secondary:hover { box-shadow: inset 0 0 0 2px var(--fg); }
.button--light { background: #fff; color: #121212; }
.button--light-outline { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px #fff; }
.full { width: 100%; }

.announcement { background: var(--bg); border-bottom: 1px solid var(--line); text-align: center; font-size: .82rem; letter-spacing: .08em; padding: 10px var(--gutter); margin: 0; }
.demo { background: var(--bg-2); color: var(--fg-75); text-align: center; font-size: .78rem; padding: 6px var(--gutter); margin: 0; }

/* header */
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.header .page { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px; min-height: 76px; }
.logo { font-size: 1.6rem; font-weight: 500; color: var(--fg); text-decoration: none; letter-spacing: .02em; }
.menu { display: flex; gap: 6px; }
.menu button, .menu a { background: none; border: 0; padding: 12px; font-size: .95rem; color: var(--fg-75); text-decoration: none; }
.menu button:hover, .menu a:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }
.icons { display: flex; align-items: center; }
.icon { position: relative; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--fg); }
.icon svg { width: 20px; height: 20px; }
.icon .count { position: absolute; bottom: 4px; inset-inline-end: 2px; min-width: 19px; height: 19px; border-radius: 50%; background: var(--btn); color: var(--on-btn); font-size: .68rem; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.lang { min-height: 44px; padding: 0 12px; border: 1px solid var(--fg-75); background: none; font-size: .85rem; margin-inline-end: 6px; }
.burger { display: none; }
@media (max-width: 900px) {
  .header .page { grid-template-columns: auto 1fr auto; }
  .menu { display: none; }
  .burger { display: grid; }
  .logo { justify-self: center; }
}
.mobile-menu { border-top: 1px solid var(--line); padding: 8px var(--gutter) 16px; display: grid; }
.mobile-menu button { text-align: start; background: none; border: 0; padding: 14px 0; font-size: 1.1rem; border-bottom: 1px solid var(--line); }

/* search */
.search-bar { border-top: 1px solid var(--line); padding-block: 14px; }
.search-field { position: relative; }
.search-field input { width: 100%; min-height: 48px; padding: 0 16px; border: 1px solid var(--fg-75); background: var(--bg); font-size: 1rem; }
.search-results { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.search-results button { width: 100%; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 6px; background: none; border: 0; text-align: start; }
.search-results button:hover { background: var(--bg-2); }
.search-results img, .search-results canvas { width: 52px; height: 52px; object-fit: cover; background: var(--bg-2); }
.search-results .pr { color: var(--fg-75); font-variant-numeric: tabular-nums; }

/* image banner */
.banner { position: relative; min-height: clamp(420px, 62vw, 640px); display: grid; align-items: end; color: #fff; overflow: hidden; }
.banner picture, .banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.banner img { object-position: 50% 35%; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.12) 60%); }
.banner .page { position: relative; z-index: 1; width: 100%; padding-block: clamp(32px, 6vw, 72px); display: grid; gap: 18px; justify-items: start; }
.banner p { margin: 0; max-width: 40ch; color: rgba(255,255,255,.9); font-size: 1.05rem; }
.banner .btns { display: flex; gap: 12px; flex-wrap: wrap; }

.section { padding-block: clamp(40px, 6vw, 72px); }
.rich { text-align: center; display: grid; gap: 14px; justify-items: center; }
.rich p { margin: 0; max-width: 56ch; color: var(--fg-75); }

/* product card */
.title-row { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 10px; list-style: none; margin: 0; padding: 0; }
@media (max-width: 990px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 750px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 8px; } }
.card { position: relative; display: grid; gap: 6px; }
.card .media { position: relative; aspect-ratio: 4 / 5; background: var(--bg-2); overflow: hidden; }
.card .media img, .card .media canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.card .media canvas { inset: 8%; width: 84%; height: 84%; }
.card:hover .media img { transform: scale(1.03); }
.card .link { position: absolute; inset: 0; z-index: 1; background: none; border: 0; padding: 0; }
.card h3 { margin: 6px 0 0; font-size: .98rem; font-weight: 400; line-height: 1.45; }
.card:hover h3 { text-decoration: underline; text-underline-offset: 3px; }
.card .price { color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.badge { position: absolute; bottom: 10px; inset-inline-start: 10px; z-index: 2; background: var(--badge); color: var(--on-badge); font-size: .75rem; padding: 2px 12px; border-radius: 40px; letter-spacing: .04em; }
.quick-add { position: relative; z-index: 2; min-height: 44px; margin-top: 6px; background: transparent; color: var(--fg); border: 0; box-shadow: inset 0 0 0 1px var(--fg-75); font-size: .9rem; letter-spacing: .06em; }
.quick-add:hover { box-shadow: inset 0 0 0 2px var(--fg); }
.center { text-align: center; margin-top: 36px; }

/* collection list */
.collections { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.coll { position: relative; display: grid; gap: 10px; background: none; border: 0; padding: 0; text-align: start; }
.coll .media { aspect-ratio: 4 / 5; overflow: hidden; background: var(--bg-2); }
.coll img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.coll:hover img { transform: scale(1.03); }
.coll span { font-size: 1.15rem; display: inline-flex; align-items: center; gap: 8px; }
.coll svg { width: 16px; height: 16px; transition: transform .2s; }
[dir="rtl"] .coll svg { transform: scaleX(-1); }
.coll:hover svg { transform: translateX(4px); }
[dir="rtl"] .coll:hover svg { transform: scaleX(-1) translateX(4px); }
@media (max-width: 750px) { .collections { grid-template-columns: 1fr 1fr; } .collections .coll:last-child { grid-column: span 2; } .collections .coll:last-child .media { aspect-ratio: 16 / 9; } }

/* image with text */
.iwt { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-2); }
.iwt .media { position: relative; min-height: 420px; }
.iwt .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.iwt .content { padding: clamp(28px, 5vw, 64px); display: grid; align-content: center; gap: 16px; }
.iwt .content p { margin: 0; color: var(--fg-75); }
.iwt .preview { position: relative; height: 160px; background: var(--bg); }
.iwt .preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.iwt input { width: 100%; min-height: 48px; padding: 0 16px; border: 1px solid var(--fg-75); background: var(--bg); font: 700 1.4rem "Aref Ruqaa", serif; }
.iwt label { font-size: .9rem; color: var(--fg-75); }
@media (max-width: 750px) { .iwt { grid-template-columns: 1fr; } .iwt .media { min-height: 300px; } }

/* multicolumn */
.multi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; text-align: center; }
.multi svg { width: 34px; height: 34px; margin: 0 auto 12px; display: block; }
.multi h3 { margin: 0 0 6px; font-weight: 500; font-size: 1.1rem; }
.multi p { margin: 0; color: var(--fg-75); font-size: .95rem; }
@media (max-width: 750px) { .multi { grid-template-columns: 1fr; } }

/* newsletter */
.news { text-align: center; display: grid; gap: 14px; justify-items: center; }
.news form { width: min(440px, 100%); position: relative; }
.news input { width: 100%; min-height: 50px; padding-block: 0; padding-inline: 16px 52px; border: 1px solid var(--fg-75); background: var(--bg); }
.news button { position: absolute; inset-inline-end: 0; top: 0; width: 50px; height: 50px; background: none; border: 0; display: grid; place-items: center; }
.news button svg { width: 18px; height: 18px; }
[dir="rtl"] .news button svg { transform: scaleX(-1); }
.news .msg { margin: 0; font-size: .9rem; min-height: 1.4em; }

/* footer */
.footer { border-top: 1px solid var(--line); padding-block: 48px 30px; font-size: .92rem; }
.footer .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
.footer h4 { margin: 0 0 12px; font-weight: 500; font-size: 1rem; }
.footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; color: var(--fg-75); }
.footer b { color: var(--fg); font-weight: 500; user-select: all; font-variant-numeric: tabular-nums; }
.footer .bottom { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 14px; color: var(--fg-75); font-size: .8rem; }
.pay-icons { display: flex; gap: 6px; flex-wrap: wrap; }
.pay-icons span { border: 1px solid var(--line); padding: 2px 8px; font-size: .72rem; letter-spacing: .04em; }
@media (max-width: 750px) { .footer .cols { grid-template-columns: 1fr; } }

/* panels: quick view + cart drawer */
.sheet, .drawer { position: fixed; inset: 0; z-index: 50; background: rgba(18,18,18,.45); display: flex; opacity: 0; transition: opacity .25s; }
.is-open { opacity: 1; }
.sheet { align-items: center; justify-content: center; padding: 16px; }
.sheet-card { position: relative; width: min(980px, 100%); max-height: calc(100% - 16px); overflow: auto; display: grid; grid-template-columns: 1.15fr 1fr; background: var(--bg); transform: translateY(14px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.is-open .sheet-card { transform: none; }
.sheet-art { position: relative; aspect-ratio: 4 / 5; background: var(--bg-2); }
.sheet-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sheet-art canvas { position: absolute; inset: 8%; width: 84%; height: 84%; }
.sheet-info { padding: 36px 32px; display: flex; flex-direction: column; gap: 14px; }
.sheet-info h2 { font-weight: 400; font-size: 2rem; line-height: 1.25; margin: 0; }
.sheet-cat { margin: 0; color: var(--fg-75); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
.sheet-price { margin: 0; font-size: 1.2rem; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.ship-note { margin: -8px 0 0; color: var(--fg-75); font-size: .82rem; }
.sheet-desc { margin: 0; color: var(--fg-75); }
fieldset { border: 0; padding: 0; margin: 0; }
legend, .lbl-s { font-size: .88rem; color: var(--fg-75); margin-bottom: 8px; padding: 0; display: block; }
[data-sheet-tones] { display: flex; gap: 8px; flex-wrap: wrap; }
.tone { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 40px; border: 1px solid var(--fg-75); background: var(--bg); font-size: .9rem; }
.tone[aria-checked="true"] { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }
.tone-dot { width: 14px; height: 14px; border-radius: 50%; }
.text-in { width: 100%; min-height: 48px; padding: 0 16px; border: 1px solid var(--fg-75); background: var(--bg); font: 700 1.4rem "Aref Ruqaa", serif; }
.hint { color: var(--fg-75); font-size: .82rem; }
.err { color: var(--error); font-size: .86rem; margin: 2px 0 0; min-height: 1em; }
.x { position: absolute; top: 12px; inset-inline-end: 12px; z-index: 3; width: 44px; height: 44px; border: 0; background: var(--bg); display: grid; place-items: center; }
.x svg { width: 18px; height: 18px; }
.buy-btns { display: grid; gap: 10px; }
@media (max-width: 750px) {
  .sheet { align-items: end; padding: 0; }
  .sheet-card { grid-template-columns: 1fr; max-height: 94%; transform: translateY(40px); }
  .sheet-art { aspect-ratio: 1; }
  .sheet-info { padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); }
}
.drawer { justify-content: flex-end; }
.drawer-card { width: min(420px, 100%); height: 100%; overflow: auto; background: var(--bg); padding: calc(20px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(40px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
[dir="rtl"] .drawer-card { transform: translateX(-40px); }
.drawer.is-open .drawer-card { transform: none; }
.d-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.d-head h2 { margin: 0; font-weight: 400; font-size: 1.6rem; }
.d-head span { color: var(--fg-75); font-size: .9rem; }
.d-head .x { position: static; margin-inline-start: auto; }
.empty { color: var(--fg-75); padding: 30px 0; text-align: center; }
[data-cart-list] { list-style: none; padding: 0; margin: 0; display: grid; gap: 18px; border-top: 1px solid var(--line); padding-top: 18px; }
.ci { display: grid; grid-template-columns: 80px 1fr auto; gap: 14px; }
.ci-img { position: relative; width: 80px; height: 100px; background: var(--bg-2); overflow: hidden; }
.ci-img img { width: 100%; height: 100%; object-fit: cover; }
.ci-img canvas { position: absolute; inset: 6%; width: 88%; height: 88%; }
.ci-name { margin: 0; line-height: 1.4; }
.ci-meta { margin: 2px 0 8px; color: var(--fg-75); font-size: .85rem; }
.ci-row { display: flex; gap: 10px; align-items: center; }
.ci-qty { display: inline-flex; align-items: center; box-shadow: inset 0 0 0 1px var(--fg-75); }
.ci-qty button { width: 44px; height: 44px; border: 0; background: none; font-size: 1.05rem; }
.ci-qty output { min-width: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.ci-remove { border: 0; background: none; color: var(--fg-75); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; font-size: .85rem; }
.ci-price { margin: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sums { margin: 20px 0 6px; display: grid; gap: 8px; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); padding-top: 16px; }
.sums div { display: flex; justify-content: space-between; } .sums dd { margin: 0; } .sums dt { color: var(--fg-75); }
.sums .grand { font-size: 1.1rem; } .sums .grand dt { color: var(--fg); }
.tax-note { margin: 0 0 16px; color: var(--fg-75); font-size: .82rem; }
.form { display: grid; gap: 14px; }
.form label { display: block; font-size: .88rem; color: var(--fg-75); margin-bottom: 4px; }
.form input, .form select, .form textarea { width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--fg-75); background: var(--bg); }
.form textarea { min-height: 80px; resize: vertical; }
.form [aria-invalid="true"] { border-color: var(--error); box-shadow: inset 0 0 0 1px var(--error); }
.form input[type="tel"] { direction: ltr; }
[dir="rtl"] .form input[type="tel"] { text-align: right; }
[data-pay-list] { display: grid; border: 1px solid var(--line); }
.pay { display: flex; gap: 12px; padding: 14px; cursor: pointer; }
.pay + .pay { border-top: 1px solid var(--line); }
.pay:has(input:checked) { background: var(--bg-2); }
.pay input { width: 18px; height: 18px; min-height: 0; margin: 4px 0 0; accent-color: var(--fg); }
.pay-body { display: grid; } .pay-note { color: var(--fg-75); font-size: .85rem; }
.fee-hint { color: var(--fg-75); font-size: .85rem; margin: -4px 0 0; }
.link-btn { border: 0; background: none; color: var(--fg-75); text-decoration: underline; min-height: 44px; }
.ok { text-align: center; padding: 40px 0; display: grid; gap: 12px; justify-items: center; }
.ok h3 { font-weight: 400; font-size: 1.8rem; margin: 0; }
.ok svg { width: 48px; height: 48px; }
.toast { position: fixed; top: calc(90px + env(safe-area-inset-top, 0px)); inset-inline-end: 16px; width: min(360px, calc(100% - 32px)); z-index: 60; background: var(--bg); color: var(--fg); padding: 16px 18px; border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.15); transform: translateY(-10px); opacity: 0; transition: .3s; pointer-events: none; }
.toast.is-on { transform: none; opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<p class="announcement" data-t="announce"></p>
<p class="demo" data-t="demo_note2"></p>

<header class="header">
  <div class="page">
    <button class="icon burger" type="button" id="burger" aria-expanded="false" aria-controls="mobile-menu" data-ta="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <a class="logo" href="#top">سِوار</a>
    <nav class="menu" aria-label="Main">
      <button type="button" data-jump="all" data-t="m_home"></button>
      <button type="button" data-jump="necklace" data-cat-label="necklace"></button>
      <button type="button" data-jump="bracelet" data-cat-label="bracelet"></button>
      <button type="button" data-jump="earrings" data-cat-label="earrings"></button>
      <button type="button" data-goto-name data-t="m_name"></button>
    </nav>
    <div class="icons">
      <button class="lang" type="button" data-lang-toggle data-t="lang_switch"></button>
      <button class="icon" type="button" id="search-btn" aria-expanded="false" aria-controls="search-bar" data-ta="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="icon" type="button" data-open-cart data-ta="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="count" data-cart-count hidden>0</span></button>
    </div>
  </div>
  <div class="mobile-menu" id="mobile-menu" hidden>
    <button type="button" data-jump="necklace" data-cat-label="necklace"></button>

<script>
(function () {
  var S = window.Store, cat = 'featured';
  var FEATURED = ['layered', 'hoops', 'pearl', 'beads'];

  function media(p) {
    return p.photo && !p.custom ? '<img src="' + p.photo + '" alt="' + S.esc(S.name(p)) + '">' : '<canvas data-id="' + p.id + '" aria-hidden="true"></canvas>';
  }
  function render() {
    var items = cat === 'featured' ? FEATURED.map(S.byId) : S.PRODUCTS.filter(function (p) { return cat === 'all' || p.cat === cat; });
    var grid = document.getElementById('grid');
    grid.innerHTML = items.map(function (p) {
      return '<li class="card"><div class="media">' + media(p) + (p.isNew ? '<span class="badge">' + S.t('new') + '</span>' : '') + '</div>' +
        '<button class="link" type="button" data-open="' + p.id + '" aria-label="' + S.esc(S.t('view') + ': ' + S.name(p)) + '"></button>' +
        '<h3>' + S.esc(S.name(p)) + '</h3><span class="price">' + S.money(p.price) + '</span>' +
        (p.custom ? '<button class="quick-add" type="button" data-open="' + p.id + '">' + S.esc(S.t('choose')) + '</button>'
                  : '<button class="quick-add" type="button" data-add="' + p.id + '" aria-label="' + S.esc(S.t('add_cart') + ': ' + S.name(p)) + '">' + S.esc(S.t('add_cart')) + '</button>') + '</li>';
    }).join('');
    S.mount(grid);
    var title = document.getElementById('shop-title');
    title.textContent = cat === 'featured' ? S.t('featured') : cat === 'all' ? S.t('all_products') : S.CATS[cat][S.lang()];
    document.getElementById('view-all').hidden = cat !== 'featured';
    search();
  }
  function search() {
    var q = document.getElementById('q').value.trim().toLowerCase(), out = document.getElementById('results');
    if (!q) { out.innerHTML = ''; return; }
    var hits = S.PRODUCTS.filter(function (p) { return (p.ar + ' ' + p.en + ' ' + S.CATS[p.cat].ar + ' ' + S.CATS[p.cat].en).toLowerCase().indexOf(q) > -1; });
    out.innerHTML = hits.length ? hits.map(function (p) {
      return '<li><button type="button" data-open="' + p.id + '">' + media(p) + '<span>' + S.esc(S.name(p)) + '</span><span class="pr">' + S.money(p.price) + '</span></button></li>';
    }).join('') : '<li class="sub">' + S.esc(S.t('no_results')) + '</li>';
    S.mount(out);
  }
  function toggle(btnId, panelId) {
    var b = document.getElementById(btnId), p = document.getElementById(panelId), open = p.hidden;
    p.hidden = !open; b.setAttribute('aria-expanded', String(open));
    if (open && panelId === 'search-bar') document.getElementById('q').focus();
  }

  document.getElementById('q').addEventListener('input', search);
  document.getElementById('search-btn').addEventListener('click', function () { toggle('search-btn', 'search-bar'); });
  document.getElementById('burger').addEventListener('click', function () { toggle('burger', 'mobile-menu'); });
  document.getElementById('view-all').addEventListener('click', function () { cat = 'all'; render(); });
  document.addEventListener('click', function (e) {
    var j = e.target.closest('[data-jump]');
    if (j) { cat = j.getAttribute('data-jump'); render(); document.getElementById('mobile-menu').hidden = true; document.getElementById('shop').scrollIntoView({ behavior: 'smooth' }); }
    if (e.target.closest('[data-goto-name]')) { document.getElementById('mobile-menu').hidden = true; document.getElementById('name-sec').scrollIntoView({ behavior: 'smooth' }); setTimeout(function () { document.getElementById('iwt-name').focus({ preventScroll: true }); }, 500); }
    if (e.target.closest('#search-results button, .search-results button')) { document.getElementById('search-bar').hidden = true; }
  });
  document.getElementById('iwt-add').addEventListener('click', function () {
    var input = document.getElementById('iwt-name'), v = input.value.trim();
    if (!v) { input.focus(); input.setAttribute('aria-invalid', 'true'); S.toast(S.t('e_engrave')); return; }
    input.removeAttribute('aria-invalid'); S.add('name', 'gold', v);
  });
  // Buy it now: add the piece, then jump straight to checkout
  document.getElementById('buy-now').addEventListener('click', function () {
    var before = document.querySelectorAll('[data-cart-count]')[0].textContent;
    document.querySelector('[data-sheet-add]').click();
    setTimeout(function () {
      if (document.querySelector('[data-sheet].is-open')) return; // validation kept the sheet open
      document.getElementById('open-cart-hidden').click();
      document.getElementById('goto-checkout-hidden').click();
    }, 30);
  });
  document.getElementById('news').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('news-email').value.trim(), msg = document.getElementById('news-msg');
    msg.textContent = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? S.t('news_ok') : S.t('news_err');
  });

  S.boot({
    render: render,
    strings: {
      ar: {
        announce: 'الدفع عند الاستلام · توصيل للضفة والقدس والداخل', demo_note2: 'نموذج تصميم بأسلوب متاجر Shopify. الصور من Unsplash، والأسعار ورسوم التوصيل مؤقتة.',
        m_home: 'الرئيسية', m_name: 'قلادة باسمك', menu: 'القائمة', search: 'بحث', search_ph: 'ابحثي: قلادة، سوار، لؤلؤ…', no_results: 'لا نتائج. جرّبي كلمة أخرى.',
        h1: 'لمعة ذهبية لكل يوم', lead: 'قلائد وأساور وأقراط بأسعار واضحة. تدفعين عند الاستلام.', shop_now: 'تسوقي الآن',
        rich_h: 'حُلي تُلبس كل يوم، لا في المناسبات فقط', rich_p: 'نختار قطعاً خفيفة تناسب الدوام والمشوار والسهرة. اطلبي من البيت وادفعي للمندوب عند الاستلام.',
        featured: 'قطع مختارة', all_products: 'كل المنتجات', view_all: 'عرض الكل', collections: 'تسوقي حسب النوع',
        add_cart: 'أضيفي إلى السلة', buy_now: 'اشتري الآن', choose: 'اختاري الخيارات', ship_note: 'رسوم التوصيل تُحسب عند إتمام الطلب.',
        iwt_h: 'قلادة باسمها، بالخط العربي', iwt_p: 'اكتبي الاسم وشاهديه على القلادة قبل الطلب. هدية تُفهم من أول نظرة.', type_name: 'اكتبي الاسم', name_ph: 'ليان', iwt_cta: 'أضيفيها إلى السلة',
        t1: 'الدفع عند الاستلام', t1d: 'أو بالبطاقة عبر بوابة دفع محلية.', t2: 'توصيل للضفة والقدس والداخل', t2d: 'الرسوم تظهر قبل تأكيد الطلب.', t3: 'تبديل خلال 7 أيام', t3d: 'سياسة للتأكيد مع المتجر.',
        news_h: 'اشتركي في نشرتنا', news_p: 'وصول أول للقطع الجديدة. رسالة واحدة في الشهر.', email: 'البريد الإلكتروني', subscribe: 'اشتراك',
        news_ok: 'تم الاشتراك. (نموذج: لم يُرسل شيء فعلياً)', news_err: 'اكتبي بريداً إلكترونياً صحيحاً.',
        your_cart: 'سلتك', continue: 'متابعة التسوق', est_total: 'المجموع التقديري', tax_note: 'رسوم التوصيل تُحسب في الخطوة التالية.',
        f_shop: 'تسوقي', f_help: 'سياسات (قيد الإعداد)', f_contact: 'تواصلي معنا', f_ship: 'التوصيل', f_returns: 'التبديل والإرجاع', f_care: 'العناية بالحُلي',
        credit: 'الصور: Unsplash', pi_cod: 'عند الاستلام', pi_card: 'بطاقة (البوابة للتأكيد)', pi_wallet: 'محفظة (للتأكيد)', wa: 'واتساب'
      },
      en: {
        announce: 'Cash on delivery · Delivery to the West Bank, Jerusalem and inside', demo_note2: 'Design demo in the style of Shopify stores. Photos from Unsplash; prices and delivery fees are placeholders.',
        m_home: 'Home', m_name: 'Name necklace', menu: 'Menu', search: 'Search', search_ph: 'Search: necklace, bracelet, pearl…', no_results: 'No results. Try another word.',
        h1: 'A gold shine for every day', lead: 'Necklaces, bracelets and earrings with clear prices. Pay on delivery.', shop_now: 'Shop now',
        rich_h: 'Jewellery for every day, not only for occasions', rich_p: 'We pick light pieces for work, errands and evenings out. Order from home and pay the courier on delivery.',
        featured: 'Featured pieces', all_products: 'All products', view_all: 'View all', collections: 'Shop by type',
        add_cart: 'Add to cart', buy_now: 'Buy it now', choose: 'Choose options', ship_note: 'Delivery calculated at checkout.',
        iwt_h: 'Her name, in Arabic script', iwt_p: 'Type a name and see it on the necklace before you order. A gift that explains itself.', type_name: 'Type the name', name_ph: 'ليان', iwt_cta: 'Add to cart',

})();
