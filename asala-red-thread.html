<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asala · Tatreez Red</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Alexandria:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="brand/asala-tatreez.css">
<style>
/* "Red thread": the second tatreez direction. Bold and modern, red-dominant, laid out like a fashion campaign.
   One red thread runs through the page: from the hero (a red block hemmed in light thread), through the four
   motif tiles that filter the rail, into the tatreez dome, the gift seal and the sketch, down to the charcoal border. */
:root {
  --red: #C6383C; --red-2: #A92D31; --ink: #33342F; --muted: #5F5D55; --teal: #3FA59A; --linen: #F4F3F1; --white: #FFFFFF;
  --pink: #F2C9C0; --line: #E6E2DA;
  --f-d: "Reem Kufi", "Alexandria", sans-serif; --f-b: "Alexandria", "Segoe UI", Tahoma, sans-serif; --f-ui: var(--f-b);
  --gutter: clamp(16px, 4vw, 48px); --head-h: 78px;
  --tz-bg: var(--linen); --tz-panel: var(--white); --tz-line: var(--line); --tz-font: var(--f-b); --tz-font-d: var(--f-d);
}
html[lang="en"] { --f-d: "Cormorant Garamond", Georgia, serif; --f-ui: "Jost", "Alexandria", sans-serif; --tz-font-d: "Cormorant Garamond", Georgia, serif; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--white); color: var(--ink); font: 400 1rem/1.7 var(--f-b); -webkit-font-smoothing: antialiased; }
html[lang="en"] body { font-family: "Jost", var(--f-b); font-size: 1.04rem; }
img { max-width: 100%; height: auto; display: block; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--red); color: var(--linen); }
:focus-visible { outline: 2px dashed var(--red); outline-offset: 3px; }
.on-red :focus-visible, .on-ink :focus-visible { outline-color: var(--linen); }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: var(--gutter); }
section[id] { scroll-margin-top: var(--head-h); }

/* announcement line */
.ann { background: var(--ink); color: #D9D4CB; font: 400 .78rem/1.5 var(--f-ui); }
.ann .wrap { display: flex; justify-content: center; align-items: center; gap: 12px; padding-block: 7px; text-align: center; }
.ann p { margin: 0; }
.ann canvas { width: 9px; height: 9px; flex: none; }
.ann .cod { white-space: nowrap; }
@media (max-width: 720px) { .ann .cod, .ann canvas { display: none; } }

/* header */
.top { position: sticky; top: 0; z-index: 30; background: var(--white); border-bottom: 1px solid var(--line); }
.top .bar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 20px; min-height: var(--head-h); }
.logo { display: inline-flex; min-height: 44px; align-items: center; }
.logo img { height: 24px; width: auto; }
.nav { display: flex; justify-content: center; align-items: center; gap: 2px; }
.nav button { background: none; border: 0; min-height: 44px; padding: 0 10px; font: 500 .95rem/1 var(--f-ui); white-space: nowrap; position: relative; }
html[lang="en"] .nav button { text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; }
.nav button::after { content: ""; position: absolute; inset-inline: 10px; bottom: 8px; border-bottom: 1.5px dashed var(--red); transform: scaleX(0); transition: transform .3s var(--tz-ease); }
.nav button:hover { color: var(--red); }
.nav button:hover::after { transform: none; }
.nav canvas { width: 18px; height: 18px; flex: none; }
.tools { display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; min-width: 44px; padding: 0 14px; border: 1.5px solid var(--ink); background: transparent; font: 500 .92rem/1 var(--f-ui); }
.pill:hover { border-color: var(--red); color: var(--red); }
.pill.bag { background: var(--red); border-color: var(--red); color: var(--linen); }
.pill.bag:hover { background: var(--red-2); border-color: var(--red-2); color: var(--linen); }
.pill svg { width: 18px; height: 18px; }
.count { min-width: 20px; height: 20px; padding: 0 5px; background: var(--linen); color: var(--red); font: 600 .75rem/20px var(--f-ui); text-align: center; font-variant-numeric: tabular-nums; }
@media (max-width: 980px) {
  :root { --head-h: 122px; }
  .top .bar { grid-template-columns: auto 1fr; row-gap: 0; min-height: 62px; }
  .tools { justify-self: end; }
  .nav { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); border-top: 1px solid var(--line); }
  .nav::-webkit-scrollbar { display: none; }
  .pill.bag .lbl { display: none; }
}

/* hero: the red block */
.hero { position: relative; overflow: hidden; background: var(--red); color: var(--linen); display: flex; flex-direction: column; min-height: min(82vh, 900px); }
.hero > .wrap { flex: 1; width: 100%; display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); gap: clamp(28px, 5vw, 80px); align-items: center; padding-block: clamp(36px, 6vw, 72px) clamp(40px, 5vw, 64px); }
.eyebrow { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; font: 500 .95rem/1.4 var(--f-ui); color: var(--pink); }
html[lang="en"] .eyebrow, html[lang="en"] .k { text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; }
.eyebrow canvas { width: 54px; height: 8px; flex: none; }
.hero h1 { margin: 0 0 22px; font: 700 clamp(3rem, 7.4vw, 7rem)/1.02 var(--f-d); letter-spacing: -.005em; text-wrap: balance; }
.hero h1 span { display: block; }
.hero h1 .l2 { color: var(--pink); font-size: .56em; line-height: 1.25; margin-top: .2em; }
html[lang="en"] .hero h1 { font-weight: 600; font-size: clamp(3.2rem, 7.8vw, 7.4rem); line-height: .98; letter-spacing: -.015em; }
html[lang="en"] .hero h1 .l2 { font-style: italic; font-weight: 500; font-size: .6em; line-height: 1.1; }
.lede { margin: 0 0 30px; max-width: 42ch; font-size: 1.08rem; color: #FBE3E1; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 28px; border: 1.5px solid var(--linen); background: var(--linen); color: var(--red); font: 600 1rem/1 var(--f-ui); transition: background .25s, color .25s; }
html[lang="en"] .btn { text-transform: uppercase; letter-spacing: .1em; font-size: .82rem; }
.btn::after { content: ""; position: absolute; inset: 5px; border: 1.5px dashed currentColor; opacity: 0; transform: scale(1.04); transition: opacity .25s, transform .3s var(--tz-ease); pointer-events: none; }
.btn:hover::after, .btn:focus-visible::after { opacity: 1; transform: none; }
.btn.o { background: transparent; color: var(--linen); }
.btn.o:hover { background: rgba(244, 243, 241, .1); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--linen); }
.btn.dark:hover { background: #1F201C; }
.btn.red { background: var(--red); border-color: var(--red); color: var(--linen); }
.btn.red:hover { background: var(--red-2); border-color: var(--red-2); }
.marks { list-style: none; margin: 30px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .9rem; color: #FBE3E1; }
.marks li { display: flex; align-items: center; gap: 8px; }
.marks canvas { width: 14px; height: 14px; flex: none; }
.art { position: relative; justify-self: center; width: min(440px, 100%); }
.bigstar { position: absolute; z-index: 3; width: 56%; aspect-ratio: 1; top: -12%; inset-inline-start: -28%; pointer-events: none; filter: drop-shadow(0 6px 14px rgba(60, 10, 12, .25)); }
.frame { position: relative; z-index: 1; padding: clamp(20px, 2.4vw, 28px); }
.frame > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.frame img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 26% 50%; }
.inset { position: absolute; z-index: 2; width: 40%; bottom: -5%; inset-inline-start: -18%; border: 6px solid var(--linen); box-shadow: 0 18px 40px rgba(60, 10, 12, .28); }
.inset img { width: 100%; aspect-ratio: 1; object-fit: cover; }
.hero .hem { width: 100%; height: 54px; flex: none; }
@media (max-width: 860px) {
  .hero { min-height: 0; }
  .hero > .wrap { grid-template-columns: 1fr; }
  .art { width: min(380px, 86%); margin-bottom: 18px; }
  .art { margin-top: 64px; }
  .bigstar { width: 44%; inset-inline-start: -12%; top: -15%; }
  .inset { inset-inline-start: -10%; width: 38%; }
}

/* shared section heads */
.sec { padding-block: clamp(56px, 8vw, 110px); }
.k { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; color: var(--red); font: 600 .95rem/1.4 var(--f-ui); }
.k canvas { width: 44px; height: 8px; flex: none; }
.h2 { margin: 0; font: 700 clamp(2.1rem, 4.6vw, 3.8rem)/1.12 var(--f-d); text-wrap: balance; }
html[lang="en"] .h2 { font-weight: 600; line-height: 1.02; letter-spacing: -.01em; }
.sub { margin: 14px 0 0; color: var(--muted); max-width: 52ch; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 18px 40px; margin-bottom: clamp(26px, 4vw, 44px); }

/* read the thread: motif tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 20px); }
.tile { position: relative; display: grid; justify-items: center; align-content: start; gap: 6px; padding: clamp(22px, 3vw, 38px) 14px clamp(20px, 2.6vw, 30px); border: 0; background: var(--linen); text-align: center; transition: background .3s; }
.tile:hover { background: #EFEDE9; }
.tile .tf { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .2s; pointer-events: none; }
.tile[aria-pressed="true"] { background: var(--white); box-shadow: inset 0 0 0 1px var(--line); }
.tile[aria-pressed="true"] .tf { opacity: 1; }
.tile .tm { width: 120px; height: 120px; margin-bottom: 12px; transition: transform .5s var(--tz-ease); }
.tile:hover .tm { transform: scale(1.06); }
.tile b { font: 700 clamp(1.15rem, 1.8vw, 1.5rem)/1.25 var(--f-d); }
html[lang="en"] .tile b { font-size: clamp(1.35rem, 2vw, 1.75rem); font-weight: 600; }
.tile .to { color: var(--muted); font-size: .9rem; }
.tile .to i { font-style: normal; color: var(--red); font-weight: 600; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile .tm { width: 96px; height: 96px; } }

/* product rail */
.rail-sec { padding-top: clamp(28px, 4vw, 48px); }
.rail-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 30px; margin-bottom: 22px; padding-top: 26px; border-top: 1.5px solid var(--ink); }
.rail-head h3 { margin: 0; font: 700 clamp(1.5rem, 2.6vw, 2.2rem)/1.2 var(--f-d); }
html[lang="en"] .rail-head h3 { font-weight: 600; }
.rail-head .meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: var(--muted); }
.clear { min-height: 44px; border: 0; background: none; padding: 0 4px; color: var(--red); text-decoration: underline dashed; text-underline-offset: 6px; font: 500 .95rem var(--f-ui); }
.arrows { display: flex; gap: 8px; }
.arrows button { width: 50px; height: 50px; display: grid; place-items: center; border: 1.5px solid var(--ink); background: var(--white); }
.arrows button:hover:not(:disabled) { background: var(--red); border-color: var(--red); color: var(--linen); }
.arrows button:disabled { opacity: .3; cursor: default; }
.arrows svg { width: 20px; height: 20px; }
[dir="rtl"] .arrows svg { transform: scaleX(-1); }
.rail { display: flex; gap: clamp(12px, 1.6vw, 22px); overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; padding-bottom: 6px; overscroll-behavior-x: contain; }
.rail::-webkit-scrollbar { display: none; }
.pc { flex: 0 0 clamp(250px, 23.2vw, 300px); scroll-snap-align: start; background: var(--white); display: grid; grid-template-rows: auto 1fr; }
.pc-media { position: relative; overflow: hidden; background: var(--linen); }
.pc-art { display: block; width: 100%; padding: 0; border: 0; background: none; aspect-ratio: 4 / 5; position: relative; }
.pc-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .5s ease, transform .9s var(--tz-ease); }
.pc-art .alt { opacity: 0; }
.pc-art.cut { background: var(--ink); }
.pc-art.cut img { object-fit: contain; padding: 10%; }
.pc:hover .pc-art img:first-child { transform: scale(1.04); }
.pc:hover .pc-art .alt { opacity: 1; }
.pc-stars { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); pointer-events: none; opacity: 0; transition: opacity .3s; }
.pc:hover .pc-stars, .pc:focus-within .pc-stars { opacity: 1; }
.badge { position: absolute; z-index: 2; top: 12px; inset-inline-start: 36px; padding: 5px 10px; background: var(--white); color: var(--red); border: 1.5px dashed var(--red); outline: 3px solid var(--white); font: 600 .74rem/1 var(--f-ui); }
html[lang="en"] .badge { text-transform: uppercase; letter-spacing: .12em; font-size: .66rem; }
.quick { position: absolute; z-index: 2; inset-inline: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; border: 0; background: var(--red); color: var(--linen); font: 600 .92rem/1 var(--f-ui); transform: translateY(101%); transition: transform .35s var(--tz-ease), background .2s; }
html[lang="en"] .quick { text-transform: uppercase; letter-spacing: .1em; font-size: .76rem; }
.quick:hover { background: var(--red-2); }
.quick svg { width: 18px; height: 18px; }
.pc:hover .quick, .pc:focus-within .quick { transform: none; }
@media (hover: none) { .quick { transform: none; min-height: 46px; } .pc-stars { opacity: 1; } }
.pc-meta { padding: 14px 2px 6px; display: grid; gap: 0; align-content: start; }
.pc-meta .cat { margin: 0; color: var(--red); font: 500 .8rem/1.4 var(--f-ui); }
html[lang="en"] .pc-meta .cat { text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; }
.pc-meta h4 { margin: 0; font: 500 1.02rem/1.45 var(--f-b); }
html[lang="en"] .pc-meta h4 { font-family: "Jost", var(--f-b); }
.pc-meta h4 button { border: 0; background: none; padding: 0; text-align: start; min-height: 44px; }
.pc-meta h4 button:hover { color: var(--red); }
.pc-meta .p { font: 600 1.05rem/1.4 var(--f-ui); font-variant-numeric: tabular-nums; }
.pc-meta .p small { font-weight: 400; color: var(--muted); font-size: .82rem; }
.track { position: relative; height: 2px; background: var(--line); margin-top: 22px; }
.track span { position: absolute; top: -1px; height: 4px; background: var(--red); inset-inline-start: 0; transition: inset-inline-start .2s, width .2s; }
@media (max-width: 760px) { .arrows { display: none; } .rail { margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scroll-padding-inline: var(--gutter); } .pc { flex-basis: 68%; } }

/* tatreez dome: split red / linen */
.dome { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.dome-img { position: relative; background: var(--linen); display: grid; place-items: center; padding: clamp(36px, 6vw, 90px) clamp(20px, 4vw, 64px); }
.dome-stage { position: relative; width: min(480px, 100%); background: #F7F5F2; padding: clamp(18px, 2.4vw, 26px); box-shadow: 0 0 0 1px var(--line); }
.dome-stage img { width: 100%; aspect-ratio: 416 / 384; object-fit: contain; transition: opacity .3s; }
.dome-stage canvas { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); pointer-events: none; }
.dome-tag { position: absolute; bottom: -16px; inset-inline-start: 50%; transform: translateX(50%); white-space: nowrap; background: var(--white); color: var(--red); border: 1.5px dashed var(--red); outline: 4px solid var(--linen); padding: 7px 14px; font: 600 .85rem/1 var(--f-ui); }
[dir="ltr"] .dome-tag { transform: translateX(-50%); }
.dome-txt { background: var(--red); color: var(--linen); padding: clamp(44px, 6vw, 96px) clamp(20px, 5vw, 80px); display: flex; flex-direction: column; justify-content: center; }
.dome-txt .k { color: var(--pink); }
.dome-txt .sub { color: #FBE3E1; }
.pats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 28px 0 22px; }
.pat { display: grid; gap: 8px; padding: 6px 6px 10px; border: 1.5px solid rgba(244, 243, 241, .45); background: transparent; color: var(--linen); text-align: center; font: 500 .8rem/1.3 var(--f-ui); }
.pat img { width: 100%; aspect-ratio: 416 / 384; object-fit: contain; background: #F7F5F2; }
.pat:hover { border-color: var(--linen); }
.pat[aria-pressed="true"] { background: var(--linen); color: var(--red); border-color: var(--linen); outline: 1.5px dashed var(--linen); outline-offset: 3px; }
.mats { list-style: none; margin: 0 0 26px; padding: 0; border-top: 1.5px dashed rgba(244, 243, 241, .5); }
.mats li { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1.5px dashed rgba(244, 243, 241, .5); }
.mats small { display: block; color: #F6CFCB; font-size: .8rem; }
.mats b { font: 600 1.05rem/1.4 var(--f-ui); white-space: nowrap; font-variant-numeric: tabular-nums; }
.note { margin: 14px 0 0; font-size: .85rem; color: #F6CFCB; }
@media (max-width: 860px) { .dome { grid-template-columns: 1fr; } }
@media (max-width: 460px) { .pats { gap: 6px; } .pat { padding: 4px 4px 8px; font-size: .7rem; } }

/* gift box */
.gift { overflow-x: clip; }
.gift .wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(40px, 6vw, 100px); align-items: center; }
.g-art { position: relative; padding-bottom: 14%; }
.g-frame { position: relative; padding: clamp(20px, 2.4vw, 28px); }
.g-frame > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.g-frame img { width: 100%; aspect-ratio: 1594 / 987; object-fit: cover; }
.g-card { position: absolute; z-index: 2; bottom: 0; inset-inline-end: -4%; width: 46%; border: 8px solid var(--white); box-shadow: 0 22px 44px rgba(51, 52, 47, .22); transform: rotate(-2.5deg); }
[dir="ltr"] .g-card { transform: rotate(2.5deg); }
.g-card img { width: 100%; aspect-ratio: 1024 / 640; object-fit: cover; }
.wax { position: absolute; z-index: 3; top: -24px; inset-inline-start: -18px; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 5px var(--white), 0 10px 24px rgba(51, 52, 47, .25); transition: background .4s, color .4s; }
.wax svg { width: 46px; height: 46px; }
.seals { display: flex; flex-wrap: wrap; gap: 10px; margin: 26px 0 12px; }
.seal { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px 0 12px; border: 1.5px solid var(--line); background: var(--white); font: 500 .92rem/1 var(--f-ui); }
.seal i { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.seal:hover { border-color: var(--ink); }
.seal[aria-pressed="true"] { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.cap { min-height: 1.7em; margin: 0 0 24px; font-weight: 500; }
.gift .note { color: var(--muted); margin: 0 0 22px; }
@media (max-width: 860px) { .gift .wrap { grid-template-columns: 1fr; } .g-card { inset-inline-end: 0; } .wax { inset-inline-start: -4px; width: 76px; height: 76px; } .wax svg { width: 38px; height: 38px; } }

/* sketch to stitch */
.story { background: var(--linen); }
.story .wrap { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(36px, 6vw, 96px); align-items: center; }
.story p.body { margin: 16px 0 0; max-width: 46ch; color: var(--muted); font-size: 1.05rem; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) clamp(40px, 7vw, 96px) minmax(0, 1fr); align-items: center; }
.pair figure { margin: 0; background: var(--white); padding: clamp(8px, 1vw, 12px); box-shadow: 0 0 0 1px var(--line), 0 14px 30px rgba(51, 52, 47, .08); }
.pair figure:first-child { transform: rotate(-2deg); }
.pair figure:last-child { transform: rotate(1.5deg); }
.pair img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.pair figcaption { display: flex; align-items: center; gap: 8px; padding-top: 10px; font: 500 .85rem/1.3 var(--f-ui); }
.pair figcaption span { color: var(--red); font-weight: 600; }
.pair .thread { position: relative; height: 100%; display: grid; align-items: center; }
.pair .thread canvas.run { width: calc(100% + 24px); margin-inline: -12px; height: 8px; position: relative; z-index: 1; }
.pair .thread canvas.knot { position: absolute; inset-inline-start: 50%; top: calc(50% - 30px); width: 18px; height: 18px; transform: translateX(50%); }
[dir="ltr"] .pair .thread canvas.knot { transform: translateX(-50%); }
@media (max-width: 860px) { .story .wrap { grid-template-columns: 1fr; } }

/* #WearAsala wall */
.wall { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: clamp(150px, 19vw, 250px); grid-auto-flow: dense; gap: clamp(8px, 1.2vw, 14px); }
.wt { position: relative; overflow: hidden; padding: 0; border: 0; background: var(--linen); }
.wt.w2 { grid-column: span 2; } .wt.h2 { grid-row: span 2; }
.wt img { width: 100%; height: 100%; object-fit: cover; transition: transform .9s var(--tz-ease); }
.wt::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(198, 56, 60, .9), rgba(198, 56, 60, 0) 55%); opacity: 0; transition: opacity .35s; }
.wt span { position: absolute; z-index: 1; inset-inline: 14px; bottom: 12px; color: var(--linen); text-align: start; font: 500 .9rem/1.35 var(--f-ui); opacity: 0; transform: translateY(8px); transition: .35s var(--tz-ease); }
.wt span b { display: block; font-weight: 600; letter-spacing: .04em; }
.wt:hover img { transform: scale(1.05); }
.wt:hover::after, .wt:focus-visible::after { opacity: 1; }
.wt:hover span, .wt:focus-visible span { opacity: 1; transform: none; }
@media (hover: none) { .wt::after { opacity: .75; } .wt span { opacity: 1; transform: none; } }
@media (max-width: 760px) { .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 150px; } }
.tag-note { display: flex; align-items: center; gap: 10px; margin: 18px 0 0; color: var(--muted); font-size: .9rem; }
.tag-note canvas { width: 16px; height: 16px; flex: none; }

/* footer */
footer { background: var(--ink); color: #CFCAC0; }
footer .hem { width: 100%; height: 56px; }
.fgrid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 32px; padding-block: 40px 44px; }
footer .logo img { height: 22px; }
footer h4 { margin: 0 0 10px; color: var(--linen); font: 600 .95rem/1.4 var(--f-ui); }
html[lang="en"] footer h4 { text-transform: uppercase; letter-spacing: .14em; font-size: .74rem; }
footer ul { list-style: none; margin: 0; padding: 0; display: grid; }
footer li { min-height: 44px; display: flex; align-items: center; font-size: .92rem; }
footer li button { border: 0; background: none; padding: 0; min-height: 44px; min-width: 44px; text-align: start; font-size: .92rem; }
footer li button:hover { color: var(--linen); text-decoration: underline dashed; text-underline-offset: 6px; }
.fline { margin: 12px 0 22px; max-width: 34ch; font-size: .92rem; }
.news label { display: block; color: var(--linen); font: 600 .95rem/1.4 var(--f-ui); margin-bottom: 4px; }
.news p { margin: 0 0 10px; font-size: .85rem; }
.news .row { display: flex; border: 1.5px solid #75766E; }
.news .row:focus-within { border-color: var(--linen); }
.news input { flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; border: 0; background: transparent; color: var(--linen); }
.news input::placeholder { color: #8F8D85; }
.news input:focus-visible { outline: none; }
.news button { min-height: 48px; padding: 0 18px; border: 0; background: var(--red); color: var(--linen); font: 600 .9rem/1 var(--f-ui); }
.news button:hover { background: var(--red-2); }
.news .msg { margin: 10px 0 0; min-height: 1.4em; font-size: .88rem; }
.news .msg.err { color: var(--pink); }
.news .msg.ok { color: var(--linen); display: flex; gap: 8px; align-items: flex-start; }
.legal { border-top: 1px solid #4A4B45; }
.legal .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; padding-block: 16px; font-size: .82rem; }
@media (max-width: 900px) { .fgrid { grid-template-columns: 1fr 1fr; } .fgrid > :first-child { grid-column: 1 / -1; } }

@media (prefers-reduced-motion: reduce) {

  *, *::before, *::after { transition-duration: .01ms !important; }
}

      m_star: 'Eight-point star', m_star_to: 'The dome pieces', m_cypress: 'Cypress', m_cypress_to: 'The Lotus pendant',
      m_chain: 'Chain', m_chain_to: 'The arches', m_teeth: 'Old man’s teeth', m_teeth_to: 'Colour in clay',
      n1: '1 piece', n2: '2 pieces', nn: '{n} pieces',
      r_k: 'The pieces', r_all: 'Every piece', r_clear: 'Show every piece', prev: 'Previous', next: 'Next',
      choose_metal: 'Choose metal', per_pair: 'per pair',
      d_k: 'From the design board', d_h: 'Tatreez, cut into the dome',
      d_p: 'The Dome earrings are cut in one of four patterns: Islamic geometric, eight-point star, mashrabiya or Palestinian tatreez. Flip through them, then choose your metal.',
      d_pick: 'Pattern', d_cta: 'Choose your metal', d_note: 'Pattern choice when ordering (to confirm).',
      g_k: 'Packaging', g_h: 'Ready to give', g_seal: 'Seal colour',
      g_p: 'Every piece arrives in a charcoal Asala box with a thank-you card. Choose the seal: red, charcoal or ivory.',
      g_cap: '{s}: the seal on your box.', g_note: 'Seal colour for gifts (to confirm).', g_cta: 'Choose a piece to gift',
      s_k: 'Sketch to piece', s_h: 'Every piece starts as a pencil line',
      s_p1: 'Asala was founded by an architect from Nablus, so every piece starts as a drawing in a sketchbook: a dome, an arch or a mashrabiya window.',
      s_p2: 'Then the drawing is laser cut, and its edges are finished by hand in Nablus.',
      s_f1: 'The drawing', s_f2: 'The piece',
      w_h: 'This wall is for your photos', w_p: 'Share a photo wearing Asala with #WearAsala and it can appear here.',
      w_note: 'For now these are Asala’s own photos, until yours arrive.', w_see: 'View piece',
      f_line: 'Architecture-inspired earrings, handmade in Nablus.', f_news: 'Letters from Asala', f_news_p: 'We let you know when new pieces arrive.',
      f_email: 'Your email', f_sub: 'Subscribe', f_thanks: 'Thank you! You are on the list. (Design demo: nothing was sent)',
      f_err: 'Please enter a valid email address.', f_shop: 'Shop', f_thread: 'By motif', f_help: 'Help', f_wa: 'WhatsApp orders (to confirm)'
    }
  };

  function lg() { return S.lang(); }
  function n(k) { return k === 1 ? t('n1') : k === 2 ? t('n2') : t('nn', { n: k }); }
  function priceHTML(p) { return p.configurable ? '<small>' + esc(t('from')) + '</small> ' + S.money(A.MATERIALS[0].price) : S.money(p.price); }
  function list() {
    if (!filter) return S.PRODUCTS.slice();
    var f = filter.split(':');
    if (f[0] === 'thread') return THREADS[f[1]].map(S.byId);
    return S.PRODUCTS.filter(function (p) { return p.cat === f[1]; });
  }

  function card(p) {
    var alt = p.alts && p.alts[0];
    return '<article class="pc"><div class="pc-media">' +
      '<button class="pc-art' + (p.cutout ? ' cut' : '') + '" type="button" data-open="' + p.id + '" aria-label="' + esc(t('view') + ': ' + S.name(p)) + '">' +
        '<img src="' + p.photo + '" alt="" loading="lazy">' + (alt ? '<img class="alt" src="' + alt + '" alt="" loading="lazy">' : '') + '</button>' +
      (NEW[p.id] ? '<span class="badge">' + esc(t('new')) + '</span>' : '') +
      '<canvas class="pc-stars" data-stitch="corners" data-palette="red" data-cell="2"></canvas>' +
      '<button class="quick" type="button" data-qadd="' + p.id + '" aria-label="' + esc((p.configurable ? t('choose_metal') : t('quick_add')) + ': ' + S.name(p)) + '">' +
        (p.configurable ? esc(t('choose_metal')) : PLUS + esc(t('quick_add'))) + '</button>' +
      '</div><div class="pc-meta"><p class="cat">' + esc(S.CATS[p.cat][lg()]) + '</p>' +
      '<h4><button type="button" data-open="' + p.id + '">' + esc(S.name(p)) + '</button></h4>' +
      '<span class="p">' + priceHTML(p) + '</span></div></article>';
  }

  function renderRail(reset) {
    var items = list(), rail = $('#rail-list'), f = filter.split(':'), title;
    if (!filter) title = t('r_all');
    else if (f[0] === 'thread') title = t('m_' + f[1]) + ' · ' + t('m_' + f[1] + '_to');
    else title = t('c_' + f[1]);
    $('#rail-title').textContent = title + ' (' + n(items.length) + ')';
    $('#clear').hidden = !filter;
    rail.innerHTML = items.map(card).join('');
    TZ.mount(rail);
    if (reset) { rail.style.scrollBehavior = 'auto'; rail.scrollLeft = 0; rail.style.scrollBehavior = ''; }
    $$('.tile').forEach(function (b) {
      var on = filter === 'thread:' + b.getAttribute('data-thread');
      var was = b.getAttribute('aria-pressed') === 'true';
      b.setAttribute('aria-pressed', String(on));
      if (on && !was) TZ.draw(b.querySelector('.tf'), true);
    });
    Object.keys(THREADS).forEach(function (k) { var el = $('[data-n="' + k + '"]'); if (el) el.textContent = n(THREADS[k].length); });
    progress();
  }
  function progress() {
    var r = $('#rail-list'), max = r.scrollWidth - r.clientWidth, pos = Math.abs(r.scrollLeft);
    var w = r.scrollWidth ? Math.min(100, r.clientWidth / r.scrollWidth * 100) : 100;
    var th = $('#thumb'); th.style.width = w + '%'; th.style.insetInlineStart = (max > 0 ? pos / max * (100 - w) : 0) + '%';
    var prev = $('[data-rail="-1"]'), next = $('[data-rail="1"]');
    prev.disabled = pos <= 2; next.disabled = pos >= max - 2;
  }

  function renderDome() {
    $('#pats').innerHTML = A.PATTERNS.map(function (p) {
      return '<button class="pat" type="button" data-pat="' + p.id + '" aria-pressed="' + (p.id === pat) + '"><img src="' + p.img + '" alt="">' + esc(p[lg()]) + '</button>';
    }).join('');
    var cur = A.PATTERNS.filter(function (p) { return p.id === pat; })[0];
    $('#pat-img').src = cur.img; $('#pat-img').alt = cur[lg()];
    $('#pat-tag').textContent = cur[lg()];
    $('#mats').innerHTML = A.MATERIALS.map(function (m) {
      return '<li><span>' + esc(lg() === 'ar' ? m.ar : m.en) + '<small>' + esc(lg() === 'ar' ? m.nAr : m.nEn) + '</small></span><b>' + S.money(m.price) + '</b></li>';
    }).join('');
  }

  function renderSeal(sew) {
    $('#seals').innerHTML = A.SEALS.map(function (s) {
      return '<button class="seal" type="button" data-seal="' + s.id + '" aria-pressed="' + (s.id === seal) + '"><i style="background:' + s.color + '"></i>' + esc(s[lg()]) + '</button>';
    }).join('');
    var s = A.SEALS.filter(function (x) { return x.id === seal; })[0], th = THREAD_OF[seal];
    $('#g-cap').textContent = t('g_cap', { s: s[lg()] });
    var wax = $('#wax'); wax.style.background = s.color; wax.style.color = s.ink; if (!wax.firstChild) wax.innerHTML = A.MARK;
    var cv = $('#g-frame'); cv.setAttribute('data-c1', th[0]); cv.setAttribute('data-c2', th[1]); cv.setAttribute('data-c3', th[1]);
    if (sew) TZ.draw(cv, true); else if (cv.__tz) TZ.draw(cv);
  }

  function renderWall() {
    $('#wall').innerHTML = WALL.map(function (w) {
      var p = S.byId(w.id);
      return '<button class="wt ' + w.cls + '" type="button" data-open="' + p.id + '" aria-label="' + esc(t('w_see') + ': ' + S.name(p)) + '"><img src="brand/' + w.img + '" alt="" loading="lazy"><span><b>#WearAsala</b>' + esc(S.name(p)) + '</span></button>';
    }).join('');
  }

  function renderNews() {
    var m = $('#news-msg');
    m.className = 'msg' + (news ? ' ' + news : '');
    m.textContent = news === 'ok' ? t('f_thanks') : news === 'err' ? t('f_err') : '';
  }

  function render() { renderRail(false); renderDome(); renderSeal(false); renderWall(); renderNews(); }
  function go(id) { var el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
  function setFilter(f) { filter = f; renderRail(true); go('rail'); }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-thread')) { setFilter('thread:' + b.getAttribute('data-thread')); return; }
    if (b.hasAttribute('data-filter-go')) { setFilter(b.getAttribute('data-filter-go')); return; }
    if (b.id === 'clear') { filter = ''; renderRail(true); return; }
    if (b.hasAttribute('data-go')) { go(b.getAttribute('data-go')); return; }
    if (b.hasAttribute('data-rail')) {
      var r = $('#rail-list'), dir = document.documentElement.dir === 'rtl' ? -1 : 1;
      r.scrollBy({ left: dir * +b.getAttribute('data-rail') * r.clientWidth * 0.8, behavior: reduce ? 'auto' : 'smooth' }); return;
    }
    if (b.hasAttribute('data-pat')) { pat = b.getAttribute('data-pat'); renderDome(); var pb = $('[data-pat="' + pat + '"]'); if (pb) pb.focus(); return; }
    if (b.hasAttribute('data-seal')) { seal = b.getAttribute('data-seal'); renderSeal(true); var sb = $('[data-seal="' + seal + '"]'); if (sb) sb.focus(); return; }
    if (b.hasAttribute('data-qadd')) {
      var p = S.byId(b.getAttribute('data-qadd'));
      if (p.configurable) S.openProduct(p.id); else S.add(p.id, p.tones[0], '', { meta: p.cat === 'earrings' ? t('per_pair') : '' });
    }
  });
  $('#rail-list').addEventListener('scroll', progress, { passive: true });
  window.addEventListener('resize', progress);
  $('#news').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('#news-email'), ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(inp.value.trim());
    news = ok ? 'ok' : 'err';
    inp.setAttribute('aria-invalid', String(!ok));
    if (ok) inp.value = '';
    renderNews(); if (!ok) inp.focus();
  });

  S.boot({ strings: TZ.strings(STR), render: render, cartKey: 'asala-17-cart', orderPrefix: 'AS-' });
  render(); TZ.mount(document);
})();
</script>
</body>
</html>
