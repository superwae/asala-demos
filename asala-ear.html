<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Asala Ear Edit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* Layout: an earring specialist that sells by the look on the ear. Edge-to-edge ear photography with red hotspots,
   wide light display type, soft rounded frames, a style finder and a filterable grid. Ivory, sand and charcoal grounds;
   red is reserved for the hotspots, the active choice and the one badge. */
:root {
  --ivory: #F5F1E9; --sand: #EAE2D4; --sand-2: #DFD4C1; --paper: #FFFCF6;
  --char: #33342F; --char-2: #5A5A53; --char-3: #2A2B27; --line: rgba(51,52,47,.15); --line-2: rgba(51,52,47,.32);
  --red: #C6383C; --red-ink: #A52A2E; --gold: #B08A3E;
  --on-dark: #F5F1E9; --on-dark-2: #CFC9BD; --line-dark: rgba(245,241,233,.18);
  --f-display: "Alexandria", "IBM Plex Sans Arabic", sans-serif; --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --gutter: clamp(16px, 4vw, 56px);
  --r-lg: 22px; --r-md: 14px; --r-sm: 10px;
  --shadow-1: 0 2px 10px rgba(51,52,47,.22);
  --shadow-2: 0 16px 40px rgba(51,52,47,.24);
  --ease: cubic-bezier(.16,1,.3,1);
  --jewel-shadow: rgba(51,52,47,.2);
  color-scheme: light;
}
* { box-sizing: border-box; }
html.panel-open { overflow: hidden; }
body { margin: 0; background: var(--ivory); color: var(--char); font: 400 1rem/1.75 var(--f-body); caret-color: var(--red); accent-color: var(--red); }
::selection { background: var(--red); color: var(--paper); }
:focus-visible { outline: 2px solid var(--red-ink); outline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 300; margin: 0; text-wrap: balance; }
html[lang="en"] h1, html[lang="en"] h2 { letter-spacing: -.02em; }
p { margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: var(--gutter); }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; padding: 0; border: 0; }
section[id] { scroll-margin-top: 124px; }
html { scrollbar-color: var(--char-2) var(--sand); }

.demo { background: var(--char); color: var(--on-dark); text-align: center; font-size: .78rem; line-height: 1.5; padding: 7px var(--gutter); }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--ivory) 94%, transparent); backdrop-filter: saturate(1.2) blur(8px); border-bottom: 1px solid var(--line); }
.top-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 64px; }
.top-row > :last-child { justify-self: end; }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--char); text-decoration: none; }
.brand .mk svg { width: 26px; height: 28px; display: block; }
.brand img { height: 14px; width: auto; }
.lang { min-height: 44px; padding: 0 16px; border: 1px solid var(--line-2); border-radius: 999px; background: transparent; font-size: .85rem; }
.lang:hover { border-color: var(--char); }
.bag { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; min-width: 44px; padding: 0 6px 0 10px; border: 0; background: none; font-size: .9rem; }
.bag svg { width: 22px; height: 22px; }
.bag-lbl { display: none; }
.count { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--red); color: var(--paper); font-size: .7rem; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
@media (min-width: 720px) { .bag-lbl { display: inline; } }
.styles-nav { display: flex; justify-content: center; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.styles-nav::-webkit-scrollbar { display: none; }
.styles-nav button { flex: none; min-height: 44px; min-width: 44px; padding: 0 14px; border: 0; background: none; color: var(--char-2); font-size: .92rem; white-space: nowrap; border-radius: 999px; }
.styles-nav button:hover { color: var(--char); background: var(--sand); }
.styles-nav .sep { flex: none; width: 1px; height: 18px; background: var(--line-2); margin-inline: 8px; }
.styles-nav .feat { color: var(--char); font-weight: 500; }
@media (max-width: 760px) { .styles-nav { justify-content: flex-start; margin-inline: calc(-1 * var(--gutter)); padding-inline: 10px; } }

/* ---------- shoppable frames + hotspots ---------- */
.frame { position: relative; overflow: hidden; background: var(--sand); }
.frame > img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
.spot { position: absolute; z-index: 2; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: 0; background: none; display: grid; place-items: center; border-radius: 50%; }
.spot::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 2px solid var(--paper); opacity: 0; animation: ring 2.6s var(--ease) infinite; }
.spot .dot { position: relative; width: 30px; height: 30px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--paper), var(--shadow-1); transition: transform .35s var(--ease), background .2s; }
.spot .dot::before, .spot .dot::after { content: ""; position: absolute; inset: 0; margin: auto; width: 12px; height: 2px; border-radius: 1px; background: var(--paper); }
.spot .dot::after { transform: rotate(90deg); }
.spot:hover .dot { transform: scale(1.1); }
.spot[aria-expanded="true"] .dot { transform: rotate(45deg); background: var(--char); }
.spot[aria-expanded="true"]::before { animation: none; }
.spot:focus-visible { outline: 2px solid var(--paper); outline-offset: 0; box-shadow: 0 0 0 4px var(--char); }
.spot-tag { position: absolute; left: 40px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: var(--paper); color: var(--char); font-size: .8rem; line-height: 1.3; padding: 7px 12px; border-radius: 999px; box-shadow: var(--shadow-1); pointer-events: none; display: none; }
.spot-tag.before { left: auto; right: 40px; }
.spot[aria-expanded="true"] .spot-tag { display: none; }
.spot-tag b { font-weight: 600; font-variant-numeric: tabular-nums; }
@keyframes ring { 0% { transform: scale(.85); opacity: .9; } 70%, 100% { transform: scale(1.6); opacity: 0; } }
.pop { position: absolute; z-index: 3; width: 300px; max-width: calc(100% - 20px); background: var(--paper); color: var(--char); border-radius: var(--r-md); box-shadow: var(--shadow-2); padding: 12px; display: grid; gap: 10px; animation: popin .35s var(--ease); }
.pop.inline { position: relative; width: auto; max-width: none; box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(51,52,47,.12); }
.hero .pop.inline { margin: 12px var(--gutter) 0; }
@keyframes popin { from { opacity: 0; transform: translateY(6px) scale(.98); } }
.pop-top { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.pop-top img { width: 64px; height: 64px; object-fit: cover; border-radius: var(--r-sm); background: var(--sand); }
.pop-top img.cut { object-fit: contain; padding: 4px; }
.pop b { display: block; font-weight: 600; line-height: 1.35; }
.pop small { display: block; color: var(--char-2); font-size: .8rem; line-height: 1.4; }
.pop .pp { display: block; margin-top: 2px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pop-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--char); color: var(--paper); font-weight: 500; text-decoration: none; transition: background .2s, color .2s, box-shadow .2s; }
.btn:hover { background: var(--red); }
.btn.ghost { background: transparent; color: var(--char); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.ghost:hover { box-shadow: inset 0 0 0 1px var(--char); background: var(--paper); }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: .88rem; }
.btn.full { width: 100%; }
.link-btn { border: 0; background: none; padding: 0 4px; min-height: 44px; color: var(--char-2); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line-2); }
.link-btn:hover { color: var(--char); text-decoration-color: var(--red); }

/* ---------- hero ---------- */
@media (min-width: 861px) {
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; max-width: 1440px; margin: 0 auto; }
  .hero .hero-frame { aspect-ratio: 4 / 5 !important; max-height: 84vh !important; }
  .hero .hero-copy { grid-template-columns: 1fr !important; align-items: start; }
}
.hero-frame { aspect-ratio: 1584 / 624; max-height: 74vh; min-height: 340px; width: 100%; }
.hero-frame > img { object-position: 50% 45%; }
.hero-copy { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px 56px; align-items: end; padding-block: clamp(28px, 4vw, 52px) clamp(48px, 7vw, 96px); }
.hero h1 { font-size: clamp(2.5rem, 6.4vw, 5.4rem); line-height: 1.12; font-weight: 200; }
html[lang="en"] .hero h1 { line-height: 1.02; }
.hero h1 span { display: block; }
.hero h1 .accent { color: var(--red); font-weight: 300; }
.hero-side { display: grid; gap: 22px; max-width: 46ch; }
.hero-side p { color: var(--char-2); font-size: 1.05rem; }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; }
@media (min-width: 900px) { .spot-tag { display: block; } .looks .spot-tag { display: none; } }
@media (max-width: 860px) {
  .hero-frame { aspect-ratio: 4 / 5; max-height: 78vh; }
  .hero-frame > img { object-position: 45% 50%; }
  .hero-copy { grid-template-columns: 1fr; }
}

/* ---------- section heads ---------- */
.sec { padding-block: clamp(56px, 8vw, 112px); }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 12px 32px; flex-wrap: wrap; margin-bottom: clamp(24px, 3vw, 40px); }
.sec-head h2 { font-size: clamp(2rem, 4.2vw, 3.4rem); line-height: 1.15; }
.sec-head p { color: var(--char-2); max-width: 52ch; }

/* ---------- shop the look ---------- */
.looks { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: end; }
.look { margin: 0; display: grid; gap: 12px; }
.look .frame { border-radius: var(--r-lg); aspect-ratio: 3 / 4; }
.look:first-child .frame { aspect-ratio: 4 / 5; }
.look figcaption { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-inline: 4px; }
.cap-name { border: 0; background: none; padding: 0; min-height: 44px; text-align: start; font-weight: 500; font-size: 1rem; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 5px; transition: text-decoration-color .2s; }
.cap-name:hover { text-decoration-color: var(--red); }
.cap-meta { color: var(--char-2); font-size: .85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (max-width: 860px) {
  .looks { display: flex; align-items: flex-start; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scroll-padding-inline: var(--gutter); padding-bottom: 6px; scrollbar-width: none; }
  .looks::-webkit-scrollbar { display: none; }
  .look { flex: 0 0 80%; scroll-snap-align: start; }
  .look .frame, .look:first-child .frame { aspect-ratio: 4 / 5; }
}

/* ---------- style finder ---------- */
.finder { background: var(--sand); }
.finder-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: clamp(20px, 4vw, 56px); align-items: stretch; }
.face { border-radius: var(--r-lg); background: var(--paper); display: grid; place-items: center; padding: 24px; min-height: 100%; }
.face img { width: min(100%, 300px); height: auto; aspect-ratio: 320 / 392; object-fit: cover; object-position: 50% 0; }
.finder-copy { display: grid; gap: 10px; margin-bottom: 26px; }
.finder-copy h2 { font-size: clamp(2rem, 4.2vw, 3.4rem); line-height: 1.15; }
.finder-copy p { color: var(--char-2); max-width: 50ch; }
.quiz { background: var(--paper); border-radius: var(--r-lg); padding: clamp(20px, 3vw, 36px); display: grid; gap: 16px; align-content: start; min-height: 360px; }
.q-of { color: var(--char-2); font-size: .85rem; font-variant-numeric: tabular-nums; }
.q-steps { display: flex; gap: 6px; }
.q-steps i { flex: 1; height: 3px; border-radius: 2px; background: var(--sand-2); }
.q-steps i.on { background: var(--red); }
.q-h { font-size: clamp(1.5rem, 2.6vw, 2.1rem); line-height: 1.3; outline: none; }
.q-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.q-opt { display: grid; gap: 4px; align-content: start; text-align: start; min-height: 112px; padding: 18px; border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--ivory); transition: border-color .2s, background .2s, transform .3s var(--ease); }
.q-opt b { font: 400 1.25rem/1.3 var(--f-display); }
.q-opt span { color: var(--char-2); font-size: .88rem; line-height: 1.5; }
.q-opt:hover { border-color: var(--char); background: var(--paper); }
.q-opt:active { transform: scale(.985); }
.q-opt[aria-pressed="true"] { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); background: var(--paper); }
.res { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.res li { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; align-items: start; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.res li:last-child { border-bottom: 0; padding-bottom: 0; }
.res li.first { grid-template-columns: 140px minmax(0, 1fr); }
.res img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--r-sm); background: var(--sand); }
.res img.cut { object-fit: contain; padding: 6px; }
.res .rank { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--sand); font-size: .8rem; font-weight: 600; margin-inline-end: 8px; vertical-align: 2px; font-variant-numeric: tabular-nums; }
.res li.first .rank { background: var(--red); color: var(--paper); }
.res .rn { font-weight: 600; }
.res li.first .rn { font: 400 1.35rem/1.3 var(--f-display); }
.res .why { color: var(--char); font-size: .92rem; margin-top: 4px; }
.res .match { color: var(--char-2); font-size: .84rem; margin-top: 2px; }
.res .act { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 8px; }
.res .pr { font-weight: 600; font-variant-numeric: tabular-nums; }
.res-foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.res-foot p { color: var(--char-2); font-size: .84rem; }
@media (max-width: 860px) {
  .finder-grid { grid-template-columns: 1fr; }
  .face { display: none; }
}
@media (max-width: 480px) {
  .q-opts { grid-template-columns: 1fr; }
  .q-opt { min-height: 0; }
  .res li.first { grid-template-columns: 96px minmax(0, 1fr); }
  .res li { grid-template-columns: 72px minmax(0, 1fr); }
}

/* ---------- grid ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 18px; border: 1px solid var(--line-2); border-radius: 999px; background: transparent; font-size: .9rem; transition: background .2s, border-color .2s, color .2s; }
.chip:hover { border-color: var(--char); }
.chip[aria-pressed="true"] { background: var(--char); border-color: var(--char); color: var(--paper); }
.chip .n { opacity: .7; margin-inline-start: 6px; font-variant-numeric: tabular-nums; }
.grid-meta { color: var(--char-2); font-size: .88rem; margin: 18px 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 28px 20px; }
.card { display: grid; gap: 12px; align-content: start; }
.card .ph { position: relative; aspect-ratio: 4 / 5; border-radius: var(--r-lg); overflow: hidden; background: var(--sand); }
.card .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .5s var(--ease), transform .9s var(--ease); }
.card .ph.cut img.main { object-fit: contain; padding: 10%; }
.card .ph .alt { opacity: 0; }
.card.show-alt .ph .alt { opacity: 1; }
@media (hover: hover) { .card.has-alt .ph:hover .alt { opacity: 1; } .card .ph:hover img.main { transform: scale(1.03); } }
.card .open { position: absolute; inset: 0; z-index: 1; border: 0; background: none; padding: 0; }
.badge { position: absolute; top: 12px; inset-inline-start: 12px; z-index: 2; background: var(--red); color: var(--paper); font-size: .76rem; font-weight: 500; line-height: 1; padding: 8px 12px; border-radius: 999px; }
.flip { position: absolute; bottom: 10px; inset-inline-end: 10px; z-index: 2; width: 44px; height: 44px; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--paper) 92%, transparent); display: grid; place-items: center; box-shadow: var(--shadow-1); }
.flip svg { width: 20px; height: 20px; }
.flip[aria-pressed="true"] { background: var(--char); color: var(--paper); }
.info { display: grid; gap: 2px; padding-inline: 4px; }
.info .nm { border: 0; background: none; padding: 0; text-align: start; font: 400 1.12rem/1.4 var(--f-display); min-height: 44px; }
.info .nm:hover { color: var(--red-ink); }
.info .sub { color: var(--char-2); font-size: .85rem; line-height: 1.5; }
.info .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.info .pr { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.info .pr small { font-weight: 400; color: var(--char-2); }
.qadd { min-height: 44px; padding: 0 16px; border: 1px solid var(--char); border-radius: 999px; background: transparent; font-size: .86rem; font-weight: 500; white-space: nowrap; transition: background .2s, color .2s; }
.qadd:hover { background: var(--char); color: var(--paper); }
@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px; }
  .card .ph { border-radius: var(--r-md); }
  .badge { top: 8px; inset-inline-start: 8px; font-size: .7rem; padding: 6px 9px; }
  .info .nm { font-size: 1rem; }
  .info .row { margin-top: 6px; }
  .qadd { width: 100%; }
}

/* ---------- how they're made (dark band) ---------- */
.made { background: var(--char); color: var(--on-dark); }
.made :focus-visible { outline-color: var(--on-dark); }
.made .sec-head p { color: var(--on-dark-2); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.steps li { display: grid; gap: 12px; align-content: start; }
.steps .ph { aspect-ratio: 4 / 5; border-radius: var(--r-md); overflow: hidden; background: var(--char-3); }
.steps img { width: 100%; height: 100%; object-fit: cover; }
.steps b { font: 400 1.15rem/1.3 var(--f-display); display: block; }
.steps span { color: var(--on-dark-2); font-size: .9rem; }
.care { margin-top: clamp(36px, 5vw, 64px); padding-top: clamp(28px, 4vw, 40px); border-top: 1px solid var(--line-dark); display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 2fr); gap: 20px 48px; }
.care h3 { font-size: clamp(1.5rem, 2.6vw, 2.1rem); line-height: 1.3; }
.care-note { color: var(--on-dark-2); font-size: .84rem; margin-top: 8px; }
.care ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 32px; }
.care li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; }
.care li svg { width: 22px; height: 23px; color: var(--gold); margin-top: 3px; }
@media (max-width: 860px) {
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px; }
  .care { grid-template-columns: 1fr; }
  .care ul { grid-template-columns: 1fr; }
}

/* ---------- gift ---------- */
.gift-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 64px); align-items: center; }
.gift-ph { position: relative; margin: 0; border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 1594 / 987; background: var(--sand); }
.gift-ph img { width: 100%; height: 100%; object-fit: cover; }
.gift-ph figcaption { position: absolute; bottom: 12px; inset-inline-start: 12px; background: var(--paper); color: var(--char); font-size: .8rem; line-height: 1.3; padding: 8px 14px; border-radius: 999px; box-shadow: var(--shadow-1); }
.gift-copy { display: grid; gap: 18px; }
.gift-copy h2 { font-size: clamp(2rem, 4.2vw, 3.4rem); line-height: 1.15; }
.gift-copy > p { color: var(--char-2); }
.gift-facts { margin: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.gift-facts div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.gift-facts dt { color: var(--char-2); }
.gift-facts dd { margin: 0; text-align: end; }
.gift-facts .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.seals { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
