<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asala · Heritage House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Amiri:wght@400;700&family=Jost:wght@300;400;500&family=Readex+Pro:wght@300;400;500&display=swap">
<link rel="stylesheet" href="brand/asala-tatreez.css">
<style>
/* Layout: a heritage fine-jewellery house. Slim announcement bar, centred small wordmark with utilities at the sides,
   a centred nav row with a mega menu, a full-bleed campaign slider, two collection tiles, a signature carousel,
   a dark editorial "craft" section, pattern medallions, a gifting row and a quiet charcoal footer.
   Tatreez sits in the details: diamond separators, stitched lines, frames on hover and the gold chain over the footer. */
:root {
  --red: #C6383C; --red-2: #A92D31; --ink: #33342F; --teal: #3FA59A; --linen: #F4F3F1; --white: #FFFFFF; --pink: #F2C9C0; --mustard: #EDC56B;
  --line: #E3E0DA; --muted: #64625A; --soft: #9A978E;
  --gutter: clamp(16px, 4vw, 56px); --hd: 124px;
  --tz-bg: var(--linen); --tz-panel: var(--white); --tz-line: var(--line); --tz-ink: var(--ink);
}
html[dir="rtl"] { --f-d: "Amiri", "Cormorant Garamond", serif; --f-b: "Readex Pro", "Jost", sans-serif; --tz-font: var(--f-b); --tz-font-d: var(--f-d); }
html[dir="ltr"] { --f-d: "Cormorant Garamond", "Amiri", serif; --f-b: "Jost", "Readex Pro", sans-serif; --tz-font: var(--f-b); --tz-font-d: var(--f-d); }
* { box-sizing: border-box; }
html { scroll-padding-top: var(--hd); }
body { margin: 0; background: var(--white); color: var(--ink); font: 300 1rem/1.75 var(--f-b); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--red); color: var(--white); }
:focus-visible { outline: 1.5px solid var(--red); outline-offset: 3px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: var(--gutter); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.demo { margin: 0; background: var(--ink); color: #D9D5CC; font-size: .76rem; text-align: center; padding: 5px var(--gutter); line-height: 1.5; }
[dir="ltr"] .up { text-transform: uppercase; letter-spacing: .2em; font-size: .74rem; }
[dir="rtl"] .up { font-size: .86rem; letter-spacing: 0; }

/* buttons: thin outline; on hover two cross-stitches appear beside the label */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 14px; min-height: 50px; padding: 0 34px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-weight: 400; transition: background .25s, color .25s, border-color .25s; }
[dir="ltr"] .btn { text-transform: uppercase; letter-spacing: .18em; font-size: .76rem; }
.btn::before, .btn::after { content: "✕"; font-size: .58rem; color: var(--red); opacity: 0; transform: scale(.4); transition: opacity .25s, transform .25s; }
.btn:hover::before, .btn:hover::after, .btn:focus-visible::before, .btn:focus-visible::after { opacity: 1; transform: none; }
.btn:hover { background: var(--ink); color: var(--white); }
.btn.light { border-color: var(--white); color: var(--white); }
.btn.light::before, .btn.light::after { color: var(--pink); }
.btn.light:hover { background: var(--white); color: var(--ink); }
.btn.light:hover::before, .btn.light:hover::after { color: var(--red); }
.btn.red { background: var(--red); border-color: var(--red); color: var(--white); }
.btn.red::before, .btn.red::after { color: var(--pink); }
.btn.red:hover { background: var(--red-2); border-color: var(--red-2); }
.ulink { border: 0; background: none; padding: 0; min-height: 44px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 1px; text-underline-offset: 8px; }
.ulink:hover { color: var(--red); }

/* announcement bar */
.ann { background: var(--linen); border-bottom: 1px solid var(--line); }
.ann ul { list-style: none; margin: 0; padding: 7px var(--gutter); display: flex; justify-content: center; align-items: center; gap: 16px; font-size: .8rem; color: var(--muted); }
.ann canvas { width: 14px; height: 14px; }
@media (max-width: 760px) { .ann li.more { display: none; } }

/* header */
.hd { position: sticky; top: 0; z-index: 40; background: var(--white); border-bottom: 1px solid var(--line); }
.hd-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 72px; }
.hd-side { display: flex; align-items: center; gap: 4px; }
.hd-side.end { justify-content: flex-end; }
.logo { display: block; padding: 8px; }
.logo img { height: 24px; width: auto; }
.ib { position: relative; width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; background: none; padding: 0; }
.ib svg { width: 21px; height: 21px; }
.ib:hover { color: var(--red); }
.lang { min-height: 44px; min-width: 44px; padding: 0 10px; border: 0; background: none; font-size: .82rem; font-weight: 400; }
.lang:hover { color: var(--red); }
.count { position: absolute; top: 5px; inset-inline-end: 2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--red); color: var(--white); font-size: .68rem; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.only-m { display: none !important; }
.nav { border-top: 1px solid var(--line); }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; gap: 6px; }
.nav li.sep { width: 16px; height: 16px; }
.nav li.sep canvas { width: 16px; height: 16px; }
.nav button { min-height: 48px; padding: 0 14px; border: 0; background: none; position: relative; color: var(--ink); }
.nav button::after { content: ""; position: absolute; inset-inline: 14px; bottom: 10px; height: 1px; background: var(--red); transform: scaleX(0); transition: transform .3s var(--tz-ease); }
.nav button:hover::after, .nav button[aria-expanded="true"]::after { transform: scaleX(1); }
.nav .chev { width: 10px; height: 10px; margin-inline-start: 6px; vertical-align: middle; transition: transform .25s; }
.nav button[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* mega menu */
.mega { position: absolute; inset-inline: 0; top: 100%; background: var(--white); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); box-shadow: 0 24px 40px -28px rgba(51, 52, 47, .35); }
.mega .wrap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.25fr); gap: 40px; padding-block: 34px 40px; }
.mega h3 { margin: 0 0 14px; color: var(--red); font-weight: 400; }
.mega ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.mega li button { border: 0; background: none; padding: 0; min-height: 40px; font: 400 1.3rem/1.3 var(--f-d); text-align: start; }
.mega li button:hover { color: var(--red); }
.mega .tile { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: end; border: 0; background: var(--linen); padding: 0; text-align: start; }
.mega .tile img { width: 100%; aspect-ratio: 1; object-fit: cover; }
.mega .tile span { display: grid; gap: 4px; padding: 0 0 16px; }
.mega .tile b { font: 400 1.3rem/1.3 var(--f-d); }
.mega .tile small { color: var(--muted); font-size: .86rem; }
.mega .tile:hover b { color: var(--red); }

/* search */
.search { position: absolute; inset-inline: 0; top: 100%; background: var(--white); border-bottom: 1px solid var(--line); box-shadow: 0 24px 40px -28px rgba(51, 52, 47, .35); }
.search .wrap { padding-block: 22px 28px; }
.search label { display: block; margin-bottom: 6px; color: var(--muted); }
.search input { width: 100%; min-height: 52px; border: 0; border-bottom: 1px solid var(--ink); background: none; font: 400 1.6rem/1.2 var(--f-d); padding: 6px 0; }
.search input:focus { outline: none; border-bottom-color: var(--red); }
.results { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 24px; }
.results button { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; width: 100%; min-height: 64px; border: 0; background: none; padding: 4px 0; text-align: start; }
.results img { width: 56px; height: 56px; object-fit: cover; background: var(--linen); }
.results img.cut { object-fit: contain; background: var(--ink); }
.results b { font: 400 1.15rem/1.3 var(--f-d); display: block; }
.results small { color: var(--muted); }
.results button:hover b { color: var(--red); }
.noresult { color: var(--muted); margin: 14px 0 0; }

/* mobile menu */
.mnav { position: fixed; inset: 0; z-index: 55; background: rgba(42, 43, 39, .5); }
.mnav-card { position: absolute; inset-block: 0; inset-inline-start: 0; width: min(380px, 88%); background: var(--white); overflow: auto; padding: 0 22px 30px; }
.mnav-head { display: flex; align-items: center; justify-content: space-between; min-height: 64px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.mnav-head img { height: 20px; width: auto; }
.mnav h3 { margin: 18px 0 4px; color: var(--red); font-weight: 400; }
.mnav ul { list-style: none; margin: 0; padding: 0; }
.mnav li button { width: 100%; min-height: 46px; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 0; text-align: start; font: 400 1.25rem/1.3 var(--f-d); }
.mnav .tz-btn { margin-top: 22px; }

@media (max-width: 960px) {
  :root { --hd: 66px; }
  .nav { display: none; }
  .only-d { display: none !important; }
  .only-m { display: inline-flex !important; align-items: center; justify-content: center; }
  .hd-top { min-height: 64px; }
  .logo img { height: 20px; }
  .mega { display: none; }
}

/* hero slider */
.hero { position: relative; height: clamp(500px, 76vh, 740px); overflow: hidden; background: var(--ink); color: var(--white); }
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 1s ease, visibility 1s; }
.slide.on { opacity: 1; visibility: visible; }
.slide > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); transition: transform 7s ease; }
.slide.on > img { transform: none; }
.slide.photo::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 46% 42% at 50% 68%, rgba(32, 33, 30, .46), rgba(32, 33, 30, 0) 100%), linear-gradient(to top, rgba(32, 33, 30, .7) 0%, rgba(32, 33, 30, .28) 36%, rgba(32, 33, 30, 0) 62%); }
.slide.photo .cap { text-shadow: 0 1px 14px rgba(20, 20, 18, .55); }
.cap { position: absolute; z-index: 1; inset-inline: 0; bottom: 88px; display: grid; justify-items: center; gap: 12px; padding-inline: var(--gutter); text-align: center; }
.cap .kick { margin: 0; color: var(--white); }
.cap h2 { margin: 0; font: 400 clamp(2.3rem, 4.8vw, 4.3rem)/1.1 var(--f-d); text-wrap: balance; max-width: 18ch; }
[dir="rtl"] .cap h2 { line-height: 1.45; }
.cap .stitch { width: 132px; height: 6px; margin: 4px 0 10px; }
.slide.split { display: grid; grid-template-columns: 1fr 1fr; background: var(--linen); color: var(--ink); }
.slide.split > img { position: relative; inset: auto; height: 100%; }
.slide.split .cap { position: relative; inset: auto; bottom: auto; align-content: center; padding-bottom: 40px; }
.slide.split .cap .kick { color: var(--red); }
.slide.split .btn { border-color: var(--ink); color: var(--ink); }
.slide.split .btn:hover { background: var(--ink); color: var(--white); }
.arrow { position: absolute; z-index: 3; top: 50%; translate: 0 -50%; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.7); background: rgba(51, 52, 47, .18); color: var(--white); backdrop-filter: blur(2px); }
.arrow:hover { background: var(--white); color: var(--ink); }
.arrow svg { width: 20px; height: 20px; }
.arrow.prev { inset-inline-start: 22px; } .arrow.next { inset-inline-end: 22px; }
[dir="rtl"] .arrow svg, [dir="rtl"] .car-arrows svg { transform: scaleX(-1); }
.hero-ctl { position: absolute; z-index: 3; bottom: 22px; inset-inline: 0; display: flex; justify-content: center; align-items: center; gap: 4px; }
.hero-ctl .dot { width: 44px; height: 44px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
.hero-ctl .dot::before { content: ""; width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid var(--white); background: transparent; transition: background .3s; }
.hero-ctl .dot[aria-current="true"]::before { background: var(--white); }
.hero.is-split .hero-ctl .dot::before { border-color: var(--ink); }
.hero.is-split .hero-ctl .dot[aria-current="true"]::before { background: var(--red); border-color: var(--red); }
.hero-ctl .pp { width: 44px; height: 44px; border: 0; background: none; color: var(--white); display: grid; place-items: center; margin-inline-start: 8px; }
.hero.is-split .hero-ctl .pp, .hero.is-split .arrow { color: var(--ink); border-color: var(--ink); }
.hero.is-split .arrow:hover { background: var(--ink); color: var(--white); }
.hero-ctl .pp svg { width: 16px; height: 16px; }
@media (max-width: 760px) {
  .hero { height: min(600px, 82svh); }
  .slide.photo > img { object-position: 70% 50%; }
  .slide.photo.wide > img { object-position: 82% 50%; }
  .cap { bottom: 76px; }
  .arrow { display: none; }
  .slide.split { grid-template-columns: 1fr; grid-template-rows: 52% 1fr; }
  .slide.split .cap { padding-bottom: 70px; padding-top: 10px; align-content: start; }
  .slide.split .cap h2 { font-size: 2rem; }
}

/* section heads */
.sec { padding-block: clamp(56px, 8vw, 112px); }
.sec.linen { background: var(--linen); }
.shead { display: grid; justify-items: center; text-align: center; gap: 10px; margin-bottom: clamp(30px, 4vw, 52px); }
.shead .k { margin: 0; color: var(--red); }
.shead h2 { margin: 0; font: 400 clamp(2rem, 3.8vw, 3.2rem)/1.15 var(--f-d); }
[dir="rtl"] .shead h2 { line-height: 1.5; }
.shead p.d { margin: 0; color: var(--muted); max-width: 52ch; }
.shead canvas.dia { width: 16px; height: 16px; }

/* collections */
.colls { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 3vw, 40px); }
.coll { position: relative; display: grid; gap: 18px; text-align: center; }
.coll .ph { position: relative; aspect-ratio: 5 / 6; overflow: hidden; background: var(--linen); }
.coll .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--tz-ease); }
.coll:hover .ph img { transform: scale(1.03); }
.coll .ph canvas { position: absolute; inset: 18px; width: calc(100% - 36px); height: calc(100% - 36px); opacity: 0; transition: opacity .4s; pointer-events: none; }
.coll:hover .ph canvas, .coll:focus-within .ph canvas { opacity: 1; }
.coll h3 { margin: 0; font: 400 clamp(1.7rem, 2.6vw, 2.3rem)/1.2 var(--f-d); }
.coll p { margin: 0 auto; color: var(--muted); max-width: 40ch; }
.coll .ulink::after { content: ""; position: absolute; inset: 0; }
@media (max-width: 700px) { .colls { grid-template-columns: 1fr; gap: 40px; } }

/* signature carousel */
.tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 6px; margin: -14px 0 30px; }
.tabs button { min-height: 44px; padding: 0 14px; border: 0; background: none; color: var(--muted); position: relative; }
.tabs button[aria-pressed="true"] { color: var(--ink); }
.tabs button[aria-pressed="true"]::after { content: ""; position: absolute; inset-inline: 14px; bottom: 8px; height: 1px; background: var(--red); }
.car-wrap { position: relative; }
.car-arrows { display: flex; justify-content: center; gap: 12px; margin-top: 30px; }
.car-arrows button { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--ink); background: transparent; display: grid; place-items: center; }
.car-arrows button:hover:not(:disabled) { background: var(--ink); color: var(--white); }
.car-arrows button:disabled { opacity: .3; cursor: default; }
.car-arrows svg { width: 18px; height: 18px; }
.track { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 3 * 24px) / 4); gap: 24px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
.track::-webkit-scrollbar { display: none; }
.pc { scroll-snap-align: start; display: grid; gap: 6px; text-align: center; }
.pc .ph { position: relative; aspect-ratio: 4 / 5; background: var(--white); overflow: hidden; }
.pc .ph > button.art { position: absolute; inset: 0; border: 0; padding: 0; background: none; }
.pc .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s var(--tz-ease); }
.pc .ph img.cut { object-fit: contain; background: var(--ink); padding: 8%; }
.pc:hover .ph img { transform: scale(1.04); }
.pc .qv { position: absolute; inset-inline: 12px; bottom: 12px; min-height: 44px; border: 1px solid var(--ink); background: rgba(255,255,255,.94); color: var(--ink); opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s, background .2s, color .2s; }
[dir="ltr"] .pc .qv { text-transform: uppercase; letter-spacing: .16em; font-size: .72rem; }
.pc:hover .qv, .pc:focus-within .qv { opacity: 1; transform: none; }
.pc .qv:hover { background: var(--ink); color: var(--white); }
@media (hover: none) { .pc .qv { opacity: 1; transform: none; } }
.pc .cat { margin: 12px 0 0; color: var(--soft); }
.pc h3 { margin: 0; font: 400 1.3rem/1.3 var(--f-d); }
.pc h3 button { border: 0; background: none; padding: 0; min-height: 44px; }
.pc h3 button:hover { color: var(--red); }
.pc .price { margin: 0; font-variant-numeric: lining-nums tabular-nums; color: var(--ink); }
.pc .price small { color: var(--muted); font-size: .82rem; }
@media (max-width: 1000px) { .track { grid-auto-columns: calc((100% - 2 * 20px) / 3); gap: 20px; } }
@media (max-width: 700px) { .track { grid-auto-columns: 68%; gap: 14px; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scroll-padding-inline: var(--gutter); } }

/* the craft */
.craft { background: var(--ink); color: var(--linen); }
.craft .shead .k { color: var(--mustard); }
.craft .shead p.d { color: #CBC7BD; }
.craft-scroll { overflow-x: auto; scrollbar-width: none; }
.craft-scroll::-webkit-scrollbar { display: none; }
.craft-in { position: relative; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(18px, 2.4vw, 34px); list-style: none; margin: 0; padding: 0; }
.craft-in > canvas { position: absolute; top: 19px; inset-inline: 12.5%; width: 75%; height: 6px; }
.step { position: relative; display: grid; gap: 12px; align-content: start; text-align: center; }
.step .node { justify-self: center; width: 44px; height: 44px; padding: 6px; background: var(--ink); position: relative; z-index: 1; }
.step .node canvas { width: 32px; height: 32px; }
.step .n { margin: 0; color: var(--mustard); font: 400 1.1rem/1 var(--f-d); }
.step img { width: 100%; aspect-ratio: 1; object-fit: cover; }
.step h3 { margin: 6px 0 0; font: 400 1.6rem/1.2 var(--f-d); color: var(--white); }
.step p { margin: 0; color: #CBC7BD; font-size: .95rem; }
.craft .foot { display: flex; justify-content: center; margin-top: 46px; }
@media (max-width: 860px) {
  .craft-scroll { margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scroll-snap-type: x mandatory; scroll-padding-inline: var(--gutter); }
  .craft-in { width: calc(4 * 72vw + 3 * 18px); }
  .steps { gap: 18px; }
  .step { scroll-snap-align: start; }
}

/* inspired by */
.insp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 6vw, 96px); align-items: center; }
.stage { position: relative; aspect-ratio: 1; padding: clamp(30px, 4vw, 48px); max-width: 560px; width: 100%; justify-self: center; }
.stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .disc { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #ECEBE9; box-shadow: 0 0 0 1px var(--line), 0 0 0 10px var(--white), 0 0 0 11px var(--line); }
.stage .disc img { width: 100%; height: 100%; object-fit: contain; padding: 13%; }
.insp .k { margin: 0 0 8px; color: var(--red); }
.insp h2 { margin: 0 0 12px; font: 400 clamp(2rem, 3.6vw, 3rem)/1.15 var(--f-d); }
[dir="rtl"] .insp h2 { line-height: 1.5; }
.insp p.d { margin: 0 0 26px; color: var(--muted); max-width: 46ch; }
.meds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 26px; max-width: 520px; }
.med { display: grid; justify-items: center; gap: 8px; border: 0; background: none; padding: 4px 0; text-align: center; font-size: .82rem; line-height: 1.35; color: var(--muted); }
.med span.ring { width: 84px; height: 84px; max-width: 100%; aspect-ratio: 1; border-radius: 50%; padding: 4px; border: 1px solid var(--line); transition: border-color .25s; }
.med span.ring { background: #ECEBE9; background-clip: content-box; }
.med img { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; padding: 10%; }
.med:hover span.ring { border-color: var(--ink); }
.med[aria-checked="true"] { color: var(--ink); }
.med[aria-checked="true"] span.ring { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.pat-now { border-top: 1px solid var(--line); padding-top: 20px; }
.pat-now h3 { margin: 0; font: 400 1.7rem/1.25 var(--f-d); }
.pat-now p { margin: 4px 0 18px; color: var(--muted); }
.pat-now .row { display: flex; align-items: center; flex-wrap: wrap; gap: 18px; }

footer .cols { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr 1.5fr; gap: 32px; padding-block: 46px 40px; }
footer .logo { padding: 0; margin-bottom: 14px; display: inline-block; }
footer .logo img { height: 20px; }
footer h4 { margin: 0 0 12px; color: var(--white); font-weight: 400; }

footer li button { border: 0; background: none; padding: 0; min-height: 40px; color: inherit; text-align: start; }
footer li button:hover { color: var(--white); text-decoration: underline; text-underline-offset: 5px; text-decoration-color: var(--mustard); }

    },
    en: {

      pl_mashrabiya: 'The lattice of a carved wooden window screen.', pl_tatreez: 'A Palestinian cross-stitch motif, set inside the dome.',

      g1: 'The Asala box', g1d: 'Charcoal boxes in four sizes, from the earring box to the large gift box.',
      g2: 'The pouch', g2d: 'A soft black pouch from the packaging family, for pieces on the move (to confirm with each order).',

      seal_k: 'Seal colour (to confirm)', seal_pick: 'Selected: {s}',

      foot_wa: 'WhatsApp orders (to confirm)', foot_care: 'Jewellery care (coming soon)', foot_made: 'Cut and finished by hand in Nablus',
      nl_h: 'Letters from Asala', nl_p: 'New pieces from the sketchbook, once a season.', nl_label: 'Your email', nl_ph: 'Your email address', nl_btn: 'Subscribe',
      nl_err: 'Enter a valid email address.', nl_ok: 'Thank you. This is a design demo; no email was sent.',
      per_pair: 'per pair'

  };

  function L(o) { return o[S.lang()]; }
  function collName(id) { return L(A.COLLECTIONS[id]); }
  function priceHTML(p) {
    return p.configurable ? '<small>' + esc(t('from')) + '</small> ' + S.money(A.MATERIALS[0].price) : S.money(p.price);
  }
  function curPat() { return A.PATTERNS.filter(function (p) { return p.id === pat; })[0]; }

  /* ---------- menus ---------- */
  function collLinks() {
    return ['dome', 'najma'].map(function (id) { return '<li><button type="button" data-coll-go="' + id + '">' + esc(collName(id)) + '</button></li>'; }).join('');
  }
  function renderMenus() {
    $('#mg-colls').innerHTML = collLinks();
    $('#mn-colls').innerHTML = collLinks();
    var d = S.byId('dome'); $('#mg-name').textContent = S.name(d); $('#mg-price').innerHTML = priceHTML(d);
    var shop = $('#ft-shop');
    $$('li.coll-li', shop).forEach(function (li) { li.remove(); });
    ['dome', 'najma'].forEach(function (id) { var li = document.createElement('li'); li.className = 'coll-li'; li.innerHTML = '<button type="button" data-coll-go="' + id + '">' + esc(collName(id)) + '</button>'; shop.appendChild(li); });
  }
  var megaBtn = $('#mega-btn'), mega = $('#mega'), megaAt = 0, megaT;
  function megaOpen(v) {
    clearTimeout(megaT);
    if (v && mega.hidden) { closeSearch(); megaAt = Date.now(); }
    mega.hidden = !v; megaBtn.setAttribute('aria-expanded', String(!!v));
  }
  megaBtn.addEventListener('mouseenter', function () { megaOpen(true); });
  megaBtn.addEventListener('focus', function () { megaOpen(true); });
  [megaBtn, mega].forEach(function (el) {
    el.addEventListener('mouseleave', function () { megaT = setTimeout(function () { megaOpen(false); }, 180); });
    el.addEventListener('mouseenter', function () { clearTimeout(megaT); });
  });
  $$('.nav button:not(#mega-btn)').forEach(function (b) { b.addEventListener('mouseenter', function () { megaOpen(false); }); b.addEventListener('focus', function () { megaOpen(false); }); });
  document.addEventListener('focusin', function (e) { if (!mega.hidden && !e.target.closest('#mega, #mega-btn')) megaOpen(false); });

  var sBtn = $('#search-btn'), sPanel = $('#search');
  function closeSearch() { if (!sPanel.hidden) { sPanel.hidden = true; sBtn.setAttribute('aria-expanded', 'false'); } }
  function renderSearch() {
    var q = $('#q').value.trim().toLowerCase();
    var list = S.PRODUCTS.filter(function (p) { return !q || (p.ar + ' ' + p.en + ' ' + S.CATS[p.cat].ar + ' ' + S.CATS[p.cat].en).toLowerCase().indexOf(q) > -1; });
    $('#results').innerHTML = list.map(function (p) {
      return '<li><button type="button" data-open="' + p.id + '"><img' + (p.cutout ? ' class="cut"' : '') + ' src="' + p.photo + '" alt=""><span><b>' + esc(S.name(p)) + '</b><small>' + esc(S.CATS[p.cat][S.lang()]) + ' · ' + priceHTML(p) + '</small></span></button></li>';
    }).join('');
    $('#noresult').hidden = list.length > 0;
  }
  sBtn.addEventListener('click', function () {
    if (sPanel.hidden) { megaOpen(false); sPanel.hidden = false; sBtn.setAttribute('aria-expanded', 'true'); renderSearch(); setTimeout(function () { $('#q').focus(); }, 20); }
    else closeSearch();
  });
  $('#q').addEventListener('input', renderSearch);

  var mnav = $('#mnav'), burger = $('#burger');
  function mnavOpen(v) {
    mnav.hidden = !v; burger.setAttribute('aria-expanded', String(v));
    document.documentElement.classList.toggle('panel-open', v);
    if (v) setTimeout(function () { $('#mnav-x').focus(); }, 20); else burger.focus({ preventScroll: true });
  }
  burger.addEventListener('click', function () { closeSearch(); mnavOpen(true); });
  $('#mnav-x').addEventListener('click', function () { mnavOpen(false); });
  mnav.addEventListener('click', function (e) { if (e.target === mnav) mnavOpen(false); });
  mnav.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var f = $$('button', mnav), first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!mnav.hidden) { mnavOpen(false); return; }
    if (!mega.hidden) { megaOpen(false); megaBtn.focus(); return; }
    if (!sPanel.hidden) { closeSearch(); sBtn.focus(); }
  });
  document.addEventListener('click', function (e) {
    if (!sPanel.hidden && !e.target.closest('#search, #search-btn')) closeSearch();
    if (!mega.hidden && !e.target.closest('#mega, #mega-btn')) megaOpen(false);
  });

  /* ---------- hero ---------- */
  var slides = $$('#hero .slide'), userPaused = RM, hoverPaused = false, timer = null;
  function renderHero() {
    $('#dots').innerHTML = slides.map(function (_, i) {
      return '<button class="dot" type="button" data-dot="' + i + '" aria-label="' + esc(t('slide_n', { n: i + 1, m: slides.length })) + '" aria-current="' + (i === slide) + '"></button>';
    }).join('');
    slides.forEach(function (s, i) { s.setAttribute('aria-label', t('slide_n', { n: i + 1, m: slides.length })); });
    var pp = $('#pp'); pp.innerHTML = userPaused ? PLAY : PAUSE; pp.setAttribute('aria-label', t(userPaused ? 'play' : 'pause'));
  }
  function show(i) {
    slide = (i + slides.length) % slides.length;
    slides.forEach(function (s, k) { s.classList.toggle('on', k === slide); });
    $('#hero').classList.toggle('is-split', slides[slide].classList.contains('split'));
    renderHero();
  }
  function tick() { clearInterval(timer); timer = null; if (!userPaused) timer = setInterval(function () { if (!hoverPaused && !document.hidden) show(slide + 1); }, 6000); }
  var hero = $('#hero');
  hero.addEventListener('mouseenter', function () { hoverPaused = true; });
  hero.addEventListener('mouseleave', function () { hoverPaused = false; });
  hero.addEventListener('focusin', function () { hoverPaused = true; });
  hero.addEventListener('focusout', function (e) { if (!hero.contains(e.relatedTarget)) hoverPaused = false; });

  /* ---------- collections ---------- */
  var COLL_IMG = { dome: 'brand/dome-stone.jpg', najma: 'brand/clay-arcs.jpg' };
  function renderColls() {
    $('#colls').innerHTML = ['dome', 'najma'].map(function (id) {
      var c = A.COLLECTIONS[id];
      return '<article class="coll"><div class="ph"><img src="' + COLL_IMG[id] + '" alt="" loading="lazy"><canvas data-stitch="frame" data-cell="4"></canvas></div>' +
        '<h3>' + esc(L(c)) + '</h3><p>' + esc(S.lang() === 'ar' ? c.dAr : c.dEn) + '</p>' +
        '<div><button class="ulink" type="button" data-coll-go="' + id + '">' + esc(t('explore')) + '</button></div></article>';
    }).join('');
    $$('#colls .coll').forEach(function (el) {
      var cv = el.querySelector('canvas');
      el.addEventListener('mouseenter', function () { TZ.draw(cv, true); });
    });
  }

  /* ---------- signature carousel ---------- */
  function tabs() {
    return [{ type: 'all', v: '', k: 'c_all' }, { type: 'coll', v: 'dome', k: 't_dome' }, { type: 'coll', v: 'najma', k: 't_najma' },
      { type: 'cat', v: 'earrings', k: 'c_earrings' }, { type: 'cat', v: 'necklace', k: 'c_necklace' }];
  }
  function renderCarousel() {
    $('#tabs').innerHTML = tabs().map(function (x) {
      return '<button type="button" data-tab="' + x.type + ':' + x.v + '" aria-pressed="' + (x.type === filter.type && x.v === filter.v) + '">' + esc(t(x.k)) + '</button>';
    }).join('');
    var list = S.PRODUCTS.filter(function (p) { return filter.type === 'all' || (filter.type === 'coll' ? p.coll === filter.v : p.cat === filter.v); });
    $('#track').innerHTML = list.map(function (p) {
      return '<article class="pc"><div class="ph"><button class="art" type="button" data-open="' + p.id + '" tabindex="-1" aria-hidden="true"><img' + (p.cutout ? ' class="cut"' : '') + ' src="' + p.photo + '" alt="" loading="lazy"></button>' +
        '<button class="qv" type="button" data-open="' + p.id + '" aria-label="' + esc(t('qv') + ': ' + S.name(p)) + '">' + esc(t('qv')) + '</button></div>' +
        '<p class="cat up">' + esc(S.CATS[p.cat][S.lang()]) + '</p>' +
        '<h3><button type="button" data-open="' + p.id + '">' + esc(S.name(p)) + '</button></h3>' +
        '<p class="price">' + priceHTML(p) + '</p></article>';
    }).join('');
    $('#track').scrollLeft = 0; carState();
  }
  function rtl() { return document.documentElement.dir === 'rtl'; }
  function carState() {
    var tr = $('#track'), max = tr.scrollWidth - tr.clientWidth, pos = Math.abs(tr.scrollLeft);
    $('#car-prev').disabled = pos < 4; $('#car-next').disabled = pos > max - 4;
    $('.car-arrows').style.visibility = max > 4 ? 'visible' : 'hidden';
  }
  function carMove(d) {
    var tr = $('#track'), card = tr.querySelector('.pc'); if (!card) return;
    var step = card.getBoundingClientRect().width + parseFloat(getComputedStyle(tr).columnGap || 0);
    tr.scrollBy({ left: d * step * (rtl() ? -1 : 1), behavior: RM ? 'auto' : 'smooth' });
  }
  $('#track').addEventListener('scroll', function () { carState(); }, { passive: true });
  window.addEventListener('resize', carState);

  /* ---------- inspired by ---------- */
  function renderPatterns() {
    $('#meds').innerHTML = A.PATTERNS.map(function (p) {
      return '<button class="med" type="button" role="radio" data-pat="' + p.id + '" aria-checked="' + (p.id === pat) + '" tabindex="' + (p.id === pat ? 0 : -1) + '"><span class="ring"><img src="' + p.img + '" alt=""></span>' + esc(L(p)) + '</button>';
    }).join('');
    var c = curPat();
    $('#pat-big').src = c.img; $('#pat-big').alt = S.name(S.byId('dome')) + ' · ' + L(c);
    $('#pat-name').textContent = L(c);
    $('#pat-line').textContent = t('pl_' + c.id);
    $('#pat-price').innerHTML = priceHTML(S.byId('dome'));
  }
  $('#meds').addEventListener('keydown', function (e) {
    var keys = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']; if (keys.indexOf(e.key) < 0) return;
    e.preventDefault();
    var ids = A.PATTERNS.map(function (p) { return p.id; }), i = ids.indexOf(pat);
    var d = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1; if (rtl() && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) d = -d;
    pat = ids[(i + d + ids.length) % ids.length]; renderPatterns(); $('#meds [aria-checked="true"]').focus();
  });

  /* the Dome sheet: pattern pills, the pattern photo, and the pattern saved with the bag line */
  function fillSheetExtra(p) {
    var ex = $('[data-sheet-extra]'), sheet = $('[data-sheet]');
    if (!p || p.id !== 'dome') { ex.innerHTML = ''; sheetPat = false; return; }
    ex.innerHTML = '<fieldset class="tz-fs"><legend>' + esc(t('sheet_pat')) + '</legend><div class="tz-tones" role="radiogroup">' +
      A.PATTERNS.map(function (x) { return '<button type="button" class="tone" role="radio" data-spat="' + x.id + '" aria-checked="' + (x.id === pat) + '">' + esc(L(x)) + '</button>'; }).join('') +
      '</div><p style="margin:8px 0 0;color:var(--tz-muted);font-size:.84rem">' + esc(t('sheet_pat_note')) + '</p></fieldset>';
    if (sheetPat) { var ph = $('[data-sheet-photo]', sheet); if (ph) { ph.src = curPat().img; } }
  }
  S.on('sheet', function (d) {
    var sheet = $('[data-sheet]');
    if (!sheet.classList.contains('is-open')) { sheetPat = pendingPat; pendingPat = false; }
    fillSheetExtra(d.product);
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-sheet-add]'), cur = S.current();
    if (!b || !cur || cur.id !== 'dome') return;
    e.stopImmediatePropagation(); e.preventDefault();
    var tp = $('[data-tone-pick][aria-checked="true"]'), tone = tp ? tp.getAttribute('data-tone-pick') : cur.tones[0];
    S.add('dome', tone, '', { meta: t('pat_meta', { p: L(curPat()) }) + ' · ' + t('per_pair') });
    $('[data-sheet] [data-close]').click();
  }, true);

  /* ---------- gifting ---------- */
  function renderSeals() {
    $('#seals').innerHTML = A.SEALS.map(function (s) {
      return '<button class="seal" type="button" data-seal="' + s.id + '" aria-pressed="' + (s.id === seal) + '"><i style="background:' + s.color + '"></i>' + esc(L(s)) + '</button>';
    }).join('');
    var s = A.SEALS.filter(function (x) { return x.id === seal; })[0];
    var w = $('#wax'); w.innerHTML = A.MARK; w.style.background = s.color; w.style.color = s.ink;
    $('#seal-note').textContent = t('seal_pick', { s: L(s) });
  }

  /* ---------- newsletter (demo only, nothing is sent) ---------- */
  $('#nl').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('#nl-email').value.trim(), m = $('#nl-msg');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { m.className = 'msg err'; m.setAttribute('data-k', 'nl_err'); m.textContent = t('nl_err'); $('#nl-email').setAttribute('aria-invalid', 'true'); $('#nl-email').focus(); return; }
    $('#nl-email').setAttribute('aria-invalid', 'false'); $('#nl-email').value = '';
    m.className = 'msg ok'; m.setAttribute('data-k', 'nl_ok'); m.textContent = t('nl_ok');
  });

  /* ---------- navigation ---------- */
  function go(id) { var el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); }
  function leaveMenus() { megaOpen(false); closeSearch(); if (!mnav.hidden) { mnav.hidden = true; burger.setAttribute('aria-expanded', 'false'); document.documentElement.classList.remove('panel-open'); } }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'mega-btn') { if (mega.hidden) megaOpen(true); else if (Date.now() - megaAt > 400) megaOpen(false); return; }
    if (b.hasAttribute('data-go')) { leaveMenus(); go(b.getAttribute('data-go')); return; }
    if (b.hasAttribute('data-coll-go')) { leaveMenus(); filter = { type: 'coll', v: b.getAttribute('data-coll-go') }; renderCarousel(); go('signature'); return; }
    if (b.hasAttribute('data-cat-go')) { leaveMenus(); var c = b.getAttribute('data-cat-go'); filter = c === 'all' ? { type: 'all', v: '' } : { type: 'cat', v: c }; renderCarousel(); go('signature'); return; }
    if (b.hasAttribute('data-pat-go')) { leaveMenus(); pat = b.getAttribute('data-pat-go'); renderPatterns(); go('inspired'); return; }
    if (b.hasAttribute('data-open')) { leaveMenus(); return; }
    if (b.hasAttribute('data-tab')) { var x = b.getAttribute('data-tab').split(':'); filter = { type: x[0], v: x[1] }; renderCarousel(); return; }
    if (b.id === 'car-prev') { carMove(-1); return; }
    if (b.id === 'car-next') { carMove(1); return; }
    if (b.hasAttribute('data-hero')) { show(slide + Number(b.getAttribute('data-hero'))); tick(); return; }
    if (b.hasAttribute('data-dot')) { show(Number(b.getAttribute('data-dot'))); tick(); return; }
    if (b.id === 'pp') { userPaused = !userPaused; renderHero(); tick(); return; }
    if (b.hasAttribute('data-pat')) { pat = b.getAttribute('data-pat'); renderPatterns(); return; }
    if (b.id === 'pat-order') { pendingPat = true; S.openProduct('dome'); return; }
    if (b.hasAttribute('data-spat')) { pat = b.getAttribute('data-spat'); sheetPat = true; renderPatterns(); fillSheetExtra(S.current()); return; }
    if (b.hasAttribute('data-seal')) { seal = b.getAttribute('data-seal'); renderSeals(); return; }
  });

  function render() {
    renderMenus(); renderHero(); renderColls(); renderCarousel(); renderPatterns(); renderSeals();
    if (!sPanel.hidden) renderSearch();
    var m = $('#nl-msg'); if (m.getAttribute('data-k')) m.textContent = t(m.getAttribute('data-k'));
    TZ.mount($('#colls'));
  }

  S.boot({ strings: TZ.strings(STR), render: render, cartKey: 'asala-18-cart', orderPrefix: 'AS-' });
  render(); show(0); tick(); TZ.mount(document);
})();
</script>
</body>
