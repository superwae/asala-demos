<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Siwar Editorial Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Layout: an editorial everyday-jewellery store in the manner of the big direct-to-consumer brands.
   Photo-led split hero, category circles, a new-in shelf with second-image cards, a tappable shop-the-look photo,
   a gift guide by budget, a filterable catalogue, and a gallery product view with details and pairings. */
:root {
  --bg: #ffffff; --sand: #f4efe8; --sand-2: #ebe4da; --ink: #1b1815; --muted: #6a625a; --line: #e7e1d9; --edge: #8f877e;
  --btn: #1b1815; --on-btn: #ffffff; --error: #b3261e; --spot: #ffffff;
  --f: "Almarai", "Segoe UI", Tahoma, sans-serif;
  --gutter: clamp(16px, 3.5vw, 48px);
  --jewel-shadow: rgba(27, 24, 21, .2);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141210; --sand: #1f1c19; --sand-2: #282420; --ink: #f2ede6; --muted: #aaa196; --line: #322d28; --edge: #776f66;
  --btn: #f2ede6; --on-btn: #141210; --error: #ff8a80; --jewel-shadow: rgba(0,0,0,.55); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141210; --sand: #1f1c19; --sand-2: #282420; --ink: #f2ede6; --muted: #aaa196; --line: #322d28; --edge: #776f66;
  --btn: #f2ede6; --on-btn: #141210; --error: #ff8a80; --jewel-shadow: rgba(0,0,0,.55); color-scheme: dark; }
* { box-sizing: border-box; }
html.panel-open { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.7 var(--f); }
::selection { background: var(--sand-2); color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: var(--gutter); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { font-weight: 400; margin: 0; text-wrap: balance; }
.h-xl { font-size: clamp(2.2rem, 4.6vw, 3.8rem); line-height: 1.15; font-weight: 300; }
.h-l { font-size: clamp(1.6rem, 2.8vw, 2.3rem); line-height: 1.25; font-weight: 300; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 28px; border: 1px solid var(--btn); background: var(--btn); color: var(--on-btn); font-weight: 700; font-size: .95rem; border-radius: 0; }
.btn:hover { opacity: .88; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.light { background: #fff; color: #1b1815; border-color: #fff; }
.btn.light-ghost { background: transparent; color: #fff; border-color: #fff; }
.full { width: 100%; }
.link { background: none; border: 0; padding: 0; min-height: 44px; text-decoration: underline; text-underline-offset: 5px; font-weight: 700; }

.promo { margin: 0; background: var(--ink); color: var(--bg); text-align: center; font-size: .82rem; padding: 9px var(--gutter); }
.demo { margin: 0; background: var(--sand); color: var(--muted); text-align: center; font-size: .78rem; padding: 6px var(--gutter); }

/* header + mega menu */
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.header .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 70px; gap: 12px; }
.nav { display: flex; gap: 4px; }
.nav button { background: none; border: 0; min-height: 44px; padding: 0 12px; font-weight: 700; font-size: .95rem; }
.nav button[aria-expanded="true"] { text-decoration: underline; text-underline-offset: 8px; }
.logo { font-size: 1.7rem; font-weight: 800; letter-spacing: .02em; color: var(--ink); text-decoration: none; }
.tools { display: flex; gap: 2px; justify-content: flex-end; align-items: center; }
.icon { position: relative; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; }
.icon svg { width: 21px; height: 21px; }
.count { position: absolute; top: 4px; inset-inline-end: 2px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px; background: var(--ink); color: var(--bg); font-size: .66rem; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.lang { min-height: 44px; padding: 0 10px; background: none; border: 0; font-weight: 700; font-size: .85rem; text-decoration: underline; text-underline-offset: 5px; }
.burger { display: none; }
.mega { border-top: 1px solid var(--line); background: var(--bg); box-shadow: 0 18px 30px rgba(0,0,0,.08); }
.mega .wrap { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 32px; padding-block: 28px 34px; }
.mega h3 { font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin-bottom: 10px; }
.mega ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.mega li button { background: none; border: 0; padding: 0; min-height: 40px; font-size: 1.05rem; text-align: start; }
.mega li button:hover { text-decoration: underline; text-underline-offset: 5px; }
.mega .feature { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: end; background: none; border: 0; padding: 0; text-align: start; }
.mega .feature img { aspect-ratio: 4 / 5; object-fit: cover; width: 100%; }
.mega .feature span { font-weight: 700; }
.search { border-top: 1px solid var(--line); padding-block: 14px; }
.search input { width: 100%; min-height: 50px; padding: 0 16px; border: 1px solid var(--edge); background: var(--bg); font-size: 1rem; }
.results { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.results button { width: 100%; display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; background: none; border: 0; padding: 6px; text-align: start; }
.results button:hover { background: var(--sand); }
.results img, .results canvas { width: 56px; height: 70px; object-fit: cover; background: var(--sand); }
.results small { display: block; color: var(--muted); }
@media (max-width: 900px) {
  .nav { display: none; } .burger { display: grid; }
  .header .wrap { grid-template-columns: auto 1fr auto; }
  .logo { justify-self: center; }
  .mega .wrap { grid-template-columns: 1fr; gap: 20px; }
  .mega .feature { grid-template-columns: 1fr 1fr; }
}

/* hero */
.hero { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.hero figure { margin: 0; position: relative; aspect-ratio: 4 / 5; max-height: 86vh; width: 100%; overflow: hidden; }
.hero img { width: 100%; height: 100%; object-fit: cover; }
.hero .copy { position: absolute; inset-inline: 0; bottom: 0; padding: clamp(20px, 4vw, 48px); color: #fff; background: linear-gradient(to top, rgba(0,0,0,.5), transparent); display: grid; gap: 14px; justify-items: start; }
.hero .copy p { margin: 0; max-width: 34ch; color: rgba(255,255,255,.9); }
.hero .btns { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .hero figure + figure { display: none; } .hero figure { aspect-ratio: 4 / 5; } }

.sec { padding-block: clamp(40px, 6vw, 80px); }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }

/* category circles */
.circles { display: flex; gap: clamp(14px, 3vw, 36px); justify-content: center; flex-wrap: wrap; }
.circle { display: grid; justify-items: center; gap: 10px; background: none; border: 0; padding: 0; width: clamp(86px, 13vw, 132px); }
.circle .ph { position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: var(--sand); }
.circle img, .circle canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
.circle:hover img { transform: scale(1.06); }
.circle span { font-weight: 700; font-size: .95rem; }

/* product card with second image */
.card { position: relative; display: grid; gap: 6px; align-content: start; }
.card .media { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--sand); }
.card .media img, .card .media canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .45s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
.card .media canvas { inset: 6%; width: 88%; height: 88%; }
.card .media .alt { opacity: 0; }
@media (hover: hover) { .card:hover .media .alt { opacity: 1; } .card:hover .media img:first-child { transform: scale(1.02); } }
.card .open { position: absolute; inset: 0; z-index: 1; background: none; border: 0; padding: 0; }
.card .badge { position: absolute; top: 10px; inset-inline-start: 10px; z-index: 2; background: var(--bg); color: var(--ink); font-size: .72rem; font-weight: 700; padding: 3px 10px; pointer-events: none; }
.card .quick { position: absolute; bottom: 10px; inset-inline: 10px; z-index: 2; min-height: 44px; border: 0; background: var(--bg); color: var(--ink); font-weight: 700; font-size: .88rem; opacity: 0; transform: translateY(6px); transition: .25s; }
@media (hover: hover) { .card:hover .quick, .card .quick:focus-visible { opacity: 1; transform: none; } }
@media (hover: none) { .card .quick { opacity: 1; transform: none; position: static; margin-top: 6px; background: transparent; box-shadow: inset 0 0 0 1px var(--edge); width: 100%; } }
.card h3 { font-size: .98rem; font-weight: 400; line-height: 1.45; margin-top: 8px; }
.card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .price { font-weight: 700; font-variant-numeric: tabular-nums; }
.card .tone { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: .82rem; }
.card .tone i { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }

/* shelf */
.shelf-wrap { position: relative; }
.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 23%); gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 6px; }
.shelf::-webkit-scrollbar { display: none; }
.shelf .card { scroll-snap-align: start; }
@media (max-width: 760px) { .shelf { grid-auto-columns: 64%; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); } }
.arrows { display: flex; gap: 8px; }
.arrow { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--edge); background: var(--bg); display: grid; place-items: center; }
.arrow svg { width: 18px; height: 18px; }
[dir="rtl"] .arrow svg { transform: scaleX(-1); }
.arrow:disabled { opacity: .35; cursor: default; }

/* shop the look */
.look { display: grid; grid-template-columns: 1.1fr 1fr; background: var(--sand); }
.look figure { position: relative; margin: 0; aspect-ratio: 11 / 13; }
.look figure img { width: 100%; height: 100%; object-fit: cover; }
.spot { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; }
.spot::before { content: ""; width: 26px; height: 26px; border-radius: 50%; background: var(--spot); box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.spot::after { content: "+"; position: absolute; color: #1b1815; font-weight: 700; font-size: 1.1rem; line-height: 1; }
.spot[aria-pressed="true"]::before { background: #1b1815; box-shadow: 0 0 0 3px #fff, 0 2px 10px rgba(0,0,0,.35); }
.spot[aria-pressed="true"]::after { color: #fff; }
@media (prefers-reduced-motion: no-preference) { .spot::before { animation: breathe 2.6s ease-in-out infinite; } }
@keyframes breathe { 50% { transform: scale(1.12); } }
.look .panel { padding: clamp(24px, 4vw, 56px); display: grid; align-content: center; gap: 18px; }
.look .panel p { margin: 0; color: var(--muted); }
.look-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.look-item { display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; align-items: center; padding: 10px; background: var(--bg); outline: 2px solid transparent; transition: outline-color .2s; }
.look-item.on { outline-color: var(--ink); }
.look-item img { width: 72px; height: 90px; object-fit: cover; }
.look-item b { font-weight: 700; display: block; }
.look-item small { color: var(--muted); font-variant-numeric: tabular-nums; }
.look-item .add { width: 44px; height: 44px; border: 1px solid var(--edge); background: transparent; display: grid; place-items: center; }
.look-item .add svg { width: 18px; height: 18px; }
@media (max-width: 860px) { .look { grid-template-columns: 1fr; } }

/* gift guide */
.gifts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.gift { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border: 0; padding: 0; background: var(--sand); color: #fff; text-align: start; }
.gift img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s cubic-bezier(.2,.8,.2,1); }
.gift:hover img { transform: scale(1.04); }
.gift span { position: absolute; inset-inline: 0; bottom: 0; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,.55), transparent); display: grid; gap: 2px; }
.gift b { font-size: 1.4rem; font-weight: 300; }
.gift small { font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
@media (max-width: 640px) { .gifts { grid-template-columns: 1fr 1fr; } .gifts .gift:last-child { grid-column: span 2; aspect-ratio: 16 / 10; } }

/* catalogue */
.toolbar { position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); z-index: 10; background: var(--bg); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding-block: 12px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 44px; padding: 0 16px; border: 1px solid var(--edge); background: var(--bg); font-weight: 700; font-size: .88rem; border-radius: 22px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tb-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tb-right select { min-height: 44px; padding: 0 12px; border: 1px solid var(--edge); background: var(--bg); border-radius: 22px; }
.count-txt { color: var(--muted); font-size: .88rem; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 14px; }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 8px; } }
.none { grid-column: 1 / -1; padding: 40px 0; text-align: center; color: var(--muted); }

.values { border-top: 1px solid var(--line); }
.values ul { list-style: none; margin: 0; padding: 30px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.values li { display: grid; gap: 4px; justify-items: center; text-align: center; }
.values svg { width: 28px; height: 28px; }
.values b { font-weight: 700; } .values span { color: var(--muted); font-size: .9rem; }
@media (max-width: 720px) { .values ul { grid-template-columns: 1fr; } }
footer { background: var(--sand); padding-block: 40px; font-size: .9rem; color: var(--muted); }
footer .wrap { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
footer b { color: var(--ink); user-select: all; font-variant-numeric: tabular-nums; }

/* product view */
.sheet, .drawer { position: fixed; inset: 0; z-index: 50; background: rgba(20, 18, 16, .45); display: flex; opacity: 0; transition: opacity .25s; }
.is-open { opacity: 1; }
.sheet { align-items: stretch; justify-content: center; padding: 20px; }
.sheet-card { position: relative; width: min(1120px, 100%); max-height: 100%; overflow: auto; display: grid; grid-template-columns: 1.2fr 1fr; background: var(--bg); transform: translateY(14px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.is-open .sheet-card { transform: none; }
.gallery { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 16px; align-content: start; }
.thumbs { display: grid; gap: 8px; align-content: start; }
.thumbs button { padding: 0; border: 1px solid transparent; background: var(--sand); aspect-ratio: 4 / 5; overflow: hidden; }
.thumbs button[aria-pressed="true"] { border-color: var(--ink); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.stage { position: relative; aspect-ratio: 4 / 5; background: var(--sand); overflow: hidden; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stage canvas { position: absolute; inset: 6%; width: 88%; height: 88%; }
.sheet-info { padding: 32px 30px 28px; display: flex; flex-direction: column; gap: 14px; }
.crumbs { margin: 0; font-size: .82rem; color: var(--muted); }
.sheet-info h2 { font-size: 1.9rem; line-height: 1.3; font-weight: 300; }
.sheet-price { margin: 0; font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.cod-note { margin: 0; display: flex; gap: 8px; align-items: center; font-size: .88rem; color: var(--muted); }
.cod-note svg { width: 18px; height: 18px; flex: none; }
fieldset { border: 0; padding: 0; margin: 0; }
legend, .lbl-s { font-size: .85rem; font-weight: 700; margin-bottom: 8px; padding: 0; display: block; }
[data-sheet-tones] { display: flex; gap: 8px; flex-wrap: wrap; }
.tone { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--edge); background: var(--bg); font-size: .9rem; }
.tone[aria-checked="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tone-dot { width: 14px; height: 14px; border-radius: 50%; }
.text-in { width: 100%; min-height: 50px; padding: 0 16px; border: 1px solid var(--edge); background: var(--bg); font: 700 1.4rem "Aref Ruqaa", serif; }
.hint { color: var(--muted); font-size: .82rem; }
.err { color: var(--error); font-size: .86rem; margin: 2px 0 0; min-height: 1em; }
details { border-top: 1px solid var(--line); }
details:last-of-type { border-bottom: 1px solid var(--line); }
summary { list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 52px; font-weight: 700; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-size: 1.3rem; font-weight: 300; }
details[open] summary::after { content: "−"; }
details p, details ul { margin: 0 0 16px; color: var(--muted); font-size: .92rem; }
details ul { padding-inline-start: 18px; }
.pairs h3 { font-size: .9rem; font-weight: 700; margin-bottom: 10px; }
.pairs ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pairs button { width: 100%; display: grid; gap: 6px; background: none; border: 0; padding: 0; text-align: start; }
.pairs img { aspect-ratio: 4 / 5; object-fit: cover; width: 100%; background: var(--sand); }
.pairs small { color: var(--muted); font-variant-numeric: tabular-nums; }
.x { position: absolute; top: 12px; inset-inline-end: 12px; z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bg); display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.x svg { width: 18px; height: 18px; }
@media (max-width: 820px) {
  .sheet { padding: 0; align-items: end; }
  .sheet-card { grid-template-columns: 1fr; max-height: 94%; transform: translateY(40px); }
  .gallery { grid-template-columns: 1fr; padding: 0; }
  .thumbs { grid-auto-flow: column; grid-auto-columns: 56px; order: 2; padding: 8px 16px 0; }
  .sheet-info { padding: 18px 18px calc(22px + env(safe-area-inset-bottom, 0px)); }
}
/* bag */
.drawer { justify-content: flex-end; }
.drawer-card { width: min(430px, 100%); height: 100%; overflow: auto; background: var(--bg); padding: calc(20px + env(safe-area-inset-top, 0px)) 22px calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(40px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
[dir="rtl"] .drawer-card { transform: translateX(-40px); }
.drawer.is-open .drawer-card { transform: none; }
.d-head { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.d-head h2 { font-size: 1.4rem; font-weight: 300; }
.d-head span { color: var(--muted); font-size: .9rem; }
.d-head .x { position: static; margin-inline-start: auto; box-shadow: none; background: var(--sand); }
.cod-bar { display: flex; gap: 10px; align-items: center; background: var(--sand); padding: 10px 12px; font-size: .86rem; margin-bottom: 16px; }
.cod-bar svg { width: 20px; height: 20px; flex: none; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; display: grid; gap: 14px; justify-items: center; }
[data-cart-list] { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
.ci { display: grid; grid-template-columns: 78px 1fr auto; gap: 12px; }
.ci-img { position: relative; width: 78px; height: 98px; background: var(--sand); overflow: hidden; }
.ci-img img { width: 100%; height: 100%; object-fit: cover; }
.ci-img canvas { position: absolute; inset: 6%; width: 88%; height: 88%; }
.ci-name { margin: 0; font-weight: 700; }
.ci-meta { margin: 2px 0 8px; color: var(--muted); font-size: .84rem; }
.ci-row { display: flex; gap: 10px; align-items: center; }
.ci-qty { display: inline-flex; align-items: center; border: 1px solid var(--edge); }
.ci-qty button { width: 44px; height: 44px; border: 0; background: none; font-size: 1.05rem; }

<script src="store.js"></script>
<script>
(function () {
  var S = window.Store, cat = 'all', max = 150, sort = 'new';

  // Two pieces that appear in this store's look photo
  S.PRODUCTS.push(
    { id: 'clip', cat: 'necklace', kind: 'layered', price: 75, tones: ['gold'], photo: 'img/m-hero-a.jpg', photoTone: 'gold', isNew: true,
      ar: 'سلسلة المشبك', en: 'Paperclip chain', dAr: 'سلسلة بحلقات مستطيلة طويلة، تُلبس وحدها أو مع غيرها.', dEn: 'Long rectangular links, worn alone or layered.' },
    { id: 'twin', cat: 'bracelet', kind: 'charm', price: 60, tones: ['gold'], photo: 'img/c-bracelet.jpg', photoTone: 'gold',
      ar: 'سوار المشبك', en: 'Paperclip bracelet', dAr: 'سوار رفيع بحلقات مستطيلة وقفل صغير.', dEn: 'A fine bracelet of rectangular links with a small clasp.' }
  );
  var ALT = { drop: 'img/a-drop.jpg', coin: 'img/a-coin.jpg', pearl: 'img/a-pearl.jpg', layered: 'img/a-layered.jpg', bar: 'img/a-bar.jpg',
    tennis: 'img/a-tennis.jpg', beads: 'img/a-beads.jpg', cuff: 'img/c-bracelet.jpg', charm: 'img/a-charm.jpg', hoops: 'img/a-hoops.jpg',
    drops: 'img/a-drops.jpg', clip: 'img/m-look.jpg', twin: 'img/a-beads.jpg', name: 'img/hand.jpg' };
  var PAIRS = { name: ['clip', 'twin'], drop: ['twin', 'hoops'], coin: ['clip', 'drops'], pearl: ['drops', 'twin'], layered: ['clip', 'twin'], bar: ['hoops', 'twin'],
    tennis: ['drops', 'pearl'], beads: ['drop', 'hoops'], cuff: ['hoops', 'layered'], charm: ['coin', 'drops'], hoops: ['layered', 'twin'], drops: ['pearl', 'cuff'],
    clip: ['layered', 'twin'], twin: ['clip', 'hoops'] };
  var LOOK = ['layered', 'clip', 'twin'];
  var plus = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

  function card(p) {
    var main = S.media(p, { decorative: true });
    var alt = ALT[p.id] && !p.custom ? '<img class="alt" src="' + ALT[p.id] + '" alt="">' : '';
    var t = S.TONES[p.tones[0]];
    return '<article class="card"><div class="media">' + main + alt +
      (p.isNew ? '<span class="badge">' + S.t('new') + '</span>' : '') +
      '<button class="open" type="button" data-open="' + p.id + '" aria-label="' + S.esc(S.t('view') + ': ' + S.name(p)) + '"></button>' +
      (p.custom ? '<button class="quick" type="button" data-open="' + p.id + '">' + S.esc(S.t('personalise')) + '</button>'
                : '<button class="quick" type="button" data-add="' + p.id + '" aria-label="' + S.esc(S.t('add_bag') + ': ' + S.name(p)) + '">' + S.esc(S.t('quick_add')) + '</button>') +
      '</div><h3>' + S.esc(S.name(p)) + '</h3><div class="row"><span class="price">' + S.money(p.price) + '</span>' +
      '<span class="tone"><i style="background:' + t.swatch + '"></i>' + S.esc(t[S.lang()]) + (p.tones.length > 1 ? ' +' + (p.tones.length - 1) : '') + '</span></div></article>';
  }
  function countText(n) {
    if (S.lang() !== 'ar') return n + (n === 1 ? ' piece' : ' pieces');
    return n === 1 ? 'قطعة واحدة' : n === 2 ? 'قطعتان' : n <= 10 ? n + ' قطع' : n + ' قطعة';
  }
  function renderGrid() {
    var items = S.PRODUCTS.filter(function (p) { return (cat === 'all' || p.cat === cat) && p.price <= max; }).slice();
    if (sort === 'low') items.sort(function (a, b) { return a.price - b.price; });
    if (sort === 'high') items.sort(function (a, b) { return b.price - a.price; });
    if (sort === 'new') items.sort(function (a, b) { return (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0); });
    var g = document.getElementById('grid');
    g.innerHTML = items.length ? items.map(card).join('') : '<p class="none">' + S.esc(S.t('none')) + '</p>';
    S.mount(g);
    document.getElementById('count-txt').textContent = countText(items.length);
    S.$$('[data-chip]').forEach(function (c) { c.setAttribute('aria-pressed', String(c.getAttribute('data-chip') === cat)); });
    document.getElementById('max').value = String(max);
  }
  function renderSelects() {
    document.getElementById('max').innerHTML = [[150, S.t('price_any')], [100, S.t('g100')], [60, S.t('g60')]].map(function (o) { return '<option value="' + o[0] + '">' + S.esc(o[1]) + '</option>'; }).join('');
    document.getElementById('sort').innerHTML = [['new', S.t('sort_new')], ['low', S.t('sort_low')], ['high', S.t('sort_high')]].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === sort ? ' selected' : '') + '>' + S.esc(o[1]) + '</option>'; }).join('');
  }
  function renderLook() {
    var total = 0;
    document.getElementById('look-list').innerHTML = LOOK.map(function (id) {
      var p = S.byId(id); total += p.price;

    var q = document.getElementById('q').value.trim().toLowerCase(), out = document.getElementById('results');

    S.mount(out);
  }
