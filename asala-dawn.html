<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Asala Dawn Store</title>
<script>
  // Opens in light mode unless the visitor picked dark before.
  (function () { var t = 'light'; try { t = localStorage.getItem('asala-dawn-theme') || 'light'; } catch (e) {} document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* Layout: the Shopify Dawn storefront Wael picked, rebuilt in ASALA's own brand book: charcoal, ivory and red,
   the real wordmark, real product photos. Image banner, story, trust row, collection list, featured collection,
   featured product (the Dome with its four filigree patterns and three materials), image with text,
   filterable catalogue, how it's made, packaging, email signup, footer. Light by default with a dark switch. */
:root {
  --bg: #fbf9f5; --bg-2: #f1ece2; --fg: #33342F; --fg-75: rgba(51,52,47,.76); --line: rgba(51,52,47,.14); --edge: rgba(51,52,47,.5);
  --btn: #33342F; --on-btn: #F5F1E9; --accent: #C6383C; --accent-ink: #a82d31; --on-accent: #fffaf2; --error: #b3261e;
  --f: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --page: 1240px; --gutter: clamp(16px, 4vw, 50px);
  --jewel-shadow: rgba(51, 52, 47, .2);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1d1e1a; --bg-2: #272823; --fg: #F5F1E9; --fg-75: rgba(245,241,233,.76); --line: rgba(245,241,233,.14); --edge: rgba(245,241,233,.5);
  --btn: #F5F1E9; --on-btn: #1d1e1a; --accent: #e0686b; --accent-ink: #f08a8c; --on-accent: #1d1e1a; --error: #ff8a80; --jewel-shadow: rgba(0,0,0,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html.panel-open { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 1rem/1.75 var(--f); transition: background-color .25s, color .25s; }
::selection { background: var(--fg); color: var(--bg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; box-shadow: 0 0 0 5px var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
.page { max-width: var(--page); margin: 0 auto; padding-inline: var(--gutter); }
section[id] { scroll-margin-top: 92px; }
::placeholder { color: color-mix(in srgb, var(--fg) 60%, var(--bg)); opacity: 1; }
bdi { direction: ltr; unicode-bidi: isolate; }
.drawer-card:has([data-step="confirm"]:not([hidden])) .cod-bar { display: none; }
[data-theme="dark"] .sheet, [data-theme="dark"] .drawer { background: rgba(0,0,0,.7); }
[data-theme="dark"] .sheet-card, [data-theme="dark"] .drawer-card { background: var(--bg-2); border: 1px solid var(--line); }
[data-theme="dark"] .photo-dim { filter: brightness(.9); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.h0 { font-weight: 400; font-size: clamp(2.1rem, 4.6vw, 3.7rem); line-height: 1.2; margin: 0; text-wrap: balance; }
.h1 { font-weight: 400; font-size: clamp(1.7rem, 3.1vw, 2.5rem); line-height: 1.3; margin: 0; text-wrap: balance; }
.h2 { font-weight: 400; font-size: clamp(1.4rem, 2.2vw, 1.85rem); line-height: 1.3; margin: 0; }
.sub { color: var(--fg-75); }

.button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 30px; border: 0; background: var(--btn); color: var(--on-btn); font-size: .98rem; text-decoration: none; transition: box-shadow .1s; }
.button:hover { box-shadow: 0 0 0 1.3px var(--btn); }
.button--secondary { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.button--secondary:hover { box-shadow: inset 0 0 0 2px var(--fg); }
.full { width: 100%; }
.text-link { background: none; border: 0; padding: 0; min-height: 44px; color: var(--fg); text-decoration: underline; text-underline-offset: 5px; }

.announcement { background: #33342F; color: #F5F1E9; text-align: center; font-size: .84rem; padding: 10px var(--gutter); margin: 0; }
[data-theme="dark"] .announcement { background: #11120f; }
.demo { background: var(--bg-2); color: var(--fg-75); text-align: center; font-size: .78rem; padding: 6px var(--gutter); margin: 0; }

/* header */
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); transition: background-color .25s; }
.header .page { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 28px; min-height: 78px; }
.logo { display: grid; justify-items: start; align-content: center; gap: 6px; min-height: 44px; text-decoration: none; color: var(--fg); }
.logo img { height: 20px; width: auto; max-width: none; }
.logo .on-dark { display: none; }
[data-theme="dark"] .logo .on-light { display: none; }
[data-theme="dark"] .logo .on-dark { display: block; }
.logo small { font-size: .7rem; color: var(--fg-75); line-height: 1; }
.menu { display: flex; gap: 2px; flex-wrap: wrap; }
.menu button { background: none; border: 0; padding: 12px 10px; min-height: 44px; font-size: .95rem; color: var(--fg-75); }
.menu button:hover, .menu button[aria-current="true"] { color: var(--fg); text-decoration: underline; text-underline-offset: 6px; }
.icons { display: flex; align-items: center; }
.icon { position: relative; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--fg); }
.icon svg { width: 20px; height: 20px; }
.icon .count { position: absolute; bottom: 4px; inset-inline-end: 2px; min-width: 19px; height: 19px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: .68rem; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.lang { min-height: 44px; padding: 0 12px; border: 1px solid var(--edge); background: none; font-size: .85rem; margin-inline-end: 4px; }
.theme-ico-dark { display: none; }
[data-theme="dark"] .theme-ico-light { display: none; }
[data-theme="dark"] .theme-ico-dark { display: block; }
.burger { display: none; }
@media (max-width: 980px) {
  .menu { display: none; }
  .burger { display: grid; }
  .logo { justify-self: center; justify-items: center; }
}
@media (max-width: 480px) { .logo small { display: none; } .lang { padding: 0 8px; } .logo img { height: 15px; } .header .page { gap: 6px; } #theme-btn { display: none; } }
.mm-theme { display: none; }
@media (max-width: 480px) { .mm-theme { display: block; } }
.mobile-menu { border-top: 1px solid var(--line); padding: 8px var(--gutter) 16px; display: grid; }
.mobile-menu button { text-align: start; background: none; border: 0; padding: 14px 0; font-size: 1.1rem; border-bottom: 1px solid var(--line); }

/* search */
.search-bar { border-top: 1px solid var(--line); padding-block: 14px; }
.search-field input { width: 100%; min-height: 48px; padding: 0 16px; border: 1px solid var(--edge); background: var(--bg); font-size: 1rem; }
.search-results { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px; }
.search-results button { width: 100%; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 6px; background: none; border: 0; text-align: start; }
.search-results button:hover { background: var(--bg-2); }
.search-results img { width: 52px; height: 64px; object-fit: cover; background: var(--bg-2); }
.search-results .pr { color: var(--fg-75); font-variant-numeric: tabular-nums; }

/* image banner: text box over the photo on desktop, stacked under it on phones (Dawn's "stack on mobile") */
.banner { position: relative; min-height: clamp(460px, 44vw, 640px); display: grid; align-items: center; overflow: hidden; background: #e9dfd0; }
.banner > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 80% 40%; }
.banner .page { position: relative; z-index: 1; width: 100%; display: flex; justify-content: flex-start; }
[dir="rtl"] .banner .page { justify-content: flex-start; flex-direction: row-reverse; }
.banner-box { width: min(470px, 100%); background: rgba(251,249,245,.94); color: #33342F; padding: clamp(26px, 3.4vw, 44px); display: grid; gap: 16px; justify-items: start; }
[data-theme="dark"] .banner-box { background: rgba(29,30,26,.92); color: #F5F1E9; }
.banner-box p { margin: 0; color: inherit; opacity: .82; font-size: 1.05rem; }
.banner-box .btns { display: flex; gap: 12px; flex-wrap: wrap; }
@media (max-width: 750px) {
  .banner { display: block; min-height: 0; background: var(--bg-2); }
  .banner > img { position: relative; height: auto; aspect-ratio: 760 / 624; object-position: 78% 50%; }
  .banner .page { padding: 0; }
  .banner-box { width: 100%; background: var(--bg-2); color: var(--fg); padding: 26px var(--gutter) 34px; }
  [data-theme="dark"] .banner-box { background: var(--bg-2); color: var(--fg); }
  .banner-box .btns .button { flex: 1 1 140px; }
}

.section { padding-block: clamp(44px, 6vw, 80px); }
.tight { padding-top: 0; }
.rich { text-align: center; display: grid; gap: 14px; justify-items: center; }
.rich p { margin: 0; max-width: 60ch; color: var(--fg-75); }
.rich .mark { width: 46px; color: var(--accent); }

/* collection list */
.title-row { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
.collections { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.coll { position: relative; display: grid; gap: 10px; background: none; border: 0; padding: 0; text-align: start; }
.coll .media { aspect-ratio: 4 / 5; overflow: hidden; background: var(--bg-2); }
.coll img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.coll:hover img { transform: scale(1.03); }
.coll > span { font-size: 1.08rem; display: inline-flex; align-items: center; gap: 8px; }
.coll svg { width: 16px; height: 16px; transition: transform .2s; }
[dir="rtl"] .coll svg { transform: scaleX(-1); }
.coll:hover svg { transform: translateX(4px); }
[dir="rtl"] .coll:hover svg { transform: scaleX(-1) translateX(4px); }
@media (max-width: 750px) { .collections { grid-template-columns: 1fr 1fr; } }

/* product cards */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 34px 12px; list-style: none; margin: 0; padding: 0; }
@media (max-width: 990px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 750px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 8px; } }
.card { position: relative; display: grid; gap: 4px; align-content: start; }
.card .media { position: relative; aspect-ratio: 4 / 5; background: var(--bg-2); overflow: hidden; }
.card .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .45s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
.card .media.is-cut img { object-fit: contain; padding: 12%; }
.card .media .alt { opacity: 0; }
@media (hover: hover) { .card:hover .media .alt { opacity: 1; } .card:hover .media img { transform: scale(1.03); } }
.card .link { position: absolute; inset: 0; z-index: 1; background: none; border: 0; padding: 0; }
.card h3 { margin: 8px 0 0; font-size: .98rem; font-weight: 400; line-height: 1.45; }
@media (hover: hover) { .card:hover h3 { text-decoration: underline; text-underline-offset: 3px; } }
.card .price { color: var(--fg); font-variant-numeric: tabular-nums; }
.card .from { color: var(--fg-75); font-size: .85rem; }
.badge { position: absolute; bottom: 10px; inset-inline-start: 10px; z-index: 2; background: var(--fg); color: var(--bg); font-size: .75rem; padding: 2px 12px; border-radius: 40px; pointer-events: none; }
.badge.red { background: var(--accent); color: var(--on-accent); }
.quick-add { position: relative; z-index: 2; min-height: 44px; margin-top: 8px; background: transparent; color: var(--fg); border: 0; box-shadow: inset 0 0 0 1px var(--edge); font-size: .9rem; }
.quick-add:hover { box-shadow: inset 0 0 0 2px var(--fg); }

/* featured product */
.fp { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(24px, 4vw, 60px); align-items: start; }
.fp-gallery { display: grid; gap: 10px; }
.fp-stage { position: relative; aspect-ratio: 1; background: var(--bg-2); overflow: hidden; }
.fp-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .3s; }
.fp-stage.is-render, .stage.is-render { background: #fff; }
.fp-stage.is-render img, .stage.is-render img { object-fit: contain; padding: 5%; }
.fp-thumbs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.fp-thumbs button { aspect-ratio: 1; padding: 0; border: 1px solid transparent; background: var(--bg-2); overflow: hidden; min-height: 44px; }
.fp-thumbs button[aria-pressed="true"] { border-color: var(--fg); }
.fp-thumbs img { width: 100%; height: 100%; object-fit: cover; }
.fp-info { display: grid; gap: 14px; position: sticky; top: 100px; }
.fp-info .meta-line { margin: 0; color: var(--fg-75); font-size: .88rem; }
.fp-info .price { margin: 0; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.fp-info .note { margin: -6px 0 0; color: var(--fg-75); font-size: .85rem; }
.opt-label { font-size: .9rem; color: var(--fg-75); margin: 0 0 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.opt-label b { color: var(--fg); font-weight: 500; }
.pats { display: flex; gap: 8px; flex-wrap: wrap; }
.pat { width: 64px; height: 64px; padding: 0; border: 1px solid var(--line); background: var(--bg-2); overflow: hidden; border-radius: 50%; }
.pat img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.35); }
.pat[aria-checked="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--fg); }
.mats { display: flex; gap: 8px; flex-wrap: wrap; }
.mat { min-height: 44px; padding: 6px 16px; border-radius: 40px; border: 1px solid var(--edge); background: var(--bg); font-size: .9rem; display: inline-flex; align-items: center; gap: 8px; text-align: start; }
.mat .sw { width: 16px; height: 16px; border-radius: 50%; flex: none; background-size: cover; border: 1px solid var(--line); }
.mat[aria-checked="true"] { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }
.mto { display: flex; gap: 10px; align-items: flex-start; background: var(--bg-2); padding: 12px 14px; font-size: .88rem; margin: 0; }
.mto svg { width: 20px; height: 20px; flex: none; margin-top: 3px; }
@media (max-width: 860px) { .fp { grid-template-columns: 1fr; } .fp-info { position: static; } }

/* image with text */
.iwt { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-2); }
.iwt.reverse .media { order: 2; }
.iwt .media { position: relative; min-height: 460px; }
.iwt .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.iwt .content { padding: clamp(28px, 5vw, 64px); display: grid; align-content: center; justify-items: start; gap: 14px; }
.iwt .content p { margin: 0; color: var(--fg-75); }
.iwt .small { font-size: .82rem; }
@media (max-width: 750px) { .iwt { grid-template-columns: 1fr; } .iwt.reverse .media { order: 0; } .iwt .media { min-height: 0; aspect-ratio: 4 / 3; } }

/* catalogue */
.toolbar { position: sticky; top: calc(78px + env(safe-area-inset-top, 0px)); z-index: 10; background: var(--bg); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding-block: 12px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
@media (max-width: 750px) { .toolbar { position: static; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 44px; padding: 0 16px; border: 1px solid var(--edge); background: var(--bg); font-size: .9rem; border-radius: 40px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tb-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tb-right select { min-height: 44px; padding: 0 12px; border: 1px solid var(--edge); background: var(--bg); }
.count-txt { color: var(--fg-75); font-size: .88rem; }
.none { grid-column: 1 / -1; padding: 40px 0; text-align: center; color: var(--fg-75); }

/* multicolumn */
.multi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; text-align: center; }
.multi svg { width: 34px; height: 34px; margin: 0 auto 12px; display: block; }
.multi h3 { margin: 0 0 6px; font-weight: 500; font-size: 1.08rem; }
.multi p { margin: 0; color: var(--fg-75); font-size: .95rem; }
.trust .multi { padding-block: 26px; border-block: 1px solid var(--line); }
.steps { text-align: start; }
.steps .ph { aspect-ratio: 4 / 3; overflow: hidden; background: var(--bg-2); margin-bottom: 16px; }
.steps .ph img { width: 100%; height: 100%; object-fit: cover; }
.steps .n { color: var(--accent-ink); font-variant-numeric: tabular-nums; margin-inline-end: 6px; }
@media (max-width: 750px) { .multi { grid-template-columns: 1fr; } }

/* newsletter */
.news { text-align: center; display: grid; gap: 14px; justify-items: center; }
.news form { width: min(440px, 100%); position: relative; }
.news input { width: 100%; min-height: 50px; padding-block: 0; padding-inline: 16px 52px; border: 1px solid var(--edge); background: var(--bg); }
.news button { position: absolute; inset-inline-end: 0; top: 0; width: 50px; height: 50px; background: none; border: 0; display: grid; place-items: center; }
.news button svg { width: 18px; height: 18px; }
[dir="rtl"] .news button svg { transform: scaleX(-1); }
.news .msg { margin: 0; font-size: .9rem; min-height: 1.4em; }

/* footer */
.footer { border-top: 1px solid var(--line); padding-block: 50px 30px; font-size: .92rem; }
.footer .cols { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 30px; }
.footer .about img { height: 18px; width: auto; margin-bottom: 14px; }
.footer .about .on-dark { display: none; }
[data-theme="dark"] .footer .about .on-light { display: none; }
[data-theme="dark"] .footer .about .on-dark { display: block; }
.footer .about p { margin: 0; color: var(--fg-75); max-width: 36ch; }
.footer h4 { margin: 0 0 12px; font-weight: 500; font-size: 1rem; }
.footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; color: var(--fg-75); }
.footer ul button { background: none; border: 0; padding: 0; min-height: 44px; min-width: 44px; color: inherit; text-align: start; }
.footer ul button:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }
.footer .bottom { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 14px; color: var(--fg-75); font-size: .8rem; }
.pay-icons { display: flex; gap: 6px; flex-wrap: wrap; }
.pay-icons span { border: 1px solid var(--line); padding: 2px 8px; font-size: .74rem; }
@media (max-width: 860px) { .footer .cols { grid-template-columns: 1fr 1fr; } .footer .about { grid-column: 1 / -1; } }

/* product view */
.sheet, .drawer { position: fixed; inset: 0; z-index: 50; background: rgba(20,20,17,.5); display: flex; opacity: 0; transition: opacity .25s; }
.is-open { opacity: 1; }
.sheet { align-items: center; justify-content: center; padding: 16px; }
.sheet-card { position: relative; width: min(1060px, 100%); max-height: calc(100% - 16px); overflow: auto; display: grid; grid-template-columns: 1.15fr 1fr; background: var(--bg); transform: translateY(14px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.is-open .sheet-card { transform: none; }
.gallery { padding: 16px; display: grid; gap: 10px; align-content: start; }
.stage { position: relative; aspect-ratio: 4 / 5; background: var(--bg-2); overflow: hidden; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stage canvas { position: absolute; inset: 8%; width: 84%; height: 84%; }
.stage.is-cut img { object-fit: contain; padding: 12%; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs button { width: 64px; aspect-ratio: 4 / 5; padding: 0; border: 1px solid transparent; background: var(--bg-2); overflow: hidden; }
.thumbs button[aria-pressed="true"] { border-color: var(--fg); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.sheet-info { padding: 34px 30px; display: flex; flex-direction: column; gap: 14px; }
.sheet-info h2 { font-weight: 400; font-size: 1.9rem; line-height: 1.3; margin: 0; }
.sheet-cat { margin: 0; color: var(--fg-75); font-size: .85rem; }
.sheet-price { margin: 0; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.ship-note { margin: -8px 0 0; color: var(--fg-75); font-size: .82rem; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-size: .88rem; color: var(--fg-75); margin-bottom: 8px; padding: 0; display: block; }
[data-sheet-tones] { display: flex; gap: 8px; flex-wrap: wrap; }
.tone { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 40px; border: 1px solid var(--edge); background: var(--bg); font-size: .9rem; }
.tone[aria-checked="true"] { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }
.tone-dot { width: 14px; height: 14px; border-radius: 50%; }
.err { color: var(--error); font-size: .86rem; margin: 2px 0 0; min-height: 1em; }
.buy-btns { display: grid; gap: 10px; }
details { border-top: 1px solid var(--line); }
details:last-of-type { border-bottom: 1px solid var(--line); }

<script src="store.js"></script>
<script src="brand/asala-catalog.js"></script>
<script>
(function () {
  var S = window.Store, A = window.ASALA, filter = 'all', max = 999, sort = 'featured';
  A.install(S);
  S.byId('lotus').photo = 'brand/lotus-45.jpg';
  ['mark-rich', 'mark-ok'].forEach(function (id) { var el = document.getElementById(id); el.innerHTML = A.MARK; el.firstChild.style.cssText = 'width:100%;height:auto;display:block'; });

  // The Dome is sold in four filigree patterns and three materials (brand book). Each pattern has its own render.
  var dome = { pattern: 'geometric', mat: 'A' };
  var PAT_IMG = { geometric: 'brand/dome-render.jpg', star: 'brand/pat-star.jpg', mashrabiya: 'brand/pat-mashrabiya.jpg', tatreez: 'brand/pat-tatreez.jpg' };
  var MAT_SW = { A: 'brand/fin-gold-shiny.jpg', B: 'brand/fin-silver-matte.jpg', C: 'brand/fin-gold-matte.jpg' };
  var ALT = { dome: 'brand/dome-worn.jpg', horseshoe: 'brand/woman-arch.jpg' };
  var GALLERY = { dome: ['brand/dome-render.jpg', 'brand/dome-worn.jpg', 'brand/dome-stone.jpg'], horseshoe: ['brand/horseshoe-close.jpg', 'brand/woman-arch.jpg'], 'dome-teal': ['brand/dome-teal.jpg'] };
  var NAJMA = ['dome-teal', 'arcs', 'mihrab', 'branch'];
  var ORDER = ['dome', 'dome-teal', 'horseshoe', 'arcs', 'mihrab', 'branch', 'lotus'];
  var TINT = 'grayscale(1) brightness(1.07) contrast(1.06)';
  function L(o) { return o[S.lang()]; }
  function mat() { return A.MATERIALS.filter(function (m) { return m.id === dome.mat; })[0]; }
  function pat() { return A.PATTERNS.filter(function (p) { return p.id === dome.pattern; })[0]; }
  function domeSrc() { return PAT_IMG[dome.pattern]; }
  function isRender(src) { return /dome-render|pat-/.test(src); }
  function domeFilter() { return mat().tone === 'silver' ? TINT : 'none'; }

  // ---- theme ----
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('asala-dawn-theme', t); } catch (e) {}
    var b = document.getElementById('theme-btn');
    b.setAttribute('aria-pressed', String(t === 'dark'));
    b.setAttribute('aria-label', S.t(t === 'dark' ? 'theme_to_light' : 'theme_to_dark'));
    document.getElementById('mm-theme').textContent = S.t(t === 'dark' ? 'theme_to_light' : 'theme_to_dark');
  }
  document.getElementById('mm-theme').addEventListener('click', function () {
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  document.getElementById('theme-btn').addEventListener('click', function () {
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  // ---- cards ----
  function card(p) {
    var alt = ALT[p.id] ? '<img class="alt" src="' + ALT[p.id] + '" alt="">' : '';
    var badge = p.madeToOrder ? '<span class="badge red">' + S.esc(S.t('mto')) + '</span>' : '';
    var action = p.configurable
      ? '<button class="quick-add" type="button" data-open="' + p.id + '">' + S.esc(S.t('choose')) + '</button>'
      : '<button class="quick-add" type="button" data-add="' + p.id + '" aria-label="' + S.esc(S.t('add_cart') + ': ' + S.name(p)) + '">' + S.esc(S.t('add_cart')) + '</button>';
    return '<li class="card"><div class="media' + (p.cutout ? ' is-cut' : '') + '">' + S.media(p, { decorative: true }) + alt + badge + '</div>' +
      '<button class="link" type="button" data-open="' + p.id + '" aria-label="' + S.esc(S.t('view') + ': ' + S.name(p)) + '"></button>' +
      '<h3>' + S.esc(S.name(p)) + '</h3><span class="price">' + (p.configurable ? '<span class="from">' + S.esc(S.t('from')) + ' </span>' : '') + S.money(p.price) + '</span>' + action + '</li>';
  }
  function fill(id, items) { var el = document.getElementById(id); el.innerHTML = items.map(card).join(''); }
  function countText(n) {
    if (S.lang() !== 'ar') return n + (n === 1 ? ' product' : ' products');
    return n === 0 ? 'لا منتجات' : n === 1 ? 'منتج واحد' : n === 2 ? 'منتجان' : n <= 10 ? n + ' منتجات' : n + ' منتجاً';
  }
  function matches(p) {
    if (filter === 'all') return true;
    if (filter.indexOf('coll:') === 0) return p.coll === filter.slice(5);
    return p.cat === filter;
  }
  function filterName(f) {
    if (f === 'all') return S.t('all_products');
    if (f === 'coll:dome') return S.t('c_dome');
    if (f === 'coll:najma') return S.t('c_najma');
    return S.CATS[f][S.lang()];
  }
  function renderCatalog() {
    var items = S.PRODUCTS.filter(function (p) { return matches(p) && p.price <= max; }).slice();
    if (sort === 'low') items.sort(function (a, b) { return a.price - b.price; });
    else if (sort === 'high') items.sort(function (a, b) { return b.price - a.price; });
    else items.sort(function (a, b) { return ORDER.indexOf(a.id) - ORDER.indexOf(b.id); });
    var g = document.getElementById('grid');
    g.innerHTML = items.length ? items.map(card).join('') : '<li class="none">' + S.esc(S.t('none')) + '</li>';
    document.getElementById('count-txt').textContent = countText(items.length);
    document.getElementById('shop-h').textContent = filterName(filter);
    S.$$('[data-chip]').forEach(function (c) { c.setAttribute('aria-pressed', String(c.getAttribute('data-chip') === filter)); });
    S.$$('.menu [data-jump]').forEach(function (b) { b.setAttribute('aria-current', String(b.getAttribute('data-jump') === filter && filter !== 'all')); });
  }
  function renderControls() {
    document.getElementById('chips').innerHTML = ['all', 'earrings', 'necklace', 'coll:dome', 'coll:najma'].map(function (c) {
      return '<button class="chip" type="button" data-chip="' + c + '" aria-pressed="' + (c === filter) + '">' + S.esc(c === 'all' ? S.t('all_chip') : filterName(c)) + '</button>';
    }).join('');
    document.getElementById('max').innerHTML = [[999, S.t('price_any')], [80, S.t('p80')], [100, S.t('p100')], [200, S.t('p200')]].map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === max ? ' selected' : '') + '>' + S.esc(o[1]) + '</option>';
    }).join('');
    document.getElementById('sort').innerHTML = [['featured', S.t('sort_featured')], ['low', S.t('sort_low')], ['high', S.t('sort_high')]].map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === sort ? ' selected' : '') + '>' + S.esc(o[1]) + '</option>';
    }).join('');
  }

  // ---- the Dome: shared option pickers for the featured block and the product view ----
  function patsHTML() {
    return A.PATTERNS.map(function (p) {
      return '<button class="pat" type="button" role="radio" data-pat="' + p.id + '" aria-checked="' + (p.id === dome.pattern) + '" aria-label="' + S.esc(L(p)) + '"><img src="' + PAT_IMG[p.id] + '" alt=""></button>';
    }).join('');
  }
  function matsHTML() {
    return A.MATERIALS.map(function (m) {
      return '<button class="mat" type="button" role="radio" data-mat="' + m.id + '" aria-checked="' + (m.id === dome.mat) + '"><span class="sw" style="background-image:url(' + MAT_SW[m.id] + ')"></span><span>' + S.esc(L(m)) + ' · ' + S.money(m.price) + '</span></button>';
    }).join('');
  }
  function renderDome() {
    var d = S.byId('dome');
    document.getElementById('fp-title').textContent = S.name(d);
    ['fp', 'sh'].forEach(function (k) {
      document.getElementById(k + '-pats').innerHTML = patsHTML();
      document.getElementById(k + '-mats').innerHTML = matsHTML();
    });
    var shots = [domeSrc(), 'brand/dome-worn.jpg', 'brand/dome-stone.jpg', 'brand/sketch-dome.jpg', 'brand/sketch-plan.jpg'];
    document.getElementById('fp-thumbs').innerHTML = shots.map(function (src, i) {
      return '<button type="button" data-fp-thumb="' + src + '" aria-pressed="' + (i === 0) + '" aria-label="' + S.esc(S.t('photo_n', { n: i + 1 })) + '"><img src="' + src + '" alt=""></button>';
    }).join('');
    updateDome(true);
  }
  function updateDome(resetStage) {
    var m = mat(), p = pat();
    document.getElementById('fp-price').textContent = S.money(m.price);
    ['fp', 'sh'].forEach(function (k) {
      document.getElementById(k + '-pat-name').textContent = L(p);
      document.getElementById(k + '-mat-name').textContent = L(m) + ' (' + (S.lang() === 'ar' ? m.nAr : m.nEn) + ')';
    });
    S.$$('[data-pat]').forEach(function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-pat') === dome.pattern)); });
    S.$$('[data-mat]').forEach(function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-mat') === dome.mat)); });
    var first = document.querySelector('#fp-thumbs button'); if (first) { first.setAttribute('data-fp-thumb', domeSrc()); first.querySelector('img').src = domeSrc(); first.querySelector('img').style.filter = domeFilter(); }
    var img = document.getElementById('fp-img');
    if (resetStage || img.getAttribute('data-first') !== 'no') { img.src = domeSrc(); img.style.filter = domeFilter(); img.alt = S.name(S.byId('dome')) + ' · ' + L(p) + ' · ' + L(m); }
    document.getElementById('fp-stage').classList.toggle('is-render', isRender(img.getAttribute('src')));
    S.$$('#fp-thumbs button').forEach(function (b, i) { if (resetStage) b.setAttribute('aria-pressed', String(i === 0)); });
    if (resetStage) img.setAttribute('data-first', 'yes');
    var cur = S.current();
    if (cur && cur.id === 'dome' && document.querySelector('[data-sheet].is-open')) {
      document.getElementById('sheet-price').textContent = S.money(m.price);
      var ph = document.querySelector('[data-sheet-photo]'); ph.src = domeSrc(); ph.style.filter = domeFilter();
      document.getElementById('stage').classList.add('is-render');
      var t0 = document.querySelector('#thumbs button'); if (t0) { t0.setAttribute('data-thumb', domeSrc()); t0.querySelector('img').src = domeSrc(); }
      S.$$('#thumbs button').forEach(function (b, i) { b.setAttribute('aria-pressed', String(i === 0)); });
    }
  }
  function addDome() {
    var m = mat(), p = pat();
    S.add('dome', m.tone, '', { meta: L(p) + ' · ' + L(m), photo: domeSrc(), price: m.price, noTone: true });
  }
  function render() {
    fill('najma-grid', NAJMA.map(S.byId));
    renderControls(); renderCatalog(); renderDome(); search();
    document.title = S.lang() === 'ar' ? 'أصالة · أقراط من العمارة الإسلامية' : 'ASALA · Earrings from Islamic architecture';
    setTheme(document.documentElement.getAttribute('data-theme') || 'light');
  }

  // ---- search ----
  function search() {
    var q = document.getElementById('q').value.trim().toLowerCase(), out = document.getElementById('results');
    if (!q) { out.innerHTML = ''; return; }
    var hits = S.PRODUCTS.filter(function (p) { return (p.ar + ' ' + p.en + ' ' + p.dAr + ' ' + p.dEn + ' ' + S.CATS[p.cat].ar + ' ' + S.CATS[p.cat].en).toLowerCase().indexOf(q) > -1; });
    out.innerHTML = hits.length ? hits.map(function (p) {
      return '<li><button type="button" data-open="' + p.id + '">' + S.media(p, { decorative: true }) + '<span>' + S.esc(S.name(p)) + '</span><span class="pr">' + S.money(p.price) + '</span></button></li>';
    }).join('') : '<li class="sub">' + S.esc(S.t('no_results')) + '</li>';
  }
  function toggle(btnId, panelId, force) {
    var b = document.getElementById(btnId), p = document.getElementById(panelId), open = force === undefined ? p.hidden : force;
    p.hidden = !open; b.setAttribute('aria-expanded', String(open));
    if (open && panelId === 'search-bar') document.getElementById('q').focus();
  }
  document.getElementById('q').addEventListener('input', search);
  document.getElementById('search-btn').addEventListener('click', function () { toggle('burger', 'mobile-menu', false); toggle('search-btn', 'search-bar'); });
  document.getElementById('burger').addEventListener('click', function () { toggle('search-btn', 'search-bar', false); toggle('burger', 'mobile-menu'); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var menuOpen = !document.getElementById('mobile-menu').hidden, searchOpen = !document.getElementById('search-bar').hidden;
    toggle('burger', 'mobile-menu', false); toggle('search-btn', 'search-bar', false);
    if (menuOpen) document.getElementById('burger').focus(); else if (searchOpen) document.getElementById('search-btn').focus();
  });

  // ---- navigation, filters, option pickers ----
  document.addEventListener('click', function (e) {
    var b;
    if ((b = e.target.closest('[data-jump]'))) {
      filter = b.getAttribute('data-jump'); max = 999; renderControls(); renderCatalog();
      toggle('burger', 'mobile-menu', false); toggle('search-btn', 'search-bar', false);
      document.getElementById('shop').scrollIntoView({ behavior: 'smooth' }); return;
    }
    if ((b = e.target.closest('[data-go]'))) {
      toggle('burger', 'mobile-menu', false);
      document.getElementById(b.getAttribute('data-go')).scrollIntoView({ behavior: 'smooth' }); return;
    }
    if ((b = e.target.closest('[data-chip]'))) { filter = b.getAttribute('data-chip'); renderCatalog(); return; }
    if ((b = e.target.closest('[data-pat]'))) { dome.pattern = b.getAttribute('data-pat'); updateDome(true); return; }
    if ((b = e.target.closest('[data-mat]'))) { dome.mat = b.getAttribute('data-mat'); updateDome(false); return; }
    if ((b = e.target.closest('[data-fp-thumb]'))) {
      var img = document.getElementById('fp-img'), first = b === document.querySelector('#fp-thumbs button');
      img.src = b.getAttribute('data-fp-thumb'); img.style.filter = first ? domeFilter() : 'none'; img.setAttribute('data-first', first ? 'yes' : 'no');
      document.getElementById('fp-stage').classList.toggle('is-render', isRender(img.getAttribute('src')));
      S.$$('[data-fp-thumb]').forEach(function (t) { t.setAttribute('aria-pressed', String(t === b)); }); return;
    }
    if (e.target.closest('.search-results button')) { toggle('search-btn', 'search-bar', false); return; }
    if ((b = e.target.closest('[data-thumb]'))) {
      var ph = document.querySelector('[data-sheet-photo]'), cur = S.current();
      ph.src = b.getAttribute('data-thumb');
      ph.style.filter = cur && cur.id === 'dome' && b === document.querySelector('#thumbs button') ? domeFilter() : 'none';
      document.getElementById('stage').classList.toggle('is-render', isRender(ph.getAttribute('src')));
      S.$$('[data-thumb]').forEach(function (t) { t.setAttribute('aria-pressed', String(t === b)); }); return;
    }
    if ((b = e.target.closest('[data-related]'))) { S.openProduct(b.getAttribute('data-related')); return; }
  });
  // Arrow keys move through the pattern and material radios
  document.addEventListener('keydown', function (e) {
    var r = e.target.closest && e.target.closest('[data-pat], [data-mat]');
    if (!r || ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) < 0) return;
    e.preventDefault();
    var all = Array.prototype.slice.call(r.parentNode.children), i = all.indexOf(r);
    var d = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1; if (S.lang() === 'ar' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) d = -d;
    var n = all[(i + d + all.length) % all.length]; n.click();
    var again = document.querySelector('#' + r.parentNode.id + ' [aria-checked="true"]'); if (again) again.focus();
  });
  document.getElementById('max').addEventListener('change', function (e) { max = Number(e.target.value); renderCatalog(); });
  document.getElementById('sort').addEventListener('change', function (e) { sort = e.target.value; renderCatalog(); });
  document.getElementById('fp-add').addEventListener('click', addDome);
  document.getElementById('fp-buy').addEventListener('click', function () {
    addDome();
    document.getElementById('open-cart-hidden').click();
    document.getElementById('goto-checkout-hidden').click();
  });
  document.getElementById('sheet-dome-add').addEventListener('click', function () { addDome(); document.querySelector('[data-sheet] [data-close]').click(); });

  // ---- product view extras: gallery, Dome options, size, delivery, related ----
  S.on('sheet', function (d) {
    var p = d.product, isDome = !!p.configurable, thumbs = document.getElementById('thumbs');
    document.getElementById('tone-field').hidden = isDome || p.tones.length < 2;
    document.getElementById('sheet-dome').hidden = !isDome;
    document.querySelector('[data-sheet-add]').hidden = isDome;
    document.getElementById('sheet-dome-add').hidden = !isDome;
    document.getElementById('stage').classList.toggle('is-cut', !!p.cutout);
    var photos = isDome ? [domeSrc()].concat(GALLERY.dome.slice(1)) : (GALLERY[p.id] || [p.photo]);
    thumbs.innerHTML = photos.map(function (src, i) { return '<button type="button" data-thumb="' + src + '" aria-pressed="' + (i === 0) + '" aria-label="' + S.esc(S.t('photo_n', { n: i + 1 })) + '"><img src="' + src + '" alt=""></button>'; }).join('');
    thumbs.hidden = photos.length < 2;
    var ph = document.querySelector('[data-sheet-photo]');
    if (isDome) { ph.src = domeSrc(); ph.style.filter = domeFilter(); document.getElementById('sheet-price').textContent = S.money(mat().price); }
    document.getElementById('stage').classList.toggle('is-render', isRender(ph.getAttribute('src') || ''));
    document.getElementById('size-line').textContent = isDome ? S.t('size_dome') : S.t('size_tbc');
    document.getElementById('mat-text').textContent = isDome ? S.t('mat_dome') : p.coll === 'najma' && p.id !== 'branch' ? S.t('mat_clay') : S.t('mat_metal');
    var zones = {};
    S.CITIES.forEach(function (c) { (zones[c.fee] = zones[c.fee] || []).push(c[S.lang()]); });
    document.getElementById('ship-list').innerHTML = Object.keys(zones).map(function (f) { return '<li>' + S.esc(zones[f].join('، ')) + ': ' + S.money(Number(f)) + '</li>'; }).join('') + '<li>' + S.esc(S.t('d_exchange')) + '</li>';
    var rel = S.PRODUCTS.filter(function (q) { return q.coll === p.coll && q.id !== p.id; }).slice(0, 3);
    if (rel.length < 3) rel = rel.concat(S.PRODUCTS.filter(function (q) { return q.coll !== p.coll && q.id !== p.id; }).slice(0, 3 - rel.length));
    document.getElementById('related').innerHTML = rel.map(function (q) {
      return '<li><button type="button" data-related="' + q.id + '"><img src="' + q.photo + '" alt=""' + (q.cutout ? ' style="object-fit:contain;padding:10%"' : '') + '><span>' + S.esc(S.name(q)) + '</span><small>' + S.money(q.price) + '</small></button></li>';
    }).join('');
    var sc = document.querySelector('.sheet-card'); if (sc) sc.scrollTop = 0;
  });

  // Buy it now: add the piece, then jump straight to checkout
  document.getElementById('buy-now').addEventListener('click', function () {
    var cur = S.current();
    if (cur && cur.configurable) document.getElementById('sheet-dome-add').click(); else document.querySelector('[data-sheet-add]').click();
    setTimeout(function () {
      if (document.querySelector('[data-sheet].is-open')) return;
      document.getElementById('open-cart-hidden').click();
      document.getElementById('goto-checkout-hidden').click();
    }, 30);
  });
  document.getElementById('news').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('news-email'), v = input.value.trim(), msg = document.getElementById('news-msg'), ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    msg.textContent = ok ? S.t('news_ok') : S.t('news_err');
    input.setAttribute('aria-invalid', ok ? 'false' : 'true');
  });

  S.boot({
    render: render, orderPrefix: 'AS-', cartKey: 'asala-dawn',
    strings: {
      ar: {
