<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Siwar Velvet Tray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Readex+Pro:wght@300;400;500;600&display=swap">
<style>
/* Layout: an old-city jeweller's window. The page is a velvet counter; products sit in brass-divided tray compartments with paper price tags. */
:root {
  --velvet: #0e2b25; --velvet-2: #14382f; --velvet-deep: #071a16;
  --brass: #c9a35b; --brass-hi: #ead095; --brass-lo: #8a6a2f;
  --paper: #efe8d8; --paper-ink: #26211a;
  --text: #ece5d3; --muted: #a8b9af; --error: #ffb4a8;
  --f-sign: "Aref Ruqaa", "Amiri", serif;
  --f-body: "Readex Pro", "Segoe UI", Tahoma, sans-serif;
  --gutter: clamp(16px, 4vw, 40px);
  --jewel-shadow: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html.panel-open { overflow: hidden; }
body {
  margin: 0; background: var(--velvet); color: var(--text);
  font: 400 1rem/1.65 var(--f-body);
  background-image: var(--nap, none); background-size: 180px;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--brass); color: var(--velvet-deep); }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: var(--gutter); }

/* demo strip */
.demo { background: var(--velvet-deep); color: var(--muted); font-size: .8rem; text-align: center; padding: 6px var(--gutter); }

/* header: a brass shop sign */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--velvet-deep) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--brass-lo); }
.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 64px; }
.sign { font: 700 2rem/1 var(--f-sign); color: var(--brass-hi); text-decoration: none; letter-spacing: 0; }
.sign small { font: 400 .7rem/1 var(--f-body); color: var(--muted); margin-inline-start: 8px; letter-spacing: .04em; }
.nav { display: flex; gap: 4px; margin-inline-start: auto; }
.nav a { color: var(--text); text-decoration: none; padding: 8px 12px; font-size: .95rem; border-radius: 2px; }
.nav a:hover { color: var(--brass-hi); }
.tools { display: flex; gap: 8px; align-items: center; }
.chip-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid var(--brass-lo); background: transparent; border-radius: 2px; color: var(--text); }
.chip-btn:hover { border-color: var(--brass); color: var(--brass-hi); }
.chip-btn svg { width: 18px; height: 18px; }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--brass); color: var(--velvet-deep); font-size: .75rem; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .nav { display: none; } .tools { margin-inline-start: auto; } .chip-btn .lbl { display: none; } }

/* hero: the window */
.window { padding-block: clamp(20px, 4vw, 48px); }
.pane { display: grid; grid-template-columns: 1.1fr 1fr; border: 1px solid var(--brass); outline: 1px solid var(--brass-lo); outline-offset: 6px; background: var(--velvet-2); }
.pane-art { position: relative; min-height: 380px; background: radial-gradient(120% 90% at 50% 30%, #1b4a3f 0%, var(--velvet-2) 55%, var(--velvet-deep) 100%); }
.pane-art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pane-copy { padding: clamp(22px, 4vw, 48px); display: flex; flex-direction: column; gap: 18px; border-inline-start: 1px solid var(--brass-lo); }
.pane h1 { font: 700 clamp(2.1rem, 4.6vw, 3.6rem)/1.15 var(--f-sign); color: var(--brass-hi); margin: 0; text-wrap: balance; }
.pane p.lead { margin: 0; color: var(--text); max-width: 42ch; font-size: 1.05rem; }
.field label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.name-input { width: 100%; min-height: 54px; padding: 0 16px; font: 700 1.6rem var(--f-sign); background: var(--velvet-deep); border: 1px solid var(--brass-lo); border-radius: 2px; color: var(--brass-hi); caret-color: var(--brass-hi); }
.name-input::placeholder { color: color-mix(in srgb, var(--brass-hi) 70%, transparent); }
.name-input:focus { border-color: var(--brass); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 30%, transparent); }
.buy { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 26px; border: 0; border-radius: 2px; font-weight: 500; font-size: 1rem; }
.btn-brass { background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: var(--velvet-deep); box-shadow: 0 2px 0 var(--brass-lo), 0 8px 18px rgba(0,0,0,.35); }
.btn-brass:hover { filter: brightness(1.06); }
.btn-brass:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--brass-lo), 0 4px 10px rgba(0,0,0,.35); }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--brass-lo); }

/* paper tag on a thread */
.tag { position: relative; display: inline-flex; flex-direction: column; background: var(--paper); color: var(--paper-ink); padding: 8px 14px 8px 22px; border-radius: 3px 3px 3px 3px; box-shadow: 0 6px 12px rgba(0,0,0,.35); transform-origin: 100% 50%; font-variant-numeric: tabular-nums; }
[dir="ltr"] .tag { padding: 8px 22px 8px 14px; transform-origin: 0 50%; }
.tag::before { content: ""; position: absolute; inset-inline-end: 7px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--velvet-deep); box-shadow: inset 0 0 0 1.5px var(--brass-lo); }
.tag b { font-weight: 600; font-size: 1.15rem; line-height: 1.2; }
.tag span { font-size: .9rem; }
.hero-tag { transform: rotate(-3deg); }

.trust { display: flex; flex-wrap: wrap; gap: 8px 26px; margin: 26px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: .9rem; }
.trust li { display: flex; align-items: center; gap: 8px; }
.trust svg { width: 18px; height: 18px; color: var(--brass); flex: none; }

@media (max-width: 820px) {
  .pane { grid-template-columns: 1fr; }
  .pane-art { min-height: 250px; }
  .pane-copy { border-inline-start: 0; border-top: 1px solid var(--brass-lo); }
}

/* trays */
.trays { padding-block: clamp(36px, 6vw, 72px); }
.trays-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.trays h2, .how h2 { font: 700 clamp(1.8rem, 3.4vw, 2.6rem)/1.2 var(--f-sign); color: var(--brass-hi); margin: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { min-height: 44px; padding: 0 16px; background: transparent; border: 1px solid var(--brass-lo); border-radius: 2px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--brass); border-color: var(--brass); color: var(--velvet-deep); font-weight: 500; }
.tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 3px; background: linear-gradient(135deg, var(--brass-hi), var(--brass-lo) 60%, var(--brass)); padding: 3px; border-radius: 3px; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
.slot { position: relative; background: var(--velvet-2); background-image: var(--nap, none); background-size: 180px; box-shadow: inset 0 10px 18px rgba(0,0,0,.45), inset 0 -2px 6px rgba(255,255,255,.04); display: grid; grid-template-rows: 1fr auto; min-height: 290px; padding: 14px; text-align: start; border: 0; color: inherit; }
.slot .art { position: relative; min-height: 190px; }
.slot .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
.slot:hover .art canvas { transform: translateY(-4px) scale(1.03); }
.slot .art:has(img) { min-height: 0; aspect-ratio: 1; margin-bottom: 12px; overflow: hidden; border: 1px solid var(--brass-lo); box-shadow: 0 10px 22px rgba(0,0,0,.45); }
.slot .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.slot:hover .art img { transform: scale(1.04); }
.worn { padding-block: 0 clamp(36px, 6vw, 72px); }
.worn h2 { font: 700 clamp(1.8rem, 3.4vw, 2.6rem)/1.2 var(--f-sign); color: var(--brass-hi); margin: 0 0 22px; }
.worn-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 2.5vw, 28px); }
.look { display: grid; gap: 12px; padding: 0; border: 0; background: none; text-align: start; }
.look .frame { aspect-ratio: 4 / 5; overflow: hidden; border: 1px solid var(--brass); outline: 1px solid var(--brass-lo); outline-offset: 5px; margin: 6px; }
.look img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s cubic-bezier(.2,.8,.2,1); }
.look:hover img { transform: scale(1.04); }
.look span { font: 700 1.5rem/1 var(--f-sign); color: var(--brass-hi); padding-inline: 6px; }
@media (max-width: 720px) { .worn-row { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scrollbar-width: none; } .look { flex: 0 0 68%; scroll-snap-align: center; } }
.slot .row { display: flex; align-items: end; justify-content: space-between; gap: 10px; }
.slot .tag { transform: rotate(-2.5deg); max-width: 75%; }
.slot:nth-child(3n+2) .tag { transform: rotate(1.8deg); }
.slot:nth-child(4n+3) .tag { transform: rotate(-1deg); }
.new { position: absolute; top: 12px; inset-inline-start: 12px; font-size: .72rem; letter-spacing: .06em; color: var(--brass-hi); border: 1px solid var(--brass-lo); padding: 2px 8px; border-radius: 2px; }
.quick { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--brass); background: var(--velvet-deep); color: var(--brass-hi); }
.quick:hover { background: var(--brass); color: var(--velvet-deep); }
.quick svg { width: 20px; height: 20px; }
.open-area { position: absolute; inset: 0; z-index: 1; background: transparent; border: 0; }
@media (max-width: 520px) {
  .tray { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .slot { min-height: 230px; padding: 10px; }
  .slot .art { min-height: 140px; }
  .slot .row { display: block; }
  .slot .tag, .slot:nth-child(3n+2) .tag, .slot:nth-child(4n+3) .tag { max-width: 100%; transform: rotate(-1.5deg); animation: none; }
  .tray .slot .quick { position: absolute; top: 8px; inset-inline-end: 8px; }
  .new { top: 10px; inset-inline-start: 10px; }
}
.slot .quick { position: relative; z-index: 2; }

/* how ordering works: a real sequence */
.how { padding-block: clamp(30px, 5vw, 64px); border-top: 1px solid var(--brass-lo); }
.steps { list-style: none; padding: 0; margin: 24px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: baseline; }
.steps li::before { content: counter(s); grid-row: span 2; font: 700 2.6rem/1 var(--f-sign); color: var(--brass); }
.steps b { font-weight: 500; font-size: 1.05rem; }
.steps span { color: var(--muted); font-size: .92rem; }
@media (max-width: 720px) { .steps { grid-template-columns: 1fr; } }

footer { background: var(--velvet-deep); padding-block: 36px; color: var(--muted); font-size: .9rem; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 18px 40px; justify-content: space-between; align-items: center; }
footer .sign { font-size: 1.6rem; }
footer .contact { display: flex; gap: 24px; flex-wrap: wrap; }
footer .contact b { color: var(--text); font-weight: 500; user-select: all; font-variant-numeric: tabular-nums; }

/* panels */
.sheet, .drawer { position: fixed; inset: 0; z-index: 50; background: rgba(3, 12, 10, .62); display: flex; opacity: 0; transition: opacity .25s; }
.sheet.is-open, .drawer.is-open { opacity: 1; }
.sheet { align-items: center; justify-content: center; padding: 16px; }
.sheet-card { position: relative; width: min(880px, 100%); max-height: calc(100% - 16px); overflow: auto; display: grid; grid-template-columns: 1fr 1fr; background: var(--velvet-2); border: 1px solid var(--brass); transform: translateY(16px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.is-open .sheet-card { transform: none; }
.sheet-art { position: relative; min-height: 340px; background: radial-gradient(110% 90% at 50% 30%, #1b4a3f, var(--velvet-deep)); }
.sheet-art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.sheet-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sheet-info { padding: 28px; display: flex; flex-direction: column; gap: 12px; }
.sheet-info h2 { font: 700 2rem/1.2 var(--f-sign); color: var(--brass-hi); margin: 0; }
.sheet-cat { margin: 0; color: var(--muted); font-size: .85rem; }
.sheet-price { margin: 0; font-size: 1.4rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.sheet-desc { margin: 0; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0; }
legend, .lbl-s { font-size: .85rem; color: var(--muted); margin-bottom: 8px; padding: 0; }
[data-sheet-tones] { display: flex; gap: 8px; flex-wrap: wrap; }
.tone { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid var(--brass-lo); background: transparent; border-radius: 2px; }
.tone[aria-checked="true"] { border-color: var(--brass-hi); background: color-mix(in srgb, var(--brass) 16%, transparent); }
.tone-dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 -2px 3px rgba(0,0,0,.3); }
.text-in { width: 100%; min-height: 48px; padding: 0 14px; background: var(--velvet-deep); border: 1px solid var(--brass-lo); border-radius: 2px; font: 700 1.3rem var(--f-sign); color: var(--brass-hi); }
.hint { color: var(--muted); font-size: .8rem; }
.err { color: var(--error); font-size: .85rem; margin: 4px 0 0; min-height: 1em; }
.x { position: absolute; top: 10px; inset-inline-end: 10px; z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--brass-lo); background: var(--velvet-deep); color: var(--text); display: grid; place-items: center; }
.x svg { width: 18px; height: 18px; }
@media (max-width: 720px) {
  .sheet { align-items: end; padding: 0; }
  .sheet-card { grid-template-columns: 1fr; max-height: 92%; border-inline: 0; border-bottom: 0; transform: translateY(40px); }
  .sheet-art { min-height: 240px; }
  .sheet-info { padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
}

.drawer { justify-content: flex-end; }
.drawer-card { width: min(440px, 100%); height: 100%; overflow: auto; background: var(--velvet-2); border-inline-start: 1px solid var(--brass); padding: calc(18px + env(safe-area-inset-top, 0px)) 22px calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(40px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
[dir="rtl"] .drawer-card { transform: translateX(-40px); }
.drawer.is-open .drawer-card { transform: none; }
.d-head { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--brass-lo); margin-bottom: 16px; }
.d-head h2 { margin: 0; font: 700 1.8rem/1 var(--f-sign); color: var(--brass-hi); }
.d-head span { color: var(--muted); font-size: .9rem; }
.d-head .x { position: static; margin-inline-start: auto; }
.empty { color: var(--muted); padding: 30px 0; }
[data-cart-list] { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.ci { display: grid; grid-template-columns: 76px 1fr auto; gap: 12px; align-items: start; padding-bottom: 14px; border-bottom: 1px dashed color-mix(in srgb, var(--brass) 35%, transparent); }
.ci-img { position: relative; width: 76px; height: 76px; background: var(--velvet-deep); box-shadow: inset 0 6px 10px rgba(0,0,0,.4); }
.ci-img canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.ci-img img { width: 100%; height: 100%; object-fit: cover; }
.ci-name { margin: 0; font-weight: 500; }
.ci-meta { margin: 2px 0 8px; color: var(--muted); font-size: .85rem; }
.ci-row { display: flex; gap: 12px; align-items: center; }
.ci-qty { display: inline-flex; align-items: center; border: 1px solid var(--brass-lo); border-radius: 2px; }
.ci-qty button { width: 44px; height: 44px; background: transparent; border: 0; color: var(--text); font-size: 1.1rem; }
.ci-qty output { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.ci-remove { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: .85rem; min-height: 44px; }
.ci-price { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sums { margin: 18px 0; display: grid; gap: 8px; font-variant-numeric: tabular-nums; }
.sums div { display: flex; justify-content: space-between; }
.sums dt { color: var(--muted); } .sums dd { margin: 0; }
.sums .grand { padding-top: 10px; border-top: 1px solid var(--brass-lo); font-size: 1.15rem; font-weight: 600; }
.sums .grand dt { color: var(--text); }
.full { width: 100%; }
.form { display: grid; gap: 14px; }
.form label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 5px; }
.form input, .form select, .form textarea { width: 100%; min-height: 48px; padding: 10px 12px; background: var(--velvet-deep); border: 1px solid var(--brass-lo); border-radius: 2px; }
.form textarea { min-height: 76px; resize: vertical; }
.form [aria-invalid="true"] { border-color: var(--error); }
.form input[type="tel"] { direction: ltr; text-align: start; }
[dir="rtl"] .form input[type="tel"] { text-align: right; }
[data-pay-list] { display: grid; gap: 8px; }
.pay { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--brass-lo); border-radius: 2px; cursor: pointer; }
.pay:has(input:checked) { border-color: var(--brass-hi); background: color-mix(in srgb, var(--brass) 12%, transparent); }
.pay input { width: 20px; height: 20px; min-height: 0; margin: 2px 0 0; accent-color: var(--brass); }
.pay-body { display: grid; } .pay-name { font-weight: 500; } .pay-note { color: var(--muted); font-size: .82rem; }
.fee-hint { color: var(--muted); font-size: .82rem; margin: -6px 0 0; }
.link-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }
.ok { text-align: center; padding: 40px 0; display: grid; gap: 14px; justify-items: center; }
.ok h3 { font: 700 2.2rem/1.2 var(--f-sign); color: var(--brass-hi); margin: 0; }
.ok .num { font-variant-numeric: tabular-nums; letter-spacing: .06em; }

.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); inset-inline: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px); z-index: 60; background: var(--paper); color: var(--paper-ink); padding: 10px 18px; border-radius: 3px; box-shadow: 0 10px 24px rgba(0,0,0,.45); transform: translateY(20px); opacity: 0; transition: .3s; pointer-events: none; }
.toast.is-on { transform: none; opacity: 1; }

@keyframes swing { 0% { transform: rotate(-9deg); } 40% { transform: rotate(2deg); } 70% { transform: rotate(-4deg); } 100% { transform: rotate(-2.5deg); } }
.slot .tag { animation: swing 1.4s cubic-bezier(.3,.7,.3,1) both; }
.slot:nth-child(2) .tag { animation-delay: .08s; } .slot:nth-child(3) .tag { animation-delay: .16s; } .slot:nth-child(4) .tag { animation-delay: .24s; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<p class="demo" data-t="demo_note"></p>

<header class="top">
  <div class="wrap">
    <a class="sign" href="#top">سِوار<small data-t="tagline"></small></a>
    <nav class="nav" aria-label="Categories">
      <a href="#trays" data-cat-jump="necklace" data-cat-label="necklace"></a>
      <a href="#trays" data-cat-jump="bracelet" data-cat-label="bracelet"></a>
      <a href="#trays" data-cat-jump="earrings" data-cat-label="earrings"></a>
    </nav>
    <div class="tools">
      <button class="chip-btn" type="button" data-lang-toggle><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span data-t="lang_switch"></span></button>
      <button class="chip-btn" type="button" data-open-cart data-ta="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="lbl" data-t="cart"></span><span class="count" data-cart-count hidden>0</span></button>
    </div>
  </div>
</header>

<main id="top">
  <section class="window">
    <div class="wrap">

<script src="store.js"></script>
<script>
(function () {
  var S = window.Store, filter = 'all';

  // velvet nap: a fine noise tile generated once, used as the ground texture
  try {
    var c = document.createElement('canvas'); c.width = c.height = 180;
    var x = c.getContext('2d'), img = x.createImageData(180, 180);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = Math.random();
      img.data[i] = 255; img.data[i + 1] = 255; img.data[i + 2] = 255; img.data[i + 3] = v > .5 ? Math.round((v - .5) * 14) : 0;
    }
    x.putImageData(img, 0, 0);
    document.documentElement.style.setProperty('--nap', 'url(' + c.toDataURL() + ')');
  } catch (e) {}

  var icoAdd = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2M12 11v6M9 14h6"/></svg>';

  function render() {
    var tray = document.getElementById('tray');
    var items = S.PRODUCTS.filter(function (p) { return filter === 'all' || p.cat === filter; });
    tray.innerHTML = items.map(function (p) {
      return '<div class="slot">' +
        '<button class="open-area" type="button" data-open="' + p.id + '" aria-label="' + S.esc(S.t('view') + ': ' + S.name(p)) + '"></button>' +
        (p.isNew ? '<span class="new">' + S.t('new') + '</span>' : '') +
        '<div class="art">' + S.media(p, { decorative: true }) + '</div>' +
        '<div class="row"><span class="tag"><b>' + S.money(p.price) + '</b><span>' + S.esc(S.name(p)) + '</span></span>' +
        (p.custom ? '<button class="quick" type="button" data-open="' + p.id + '" aria-label="' + S.esc(S.t('view')) + '">' + icoAdd + '</button>'
                  : '<button class="quick" type="button" data-add="' + p.id + '" aria-label="' + S.esc(S.t('add') + ': ' + S.name(p)) + '">' + icoAdd + '</button>') +
        '</div></div>';
    }).join('');
    S.mount(tray);
    document.querySelector('[data-hero-price]').textContent = S.money(S.byId('name').price);
  }

  document.addEventListener('click', function (e) {
    var tab = e.target.closest('[data-tab]');
    if (tab) {
      filter = tab.getAttribute('data-tab');
      S.$$('[data-tab]').forEach(function (t) { t.setAttribute('aria-selected', String(t === tab)); });
      render();
    }
    var jump = e.target.closest('[data-cat-jump]');
    if (jump) { filter = jump.getAttribute('data-cat-jump'); S.$$('[data-tab]').forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-tab') === filter)); }); render(); document.getElementById('trays').scrollIntoView({ behavior: 'smooth' }); }
    if (e.target.closest('[data-hero-add]')) {
      var input = document.getElementById('hero-name'), v = input.value.trim();
      var herr = document.getElementById('hero-err');
      if (!v) { input.focus(); input.setAttribute('aria-invalid', 'true'); herr.textContent = S.t('e_engrave'); return; }
      input.removeAttribute('aria-invalid'); herr.textContent = '';
      S.add('name', 'gold', v);
    }
  });

  S.boot({
    render: render,
    strings: {
      ar: {
        tagline: 'حُلي يومية', h1: 'قلادة باسمها، بخط الرقعة.',
        lead: 'اكتبي الاسم وشاهديه على القلادة قبل الطلب. تدفعين عند الاستلام.',
        type_name: 'اكتبي الاسم', name_ph: 'ليان', hero_tag: 'مع السلسلة', hero_cta: 'اطلبيها بهذا الاسم',
        trust_cod: 'الدفع عند الاستلام', trust_ship: 'توصيل للضفة والقدس والداخل', trust_swap: 'تبديل خلال 7 أيام (للتأكيد)',
        trays_h: 'من الواجهة', worn_h: 'كيف تُلبس', how_h: 'كيف تطلبين',
        s1: 'اختاري القطعة واللون', s1d: 'ذهبي أو فضي أو وردي، حسب القطعة.',
        s2: 'اكتبي عنوانك ورقمك', s2d: 'نتصل بك لتأكيد الطلب قبل الشحن.',
        s3: 'ادفعي عند الاستلام', s3d: 'نقداً للمندوب، أو بالبطاقة إن فضّلتِ.',
        wa: 'واتساب'
      },
      en: {
        tagline: 'everyday jewellery', h1: 'Her name, in Ruqaa script.',
        lead: 'Type a name and see it on the necklace before you order. Pay on delivery.',
        type_name: 'Type the name', name_ph: 'ليان', hero_tag: 'chain included', hero_cta: 'Order with this name',
        trust_cod: 'Cash on delivery', trust_ship: 'Delivery to the West Bank, Jerusalem and inside', trust_swap: '7-day exchange (to confirm)',
        trays_h: 'From the window', worn_h: 'How they are worn', how_h: 'How to order',
        s1: 'Pick the piece and colour', s1d: 'Gold, silver or rose tone, depending on the piece.',
        s2: 'Add your address and number', s2d: 'We call to confirm before we ship.',
        s3: 'Pay when it arrives', s3d: 'Cash to the courier, or by card if you prefer.',
        wa: 'WhatsApp'
      }
    }
  });
})();
</script>
